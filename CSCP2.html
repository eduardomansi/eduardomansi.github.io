/* ===== Final ECM-gap glossary terms ===== */
g("Customer-supplier partnership","A long-term relationship between a buyer and supplier characterized by teamwork and mutual confidence. The supplier is considered an extension of the buyer's organization.");
g("Inventory optimization software","Software that uses statistical models (often multi-echelon) to determine optimal inventory levels and placement across the network for target service levels at minimum cost.");
g("Manufacturing layout strategies","Facility arrangements: product (line) layout for high volume, process (functional) layout for job shops, cellular layout for group technology families, and fixed-position layout for large projects.");
g("Product positioning","Creating an image or identity for a product in the minds of the target market relative to competitors (e.g., premium, value, innovative).");
g("Safety capacity","Planned capacity in excess of expected demand, reserved to handle unplanned events (rush orders, breakdowns, absenteeism). The capacity analog of safety stock.");
g("Total cost to serve","The total cost of serving a specific customer or segment — product cost + logistics + service + sales + returns. Used to identify unprofitable customers and tailor service levels.");
g("Operating exposure","The risk that a company's future cash flows and market value change due to exchange-rate movements affecting costs and prices. Managed via natural hedges and sourcing/market diversification.");
g("Terms of trade","The conditions of an international sale: price, currency, payment terms, Incoterms, documentation. Also: ratio of export prices to import prices for a country.");

/* ===== Official APICS deck glossary additions ===== */
g("Supply chain management","The design, planning, execution, control, and monitoring of supply chain activities with the objective of creating net value, building a competitive infrastructure, leveraging worldwide logistics, synchronizing supply with demand, and measuring performance globally.");
g("Macro environment","The environment external to a business including technological, economic, natural, and regulatory forces that marketing efforts cannot control.");
g("Market share","The actual portion of current market demand that a company or product achieves.");
g("Marketing research","The systematic gathering, recording, and analyzing of data relating to the marketing of goods and services. Such research may be undertaken by impartial agencies or by business firms or their agents. Marketing research includes several types: (1) Market analysis is the study of the size, location, nature, and characteristics of markets; (2) sales analysis (or research) is the systematic study and comparison of sales data; and (3) consumer research is concerned with the discovery and analysis...");
g("Order processing","The activities required to administratively process a customer’s order and make it ready for shipment or production.");
g("Demand forecasting","Forecasting the demand for a particular good, component, or service.");
g("Product mix forecast","A forecast of the proportion of products that will be sold within a given product family or the proportion of options ordered within a product line. An inaccurate product mix forecast can create material and inventory shortages even if the aggregate product line or product family demand forecast is accurate.");
g("Chase production method","A production planning method that maintains a stable inventory level while varying production to meet demand. Companies may combine elements of chase and level strategies to create a hybrid production plan that minimizes total cost over the planning horizon. Syn.: chase strategy.");
g("Executive sales and operations planning","(executive S&OP) The portion of sales and operations planning (S&OP) that defines executive decision-making processes to balance supply and demand at the volume level in families, fully integrates financial planning and operational planning, and provides a forum for establishing and linking high-level strategic plans with day-to-day operations. See: sales and operations planning (S&OP).");
g("Level production method","A production planning method that maintains a stable production rate while varying inventory levels to meet demand. Syns.: level strategy, production leveling. See: level schedule.");
g("Electronic document","The electronic version of a document that may or may not also be printed.");
g("Information system","Interrelated computer hardware and software along with people and processes designed for the collection, processing, and dissemination of information for planning, decision-making, and control.");
g("Information technology (IT)","The technology of computers, telecommunications, and other devices that integrate data, equipment, personnel, and problem-solving methods in planning and controlling business activities. IT provides the means for collecting, storing, encoding, processing, analyzing, transmitting, receiving, and printing text, audio, or video information.");
g("Supply chain resilience","The ability of a supply chain to anticipate, create plans to avoid or mitigate, and/or to recover from disruptions to supply chain functionality. See: resilience.");
g("Collaborative planning, forecasting, and replenishment (CPFR)","CPFR) A collaboration process in which supply chain trading partners jointly develop plans for demand management and demand fulfillment activities to establish a shared vision of how products will be promoted and sold over the planning horizon. The trading partners share demand forecasts and replenishment plans iteratively until they agree to a consensus forecast, which they use to develop production and shipment plans designed to support the collaborative demand forecast. See: collaborative...");
g("Content management application","An application that supports the evolutionary life cycle of digital-based information and makes information dynamically updatable online. These applications also have the ability to publish content to a repository and support access to digital-based content.");
g("Data cleansing","Examining a database or data file to find and fix mistakes, such as misspellings, missing information, data inconsistencies, and false data.");
g("Information system architecture","A model of how the organization operates regarding information. The model considers four factors: (1) organizational functions, (2) communication of coordination requirements, (3) data modeling needs, and (4) management and control structures. The architecture of the information system should be aligned with and match the architecture of the organization.");
g("Operating system","A set of software programs that controls the execution of the hardware and application programs. The operating system manages the computer and network resources through storage management, disk input/output, communications linkages, program scheduling, and monitoring system usage for performance and cost allocations.");
g("Passive tag","A radio frequency identification (RFID) tag that does not actively transmit data and is not self-powered. See: radio frequency identification (RFID).");
g("Point-of-sale information","Information about customers collected at the time of sale.");
g("Quick-response program (QRP)","A system of linking final retail sales with production and shipping schedules back through the chain of supply. This system employs point-of-sale scanning and electronic data interchange and may use direct shipment from a factory to a retailer. See: continuous replenishment.");
g("Semipassive tag","A radio frequency identification (RFID) tag that sends out data, is self-powered, and widens its range by harnessing power from the reader. See: radio frequency identification (RFID).");
g("Server","A computer or software package that provides a specific kind of service to client software running on other computers. The term can refer to a particular piece of software, a web server, or the machine on which the software is running. A single server machine could have several different server software packages running on it, thus providing many different servers to clients on the network.");
g("Web directory","A list of web pages that is structured hierarchically.");
g("Accounts payable (AP)","The value of goods and services acquired for which payment has not yet been made.");
g("Accounts receivable (AR)","The value of goods shipped or services rendered to a customer for which payment has not yet been received. This usually includes an allowance for bad debts.");
g("Cost accounting","The branch of accounting that is concerned with recording and reporting business operating costs. It includes the reporting of costs by departments, activities, and products.");
g("Current price","The price currently being paid, as opposed to standard cost.");
g("Customer order fulfillment cycle time","The average actual cycle time consistently achieved to fulfill customer orders. For each individual order, this cycle time starts at the order receipt and ends at customer acceptance of the order.");
g("Days outstanding","A term used to imply the amount of an asset or liability measured in days of sales. For example, accounts payable (AP) days are the typical number of days that a firm delays payment of invoices to its suppliers. See: days payable outstanding (DPO), days sales outstanding (DSO).");
g("Digital Capabilities Model (DCM) for Supply Networks","A reference model for supply chain professionals to guide the development of digital supply networks. The model is designed in a relational manner to help envision and then build the digitally enabled capabilities required to transform linear supply chains into a set of dynamic networks.");
g("Executive dashboard","A set of cross-functional metrics for measuring company performance that indicates the health of the company. It usually includes the company’s key performance indicators. See: dashboard.");
g("Inventory valuation","The value of the inventory at either its cost or its market value. There are a variety of ways to calculate the value of inventory to establish the cost of goods sold (COGS). Because inventory value can change with time, the age of the inventory may also be taken into consideration. See: average cost system; first in, first out (FIFO); inventory investment; last in, first out (LIFO).");
g("Net working capital","The current assets of a firm minus its current liabilities. Syn.: working capital.");
g("Perfect order fulfillment","A measure of an organization’s ability to deliver a perfect order.");
g("Return on supply chain fixed assets","A measurement of the return an organization receives from its invested capital in supply chain fixed assets. This includes the fixed assets used in Orchestrate, Plan, Order, Source, Transform, Fulfill, and Return. It is calculated as (Supply Chain Revenue - Total Supply Chain Management Cost) ÷ Supply Chain Fixed Assets.");
g("Return on working capital","A measure of profit on the amount of capital consumed. It is calculated as after-tax operating income divided by net working capital.");
g("Standard cost accounting system","A cost accounting system that uses cost units determined before production for estimating the cost of an order or product. For management control purposes, the standards are compared with actual costs, and variances are computed.");
g("Make or buy cost analysis","A comparison of all the costs associated with making an item versus the cost of buying the item. See: make- or-buy decision.");
g("Make-or-buy decision","The act of deciding whether to produce an item internally or buy it from an outside supplier. Factors to consider in the decision include costs, capacity availability, proprietary and/or specialized knowledge, quality considerations, skill requirements, volume, and timing. See: make or buy cost analysis.");
g("Supplier partnership","The establishment of a working relationship with a supplier organization whereby two organizations act as one. Syn.: collaborative supply relationship. See: supplier collaboration.");
g("Design for the supply chain","Enhancement of a firm’s product design in consideration of the issues that will arise in the supply chain, from raw materials to the final stage of the product’s life cycle.");
g("Modular design strategy","The strategy of planning and designing products so that components or subassemblies can be used in current and future products or assembled to produce multiple configurations of a product. Automobiles and personal computers are examples of modular designs.");
g("Modularization","In product development, the use of standardized parts for flexibility and variety. This permits product development cost reductions by using the same item(s) to build a variety of finished goods. Modularization is the first step in developing a planning bill of material (BOM).");
g("Product differentiation","A strategy of making a product distinct from the competition on a nonprice basis such as availability, durability, quality, or reliability.");
g("Bilateral contract","An agreement wherein each party makes a promise to the other party.");
g("Blanket purchase order","A long-term commitment to a supplier for material against which short-term releases will be generated to satisfy requirements. Often blanket orders cover only one item with predetermined delivery dates. Syns.: blanket order, standing order. See: open-end purchase order.");
g("Cost-based contract","A type of purchasing contract in which the price of goods or services is tied to the costs of key inputs or other economic factors such as interest rates.");
g("Cost-plus contract","A contract in which the buyer agrees to pay the seller all the acceptable costs of the product or service up to a maximum cost. Syn.: cost-type contract.");
g("Cost-plus-fixed-fee contract","A contract in which the seller is paid for costs specified as allowable in the contract plus a stipulated fixed fee.");
g("Cost-plus-incentive-fee contract","A contract in which the seller is paid for costs specified as allowable in the contract plus a bonus, provided certain provisions are met or exceeded.");
g("Fixed-price incentive fee contract","A contract in which the seller is paid a set price and can earn an additional profit if certain stipulations are met.");
g("Incentive arrangements","A contract between a buyer and seller that incorporates conditions designed to motivate the supplier to improve its performance in specific areas including on-time delivery, product quality, and customer satisfaction.");
g("Operating exposure","The risk introduced by flexible exchange rates when operating in the global environment, including their effect on production, storage, and buying and selling prices.");
g("Payment terms","Conditions surrounding payment for a sale, providing a time frame in which a customer can pay without late penalties or additional fees. The payment terms may also specify an optional early payment deadline that would trigger a discount for the customer. See: terms and conditions.");
g("Terms and conditions","All the provisions and agreements of a contract.");
g("Trading partner agreement","A contract between trading partners that describes all facets of their business together. It is a legal and binding agreement suitable for legal purposes as well as standard working agreements.");
g("United Nations Convention on Contracts for the International Sale of Goods (CISG)","CISG) A multilateral treaty that governs the sale of goods internationally. It facilitates international trade and removes legal barriers by providing uniform rules for commercial transactions. It is sometimes known as the Vienna Convention.");
g("Virtual trading exchange","An online trading exchange that enables both information integration and collaboration among multiple trading partners.");
g("Cumulative lead time","The longest planned length of time to accomplish an activity. It is the sum of the lead time for each bill of material (BOM) path below an item. Whichever path adds up to the greatest number defines cumulative lead time. Syns.: aggregate lead time, combined lead time, composite lead time, stacked lead time. See: critical path lead time, planning horizon, planning time fence.");
g("Joint replenishment","The coordination of the lot sizing and order release decisions for related items and treating them as a family of items. The objective is to achieve lower costs from ordering, setup, shipping, and quantity discount economies. This term applies equally to joint ordering and to composite part (group technology (GT)) fabrication scheduling. See: joint order, multiple-item lot-sizing model.");
g("Master schedule item","A part number selected to be planned by the master scheduler. The item is deemed critical in its impact on lower-level components or resources such as skilled labor, key machines, or dollars. Therefore, the master scheduler, not the computer, maintains the plan for these items. A master schedule item may be an end- item, a component, a pseudo number, or a planning bill of material (BOM).");
g("Open order","A customer order, manufacturing order, or purchased order that has been released but not yet filled. Syn.: released order. See: scheduled receipt.");
g("Parent item","The item produced from one or more components. Syn.: parent.");
g("Planned order receipt","The quantity planned to be received at a future date as a result of a planned order release. Planned order receipts differ from scheduled receipts in that they have not been released. Syn.: planned receipt.");
g("Planned order release","A row on a material requirements planning (MRP) table that is derived from planned order receipts by taking the planned receipt quantity and offsetting it to the left by the appropriate lead time. See: order release.");
g("Pull system","1) In production, the production of items only as demanded for use or to replace those taken for use. See: pull signal. 2) In material control, the withdrawal of inventory as demanded by the using operations. Material is not issued until a signal comes from the user. 3) In distribution, a system for replenishing field warehouse inventories in which replenishment decisions are made at the field warehouse itself, not at the central warehouse or plant.");
g("Push system","1) In production, the production of items at times required by a given schedule planned in advance. 2) In material control, the issuing of material according to a given schedule or the issuing of material to a job order at its start time. 3) In distribution, a system for replenishing field warehouse inventories in which replenishment decision-making is centralized, usually at the manufacturing site or central supply facility. See: pull system.");
g("Bill of resources","A listing of the required capacity and key resources needed to manufacture one unit of a selected item or family. Rough-cut capacity planning (RCCP) uses these bills to calculate the approximate capacity requirements of the master production schedule (MPS). Resource planning may use a form of this bill. Syn.: bill of capacity. See: bill of labor, capacity bill procedure, capacity planning using overall factors (CPOF), product load profile, resource profile, rough- cut capacity planning...");
g("Capacity control","The process of measuring production output and comparing it with the capacity plan, determining if the variance exceeds pre-established limits, and taking corrective action to get back on plan if the limits are exceeded. See: input/output control (I/O control).");
g("Demand pull","The triggering of material movement to a work center only when that work center is ready to begin the next job. Demand pull shortens or eliminates the queue from in front of a work center, but it can cause a queue at the end of a preceding work center. Demand pull also can occur within a supply chain, in which case it often is called a demand chain. See: demand chain management.");
g("Manufacturing lead time","The total time required to manufacture an item, exclusive of lower-level purchasing lead time. For make- to-order (MTO) products, it is the length of time between the release of an order to the production process and shipment to the final customer. For make-to-stock (MTS) products, it is the length of time between the release of an order to the production process and receipt into inventory. Manufacturing lead time includes order preparation time, queue time, setup time, run time, move time,...");
g("Resource profile","The standard hours of load placed on a resource by time period. Production lead-time data is taken into account to provide time-phased projections of the capacity requirements for individual production facilities. See: bill of resources, capacity planning using overall factors (CPOF), product load profile, rough-cut capacity planning (RCCP).");
g("ABC classification","The classification of a group of items in decreasing order of annual dollar volume (price multiplied by projected volume) or other criteria. This array is then split into three classes, called A, B, and C. The A group usually represents 10 percent to 20 percent by number of items and 50 percent to 70 percent by projected dollar volume. The next grouping, B, usually represents about 20 percent of the items and about 20 percent of the dollar volume. The C class contains about 50 percent of the...");
g("Acquisition cost","The cost required to obtain one or more units of an item. This is computed as order quantity times unit cost. See: ordering cost.");
g("Anticipation inventories","Additional inventory above basic stocking levels to cover projected trends of increasing sales, planned sales promotion programs, seasonal fluctuations, plant shutdowns, and vacations.");
g("End-of-life product management","Planning for the phase-out of a product to avoid out-of- stock situations, excess inventory, or negative environmental impacts. This involves notifying customers so they can make timely conversions and plan lifetime buys of replacement parts, as well as considering the disposition of the materials.");
g("In-transit inventory","Material moving between two or more locations, usually separated geographically (e.g., finished goods being shipped from a plant to a distribution center (DC)).");
g("Inventory control","The activities and techniques of maintaining the desired levels of items, whether raw materials, work in process (WIP), or finished products and storing them properly to enable effective tracking and ensure their usable condition. Syn.: material control.");
g("Inventory ordering system","An inventory model for the replenishment of inventory. Independent demand inventory ordering systems include fixed reorder cycle, fixed reorder inventory model, optional replenishment, and hybrid models, among others. Dependent demand inventory ordering systems include material requirements planning, kanban, and drum-buffer-rope.");
g("Inventory planning","The activities and techniques of determining the desired levels of items, whether raw materials, work in process (WIP), or finished products (including order quantities and safety stock levels). Syn.: material planning.");
g("Appraisal costs","Those costs associated with the formal evaluation and audit of quality in the firm. Typical costs include inspection, quality audits, testing, calibration, and checking time.");
g("Cost of poor quality","The costs associated with performing a task incorrectly and/or generating unacceptable output. These costs would include the costs of nonconformities, inefficient processes, and lost opportunities. See: quality costs.");
g("Lean metric","A quantitative measurement of performance of a process, team, or the organization overall that can be used to guide improvement efforts toward reducing waste, enhancing quality, and increasing efficiency. Lean metrics take a balanced approach, enabling organizations to measure their performance relative to the needs of their customers.");
g("Lean production","A philosophy of production that emphasizes the minimization of the amount of all the resources (including time) used in the various activities of the enterprise. It involves identifying and eliminating non-value-adding activities in design, production, supply chain management, and customer management. Lean producers employ teams of multiskilled workers at all levels of the organization and use highly flexible, increasingly automated machines to produce volumes of products in potentially...");
g("Operational performance measurement","A performance measurement related to machine, worker, process, or department efficiency; utilization; throughput; and inventory levels. See: performance objective, strategic performance measurement.");
g("Pareto’s law","A principle first observed by Italian economist Vilfredo Pareto that states that a small percentage of a group accounts for the largest fraction of its impact or value. In ABC classification, for example, 20 percent of the inventory items may constitute 80 percent of the inventory value. See: 80-20 rule, ABC classification.");
g("Process map","A diagram of the flow of a production process or service process through the production system. Standardized symbols are used to designate processing, flow directions, branching decisions, input/output, and other aspects of the process.");
g("Fixed-location storage","A method of storage in which a relatively permanent location is assigned for the storage of each item in a storeroom or warehouse. More space may be needed to store parts than in a random-location storage system, but fixed locations become familiar to warehouse personnel. See: random-location storage.");
g("Line haul cost","The cost of carrier operations to move a container of freight, including drivers’ wages and usage depreciation. These vary with the cost per mile, the distance shipped, and the weight moved. This cost is commonly expressed in relation to the hundredweight (cwt) of the shipment.");
g("Random-location storage","A storage technique in which parts are placed in any space that is empty when they arrive at the storeroom. Although this random method requires the use of a locator record to identify part locations, it often requires less storage space than a fixed-location storage method. Syns.: floating inventory location system, floating storage location. See: fixed-location storage.");
g("Total cost concept","In logistics, the idea that all logistical decisions that provide equal service levels should favor the option that minimizes the total of all logistical costs and should not be used on cost reductions in one area (such as lower transportation charges) alone.");
g("Packing and marking","The activities of unitizing one or more items of an order, packing them into an appropriate container for safe shipping, and marking and labeling the container with required shipment data for identification, handling, and tracking. See: packaging.");
g("Harmonized system (HS) code","An internationally standardized description of goods maintained by the World Customs Organization that uses a system of numbers to provide increasingly detailed classification for the purpose of assessing duties and gathering import and export statistics.");
g("International freight forwarder","An entity that arranges and coordinates the transportation of goods from the production site or seller's storage facility to the customer's location in another country.");
g("Terms of trade","The portion of a contract of sale that specifies the responsibilities of the seller or exporter and the responsibilities of the buyer or importer, especially the point at which one party’s responsibilities end and the other party’s responsibilities begin (including the point at which title to the goods is transferred). These terms are commonly specified using International Commercial Terms (Incoterms<sup>®</sup>).");
g("Globally Harmonized System of Classification and Labelling of Chemicals (GHS)","GHS) An international standard created by the United Nations Economic Commission for Europe (UNECE) for classifying chemicals according to their health, physical, and environmental hazards. The system defines and classifies the hazards of chemical products and communicates health and safety information on labels and material safety data sheets. See: Harmonized Tariff Schedule (HTS).");
g("Reverse supply chain","The planning and controlling of the processes of moving goods from the point of consumption back to the point of origin for repair, reclamation, recycling, or disposal. See: reverse logistics.");
g("Multisourcing","Procurement of a good or service from more than one independent supplier. Syn.: multiple sourcing. Ant.: single sourcing. See: dual sourcing.");
g("Single-source supplier","A company that is selected to have 100 percent of the business for a part although alternate suppliers are available. See: sole-source supplier.");
g("Strategic sourcing","A comprehensive approach for locating and sourcing key material suppliers, which often includes the business process of analyzing total-spend-for-material spend categories. The approach includes a focus on the development of long-term relationships with trading partners who can help the purchaser meet profitability and customer satisfaction goals. From an information technology (IT) applications perspective, it includes automation of requests for quotes, requests for proposals, electronic...");
g("ISO 73:2009","An international standard that provides the definitions of generic terms related to risk management. It aims to encourage a mutual and consistent understanding of and a coherent approach to the description of activities relating to the management of risk and the use of uniform risk management terminology in processes and frameworks dealing with the management of risk.");
g("Risk acceptance","A decision to take no action to deal with a risk or an inability to format a plan to deal with the risk.");
g("Risk avoidance","Changing a plan to eliminate a risk or to protect plan objectives from its impact.");
g("Risk category","A cluster of risk causes with a label such as external, environmental, technical, or organizational.");
g("Risk response plan","A document defining known risks including description, cause, likelihood, costs, and proposed responses. It also identifies current status of each risk.");
g("Risk response planning","The process of developing a plan to avoid risks and to mitigate the effect of those that cannot be avoided.");
g("Supply chain continuity","An organization’s strategic and tactical capability to plan for and respond to conditions, situations, and events as necessary in order to continue supply chain operations at an acceptable predefined level.");
g("Demand-driven material requirements planning (DDMRP)","(DDMRP) A method for planning material needs that enables a company to build more closely to actual market requirements.");
g("Demand-driven supply network","A network in which a customer purchase initiates real- time information flows through the supply chain that consequently cause movement of product through the network.");
g("Global strategy","A strategy that focuses on improving worldwide performance through the sales and marketing of common goods and services with minimum product variation by country. The firm's competitive advantage grows through selecting the best locations for operations in other countries. See: multinational strategy.");
g("Inventory optimization","A computer application that can find optimal inventory strategies and policies related to customer service and return on investment over multiple echelons of a supply chain. The optimization happens simultaneously across all inventory stocking points in the supply chain and accounts for random variability. This practice is traditionally used for the replenish-to- forecast process as an alternative to pull-based replenishment, but it also can be used to calculate reorder points. See:...");
g("Key success factors","The product attributes, organizational strengths, and accomplishments with the greatest impact on future success in the marketplace.");
g("Mass marketing","The strategy of sending the same message to all potential customers.");
g("Operations research","1) The development and application of quantitative techniques to the solution of problems. More specifically, theory and methodology in mathematics, statistics, and computing are adapted and applied to the identification, formulation, solution, validation, implementation, and control of decision-making problems. 2) An academic field of study concerned with the development and application of quantitative analysis to the solution of problems faced by management in public and private...");
g("Organizational design","The creation of an organizational structure to support the strategic business plans and goals of an enterprise (e.g., for-profit versus not-for-profit companies). Given the mission and business strategy, the organizational structure design provides the framework within which the business’s operational and management activities will be performed.");
g("Strategic plan","A plan for how to marshal and determine actions to support the mission, goals, and objectives of an organization. A strategic plan generally includes an organization’s explicit mission, goals, and objectives as well as the specific actions needed to achieve those goals and objectives. See: business plan, strategic planning, strategy, tactical plan(s).");
g("Environmentally responsible business","A firm that operates in such a way as to minimize detrimental impacts on society. See: green manufacturing, green supply chain.");
g("ISO 14000 family of standards","A series of generic environmental management standards developed by the International Organization for Standardization (ISO) that provide structure and systems for managing environmental compliance with legislative and regulatory requirements and affect every aspect of a company’s environmental operations.");
g("ISO 26000:2010","An international standard developed by the International Organization for Standardization (ISO) to assist organizations in contributing to sustainable development beyond legal compliance through a common understanding of social responsibility.");
g("ISO 9000:2015","A set of international standards about quality management and quality assurance developed to help companies effectively document the quality system elements to be implemented to maintain an efficient quality system. The standards, initially published in 1987, are not specific to any particular industry, product, or service. The standards were developed by the International Organization for Standardization (ISO).");
g("Organization for Economic Cooperation and Development (OECD)","OECD) Guidelines for Multinational Enterprises A set of recommendations about responsible business conduct addressed by governments to multinational enterprises (MNEs) operating in or from adhering countries that encourage and maximize the positive impact MNEs can make to sustainable development and enduring social progress. See: multinational corporation.");
g("Artificial intelligence (AI)","1) Machines or computer programs that can learn, reason, and take action, similar to humans. 2) An area of computer science that attempts to develop AI computer programs. See: artificial general intelligence (AGI), artificial superintelligence (ASI), expert system.");
g("Expert system","A type of artificial intelligence that mimics human experts by using rules and heuristics rather than deterministic algorithms. See: artificial intelligence (AI).");
g("Project management","The use of skills and knowledge in coordinating the organizing, planning, scheduling, directing, controlling, monitoring, and evaluating of prescribed activities to ensure that the stated objectives of a project, manufactured good, or service are achieved. See: project.");
g("Supply chain control tower","A centralized hub that provides an integrated, complete view of data across the end-to-end supply chain. The system allows the supplier to see the requirements and inventory levels at the customer’s site, enhances the ability to get accurate information about supply location and availability, and highlights any potential excess inventory. Similarly, it helps the customer easily identify supply and demand variations and take necessary actions to return excess inventory. See: digital twin.");
g("augmented reality (AR)","Using holographic imagery alongside the physical environment to provide additional information or guidance about how to carry out a task. For example, warehouse employees can wear AR-enabled smart glasses to see information about the locations of items as well as instructions about what items and quantities to pick when pulling material to fill an order.");

</script>
<script id="app-script">
/* =============== APP LOGIC =============== */
const LS_KEY = "cscp_app_v1";
const state = Object.assign({
  moduleRead: {},          // moduleId -> bool
  quizScores: {},          // moduleId -> {best, last, attempts}
  mockBest: null,
  flashSeen: {},
  flashKnown: {},
  activeModule: "m1",
  activeQuizModule: "m1",
  activeFlashFilter: "all",
}, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));

const save = () => localStorage.setItem(LS_KEY, JSON.stringify(state));

/* ---------- Tab Navigation ---------- */
document.querySelectorAll("#mainTabs button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("#mainTabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    const v = document.getElementById("view-"+b.dataset.view);
    v.classList.add("active");
    renderView(b.dataset.view);
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

function renderView(v){
  if(v==="dashboard") renderDashboard();
  if(v==="modules") renderModules();
  if(v==="flashcards") renderFlashcards();
  if(v==="quiz") renderQuiz();
  if(v==="mock") renderMock();
  if(v==="diagrams") renderDiagrams();
  if(v==="glossary") renderGlossary();
  if(v==="strategy") renderStrategy();
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const totalFlash = FLASHCARDS.length;
  const known = Object.values(state.flashKnown).filter(Boolean).length;
  const totalQ = Object.values(QUIZZES).reduce((a,b)=>a+b.length,0);
  const modulesDone = Object.values(state.moduleRead).filter(Boolean).length;
  const bestScores = MODULES.map(m=>state.quizScores[m.id]?.best ?? null);
  const avgBest = bestScores.filter(x=>x!=null).reduce((a,b)=>a+b,0) / Math.max(1,bestScores.filter(x=>x!=null).length);
  const html = `
    <h2 class="section-title">Welcome back — let's get you CSCP-certified.</h2>
    <p class="lead">Track your progress across all 8 ECM modules, ${totalFlash} flashcards, ${totalQ} practice questions, and a 120-question mock exam.</p>
    <div class="grid cards-4" style="margin-bottom:22px">
      <div class="card stat-box"><b>${modulesDone}/8</b><span>Modules reviewed</span></div>
      <div class="card stat-box"><b>${known}/${totalFlash}</b><span>Flashcards learned</span></div>
      <div class="card stat-box"><b>${bestScores.filter(x=>x!=null).length>0 ? Math.round(avgBest)+"%" : "—"}</b><span>Avg. best quiz score</span></div>
      <div class="card stat-box"><b>${state.mockBest!=null ? state.mockBest+"%" : "—"}</b><span>Mock exam best</span></div>
    </div>
    <h3 style="margin:24px 0 10px">Modules</h3>
    <div class="grid cards-3">
      ${MODULES.map((m,i)=>{
        const done = !!state.moduleRead[m.id];
        const score = state.quizScores[m.id]?.best;
        const pct = done?100:(score?score:0);
        return `<div class="card" style="cursor:pointer" onclick="goModule('${m.id}')">
          <span class="pill mod${i+1}">Module ${i+1}</span>
          <h3 style="margin-top:8px">${m.title}</h3>
          <p style="margin-top:6px">${m.blurb}</p>
          <div class="progress"><div style="width:${pct}%"></div></div>
          <div class="row" style="margin-top:8px;font-size:.85rem;color:var(--mute)">
            <span>${done?"Reviewed ✓":"Not yet reviewed"}</span>
            ${score!=null?`· <span>Best quiz: ${score}%</span>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>
    <h3 style="margin:24px 0 10px">Study plan — suggested path</h3>
    <div class="card">
      <ol>
        <li><b>Read each module</b> (use the <a href="#" onclick="switchTab('modules');return false;">Modules</a> tab) — open each collapsible section, focus on keyterms and formulas highlighted in color.</li>
        <li><b>Drill flashcards daily</b> (20–30/day). Use the module filter to focus on the chapter you just read.</li>
        <li><b>Take the module quiz</b> right after finishing the module. Aim for 80%+ before moving on.</li>
        <li><b>Study the diagrams</b> — SCOR, Kraljic, Porter 5F, Push/Pull, Bullwhip. Be able to sketch them from memory.</li>
        <li><b>Take the 120-question Mock Exam</b> once, cold, two weeks before your test. Review every miss.</li>
        <li><b>Re-run any quiz where you scored &lt; 80%</b> until you own the material.</li>
      </ol>
    </div>
    <h3 style="margin:24px 0 10px">Exam quick facts</h3>
    <div class="card">
      <table><tr><th>Format</th><td>150 multiple-choice questions (130 scored + 20 pretest); 3.5 hours</td></tr>
      <tr><th>Pass mark</th><td>Scaled score of 300 out of a 200–350 range (≈70% raw)</td></tr>
      <tr><th>Domains</th><td>Supply Chains, Demand & Forecasting · Global Networks · Sourcing · Internal Operations · Logistics · Relationships · Risk · Optimization/Sustainability/Tech</td></tr>
      <tr><th>Retake</th><td>Allowed; waiting periods apply between attempts</td></tr>
      <tr><th>Certification</th><td>Issued by ASCM (formerly APICS)</td></tr></table>
    </div>
  `;
  document.getElementById("view-dashboard").innerHTML = html;
}
function goModule(id){ state.activeModule = id; save(); switchTab("modules"); }
function switchTab(name){ document.querySelector(`#mainTabs button[data-view="${name}"]`).click(); }

/* ---------- Modules ---------- */
function renderModules(){
  const mod = MODULES.find(m=>m.id===state.activeModule) || MODULES[0];
  const tabs = MODULES.map(m=>`<button class="${m.id===mod.id?'active':''}" onclick="setModule('${m.id}')">${m.shortTitle}</button>`).join("");
  const sectionHtml = mod.sections.map(sec=>`
    <details ${sec.open?"open":""}>
      <summary>${sec.title}</summary>
      <div style="padding:8px 2px">${sec.body}</div>
    </details>`).join("");
  const done = !!state.moduleRead[mod.id];
  document.getElementById("view-modules").innerHTML = `
    <h2 class="section-title">${mod.title}</h2>
    <p class="lead">${mod.blurb}</p>
    <div class="module-tabs">${tabs}</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ${done?'good':''}" onclick="toggleRead('${mod.id}')">${done?"✓ Marked as reviewed":"Mark module as reviewed"}</button>
      <button class="btn ghost" onclick="state.activeQuizModule='${mod.id}';save();switchTab('quiz')">Take this module's quiz →</button>
      <button class="btn ghost" onclick="state.activeFlashFilter='${mod.id}';save();switchTab('flashcards')">Flashcards for this module →</button>
    </div>
    ${sectionHtml}
    <div class="row" style="margin-top:18px;justify-content:space-between">
      ${MODULES.indexOf(mod)>0?`<button class="btn ghost" onclick="setModule('${MODULES[MODULES.indexOf(mod)-1].id}')">← ${MODULES[MODULES.indexOf(mod)-1].shortTitle}</button>`:'<span></span>'}
      ${MODULES.indexOf(mod)<MODULES.length-1?`<button class="btn" onclick="setModule('${MODULES[MODULES.indexOf(mod)+1].id}')">${MODULES[MODULES.indexOf(mod)+1].shortTitle} →</button>`:''}
    </div>`;
}
function setModule(id){ state.activeModule=id; save(); renderModules(); window.scrollTo({top:0,behavior:"smooth"}); }
function toggleRead(id){ state.moduleRead[id]=!state.moduleRead[id]; save(); renderModules(); }

/* ---------- Flashcards ---------- */
let flashIdx = 0;
let flashDeck = [];
function renderFlashcards(){
  const filter = state.activeFlashFilter;
  flashDeck = (filter==="all")?[...FLASHCARDS]:FLASHCARDS.filter(c=>c.m===filter);
  if(!flashDeck.length){ flashDeck=[...FLASHCARDS]; state.activeFlashFilter="all"; }
  if(flashIdx>=flashDeck.length) flashIdx=0;
  const c = flashDeck[flashIdx];
  const filterOpts = ['<option value="all">All modules</option>'].concat(
    MODULES.map(m=>`<option value="${m.id}" ${filter===m.id?'selected':''}>${m.shortTitle}</option>`)
  ).join("");
  const known = Object.values(state.flashKnown).filter(Boolean).length;
  document.getElementById("view-flashcards").innerHTML = `
    <h2 class="section-title">Flashcards</h2>
    <p class="lead">${FLASHCARDS.length} cards across all modules · ${known} marked known. Click a card to flip; use the buttons to progress.</p>
    <div class="flash-toolbar">
      <select id="flashFilter" onchange="state.activeFlashFilter=this.value;flashIdx=0;save();renderFlashcards()">${filterOpts}</select>
      <button class="btn ghost" onclick="shuffleFlash()">Shuffle</button>
      <button class="btn ghost" onclick="prevFlash()">← Prev</button>
      <button class="btn" onclick="nextFlash()">Next →</button>
      <button class="btn good" onclick="markKnown(true)">✓ I know this</button>
      <button class="btn warn" onclick="markKnown(false)">Review again</button>
      <span style="color:var(--mute)">Card ${flashIdx+1} / ${flashDeck.length}</span>
    </div>
    <div class="flashcard ${state.flipped?'flipped':''}" id="flashcardEl" onclick="flipFlash()">
      <div class="face">
        <div class="front">
          <div>${c.q}</div>
          <small style="color:var(--mute);margin-top:8px;font-weight:400">${moduleLabel(c.m)} · click to flip</small>
        </div>
        <div class="back">
          <div>${c.a}</div>
          <small style="color:#a5f3fc;margin-top:8px">Press "I know this" to mark learned</small>
        </div>
      </div>
    </div>`;
}
function moduleLabel(id){ const m=MODULES.find(x=>x.id===id); return m?m.shortTitle:id; }
function flipFlash(){ document.getElementById("flashcardEl").classList.toggle("flipped"); }
function nextFlash(){ flashIdx=(flashIdx+1)%flashDeck.length; renderFlashcards(); }
function prevFlash(){ flashIdx=(flashIdx-1+flashDeck.length)%flashDeck.length; renderFlashcards(); }
function shuffleFlash(){ flashDeck.sort(()=>Math.random()-.5); flashIdx=0; renderFlashcards(); }
function markKnown(v){ const c=flashDeck[flashIdx]; state.flashKnown[c.id]=v; save(); nextFlash(); }

/* ---------- Quiz ---------- */
let quizState = { mod:"m1", idx:0, answers:{}, submitted:false };
function renderQuiz(){
  quizState.mod = state.activeQuizModule || "m1";
  const tabs = MODULES.map(m=>`<button class="${m.id===quizState.mod?'active':''}" onclick="setQuizMod('${m.id}')">${m.shortTitle} (${(QUIZZES[m.id]||[]).length})</button>`).join("");
  const qs = QUIZZES[quizState.mod] || [];
  const lastScore = state.quizScores[quizState.mod];
  let body;
  if(!qs.length){
    body = `<div class="card">No questions loaded for this module.</div>`;
  } else if(!quizState.submitted){
    body = qs.map((q,i)=>{
      const chosen = quizState.answers[i];
      const opts = q.options.map((o,oi)=>{
        const id = `q${i}o${oi}`;
        return `<label class="q-opt"><input type="radio" name="q${i}" value="${oi}" ${chosen===oi?'checked':''} onchange="quizState.answers[${i}]=${oi}"> <span>${String.fromCharCode(65+oi)}. ${o}</span></label>`;
      }).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div></div>`;
    }).join("") + `<div class="row" style="margin-top:10px"><button class="btn" onclick="submitQuiz()">Submit quiz</button><button class="btn ghost" onclick="resetQuiz()">Reset</button></div>`;
  } else {
    let correct=0;
    const rendered = qs.map((q,i)=>{
      const chosen=quizState.answers[i];
      const opts = q.options.map((o,oi)=>{
        let cls="q-opt";
        if(oi===q.answer) cls+=" correct";
        else if(chosen===oi) cls+=" wrong";
        return `<div class="${cls}"><span>${String.fromCharCode(65+oi)}. ${o}</span></div>`;
      }).join("");
      if(chosen===q.answer) correct++;
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div><div class="rationale"><b>Rationale:</b> ${q.rationale||""}</div></div>`;
    }).join("");
    const pct = Math.round(100*correct/qs.length);
    const prev = state.quizScores[quizState.mod] || {best:0,attempts:0};
    prev.last = pct; prev.best = Math.max(prev.best||0, pct); prev.attempts=(prev.attempts||0)+1;
    if(!quizState.saved){ state.quizScores[quizState.mod]=prev; save(); quizState.saved=true; }
    body = `<div class="score-banner"><h3>${correct} / ${qs.length} correct (${pct}%)</h3><p>${pct>=80?"Great work — you've mastered this module.":pct>=65?"Solid. Review the misses and retake.":"Go back to the module notes, then try again."}</p></div>${rendered}<div class="row" style="margin-top:10px"><button class="btn" onclick="resetQuiz()">Retake quiz</button></div>`;
  }
  document.getElementById("view-quiz").innerHTML = `
    <h2 class="section-title">Module quizzes</h2>
    <p class="lead">Multiple-choice, 4 options, with rationales. Each module quiz targets the high-yield concepts you'll see on the exam.</p>
    <div class="module-tabs">${tabs}</div>
    ${lastScore?`<p style="color:var(--mute)">Best: <b>${lastScore.best}%</b> · Last: ${lastScore.last}% · Attempts: ${lastScore.attempts}</p>`:""}
    ${body}`;
}
function setQuizMod(id){ state.activeQuizModule=id; save(); quizState={mod:id,idx:0,answers:{},submitted:false}; renderQuiz(); }
function submitQuiz(){ quizState.submitted=true; quizState.saved=false; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
function resetQuiz(){ quizState={mod:quizState.mod,idx:0,answers:{},submitted:false}; renderQuiz(); }

/* ---------- Mock Exam ---------- */
let mockState = { started:false, submitted:false, answers:{}, order:[] };
function renderMock(){
  if(!mockState.started){
    const best = state.mockBest;
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">120-Question Mock Exam</h2>
      <p class="lead">Simulates the CSCP test proportionally across all 8 modules. Budget ~2.5 hours; the real exam gives 3.5 hours for 150 questions. Aim for 80%+ before test day.</p>
      ${best!=null?`<div class="card" style="margin-bottom:12px">Your best score: <b>${best}%</b></div>`:""}
      <div class="card">
        <h3>How it works</h3>
        <ul>
          <li>120 questions drawn from the full pool (${MOCK_EXAM.length} available), shuffled.</li>
          <li>No time pressure — the app doesn't stop you.</li>
          <li>Answer all, then submit. You'll see rationales and which modules need more review.</li>
        </ul>
        <p style="color:var(--mute);margin-top:10px">Questions are drawn using the <b>official exam blueprint weighting</b>: Mod 1 10% · Mod 2 10% · Mod 3 17% · Mod 4 19% · Mod 5 9% · Mod 6 17% · Mod 7 10% · Mod 8 8%.</p>
        <button class="btn" onclick="startMock()">Start mock exam</button>
      </div>`;
    return;
  }
  const qs = mockState.order.map(i=>MOCK_EXAM[i]);
  if(!mockState.submitted){
    const list = qs.map((q,i)=>{
      const chosen = mockState.answers[i];
      const opts = q.options.map((o,oi)=>`<label class="q-opt"><input type="radio" name="mq${i}" value="${oi}" ${chosen===oi?'checked':''} onchange="mockState.answers[${i}]=${oi}"> <span>${String.fromCharCode(65+oi)}. ${o}</span></label>`).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div></div>`;
    }).join("");
    const answered = Object.keys(mockState.answers).length;
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">Mock Exam — in progress</h2>
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
        <p class="lead" style="margin:0">${answered}/${qs.length} answered · weighted to the real exam blueprint.</p>
        <b id="mockTimer" style="font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;color:var(--mute)">03:30:00 remaining</b>
      </div>
      ${list}
      <div class="row" style="margin-top:12px"><button class="btn" onclick="submitMock()">Submit exam</button><button class="btn ghost" onclick="mockState={started:false,submitted:false,answers:{},order:[]};renderMock()">Cancel</button></div>`;
    startMockTimer();
  } else {
    let correct=0;
    const byMod = {};
    const rendered = qs.map((q,i)=>{
      const chosen = mockState.answers[i];
      const right = chosen===q.answer;
      if(right) correct++;
      byMod[q.m] = byMod[q.m]||{c:0,t:0}; byMod[q.m].t++; if(right)byMod[q.m].c++;
      const opts = q.options.map((o,oi)=>{
        let cls="q-opt";
        if(oi===q.answer)cls+=" correct";
        else if(chosen===oi)cls+=" wrong";
        return `<div class="${cls}"><span>${String.fromCharCode(65+oi)}. ${o}</span></div>`;
      }).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q} <span class="pill mod${q.m.slice(1)}">${moduleLabel(q.m)}</span></div><div class="q-opts">${opts}</div><div class="rationale"><b>Rationale:</b> ${q.rationale||""}</div></div>`;
    }).join("");
    const pct = Math.round(100*correct/qs.length);
    if(!mockState.saved){ state.mockBest = Math.max(state.mockBest||0, pct); save(); mockState.saved=true; }
    const modBreak = Object.keys(byMod).sort().map(k=>`<tr><td>${moduleLabel(k)}</td><td>${byMod[k].c}/${byMod[k].t} (${Math.round(100*byMod[k].c/byMod[k].t)}%)</td></tr>`).join("");
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">Mock Exam — result</h2>
      <div class="score-banner"><h3>${correct} / ${qs.length} · ${pct}%</h3><p>${pct>=80?"Excellent. You are exam-ready.":pct>=70?"Solid pass territory — tighten up the weak modules.":pct>=60?"Close, not quite. Focus on your lowest-scoring modules below.":"Go back to module notes and flashcards before retaking."}</p></div>
      <div class="card"><h3>By module</h3><table><tr><th>Module</th><th>Correct</th></tr>${modBreak}</table></div>
      ${rendered}
      <div class="row" style="margin-top:10px"><button class="btn" onclick="mockState={started:false,submitted:false,answers:{},order:[]};renderMock()">Take another mock</button></div>`;
  }
}
const EXAM_BLUEPRINT = { m1:0.10, m2:0.10, m3:0.17, m4:0.19, m5:0.09, m6:0.17, m7:0.10, m8:0.08 };
function startMock(){
  const N = 120;
  const byMod = {};
  MOCK_EXAM.forEach((q,i)=>{ (byMod[q.m] = byMod[q.m]||[]).push(i); });
  Object.keys(byMod).forEach(k=> byMod[k].sort(()=>Math.random()-.5));
  let order = [];
  // Draw per official exam weighting
  Object.keys(EXAM_BLUEPRINT).forEach(m=>{
    const want = Math.round(N * EXAM_BLUEPRINT[m]);
    const avail = byMod[m] || [];
    order = order.concat(avail.slice(0, Math.min(want, avail.length)));
  });
  // Top up (or trim) to exactly N
  if(order.length < N){
    const used = new Set(order);
    const rest = MOCK_EXAM.map((_,i)=>i).filter(i=>!used.has(i)).sort(()=>Math.random()-.5);
    order = order.concat(rest.slice(0, N - order.length));
  }
  order = order.slice(0, N).sort(()=>Math.random()-.5);
  mockState = { started:true, submitted:false, answers:{}, order, startedAt: Date.now() };
  renderMock();
  startMockTimer();
}
let _mockTimer = null;
function startMockTimer(){
  if(_mockTimer) clearInterval(_mockTimer);
  _mockTimer = setInterval(()=>{
    const el = document.getElementById("mockTimer");
    if(!el || !mockState.started || mockState.submitted){ clearInterval(_mockTimer); _mockTimer=null; return; }
    const s = Math.floor((Date.now()-mockState.startedAt)/1000);
    const limit = 3.5*3600; // real exam allowance
    const left = Math.max(0, limit - s);
    const h = String(Math.floor(left/3600)).padStart(2,'0');
    const m = String(Math.floor((left%3600)/60)).padStart(2,'0');
    const sec = String(left%60).padStart(2,'0');
    el.textContent = `${h}:${m}:${sec} remaining`;
    el.style.color = left < 900 ? "#ef4444" : "#94a3b8";
  }, 1000);
}
function submitMock(){ mockState.submitted=true; mockState.saved=false; renderMock(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- Diagrams ---------- */
let diagIdx = 0;
function renderDiagrams(){
  const d = DIAGRAMS[diagIdx];
  const tabs = DIAGRAMS.map((x,i)=>`<button class="${i===diagIdx?'active':''}" onclick="diagIdx=${i};renderDiagrams()">${x.title}</button>`).join("");
  document.getElementById("view-diagrams").innerHTML = `
    <h2 class="section-title">Interactive diagrams</h2>
    <p class="lead">Click any highlighted element in the diagrams to see its explanation. These are the frameworks you must know cold.</p>
    <div class="module-tabs">${tabs}</div>
    <div class="diagram-wrap"><h3 style="margin:0 0 6px">${d.title}</h3><p style="margin:0 0 10px;color:var(--mute)">${d.desc}</p>${d.svg}</div>
    <div class="card" id="diagInfo"><b>Click a highlighted element above</b> to see its explanation here.</div>`;
  document.querySelectorAll(".clickable[data-key]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.key;
      const info = d.keys[key];

    });
  });
}

/* ---------- Glossary ---------- */
function renderGlossary(){
  const letters = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const byLet = {};
  GLOSSARY.forEach(g=>{
    const l = g.term[0].toUpperCase();
    byLet[l] = byLet[l] || [];
    byLet[l].push(g);
  });
  const html = letters.filter(l=>byLet[l]).map(l=>{
    return `<h3 id="g-${l}" style="margin:18px 0 6px;color:var(--accent)">${l}</h3>` +
      byLet[l].sort((a,b)=>a.term.localeCompare(b.term)).map(g=>`<div class="keyterm"><b>${g.term}</b> — ${g.def}</div>`).join("");
  }).join("");
  const nav = letters.filter(l=>byLet[l]).map(l=>`<a href="#g-${l}">${l}</a>`).join(" · ");
  document.getElementById("view-glossary").innerHTML = `
    <h2 class="section-title">Glossary</h2>
    <p class="lead">${GLOSSARY.length} key terms from the ECM. Use Ctrl/Cmd+F to search.</p>
    <div class="card" style="margin-bottom:12px">${nav}</div>${html}`;
}
