fc("m8","Upside SC adaptability","Max % increase in product quantities deliverable in a given timeframe.");
fc("m8","Downside SC adaptability","% reduction in order quantities sustainable 30 days before delivery without penalty.");
fc("m8","Upside SC flexibility","Days to achieve an unplanned 20% increase in quantities delivered.");
fc("m8","Target costing","Target manufacturing cost = market price − desired profit − marketing/distribution cost.");
fc("m8","UN Global Compact","Ten principles in human rights, labor, environment, anti-corruption — world's largest corporate sustainability initiative.");
fc("m8","SA8000 areas","Child labor · Forced labor · H&S · Freedom of association · Discrimination · Disciplinary practices · Working hours · Remuneration.");
fc("m8","Accreditation vs certification","Accreditation = certifying the certifier. Certification = third-party verification of compliance.");
fc("m8","Registration (ISO)","Process of having an accredited third-party auditor verify conformance to ISO standards.");
fc("m8","Feasibility study","Analysis of project viability (technical, economic, operational) before committing.");
fc("m8","Concurrent engineering / ESI","Cross-functional product design w/ early supplier involvement; reduces time and cost.");
fc("m8","Drop ship / direct shipment","Shipment direct from supplier to end customer; bypasses the seller's warehouse.");
fc("m8","Hedge inventory","Stock or financial instrument held to offset risk from price/FX volatility.");
fc("m8","Quantum computing","Emerging tech leveraging quantum mechanics; potential to solve combinatorial / optimization problems much faster.");
fc("m8","Spend management","Total outflow management across procurement, outsourcing, and supply chain.");
fc("m8","EVA (Economic Value Added)","Net operating profit earned above the cost of capital.");
fc("m8","Gap analysis","Comparison of actual product/service performance vs. customer expectations.");
fc("m8","Learning curve","Task time decreases with repetitions; depicted as a curve of repetitions vs. time.");
fc("m8","Heuristic","Rule-of-thumb solution used when full optimization is impractical.");
fc("m8","Work breakdown structure (WBS)","Hierarchical decomposition of project deliverables into smaller manageable pieces.");
fc("m8","Bullwhip causes","Demand signal processing, order batching, price fluctuations, rationing/shortage gaming, long lead times.");
fc("m8","Bullwhip remedies","Share POS, smaller batches, EDLP pricing, allocate by past sales, shorter lead times, VMI/CPFR.");
fc("m8","Stage 5 SC maturity","Orchestrated supply chain — full digital transformation (Industrie 4.0) creating relative competitive advantage.");
fc("m8","Product traceability","Ability to trace a product's history, application, or location for recall, regulatory, quality.");
fc("m8","Chain of custody","Documented unbroken trail of possession from origin to destination (pharma, food, conflict minerals).");
fc("m8","SCOR DS attributes","Reliability · Responsiveness · Agility · Cost · Asset Management.");

/* ===== Official APICS flashcard deck — full coverage additions ===== */
fc("m1","Supply chain management","The design, planning, execution, control, and monitoring of supply chain activities with the objective of creating net value, building a competitive infrastructure, leveraging worldwide logistics, synchronizing supply with demand, and measuring performance globally.");
fc("m1","Macro environment","The environment external to a business including technological, economic, natural, and regulatory forces that marketing efforts cannot control.");
fc("m1","Market share","The actual portion of current market demand that a company or product achieves.");
fc("m1","Marketing research","The systematic gathering, recording, and analyzing of data relating to the marketing of goods and services. Such research may be undertaken by impartial agencies or by business firms or their agents. Marketing research includes several types: (1) Market analysis is the study of the size, location, nature, and characteristics of markets; (2) sales analysis (or research) is the systematic study and comparison of sales data; and (3) consumer research is concerned with the discovery and analysis...");
fc("m1","Order processing","The activities required to administratively process a customer’s order and make it ready for shipment or production.");
fc("m1","Demand forecasting","Forecasting the demand for a particular good, component, or service.");
fc("m1","Product mix forecast","A forecast of the proportion of products that will be sold within a given product family or the proportion of options ordered within a product line. An inaccurate product mix forecast can create material and inventory shortages even if the aggregate product line or product family demand forecast is accurate.");
fc("m1","Chase production method","A production planning method that maintains a stable inventory level while varying production to meet demand. Companies may combine elements of chase and level strategies to create a hybrid production plan that minimizes total cost over the planning horizon. Syn.: chase strategy.");
fc("m1","Executive sales and operations planning","(executive S&OP) The portion of sales and operations planning (S&OP) that defines executive decision-making processes to balance supply and demand at the volume level in families, fully integrates financial planning and operational planning, and provides a forum for establishing and linking high-level strategic plans with day-to-day operations. See: sales and operations planning (S&OP).");
fc("m1","Level production method","A production planning method that maintains a stable production rate while varying inventory levels to meet demand. Syns.: level strategy, production leveling. See: level schedule.");
fc("m2","Electronic document","The electronic version of a document that may or may not also be printed.");
fc("m2","Information system","Interrelated computer hardware and software along with people and processes designed for the collection, processing, and dissemination of information for planning, decision-making, and control.");
fc("m2","Information technology (IT)","The technology of computers, telecommunications, and other devices that integrate data, equipment, personnel, and problem-solving methods in planning and controlling business activities. IT provides the means for collecting, storing, encoding, processing, analyzing, transmitting, receiving, and printing text, audio, or video information.");
fc("m2","Supply chain resilience","The ability of a supply chain to anticipate, create plans to avoid or mitigate, and/or to recover from disruptions to supply chain functionality. See: resilience.");
fc("m2","Collaborative planning, forecasting, and replenishment (CPFR)","CPFR) A collaboration process in which supply chain trading partners jointly develop plans for demand management and demand fulfillment activities to establish a shared vision of how products will be promoted and sold over the planning horizon. The trading partners share demand forecasts and replenishment plans iteratively until they agree to a consensus forecast, which they use to develop production and shipment plans designed to support the collaborative demand forecast. See: collaborative...");
fc("m2","Content management application","An application that supports the evolutionary life cycle of digital-based information and makes information dynamically updatable online. These applications also have the ability to publish content to a repository and support access to digital-based content.");
fc("m2","Data cleansing","Examining a database or data file to find and fix mistakes, such as misspellings, missing information, data inconsistencies, and false data.");
fc("m2","Information system architecture","A model of how the organization operates regarding information. The model considers four factors: (1) organizational functions, (2) communication of coordination requirements, (3) data modeling needs, and (4) management and control structures. The architecture of the information system should be aligned with and match the architecture of the organization.");
fc("m2","Operating system","A set of software programs that controls the execution of the hardware and application programs. The operating system manages the computer and network resources through storage management, disk input/output, communications linkages, program scheduling, and monitoring system usage for performance and cost allocations.");
fc("m2","Passive tag","A radio frequency identification (RFID) tag that does not actively transmit data and is not self-powered. See: radio frequency identification (RFID).");
fc("m2","Point-of-sale information","Information about customers collected at the time of sale.");
fc("m2","Quick-response program (QRP)","A system of linking final retail sales with production and shipping schedules back through the chain of supply. This system employs point-of-sale scanning and electronic data interchange and may use direct shipment from a factory to a retailer. See: continuous replenishment.");
fc("m2","Semipassive tag","A radio frequency identification (RFID) tag that sends out data, is self-powered, and widens its range by harnessing power from the reader. See: radio frequency identification (RFID).");
fc("m2","Server","A computer or software package that provides a specific kind of service to client software running on other computers. The term can refer to a particular piece of software, a web server, or the machine on which the software is running. A single server machine could have several different server software packages running on it, thus providing many different servers to clients on the network.");
fc("m2","Web directory","A list of web pages that is structured hierarchically.");
fc("m2","Accounts payable (AP)","The value of goods and services acquired for which payment has not yet been made.");
fc("m2","Accounts receivable (AR)","The value of goods shipped or services rendered to a customer for which payment has not yet been received. This usually includes an allowance for bad debts.");
fc("m2","Cost accounting","The branch of accounting that is concerned with recording and reporting business operating costs. It includes the reporting of costs by departments, activities, and products.");
fc("m2","Current price","The price currently being paid, as opposed to standard cost.");
fc("m2","Customer order fulfillment cycle time","The average actual cycle time consistently achieved to fulfill customer orders. For each individual order, this cycle time starts at the order receipt and ends at customer acceptance of the order.");
fc("m2","Days outstanding","A term used to imply the amount of an asset or liability measured in days of sales. For example, accounts payable (AP) days are the typical number of days that a firm delays payment of invoices to its suppliers. See: days payable outstanding (DPO), days sales outstanding (DSO).");
fc("m2","Digital Capabilities Model (DCM) for Supply Networks","A reference model for supply chain professionals to guide the development of digital supply networks. The model is designed in a relational manner to help envision and then build the digitally enabled capabilities required to transform linear supply chains into a set of dynamic networks.");
fc("m2","Executive dashboard","A set of cross-functional metrics for measuring company performance that indicates the health of the company. It usually includes the company’s key performance indicators. See: dashboard.");
fc("m2","Inventory valuation","The value of the inventory at either its cost or its market value. There are a variety of ways to calculate the value of inventory to establish the cost of goods sold (COGS). Because inventory value can change with time, the age of the inventory may also be taken into consideration. See: average cost system; first in, first out (FIFO); inventory investment; last in, first out (LIFO).");
fc("m2","Net working capital","The current assets of a firm minus its current liabilities. Syn.: working capital.");
fc("m2","Perfect order fulfillment","A measure of an organization’s ability to deliver a perfect order.");
fc("m2","Return on supply chain fixed assets","A measurement of the return an organization receives from its invested capital in supply chain fixed assets. This includes the fixed assets used in Orchestrate, Plan, Order, Source, Transform, Fulfill, and Return. It is calculated as (Supply Chain Revenue - Total Supply Chain Management Cost) ÷ Supply Chain Fixed Assets.");
fc("m2","Return on working capital","A measure of profit on the amount of capital consumed. It is calculated as after-tax operating income divided by net working capital.");
fc("m2","Standard cost accounting system","A cost accounting system that uses cost units determined before production for estimating the cost of an order or product. For management control purposes, the standards are compared with actual costs, and variances are computed.");
fc("m3","Make or buy cost analysis","A comparison of all the costs associated with making an item versus the cost of buying the item. See: make- or-buy decision.");
fc("m3","Make-or-buy decision","The act of deciding whether to produce an item internally or buy it from an outside supplier. Factors to consider in the decision include costs, capacity availability, proprietary and/or specialized knowledge, quality considerations, skill requirements, volume, and timing. See: make or buy cost analysis.");
fc("m3","Supplier partnership","The establishment of a working relationship with a supplier organization whereby two organizations act as one. Syn.: collaborative supply relationship. See: supplier collaboration.");
fc("m3","Design for the supply chain","Enhancement of a firm’s product design in consideration of the issues that will arise in the supply chain, from raw materials to the final stage of the product’s life cycle.");
fc("m3","Modular design strategy","The strategy of planning and designing products so that components or subassemblies can be used in current and future products or assembled to produce multiple configurations of a product. Automobiles and personal computers are examples of modular designs.");
fc("m3","Modularization","In product development, the use of standardized parts for flexibility and variety. This permits product development cost reductions by using the same item(s) to build a variety of finished goods. Modularization is the first step in developing a planning bill of material (BOM).");
fc("m3","Product differentiation","A strategy of making a product distinct from the competition on a nonprice basis such as availability, durability, quality, or reliability.");
fc("m3","Bilateral contract","An agreement wherein each party makes a promise to the other party.");
fc("m3","Blanket purchase order","A long-term commitment to a supplier for material against which short-term releases will be generated to satisfy requirements. Often blanket orders cover only one item with predetermined delivery dates. Syns.: blanket order, standing order. See: open-end purchase order.");
fc("m3","Cost-based contract","A type of purchasing contract in which the price of goods or services is tied to the costs of key inputs or other economic factors such as interest rates.");
fc("m3","Cost-plus contract","A contract in which the buyer agrees to pay the seller all the acceptable costs of the product or service up to a maximum cost. Syn.: cost-type contract.");
fc("m3","Cost-plus-fixed-fee contract","A contract in which the seller is paid for costs specified as allowable in the contract plus a stipulated fixed fee.");
fc("m3","Cost-plus-incentive-fee contract","A contract in which the seller is paid for costs specified as allowable in the contract plus a bonus, provided certain provisions are met or exceeded.");
fc("m3","Fixed-price incentive fee contract","A contract in which the seller is paid a set price and can earn an additional profit if certain stipulations are met.");
fc("m3","Incentive arrangements","A contract between a buyer and seller that incorporates conditions designed to motivate the supplier to improve its performance in specific areas including on-time delivery, product quality, and customer satisfaction.");
fc("m3","Operating exposure","The risk introduced by flexible exchange rates when operating in the global environment, including their effect on production, storage, and buying and selling prices.");
fc("m3","Payment terms","Conditions surrounding payment for a sale, providing a time frame in which a customer can pay without late penalties or additional fees. The payment terms may also specify an optional early payment deadline that would trigger a discount for the customer. See: terms and conditions.");
fc("m3","Terms and conditions","All the provisions and agreements of a contract.");
fc("m3","Trading partner agreement","A contract between trading partners that describes all facets of their business together. It is a legal and binding agreement suitable for legal purposes as well as standard working agreements.");
fc("m3","United Nations Convention on Contracts for the International Sale of Goods (CISG)","CISG) A multilateral treaty that governs the sale of goods internationally. It facilitates international trade and removes legal barriers by providing uniform rules for commercial transactions. It is sometimes known as the Vienna Convention.");
fc("m3","Virtual trading exchange","An online trading exchange that enables both information integration and collaboration among multiple trading partners.");
fc("m4","Cumulative lead time","The longest planned length of time to accomplish an activity. It is the sum of the lead time for each bill of material (BOM) path below an item. Whichever path adds up to the greatest number defines cumulative lead time. Syns.: aggregate lead time, combined lead time, composite lead time, stacked lead time. See: critical path lead time, planning horizon, planning time fence.");
fc("m4","Joint replenishment","The coordination of the lot sizing and order release decisions for related items and treating them as a family of items. The objective is to achieve lower costs from ordering, setup, shipping, and quantity discount economies. This term applies equally to joint ordering and to composite part (group technology (GT)) fabrication scheduling. See: joint order, multiple-item lot-sizing model.");
fc("m4","Master schedule item","A part number selected to be planned by the master scheduler. The item is deemed critical in its impact on lower-level components or resources such as skilled labor, key machines, or dollars. Therefore, the master scheduler, not the computer, maintains the plan for these items. A master schedule item may be an end- item, a component, a pseudo number, or a planning bill of material (BOM).");
fc("m4","Open order","A customer order, manufacturing order, or purchased order that has been released but not yet filled. Syn.: released order. See: scheduled receipt.");
fc("m4","Parent item","The item produced from one or more components. Syn.: parent.");
fc("m4","Planned order receipt","The quantity planned to be received at a future date as a result of a planned order release. Planned order receipts differ from scheduled receipts in that they have not been released. Syn.: planned receipt.");
fc("m4","Planned order release","A row on a material requirements planning (MRP) table that is derived from planned order receipts by taking the planned receipt quantity and offsetting it to the left by the appropriate lead time. See: order release.");
fc("m4","Pull system","1) In production, the production of items only as demanded for use or to replace those taken for use. See: pull signal. 2) In material control, the withdrawal of inventory as demanded by the using operations. Material is not issued until a signal comes from the user. 3) In distribution, a system for replenishing field warehouse inventories in which replenishment decisions are made at the field warehouse itself, not at the central warehouse or plant.");
fc("m4","Push system","1) In production, the production of items at times required by a given schedule planned in advance. 2) In material control, the issuing of material according to a given schedule or the issuing of material to a job order at its start time. 3) In distribution, a system for replenishing field warehouse inventories in which replenishment decision-making is centralized, usually at the manufacturing site or central supply facility. See: pull system.");
fc("m4","Bill of resources","A listing of the required capacity and key resources needed to manufacture one unit of a selected item or family. Rough-cut capacity planning (RCCP) uses these bills to calculate the approximate capacity requirements of the master production schedule (MPS). Resource planning may use a form of this bill. Syn.: bill of capacity. See: bill of labor, capacity bill procedure, capacity planning using overall factors (CPOF), product load profile, resource profile, rough- cut capacity planning...");
fc("m4","Capacity control","The process of measuring production output and comparing it with the capacity plan, determining if the variance exceeds pre-established limits, and taking corrective action to get back on plan if the limits are exceeded. See: input/output control (I/O control).");
fc("m4","Demand pull","The triggering of material movement to a work center only when that work center is ready to begin the next job. Demand pull shortens or eliminates the queue from in front of a work center, but it can cause a queue at the end of a preceding work center. Demand pull also can occur within a supply chain, in which case it often is called a demand chain. See: demand chain management.");
fc("m4","Manufacturing lead time","The total time required to manufacture an item, exclusive of lower-level purchasing lead time. For make- to-order (MTO) products, it is the length of time between the release of an order to the production process and shipment to the final customer. For make-to-stock (MTS) products, it is the length of time between the release of an order to the production process and receipt into inventory. Manufacturing lead time includes order preparation time, queue time, setup time, run time, move time,...");
fc("m4","Resource profile","The standard hours of load placed on a resource by time period. Production lead-time data is taken into account to provide time-phased projections of the capacity requirements for individual production facilities. See: bill of resources, capacity planning using overall factors (CPOF), product load profile, rough-cut capacity planning (RCCP).");
fc("m4","ABC classification","The classification of a group of items in decreasing order of annual dollar volume (price multiplied by projected volume) or other criteria. This array is then split into three classes, called A, B, and C. The A group usually represents 10 percent to 20 percent by number of items and 50 percent to 70 percent by projected dollar volume. The next grouping, B, usually represents about 20 percent of the items and about 20 percent of the dollar volume. The C class contains about 50 percent of the...");
fc("m4","Acquisition cost","The cost required to obtain one or more units of an item. This is computed as order quantity times unit cost. See: ordering cost.");
fc("m4","Anticipation inventories","Additional inventory above basic stocking levels to cover projected trends of increasing sales, planned sales promotion programs, seasonal fluctuations, plant shutdowns, and vacations.");
fc("m4","End-of-life product management","Planning for the phase-out of a product to avoid out-of- stock situations, excess inventory, or negative environmental impacts. This involves notifying customers so they can make timely conversions and plan lifetime buys of replacement parts, as well as considering the disposition of the materials.");
fc("m4","In-transit inventory","Material moving between two or more locations, usually separated geographically (e.g., finished goods being shipped from a plant to a distribution center (DC)).");
fc("m4","Inventory control","The activities and techniques of maintaining the desired levels of items, whether raw materials, work in process (WIP), or finished products and storing them properly to enable effective tracking and ensure their usable condition. Syn.: material control.");
fc("m4","Inventory ordering system","An inventory model for the replenishment of inventory. Independent demand inventory ordering systems include fixed reorder cycle, fixed reorder inventory model, optional replenishment, and hybrid models, among others. Dependent demand inventory ordering systems include material requirements planning, kanban, and drum-buffer-rope.");
fc("m4","Inventory planning","The activities and techniques of determining the desired levels of items, whether raw materials, work in process (WIP), or finished products (including order quantities and safety stock levels). Syn.: material planning.");
fc("m4","Appraisal costs","Those costs associated with the formal evaluation and audit of quality in the firm. Typical costs include inspection, quality audits, testing, calibration, and checking time.");
fc("m4","Cost of poor quality","The costs associated with performing a task incorrectly and/or generating unacceptable output. These costs would include the costs of nonconformities, inefficient processes, and lost opportunities. See: quality costs.");
fc("m4","Lean metric","A quantitative measurement of performance of a process, team, or the organization overall that can be used to guide improvement efforts toward reducing waste, enhancing quality, and increasing efficiency. Lean metrics take a balanced approach, enabling organizations to measure their performance relative to the needs of their customers.");
fc("m4","Lean production","A philosophy of production that emphasizes the minimization of the amount of all the resources (including time) used in the various activities of the enterprise. It involves identifying and eliminating non-value-adding activities in design, production, supply chain management, and customer management. Lean producers employ teams of multiskilled workers at all levels of the organization and use highly flexible, increasingly automated machines to produce volumes of products in potentially...");
fc("m4","Operational performance measurement","A performance measurement related to machine, worker, process, or department efficiency; utilization; throughput; and inventory levels. See: performance objective, strategic performance measurement.");
fc("m4","Pareto’s law","A principle first observed by Italian economist Vilfredo Pareto that states that a small percentage of a group accounts for the largest fraction of its impact or value. In ABC classification, for example, 20 percent of the inventory items may constitute 80 percent of the inventory value. See: 80-20 rule, ABC classification.");
fc("m4","Process map","A diagram of the flow of a production process or service process through the production system. Standardized symbols are used to designate processing, flow directions, branching decisions, input/output, and other aspects of the process.");
fc("m5","Fixed-location storage","A method of storage in which a relatively permanent location is assigned for the storage of each item in a storeroom or warehouse. More space may be needed to store parts than in a random-location storage system, but fixed locations become familiar to warehouse personnel. See: random-location storage.");
fc("m5","Line haul cost","The cost of carrier operations to move a container of freight, including drivers’ wages and usage depreciation. These vary with the cost per mile, the distance shipped, and the weight moved. This cost is commonly expressed in relation to the hundredweight (cwt) of the shipment.");
fc("m5","Random-location storage","A storage technique in which parts are placed in any space that is empty when they arrive at the storeroom. Although this random method requires the use of a locator record to identify part locations, it often requires less storage space than a fixed-location storage method. Syns.: floating inventory location system, floating storage location. See: fixed-location storage.");
fc("m5","Total cost concept","In logistics, the idea that all logistical decisions that provide equal service levels should favor the option that minimizes the total of all logistical costs and should not be used on cost reductions in one area (such as lower transportation charges) alone.");
fc("m5","Packing and marking","The activities of unitizing one or more items of an order, packing them into an appropriate container for safe shipping, and marking and labeling the container with required shipment data for identification, handling, and tracking. See: packaging.");
fc("m5","International freight forwarder","An entity that arranges and coordinates the transportation of goods from the production site or seller's storage facility to the customer's location in another country.");
fc("m5","Terms of trade","The portion of a contract of sale that specifies the responsibilities of the seller or exporter and the responsibilities of the buyer or importer, especially the point at which one party’s responsibilities end and the other party’s responsibilities begin (including the point at which title to the goods is transferred). These terms are commonly specified using International Commercial Terms (Incoterms<sup>®</sup>).");
fc("m5","Globally Harmonized System of Classification and Labelling of Chemicals (GHS)","GHS) An international standard created by the United Nations Economic Commission for Europe (UNECE) for classifying chemicals according to their health, physical, and environmental hazards. The system defines and classifies the hazards of chemical products and communicates health and safety information on labels and material safety data sheets. See: Harmonized Tariff Schedule (HTS).");
fc("m5","Reverse supply chain","The planning and controlling of the processes of moving goods from the point of consumption back to the point of origin for repair, reclamation, recycling, or disposal. See: reverse logistics.");
fc("m6","Multisourcing","Procurement of a good or service from more than one independent supplier. Syn.: multiple sourcing. Ant.: single sourcing. See: dual sourcing.");
fc("m6","Single-source supplier","A company that is selected to have 100 percent of the business for a part although alternate suppliers are available. See: sole-source supplier.");
fc("m6","Strategic sourcing","A comprehensive approach for locating and sourcing key material suppliers, which often includes the business process of analyzing total-spend-for-material spend categories. The approach includes a focus on the development of long-term relationships with trading partners who can help the purchaser meet profitability and customer satisfaction goals. From an information technology (IT) applications perspective, it includes automation of requests for quotes, requests for proposals, electronic...");
fc("m7","ISO 73:2009","An international standard that provides the definitions of generic terms related to risk management. It aims to encourage a mutual and consistent understanding of and a coherent approach to the description of activities relating to the management of risk and the use of uniform risk management terminology in processes and frameworks dealing with the management of risk.");
fc("m7","Risk acceptance","A decision to take no action to deal with a risk or an inability to format a plan to deal with the risk.");
fc("m7","Risk avoidance","Changing a plan to eliminate a risk or to protect plan objectives from its impact.");
fc("m7","Risk category","A cluster of risk causes with a label such as external, environmental, technical, or organizational.");
fc("m7","Risk response plan","A document defining known risks including description, cause, likelihood, costs, and proposed responses. It also identifies current status of each risk.");
fc("m7","Risk response planning","The process of developing a plan to avoid risks and to mitigate the effect of those that cannot be avoided.");
fc("m7","Supply chain continuity","An organization’s strategic and tactical capability to plan for and respond to conditions, situations, and events as necessary in order to continue supply chain operations at an acceptable predefined level.");
fc("m8","Demand-driven material requirements planning (DDMRP)","(DDMRP) A method for planning material needs that enables a company to build more closely to actual market requirements.");
fc("m8","Demand-driven supply network","A network in which a customer purchase initiates real- time information flows through the supply chain that consequently cause movement of product through the network.");
fc("m8","Global strategy","A strategy that focuses on improving worldwide performance through the sales and marketing of common goods and services with minimum product variation by country. The firm's competitive advantage grows through selecting the best locations for operations in other countries. See: multinational strategy.");
fc("m8","Inventory optimization","A computer application that can find optimal inventory strategies and policies related to customer service and return on investment over multiple echelons of a supply chain. The optimization happens simultaneously across all inventory stocking points in the supply chain and accounts for random variability. This practice is traditionally used for the replenish-to- forecast process as an alternative to pull-based replenishment, but it also can be used to calculate reorder points. See:...");
fc("m8","Key success factors","The product attributes, organizational strengths, and accomplishments with the greatest impact on future success in the marketplace.");
fc("m8","Mass marketing","The strategy of sending the same message to all potential customers.");
fc("m8","Operations research","1) The development and application of quantitative techniques to the solution of problems. More specifically, theory and methodology in mathematics, statistics, and computing are adapted and applied to the identification, formulation, solution, validation, implementation, and control of decision-making problems. 2) An academic field of study concerned with the development and application of quantitative analysis to the solution of problems faced by management in public and private...");
fc("m8","Organizational design","The creation of an organizational structure to support the strategic business plans and goals of an enterprise (e.g., for-profit versus not-for-profit companies). Given the mission and business strategy, the organizational structure design provides the framework within which the business’s operational and management activities will be performed.");
fc("m8","Strategic plan","A plan for how to marshal and determine actions to support the mission, goals, and objectives of an organization. A strategic plan generally includes an organization’s explicit mission, goals, and objectives as well as the specific actions needed to achieve those goals and objectives. See: business plan, strategic planning, strategy, tactical plan(s).");
fc("m8","Environmentally responsible business","A firm that operates in such a way as to minimize detrimental impacts on society. See: green manufacturing, green supply chain.");
fc("m8","ISO 14000 family of standards","A series of generic environmental management standards developed by the International Organization for Standardization (ISO) that provide structure and systems for managing environmental compliance with legislative and regulatory requirements and affect every aspect of a company’s environmental operations.");
fc("m8","ISO 26000:2010","An international standard developed by the International Organization for Standardization (ISO) to assist organizations in contributing to sustainable development beyond legal compliance through a common understanding of social responsibility.");
fc("m8","ISO 9000:2015","A set of international standards about quality management and quality assurance developed to help companies effectively document the quality system elements to be implemented to maintain an efficient quality system. The standards, initially published in 1987, are not specific to any particular industry, product, or service. The standards were developed by the International Organization for Standardization (ISO).");
fc("m8","Organization for Economic Cooperation and Development (OECD)","OECD) Guidelines for Multinational Enterprises A set of recommendations about responsible business conduct addressed by governments to multinational enterprises (MNEs) operating in or from adhering countries that encourage and maximize the positive impact MNEs can make to sustainable development and enduring social progress. See: multinational corporation.");
fc("m8","Artificial intelligence (AI)","1) Machines or computer programs that can learn, reason, and take action, similar to humans. 2) An area of computer science that attempts to develop AI computer programs. See: artificial general intelligence (AGI), artificial superintelligence (ASI), expert system.");
fc("m8","Expert system","A type of artificial intelligence that mimics human experts by using rules and heuristics rather than deterministic algorithms. See: artificial intelligence (AI).");
fc("m8","Project management","The use of skills and knowledge in coordinating the organizing, planning, scheduling, directing, controlling, monitoring, and evaluating of prescribed activities to ensure that the stated objectives of a project, manufactured good, or service are achieved. See: project.");
fc("m8","Supply chain control tower","A centralized hub that provides an integrated, complete view of data across the end-to-end supply chain. The system allows the supplier to see the requirements and inventory levels at the customer’s site, enhances the ability to get accurate information about supply location and availability, and highlights any potential excess inventory. Similarly, it helps the customer easily identify supply and demand variations and take necessary actions to return excess inventory. See: digital twin.");
fc("m8","augmented reality (AR)","Using holographic imagery alongside the physical environment to provide additional information or guidance about how to carry out a task. For example, warehouse employees can wear AR-enabled smart glasses to see information about the locations of items as well as instructions about what items and quantities to pick when pulling material to fill an order.");


/* ===== Final ECM-gap flashcards ===== */
fc("m4","Safety capacity","Planned capacity in excess of expected demand, reserved for unplanned events (rush orders, breakdowns). The capacity analog of safety stock.");
fc("m4","Manufacturing layout strategies","Product (line) layout for high volume · process (functional) layout for job shops · cellular layout for group-technology families · fixed-position for large projects.");
fc("m6","Customer-supplier partnership","Long-term buyer-supplier relationship with teamwork and mutual confidence; supplier acts as an extension of the buyer.");
fc("m6","Total cost to serve","Full cost of serving a customer/segment: product + logistics + service + sales + returns. Reveals unprofitable customers.");
fc("m1","Product positioning","Creating a product's image/identity in the minds of the target market relative to competitors.");
fc("m8","Inventory optimization software","Multi-echelon statistical optimization of inventory levels and placement for target service at minimum cost.");


/* ===== Exact-ECM-wording reinforcement cards ===== */
fc("m1","SWOT analysis","An analysis of Strengths and Weaknesses (internal) plus Opportunities and Threats (external) used to guide strategic planning and demand analysis.");
fc("m1","Market segmentation","Dividing a market into distinct groups of buyers with different needs, characteristics, or behaviors who might require separate products or marketing mixes.");
fc("m1","Marketing strategy","The plan for using the Four Ps (product, price, place, promotion) to reach target segments and achieve market objectives.");
fc("m2","Business process reengineering (BPR)","A fundamental rethinking and radical redesign of business processes to achieve dramatic improvements in cost, quality, service, and speed.");
fc("m2","Global measurements","Performance measures that assess the entire supply chain rather than a single function or firm (e.g., SCOR Level 1 metrics, perfect order, cash-to-cash).");
fc("m2","Performance measurement system","The integrated set of metrics, targets, and reporting used to evaluate performance — e.g., a balanced scorecard combining financial, customer, process, and learning perspectives.");
fc("m2","Performance standard","The expected level of performance against which actual results are compared (e.g., standard hours, standard cost, target service level).");
fc("m3","Design for maintainability","Designing a product so it is easy to service, repair, and maintain after sale. Syn.: design for service.");
fc("m3","Design for remanufacture","Designing a product so its components can be recovered, rebuilt to original specification, and resold — supports circular economy and reverse logistics.");
fc("m3","Strategic partnerships","Long-term relationships in which organizations share proprietary information, make joint investments, and link processes for mutual performance gains.");
fc("m4","Quality control","The operational techniques and activities used to fulfill requirements for quality — inspection, statistical process control, control charts, and corrective action.");
fc("m4","Root cause analysis","A structured method (5 Whys, Ishikawa/fishbone, fault tree) for identifying the underlying cause of a problem rather than its symptoms.");
fc("m4","Pareto analysis","Ranking causes or items by their contribution so effort focuses on the vital few (80-20 rule). Basis for ABC classification and Pareto charts.");
fc("m5","Distribution channel","The route by which a product moves from producer to end user — direct, retailer, wholesaler/distributor, or agent — and the intensity (intensive, selective, exclusive) of coverage.");
fc("m5","Distribution inventory","Inventory held in the distribution network (DCs, field warehouses) to serve customer demand — planned using DRP.");
fc("m5","Distribution network structure","The configuration of plants, DCs, cross-docks, and transport lanes that determines cost, service, and responsiveness.");
fc("m5","Private warehouse","A warehouse owned and operated by the company storing the goods. Benefits: control, customization, no markup. Downside: capital tied up and fixed costs persist in downturns.");
fc("m5","Logistics management","The part of supply chain management that plans, implements, and controls the efficient forward and reverse flow and storage of goods, services, and related information between origin and consumption.");
fc("m6","Customer service level","A measure of satisfying demand through inventory or the production schedule, usually expressed as a percentage. In MTS: percentage of orders filled from stock; in MTO: percentage shipped on the customer-requested date.");
fc("m6","Supplier performance evaluation","Periodic audit or assessment of a supplier against agreed KPIs — quality plan, financial stability, process capability, governance, delivery, and sustainability.");
fc("m7","Resiliency","The ability of a supply chain to anticipate, avoid or mitigate, and recover from disruption and return to normal operations.");
fc("m8","UN Global Compact Management Model","A framework for implementing the UN Global Compact's ten principles: Commit, Assess, Define, Implement, Measure, and Communicate.");
fc("m8","Upside supply chain adaptability","The maximum sustainable percentage increase in quantities delivered that the supply chain can achieve in a given timeframe.");
fc("m8","Downside supply chain adaptability","The reduction in quantities ordered that is sustainable at 30 days prior to delivery with no inventory or cost penalties.");
fc("m8","Network planning","Determining the optimal number, location, size, and role of facilities and transport lanes to meet service targets at minimum total cost.");
fc("m8","Value stream mapping","A lean tool that maps material and information flow from supplier to customer, separating value-added from non-value-added time to expose waste.");


/* ===== ECM exact-wording gap closure ===== */
fc("m1","Intrinsic forecasting method","A forecast based on the item's OWN historical demand data (internal). Examples: moving average, weighted moving average, exponential smoothing, time-series decomposition. Contrast with extrinsic.");
fc("m1","Extrinsic forecasting method","A forecast based on EXTERNAL indicators that correlate with demand (leading indicators such as housing starts, GDP, births). Uses regression/causal models. Contrast with intrinsic.");
fc("m1","Historical analysis","Examination of past demand data to identify the competitive environment and demand patterns (trend, seasonality, cyclical, random) before forecasting.");
fc("m1","Environmental scan","Systematic review of external forces — technological, economic, natural, regulatory, competitive — that shape demand and cannot be controlled by marketing.");
fc("m2","Web-based EDI","EDI conducted over the public internet rather than a private value-added network (VAN). PRIMARY advantage: it lowers the cost per transaction by eliminating VAN fees. Transaction formats and standards are unchanged, and translation is still required.");
fc("m2","Create data (master data lifecycle)","Establishing new master records — customer, supplier, product/item, engineering, logistics — with validation and approval workflows so the record is accurate from birth.");
fc("m2","Update data (master data lifecycle)","Modifying existing master records as business conditions change: prices, addresses, specifications, lead times, status.");
fc("m2","Cleanse data (master data lifecycle)","Examining a database to find and fix mistakes — misspellings, missing information, inconsistencies, duplicates, and false data.");
fc("m2","Retire data (master data lifecycle)","Removing obsolete master records from active use (discontinued products, inactive suppliers, closed accounts) while retaining history for reference and audit.");
fc("m2","Financial metrics and reports","Balance sheet, income statement, cash flow statement, COGS, gross margin, ROA, ROI, inventory turnover, days of supply, cash-to-cash cycle time — used to assess supply chain financial performance.");
fc("m2","Dashboards","An easy-to-read management tool combining business intelligence and data integration infrastructure to display performance against business objectives in near real time.");
fc("m2","Order promising","The process of making a delivery commitment — answering when a customer order can be shipped. Uses available-to-promise (ATP), capable-to-promise (CTP), or profitable-to-promise (PTP) logic.");
fc("m2","Days sales outstanding (DSO)","The average number of days it takes to collect payment after a sale. Shorter DSO = faster cash collection. A component of cash-to-cash cycle time.");
fc("m3","Design for manufacturability (DFM)","Simplifying parts, products, and processes so the item is easy and economical to manufacture — improves quality and reduces cost.");
fc("m3","Segmented sourcing strategy","Applying different sourcing approaches to different supplier segments based on how much the supplier needs your business and how strategically important the item is (see Kraljic).");
fc("m3","Supplier qualification","Initial evaluation of a potential supplier — financial stability, management policies, quality systems, capacity, capability, site visit — before award.");
fc("m3","E-procurement","Electronic purchasing of goods and services through online catalogs, portals, and marketplaces. Reduces transaction cost and cycle time for routine (non-critical) spend.");
fc("m3","Competitive strategy","A long-term, often time-phased plan of actions a firm pursues to achieve competitive advantage in its defined market — leveraging strengths against opportunities while protecting against threats tied to weaknesses. Usually a major portion of overall company strategy.");
fc("m4","Replenishment strategy","The policy determining when and how much to reorder — order point/EOQ, periodic review, MRP/time-phased, kanban pull, VMI, or continuous replenishment.");
fc("m5","Harmonized system classification codes","Internationally standardized numeric codes describing goods in increasing detail, used to assess duties and gather trade statistics. Also called HS codes; the US implementation is the HTS.");
fc("m5","Warehousing strategy","Decisions on owned vs. leased (private, public, contract), number of warehouses, locations, layout, stock location method, and automation level to balance cost against service.");
fc("m5","Transportation strategy","Decisions on modes, carriers, private vs. for-hire fleets, routing, consolidation, and service levels to minimize total logistics cost at target service.");
fc("m5","Put away","Removing material from the receiving dock, transporting it to storage, placing it in a specific location, and recording that location.");
fc("m5","Value-added services (distribution)","Extra services performed at the DC: installation, repacking, postponement/final differentiation, stocking (pricing/labeling), final assembly, and kitting.");
fc("m5","Warranties (reverse logistics)","Guarantees from the manufacturer/seller about product condition or performance. Warranty management covers claim processing, repair-vs-replace decisions, repair workflows, and warranty cost tracking; warranty policy directly drives reverse-logistics volume.");
fc("m5","Disposition (reverse logistics)","The decision on what to do with a returned, excess, or end-of-life product: return to stock, repair/refurbish for resale, remanufacture, recycle, donate, or dispose — balancing recovery value against processing cost.");
fc("m7","Contingency planning","Developing pre-defined responses and reserves for identified risks, with documented triggers/early-warning signals so the response executes quickly when the risk materializes.");
fc("m4","Quality is an elusive concept","Quality remains elusive in most organizations because it depends on CUSTOMER PERCEPTION — customers have differing requirements and priorities. (Not because there are many philosophies, not because it is everyone's responsibility, and not because targets change.)");

/* ================= QUIZZES ================= */
QUIZZES.m1 = [
  {q:"Which of the following is NOT one of the three primary flows in a supply chain?",options:["Information","Product/Service","Funds","Authority"],answer:3,rationale:"The three flows are information, product/service, and funds. Authority is an organizational concept, not a supply chain flow."},
  {q:"A firm that buys its key supplier is engaging in which type of integration?",options:["Forward vertical","Backward vertical","Horizontal","Lateral alliance"],answer:1,rationale:"Backward vertical integration = acquiring upstream suppliers. Forward = downstream."},
  {q:"A supply chain described as 'functions each optimize themselves without cross-functional integration' is at which maturity stage?",options:["Stage 1 Multiple dysfunction","Stage 2 Semifunctional enterprise","Stage 3 Integrated enterprise","Stage 4 Extended enterprise"],answer:1,rationale:"Stage 2 exhibits functional silos optimizing individually. Stage 1 is deeper dysfunction with no coordination at all."},
  {q:"Real GDP is computed by applying a weighted average price to control for what?",options:["Seasonality","Exchange rate","Inflation","Population"],answer:2,rationale:"Real GDP uses fixed-basket prices to strip out inflation so growth reflects true output change."},
  {q:"A product with |price elasticity of demand| = 0.4 is best described as:",options:["Highly elastic","Inelastic","Unit elastic","Perfectly elastic"],answer:1,rationale:"|E|<1 is inelastic — quantity changes less than proportionally to price."},
  {q:"Which forecasting principle states you should forecast based on demand rather than orders?",options:["Principle 1","Principle 2","Principle 3","Principle 4"],answer:0,rationale:"Principle 1 — orders are constrained by supply; true demand must drive the forecast."},
  {q:"Exponential smoothing with α = 0.8 will:",options:["Respond slowly to changes in demand","Respond quickly to recent changes","Give equal weight to all periods","Produce identical results to a 3-period moving average"],answer:1,rationale:"Higher α puts more weight on the most recent demand, causing the forecast to respond faster (also noisier)."},
  {q:"Which method is most appropriate for long-range forecasting of a new product with no demand history?",options:["Simple moving average","Exponential smoothing","Delphi technique","Naïve method"],answer:2,rationale:"Delphi — iterative anonymous expert consensus — is the preferred qualitative method for NPI and long-horizon forecasts."},
  {q:"A tracking signal consistently reads +5.5 over several periods. This suggests:",options:["Forecasts are accurate","Forecasts are biased low","Forecasts are biased high","Random noise only"],answer:1,rationale:"A positive tracking signal means actual > forecast on balance, i.e., the forecast is systematically too low. ±4 to ±6 indicates bias."},
  {q:"Which of the following best captures the 'Act' phase of the PDCA cycle?",options:["Set targets and metrics","Execute the plan","Compare actual vs. target","Standardize successes or correct deviations"],answer:3,rationale:"The Act phase institutionalizes what worked or corrects what didn't, setting up the next PDCA cycle."},
  {q:"Deseasonalizing demand requires dividing actual demand by:",options:["Trend value","Seasonal index","Weighted moving average","Regression coefficient"],answer:1,rationale:"Actual ÷ seasonal index removes seasonal effect before applying trend/time-series methods; then reseasonalize at the end."},
  {q:"MAPE is defined as:",options:["Σ Error / n","Σ |Error| / n","(Σ |Error / Actual|) / n × 100%","Σ Error² / n"],answer:2,rationale:"MAPE = Mean Absolute Percentage Error; scale-free so you can compare across items."},
  {q:"Which demand pattern component represents repeating within-year variation?",options:["Trend","Cycle","Seasonality","Random"],answer:2,rationale:"Seasonality = predictable repeating pattern within a year (quarterly, monthly, weekly)."},
  {q:"The 4 Ps of marketing include all EXCEPT:",options:["Price","Placement","Planning","Promotion"],answer:2,rationale:"The Ps are Product, Price, Placement (channel), Promotion. Planning is not one of the 4 Ps."},
  {q:"Forecasts are generally MORE accurate when:",options:["For individual items vs. groups","For long horizons vs. short","For groups vs. individual items","When they include no error estimate"],answer:2,rationale:"Principle 4 — aggregation reduces randomness, so group (category/family) forecasts are more accurate than individual SKUs."},
];

QUIZZES.m2 = [
  {q:"Which supply chain design is best for functional products with stable demand?",options:["Responsive","Efficient","Agile","Risk-hedging"],answer:1,rationale:"Fisher's framework: functional products → efficient, low-cost chain. Innovative products → responsive."},
  {q:"The PRIMARY benefit of ERP is:",options:["Best-of-breed functionality per module","Single integrated database and transactional backbone","No customization ever required","Elimination of all master data issues"],answer:1,rationale:"ERP's core value is one source of truth across functions; best-of-breed trades integration for best functionality."},
  {q:"Configuration is preferred over customization because it:",options:["Allows unlimited code changes","Preserves upgrade path","Is always cheaper at year 1","Eliminates the need for training"],answer:1,rationale:"Configuration uses delivered functionality and survives upgrades; customization breaks upgrades and raises TCO."},
  {q:"Which integration method involves the supplier owning the replenishment decision for the customer?",options:["CPFR","VMI","Quick Response","Cross-docking"],answer:1,rationale:"VMI = Vendor-Managed Inventory; supplier decides when and how much to replenish based on shared data."},
  {q:"CPFR stands for:",options:["Continuous Planning, Forecasting & Replenishment","Collaborative Planning, Forecasting & Replenishment","Consolidated Procurement, Forecasting & Reporting","Customer Planning for Rapid Response"],answer:1,rationale:"Collaborative Planning, Forecasting & Replenishment — shared forecasts and replenishment plans with partners."},
  {q:"Under Incoterms, EXW:",options:["Places maximum responsibility on the seller","Places maximum responsibility on the buyer","Is used only for sea shipments","Requires seller to clear goods for export"],answer:1,rationale:"Ex Works = seller's minimum obligation; buyer takes over at the seller's premises."},
  {q:"DDP (Delivered Duty Paid) means:",options:["Seller delivers to the first carrier only","Buyer is responsible for import duties","Seller bears risk until goods reach buyer's named place, duties paid","Terms only for inland water transport"],answer:2,rationale:"DDP = maximum seller obligation — duties paid, delivered to buyer's named place."},
  {q:"Risk pooling reduces safety stock because:",options:["Centralized variance is the sum of variances","Central inventory sees less demand","Aggregated demand has lower relative variability","Suppliers always deliver faster"],answer:2,rationale:"Aggregated demand has lower CV (variance adds in quadrature); safety stock ∝ σ, so pooling lowers total SS by √n."},
  {q:"Which of the following is a middleware/API purpose?",options:["Store master data","Provide transactional financial ledgers","Connect disparate systems for real-time data exchange","Replace the ERP"],answer:2,rationale:"Middleware and APIs enable real-time data exchange between front-end, ERP, and external systems."},
  {q:"The HS (Harmonized System) code is used for:",options:["Carrier rate tariffs","Customs classification and duties","ERP master data","Cybersecurity audits"],answer:1,rationale:"HS codes classify goods internationally for customs duty and trade statistics."},
  {q:"A Free Trade Zone (FTZ) primarily allows firms to:",options:["Pay duties immediately on arrival","Defer or avoid duties until goods enter commerce","Avoid all regulations","Bypass customs entirely"],answer:1,rationale:"In an FTZ, duties are deferred or avoided until goods leave the zone into the home market."},
  {q:"Which technology MOST directly provides real-time alerts when supply chain events deviate from plan?",options:["ERP transactional modules","APS","SCEM","WMS"],answer:2,rationale:"Supply Chain Event Management monitors events in real time against thresholds and triggers alerts."},
  {q:"In a cash-to-cash cycle, a LOWER number is achieved by:",options:["Increasing DIO and DSO","Decreasing DPO","Decreasing DIO and DSO while increasing DPO","Ignoring inventory turns"],answer:2,rationale:"Cash-to-cash = DIO + DSO − DPO. Less inventory and faster collections while paying suppliers later reduce it."},
  {q:"The nucleus firm in a supply chain is:",options:["The largest tier-2 supplier","A 3PL logistics provider","The focal firm that orchestrates network decisions","The end customer"],answer:2,rationale:"The nucleus (focal) firm is the orchestrator that leads design and cross-partner decisions."},
  {q:"GDPR primarily governs:",options:["Supply chain carbon emissions","Cross-border tariffs","Processing of personal data of EU residents","Anti-bribery compliance"],answer:2,rationale:"GDPR = EU General Data Protection Regulation; consent-based processing of personal data."},
];

QUIZZES.m3 = [
  {q:"Sourcing vs. procurement: sourcing is best described as:",options:["The transactional act of issuing a PO","The strategic process of supplier selection and relationship management","The same thing as procurement","Always outsourced to a 3PL"],answer:1,rationale:"Sourcing is strategic; procurement is tactical (PO, receive, pay)."},
  {q:"Which is NOT a typical make-vs-buy consideration?",options:["Core competency","Lost skills/knowledge risk","TCO / landed cost","Competitor's brand color"],answer:3,rationale:"Core competency, skill retention, and TCO are core considerations. Competitor aesthetics are not."},
  {q:"TCO typically includes all EXCEPT:",options:["Acquisition price","Inventory carrying cost","Disposal cost","Competitor's marketing budget"],answer:3,rationale:"TCO covers all costs across the ownership lifecycle of the buying firm — not competitors' costs."},
  {q:"On the Kraljic matrix, items with HIGH profit impact and HIGH supply risk are:",options:["Non-critical","Leverage","Bottleneck","Strategic"],answer:3,rationale:"Strategic items — treat with long-term partnership, joint development, risk share."},
  {q:"Leverage items (Kraljic) are characterized by:",options:["Low profit impact, low risk","High profit impact, low risk","Low profit impact, high risk","High profit impact, high risk"],answer:1,rationale:"Leverage: high spend, many suppliers — exploit buying power through bidding and consolidation."},
  {q:"A 'should-cost' analysis is used to:",options:["Determine the landed cost","Model what an item should cost from first principles (materials + labor + overhead + margin)","Audit supplier books","Calculate EOQ"],answer:1,rationale:"Should-cost benchmarks supplier quotes against a bottom-up cost model."},
  {q:"Concurrent engineering provides which benefit over traditional sequential design?",options:["Slower time to market","Late supplier involvement","Reduced development time and cost","Single-function decisions"],answer:2,rationale:"Concurrent engineering integrates cross-functional teams — including suppliers — early, reducing time and cost."},
  {q:"DFM stands for:",options:["Design for Manufacturing","Design for Marketing","Demand for Materials","Data flow Mapping"],answer:0,rationale:"DFM = Design for Manufacturing — one of the DFX family (DFA, DFS, DFE, etc.)."},
  {q:"A performance specification:",options:["Dictates exact dimensions and materials","Describes the functional outcome the item must achieve","Is used only for commodities","Cannot be used with outsourced suppliers"],answer:1,rationale:"Performance specs give supplier freedom in HOW while constraining WHAT the product must achieve."},
  {q:"Value engineering focuses on:",options:["Maximizing aesthetic value","Cutting cost while preserving function","Adding features irrespective of cost","Marketing communications"],answer:1,rationale:"VE/VA eliminates unnecessary cost without sacrificing function or quality."},
  {q:"Which contract type transfers cost risk to the supplier?",options:["Fixed-price","Cost-plus-fixed-fee","Time & materials","Cost-reimbursable"],answer:0,rationale:"Under fixed-price, the supplier bears overrun risk; buyer pays agreed price regardless of supplier cost."},
  {q:"BATNA is:",options:["A type of contract","Your best alternative to a negotiated agreement","A freight term","A sourcing event"],answer:1,rationale:"BATNA anchors your walkaway value — you should never accept terms worse than your BATNA."},
  {q:"Supplier right-sizing balances:",options:["Quality vs. speed","Risk reduction (more suppliers) vs. leverage (fewer suppliers)","Make vs. buy","Domestic vs. offshore"],answer:1,rationale:"More suppliers → less single-source risk; fewer suppliers → more volume leverage. Right-size balances these."},
  {q:"Spend analysis typically reveals:",options:["Perfect parity across all suppliers","A Pareto (80-20) distribution","That all spend is strategic","Equal spending by category"],answer:1,rationale:"Spend almost always follows 80-20: a few suppliers/categories account for most spend."},
  {q:"A preferred supplier relationship usually implies:",options:["Lowest price only","Multi-year performance-based relationship","No measurable KPIs","One-time transaction"],answer:1,rationale:"Preferred suppliers have performance scorecards and multi-year engagement; not pure spot buying."},
];

QUIZZES.m4 = [
  {q:"S&OP is conducted at which level of detail?",options:["SKU-level, daily","Product-family, monthly","Work center, hourly","Component, weekly"],answer:1,rationale:"S&OP works at product-family level with monthly cadence over 12–18 months."},
  {q:"ATP (Available-to-Promise) is calculated as:",options:["Forecast minus customer orders","MPS in this period + prior PAB − customer orders before the next MPS receipt","Beginning inventory + receipts","EOQ × lead time"],answer:1,rationale:"ATP = supply available to promise to new orders between MPS receipts — discrete ATP formula."},
  {q:"A demand fence (time fence) is a period in which:",options:["Forecasts are freely changed","MPS is frozen; no changes allowed","MRP doesn't run","Capacity is unconstrained"],answer:1,rationale:"Demand / inside time fence = frozen window; changes require significant authorization."},
  {q:"MRP inputs include all EXCEPT:",options:["MPS","Bills of material","Inventory records","Daily shipping manifests"],answer:3,rationale:"MRP inputs: MPS, BOM, inventory records, lead times. Shipping manifests are outbound execution documents."},

  {q:"RCCP (Rough-Cut Capacity Planning) validates:",options:["The MRP plan in detail","The MPS against critical resources","Daily dispatch lists","Shipping capacity"],answer:1,rationale:"RCCP is an MPS-level capacity check on critical work centers before MRP runs."},
  {q:"Utilization = ?",options:["Actual output / Design capacity","Actual output / Standard output","Standard output / Design capacity","Hours × Efficiency"],answer:0,rationale:"Utilization = actual output (or hours) ÷ design capacity (or scheduled hours). Efficiency compares to standard."},
  {q:"The Theory of Constraints' FIRST focusing step is:",options:["Elevate","Exploit","Identify the constraint","Subordinate"],answer:2,rationale:"The 5 steps: Identify → Exploit → Subordinate → Elevate → Repeat."},
  {q:"In lean, which is NOT one of the seven wastes?",options:["Overproduction","Defects","Transportation","Documentation"],answer:3,rationale:"TIMWOOD: Transport, Inventory, Motion, Waiting, Over-processing, Overproduction, Defects. Some add 'non-utilized talent' as an 8th."},
  {q:"SMED's goal is to:",options:["Reduce setup/changeover time","Improve product quality","Increase batch size","Eliminate inventory"],answer:0,rationale:"Single-Minute Exchange of Dies — reduce setup time to single-digit minutes to enable small batches."},
  {q:"DMAIC is associated with:",options:["Lean only","Six Sigma","TOC","ISO 9001"],answer:1,rationale:"DMAIC = Define, Measure, Analyze, Improve, Control — Six Sigma project framework."},
  {q:"ABC analysis classifies items by:",options:["Alphabet","Annual dollar usage / importance","Weight","Color"],answer:1,rationale:"ABC ranks items by annual dollar usage; A items highest control, C lowest."},

  {q:"Safety stock for 95% service level uses a z-factor of approximately:",options:["1.00","1.28","1.65","2.33"],answer:2,rationale:"z≈1.65 for 95% one-tailed service level. 1.28 ≈ 90%; 2.33 ≈ 99%."},
  {q:"Inventory turns = ?",options:["COGS / Average inventory","Sales / Safety stock","EOQ × cycle time","Average inventory / Daily demand"],answer:0,rationale:"Turns = COGS ÷ average inventory — how many times stock cycles per year."},
];

QUIZZES.m5 = [
  {q:"Which of the following is NOT one of the Seven Rs of logistics?",options:["Right product","Right quantity","Right receipt","Right time"],answer:2,rationale:"Seven Rs: right product, quantity, condition, place, time, customer, cost. 'Right receipt' is not one."},
  {q:"A 4PL is BEST described as:",options:["A shipper that owns its own trucks","An asset-heavy carrier","A lead logistics integrator managing multiple 3PLs and tech","A customs broker"],answer:2,rationale:"4PL = lead orchestrator; asset-light, manages multiple 3PLs and the technology stack."},
  {q:"Cross-docking primarily aims to:",options:["Store goods for longer","Bypass storage, transferring inbound directly to outbound","Increase order cycle time","Simplify customs clearance"],answer:1,rationale:"Cross-docking moves products directly from receiving to shipping with minimal or no storage."},
  {q:"Which mode of transport is BEST for low-value, bulk, international shipments?",options:["Air","Truck","Water","Parcel"],answer:2,rationale:"Water/ocean freight is the lowest cost per unit-mile but the slowest — ideal for bulk, low-value international."},

  {q:"Demurrage is a charge for:",options:["Fuel","Excessive use of a carrier's equipment (detention beyond free time)","Insurance","Customs clearance"],answer:1,rationale:"Demurrage (and detention) charges equipment held beyond allotted free time at port/DC/shipper."},
  {q:"Increasing the number of distribution centers typically:",options:["Increases transportation cost and reduces inventory","Increases inventory and reduces outbound transportation cost","Has no inventory effect","Is always cheaper overall"],answer:1,rationale:"More DCs → more safety stock (√n law) AND shorter last-mile → lower outbound transport. Optimum balances these."},

  {q:"Random stock location (vs. fixed) generally provides:",options:["Slower picking, better accuracy","Better space utilization, more complex without WMS","Lower overall cost with zero system","Reduces need for training"],answer:1,rationale:"Random/dynamic slotting maximizes space utilization but requires a WMS to track locations."},
  {q:"LTL freight is:",options:["Dedicated trailer for one shipper","Shared trailer, multiple shippers, classed freight","Always air","Over dimensional-only"],answer:1,rationale:"LTL (Less-than-Truckload) consolidates freight from multiple shippers; priced on class and distance."},
  {q:"Risk pooling via centralization cuts aggregate safety stock approximately by factor:",options:["N","log N","√N","N²"],answer:2,rationale:"Square-root law: total safety stock ratio ≈ 1/√N compared to N independent locations."},
  {q:"Which is part of extended producer responsibility (EPR)?",options:["Consumer pays all disposal costs","Producer responsible for product end-of-life","Only retailers handle returns","Governments absorb all waste"],answer:1,rationale:"EPR makes the producer financially/physically responsible for end-of-life management."},
  {q:"Collaborative Transportation Management (CTM) primarily seeks to:",options:["Reduce collaboration","Optimize transport by sharing information across shippers and carriers","Eliminate carriers","Increase empty miles"],answer:1,rationale:"CTM aligns shipper/carrier plans — reduces empty miles, balances loads, improves service."},
  {q:"Green logistics tactics include all EXCEPT:",options:["Modal shift to rail/water","Returnable packaging","Route optimization","Increasing empty backhauls"],answer:3,rationale:"Reducing — not increasing — empty backhauls lowers emissions."},
