 ["$100,000","$10,000","$250,000","$500,000"],0,
 "EMV = 0.20 × $500,000 = $100,000.");
mex("m7","A company contracts insurance for earthquake losses. This is a:",
 ["Mitigation","Avoidance","Transfer","Acceptance"],2,
 "Insurance transfers the financial impact of the risk to a third party.");
mex("m7","Which risk response is best when impact is low AND probability is low?",
 ["Avoid","Transfer","Mitigate","Accept"],3,
 "Small risks are typically accepted (passive or active with reserve) rather than actively treated.");
mex("m8","A firm moves from a linear 'take-make-dispose' to product take-back, refurbishment, and resale. This MOST exemplifies:",
 ["Agile strategy","Circular economy","Outsourcing","Offshoring"],1,
 "Reuse / refurb / resale are core circular-economy practices.");
mex("m8","Which technology is most associated with tamper-evident provenance tracking?",
 ["Blockchain / DLT","ERP","APS","WMS"],0,
 "Blockchain's distributed immutable ledger creates auditable provenance records.");
mex("m8","A supply chain strategy document that says 'we will compete on low total landed cost using global sourcing and high-volume standardized products' is an example of:",
 ["Differentiation","Cost leadership","Focus differentiation","Agility"],1,
 "Lowest total cost via scale and standardization is Porter's cost-leadership generic strategy.");
mex("m8","The 17 UN SDGs include which of the following?",
 ["Responsible consumption and production","Perfect order performance","Just-in-time manufacturing","Total productive maintenance"],0,
 "SDG 12 = 'Responsible Consumption and Production'. The others are operational SC frameworks, not SDGs.");
mex("m2","Information sharing that increases visibility but increases cyber attack surface is an example of:",
 ["Risk elimination","Risk-reward trade-off","Cost reduction without trade-off","Regulatory violation automatically"],1,
 "More openness → more risk; it's a trade-off to manage with security controls.");
mex("m4","Which lot-sizing rule orders exactly the net requirement each period?",
 ["EOQ","Fixed order quantity","Period order quantity","Lot-for-lot"],3,
 "Lot-for-lot = order exactly the net requirement; minimizes inventory but requires many orders.");
mex("m5","A company wants to reduce last-mile cost for an urban market. The BEST tactic is generally:",
 ["Centralize in one large rural DC","Use micro-fulfillment / dark-store close to the customer","Move to rail only","Stop e-commerce"],1,
 "Micro-fulfillment / dark stores shorten the last mile, lowering per-order delivery cost and time.");
mex("m7","Key steps in a business continuity plan include all EXCEPT:",
 ["Business impact analysis","Recovery strategies","Testing and updating","Publishing marketing ads"],3,
 "BCP = BIA, strategies, documented plan, training, testing, maintenance.");
mex("m1","The 'decoupling point' or 'push-pull boundary' is the point where:",
 ["Orders stop","Forecast-driven activity transitions to order-driven activity","Deliveries happen","Capacity planning begins"],1,
 "It's the boundary between forecast (push) upstream and customer-order (pull) downstream.");
mex("m4","The purpose of the master production schedule is to:",
 ["Do daily dispatch","Convert demand into a feasible plan for making end items","Replace MRP","Manage payables"],1,
 "MPS sits between S&OP and MRP — it converts aggregate demand to end-item level feasible schedules.");
mex("m3","A common purpose of the sourcing decision 'make' is:",
 ["Protect a core competency or IP","Always lower cost","Free up capital","Access a niche skill"],0,
 "'Make' when it protects IP or is a core competency; 'buy' when supplier has scale/expertise.");


/* ===== Audit: additional scenario questions (exam-style, best-answer) ===== */
mex("m1","A manufacturer keeps its workforce constant and builds inventory in the off-season to cover peak-season demand. Which production method is it using?",
 ["Chase","Level","Subcontracting only","Lag capacity"],1,
 "Level production keeps a stable rate and absorbs demand swings with inventory. Chase varies output each period.");
mex("m1","Executive S&OP differs from the earlier S&OP steps because it:",
 ["Creates the statistical forecast","Resolves imbalances and makes final authorization decisions at leadership level","Runs MRP","Publishes the demand plan only"],1,
 "The executive S&OP meeting reviews the reconciled plans, resolves remaining trade-offs, and authorizes the final plan.");
mex("m2","A supplier evaluation reveals an Altman Z-score of 1.5. The buyer should:",
 ["Treat the supplier as financially safe","Recognize distress risk and develop contingency/alternate sources","Ignore it — Z-scores are for customers only","Immediately terminate the relationship with no analysis"],1,
 "Z < 1.81 signals financial distress; prudent response is risk mitigation (alternates, monitoring), not blind trust or abrupt termination.");
mex("m2","Which measure best indicates how effectively a company uses its assets to generate sales?",
 ["Gross margin","Asset turnover","Current ratio","DSO"],1,
 "Asset turnover = total sales / total average assets (ECM supplemental definition) — an efficiency ratio linked to ROA.");
mex("m3","A US firm sources in euros and sells in dollars. A weakening dollar raises its input costs. This exemplifies:",
 ["Transaction cost","Operating exposure","Sunk cost","Inverted duty"],1,
 "Operating exposure = FX-rate movements changing future cash flows/competitiveness. Hedging and natural hedges mitigate it.");
mex("m3","Under CISG (Vienna Convention), international sales contracts benefit from:",
 ["National law of the seller only","Uniform default rules that facilitate cross-border trade","Mandatory arbitration in The Hague","Fixed worldwide prices"],1,
 "CISG provides uniform default rules for international sale of goods, removing legal barriers between signatory countries.");
mex("m4","A planner sees WIP piling up in front of one work center while downstream centers starve. TOC says the FIRST step is to:",
 ["Elevate the constraint by buying equipment","Identify the constraint","Subordinate everything to the constraint","Add safety stock everywhere"],1,
 "WIP buildup is the classic sign of a constraint; step 1 is IDENTIFY, then exploit before investing (elevate).");
mex("m4","Safety capacity is BEST described as:",
 ["Extra inventory above cycle stock","Planned capacity above expected demand for unplanned events","The constraint's maximum output","Overtime already scheduled"],1,
 "Safety capacity reserves productive capability for surprises — the capacity analog of safety stock.");
mex("m4","Which BOM would a master scheduler use to forecast options on a configurable product family?",
 ["Single-level BOM","Planning BOM with option percentages","Phantom BOM","As-built BOM"],1,
 "Planning BOMs are artificial groupings with option percentages used for family-level forecasting in ATO.");
mex("m5","A shipment's terms require the SELLER to pay freight to the destination port, but risk transfers at the origin port when goods are on board. These terms are:",
 ["FOB","CFR","EXW","DDP"],1,
 "CFR (Cost and Freight): seller pays freight to destination; risk passes on board at origin. (CIF adds insurance.)");
mex("m5","Total cost concept in logistics means:",
 ["Choose the lowest transportation cost always","Minimize the SUM of logistics costs at a given service level","Maximize warehouse utilization","Charge customers for all costs"],1,
 "Logistics decisions must optimize the total (transport + inventory + warehousing + handling), not one element.");
mex("m6","A firm calculates the full cost of serving each customer — product, freight, service, returns — and finds 20% of customers are unprofitable. This analysis is:",
 ["Total cost of ownership","Total cost to serve","Landed cost","Spend analysis"],1,
 "Cost-to-serve extends costing to customer level, guiding segmented service policies. TCO looks at purchases, not customers.");
mex("m6","Which action sequence correctly reflects supplier remediation?",
 ["Terminate first, evaluate later","Define KPIs → evaluate/audit → development program → remediation plan if underperforming","Only re-negotiate price","Public disclosure of failures"],1,
 "ECM flow: define measurements with the supplier, evaluate, develop, then execute a remediation plan when needed.");
mex("m7","A company deliberately keeps some risk because treatment would cost more than the expected loss. This is:",
 ["Avoidance","Mitigation","Acceptance","Transfer"],2,
 "Acceptance is chosen when EMV of the risk is lower than the cost of the response — often with a contingency reserve.");
mex("m7","Buying forward contracts to lock the price of a commodity input is an example of:",
 ["Hedging (risk transfer)","Risk avoidance","Risk acceptance","Insurance fraud"],0,
 "A financial hedge transfers price risk to the counterparty; a classic response to commodity/FX exposure.");
mex("m8","'Companies that focus on response rather than lowest cost' describes which supply chain type?",
 ["Efficient","Responsive","Risk-hedging","Linear"],1,
 "The exam rephrases terms — 'focus on response' = responsive chain (innovative products, unpredictable demand).");
mex("m8","A firm wants to pick ONE metric showing how quickly the chain could deliver 20% more product. It should use:",
 ["Downside adaptability","Upside supply chain flexibility","Cash-to-cash","Perfect order"],1,
 "Upside SC flexibility = days needed to achieve an unplanned sustainable 20% increase in delivered quantities.");
mex("m8","Which pairing of maturity stage and hallmark is CORRECT?",
 ["Stage 2 — first external collaboration","Stage 3 — internal integration via ERP and S&OP","Stage 4 — functional silos","Stage 5 — no technology required"],1,
 "Stage 3 = integrated enterprise (internal). Stage 4 = extends beyond the company. Stage 5 = orchestrated with tech + leadership.");
mex("m2","Which statement about master data is TRUE?",
 ["It is transactional data","It should follow Create → Update → Cleanse → Retire lifecycle governance","It never needs cleansing","Only IT should own it"],1,
 "Master data is non-transactional reference data managed through its lifecycle with data governance.");
mex("m6","The BEST first step when customer feedback shows declining satisfaction is to:",
 ["Cut prices immediately","Interpret VOC to identify root expectations and gaps","Replace the sales team","Add more SKUs"],1,
 "ECM approach: interpret Voice of the Customer, then design service offerings and KPIs to close gaps.");


/* ===== ECM official sample-question style items ===== */
mex("m2","The PRIMARY advantage of using web-based EDI for communication of transactions is that it:",
 ["Provides more flexibility in transaction formats","Lowers the cost per transaction","Eliminates translation of transactions","Supports a larger number of transactions"],1,
 "Web-based EDI removes the private/value-added network (VAN) cost. Formats and standards are independent of the transmission method, and translation to/from the standard format is still required. (ECM sample Q1)");
mex("m4","Quality remains an elusive concept in most organizations because:",
 ["It depends on customer perception","There are many quality philosophies","It is everyone's responsibility","Quality targets change frequently"],0,
 "Customers are the ultimate judges of quality and have differing requirements and priorities. Philosophies share similar definitions; quality is not defined by who provides it; perceptions improve continually rather than sitting at a target. (ECM sample Q2)");
mex("m1","Which forecasting approach uses external indicators that correlate with demand?",
 ["Intrinsic","Extrinsic","Qualitative judgment","Naive"],1,
 "Extrinsic methods use outside indicators (e.g., housing starts predicting appliance demand). Intrinsic methods use the item's own demand history.");
mex("m2","In the master data lifecycle, examining a database to find and fix misspellings, duplicates, and inconsistencies is:",
 ["Create","Update","Cleanse","Retire"],2,
 "Cleansing corrects errors in existing data. Retire removes obsolete records while preserving history.");
mex("m2","A company must commit a delivery date considering both inventory AND available capacity. It should use:",
 ["ATP","CTP","PTP","MPS"],1,
 "Capable-to-Promise checks finite capacity as well as inventory/MPS. ATP checks uncommitted supply only; PTP adds profitability.");
mex("m5","Which activity is part of 'put away'?",
 ["Inspecting inbound goods for damage","Transporting material from the dock to a storage location and recording it","Combining items into a kit","Loading the outbound trailer"],1,
 "Put-away = move from dock to a specific storage location and record the location. Inspection is receiving; kitting is value-added; loading is shipping.");
mex("m5","A DC performs pricing, labeling, and shelf-ready preparation for a retailer. This is BEST classified as:",
 ["Cross-docking","A value-added service","Break-bulk","Consolidation"],1,
 "Value-added distribution services include installation, repacking, postponement, stocking (pricing/labeling), final assembly, and kitting.");
mex("m7","Documented triggers and pre-defined responses with reserves for identified risks describe:",
 ["Risk avoidance","Contingency planning","Risk transfer","Due diligence"],1,
 "Contingency planning prepares the response before the risk occurs, with early-warning triggers and contingency reserves.");
mex("m3","Which is the BEST description of competitive strategy per the ECM supplemental glossary?",
 ["A one-year budget for marketing spend","A long-term, time-phased plan to achieve competitive advantage by leveraging strengths against opportunities","The list of approved suppliers","The annual sales forecast"],1,
 "ECM defines competitive strategy as a long-term plan for competitive advantage in a defined market — usually a major portion of overall company strategy.");
mex("m1","A demand planner reviews technological, economic, natural, and regulatory forces outside the firm's control. This activity is:",
 ["Historical analysis","Environmental scan","Product assessment","Reconciliation"],1,
 "The environmental scan reviews uncontrollable macro-environment forces; historical analysis looks at past demand data.");

/* ================= GLOSSARY ================= */
const g = (term,def)=>GLOSSARY.push({term,def});
g("ABC analysis","Ranking of items by annual dollar volume into A (highest value, tightest control), B (mid), and C (lowest value, loosest control) classes.");
g("Agile supply chain","A chain designed for rapid response to customer demands and market changes, often combining responsive + risk-hedging approaches.");
g("APS","Advanced Planning & Scheduling — constraint-based planning of demand, supply, and capacity using optimization.");
g("ATP","Available-to-Promise — quantity of supply uncommitted to customer orders; used to promise new orders.");
g("Autonomation (Jidoka)","Ability of a process to detect defects and stop automatically so problems are not passed on.");
g("Backward integration","Acquiring or controlling an upstream supplier.");
g("Balanced Scorecard","Kaplan & Norton framework measuring Financial, Customer, Internal Process, and Learning & Growth performance.");
g("BATNA","Best Alternative To a Negotiated Agreement — the walkaway option that anchors negotiation power.");
g("Benchmarking","Comparing KPIs and practices against internal, competitive, functional, or generic best-in-class references.");
g("BIA","Business Impact Analysis — identifies critical processes and quantifies disruption impact over time.");
g("Bill of Lading (BOL)","Contract of carriage issued by a carrier, serving also as a receipt and (if negotiable) a document of title.");
g("Blockchain","Distributed, immutable ledger technology used for provenance, smart contracts, and reducing counterfeits.");
g("Bottleneck","The resource whose capacity limits the throughput of the system; target of TOC.");
g("BOPIS","Buy Online, Pick up In-Store — omni-channel fulfillment using store inventory.");
g("Bullwhip effect","Amplification of demand variability as it moves upstream in the supply chain.");
g("Business continuity plan (BCP)","Documented process to keep critical operations running through and recovering from disruption.");
g("Cash-to-cash cycle","DIO + DSO − DPO — measures working capital tied up in operations.");
g("Carrying cost","Inventory holding cost: capital cost + storage + insurance + obsolescence, typically 20–30% of item value per year.");
g("Cat. strategy (category)","Coordinated approach for managing a group of related purchased items using portfolio analysis (e.g., Kraljic).");
g("CIF","Cost, Insurance and Freight — sea-only Incoterm where seller pays freight + insurance to destination port; risk transfers at origin port.");
g("CIP","Carriage and Insurance Paid — any-mode Incoterm; seller carriage + insurance to named destination; risk transfers at first carrier.");
g("CLM","Contract Lifecycle Management — authoring, negotiation, execution, and monitoring of contracts.");
g("Closed-loop supply chain","Network designed to support both forward and reverse flows as an integrated system.");
g("Collaborative transportation mgmt (CTM)","Shipper-carrier collaboration to share plans and optimize loads, routes, and assets.");
g("Concurrent engineering","Cross-functional design involving suppliers early to reduce time, cost, and quality problems.");
g("Contingency reserve","Budget or time reserved for known risks with quantified impact and probability.");
g("Control tower","Centralized end-to-end visibility, exception management, and decision-support platform for the supply chain.");
g("COSO ERM","Enterprise Risk Management framework from the Committee of Sponsoring Organizations.");
g("CPFR","Collaborative Planning, Forecasting and Replenishment — shared forecasts and replenishment with partners.");
g("CRM","Customer Relationship Management — integrated people, process, and technology to manage customer interactions.");
g("Cross-docking","Transfer of inbound freight directly to outbound with little or no storage.");
g("CTPAT","US Customs-Trade Partnership Against Terrorism — trusted-trader security program.");
g("Cycle counting","Ongoing counting of a portion of inventory each period rather than one annual count.");
g("DAP","Delivered At Place — Incoterm; seller delivers ready for unloading at named destination.");
g("DBR","Drum-Buffer-Rope — TOC scheduling: constraint is the drum, buffers protect it, rope synchronizes release.");
g("DDP","Delivered Duty Paid — Incoterm; seller's maximum obligation.");
g("Decoupling point","The point in the supply chain where forecast-driven push meets order-driven pull.");
g("Delphi method","Structured, iterative, anonymous expert forecasting to reach consensus.");
g("Demand management","Process of planning, communicating, influencing, and prioritizing demand.");
g("DFM / DFA / DFX","Design for Manufacturing / Assembly / (any X) — designing to ease production, service, or other objectives.");
g("DIO / DSO / DPO","Days Inventory Outstanding / Days Sales Outstanding / Days Payable Outstanding.");
g("Digital twin","Virtual replica of physical asset or process used for simulation and optimization.");
g("DMAIC","Six Sigma improvement cycle: Define, Measure, Analyze, Improve, Control.");
g("DPMO","Defects Per Million Opportunities — Six Sigma measure (≤3.4 at six-sigma level).");
g("DRP","Distribution Requirements Planning — extends MRP logic to the distribution network.");
g("EDI","Electronic Data Interchange — structured, computer-to-computer business message exchange.");
g("EMV","Expected Monetary Value — Σ probability × impact.");
g("EOQ","Economic Order Quantity = √(2DS/H); balances ordering vs. holding cost.");
g("EPR","Extended Producer Responsibility — producer is accountable for product end-of-life.");
g("ERP","Enterprise Resource Planning — integrated transactional system of record.");
g("ETO","Engineer-to-Order — design after receipt of customer order.");
g("EXW","Ex Works — Incoterm; seller's minimum obligation.");
g("FCPA","US Foreign Corrupt Practices Act — prohibits bribery of foreign officials.");
g("FEFO / FIFO / LIFO","First-Expired-First-Out / First-In-First-Out / Last-In-First-Out inventory rotation.");
g("Fill rate","Units (or orders) shipped from stock ÷ units ordered.");
g("FOB","Free On Board — sea/waterway Incoterm; risk transfers when goods on board at origin port.");
g("FTZ","Free Trade Zone — secure area where duties are deferred until goods leave the zone to home market.");
g("Gainsharing","Incentive agreement where parties share benefits from cost reductions / improvements.");
g("GDPR","EU General Data Protection Regulation — personal data protection and rights.");
g("GRI","Global Reporting Initiative — sustainability reporting standards.");
g("Hedging","Financial/operational techniques to mitigate exposure to risk (e.g., FX forward, dual sourcing).");
g("Heijunka","Level loading / mix — smoothing production to enable JIT.");
g("HS code","Harmonized System — international product classification code for customs duties.");
g("Incoterms","ICC international trade terms defining buyer/seller responsibilities.");
g("Intermodal","Container movement across two or more modes without re-handling product.");
g("IoT","Internet of Things — connected sensors and devices.");
g("ISO 9001 / 14001 / 31000 / 27001 / 28000","Quality / Environmental / Risk / Information Security / Supply Chain Security management standards.");
g("JIT","Just-In-Time — produce/deliver only what is needed when needed.");
g("Kaizen / Kaikaku","Small continuous improvement / radical transformation.");
g("Kanban","Visual pull signal authorizing production or replenishment.");
g("Kraljic matrix","Sourcing portfolio framework with profit impact × supply risk quadrants.");
g("Landed cost","All costs to deliver goods at destination: price + freight + duties + insurance + handling.");
g("LCA","Life Cycle Assessment — cradle-to-grave environmental impact analysis.");
g("Lead time","Elapsed time between initiation and completion (purchase LT, manufacturing LT, customer LT).");
g("Lean","Philosophy focused on eliminating waste and maximizing customer value through flow and pull.");
g("LTL","Less-than-Truckload — freight consolidated from multiple shippers.");
g("Make-to-order (MTO)","Produce only after receiving customer order; minimal finished-goods inventory.");
g("Make-to-stock (MTS)","Produce to forecast, hold finished goods for immediate fulfillment.");
g("MAD / MSE / MAPE","Forecast error metrics — Mean Absolute Deviation / Mean Squared Error / Mean Absolute Percentage Error.");
g("Master data","Core reference data: items, BOMs, customers, suppliers, locations.");
g("MPS","Master Production Schedule — end-item schedule driving MRP.");
g("MRP","Material Requirements Planning — explodes MPS through BOM to plan component orders.");
g("NPS","Net Promoter Score = % promoters − % detractors.");
g("OEE","Overall Equipment Effectiveness = Availability × Performance × Quality.");
g("OTIF","On-Time In-Full — delivery performance metric.");
g("Perfect order","OTIF + damage-free + correctly documented.");
g("Periodic review (P-model)","Inventory system with fixed review interval and order-up-to level.");
g("Planning fence","Time window within which MPS changes require authorization but may still be allowed.");
g("Poka-yoke","Mistake-proofing device or method preventing/detecting errors.");
g("Postponement","Delaying final product configuration until customer order is known to reduce inventory risk.");
g("PDCA","Plan-Do-Check-Act continuous improvement cycle.");
g("Push / Pull","Forecast-driven upstream (push) vs. customer-order-driven downstream (pull).");
g("Quick Response","Rapid replenishment method using POS data sharing (esp. fashion/retail).");
g("Rationing/shortage game","Supply chain behavior during shortages where orders are allocated by past sales; causes inflated ordering.");
g("RCCP","Rough-Cut Capacity Planning — validates MPS against critical resources.");
g("Resilience","Capacity to recover from disruption via redundancy, flexibility, visibility, partnerships.");
g("Return merchandise authorization (RMA)","Number/document authorizing a product return.");
g("RFID","Radio-frequency identification — tagged items automatically detected at readers.");
g("RFx","Sourcing solicitations: RFI, RFP, RFQ.");
g("Risk appetite","Level of risk an organization is willing to accept in pursuit of its objectives.");
g("Risk register","Catalog of identified risks with P, I, owner, response, triggers, status.");
g("ROP","Reorder Point = demand during lead time + safety stock.");
g("RPO / RTO","Recovery Point / Recovery Time Objective for business continuity.");
g("S&OP","Sales & Operations Planning — monthly, family-level demand/supply balancing process.");
g("Safety stock","Buffer against demand and lead-time variability = z · σ_LT.");
g("SCM control tower","Platform for end-to-end visibility, exception management, decision support.");
g("SCOR","Supply Chain Operations Reference model — Plan, Source, Make, Deliver, Return, Enable.");
g("Seasonal index","Avg demand in period ÷ overall average demand.");
g("Service-level factor (z)","Standard-normal multiplier chosen for desired service level (95% ≈ 1.65).");
g("Should-cost","Bottom-up cost model benchmarking what an item should cost.");
g("Six Sigma","Data-driven improvement methodology targeting ≤3.4 DPMO using DMAIC.");
g("SMED","Single-Minute Exchange of Dies — setup-time reduction methodology.");
g("SOX","Sarbanes-Oxley Act — US financial reporting controls.");
g("Spend analysis","Categorized summary and ranking of spending (often Pareto).");
g("SRM","Supplier Relationship Management.");
g("Sustainable development","Development meeting present needs without compromising future generations.");
g("SWOT","Strengths, Weaknesses, Opportunities, Threats.");
g("TCO","Total Cost of Ownership — acquisition + ownership + disposal over asset life.");
g("TMS","Transportation Management System.");
g("TOC","Theory of Constraints — manage throughput by focusing on the bottleneck.");
g("Triple Bottom Line","People, Planet, Profit measurement of sustainability.");
g("Utilization","Actual output ÷ design capacity.");
g("Value stream map (VSM)","Lean tool mapping material and information flow to expose waste.");
g("VMI","Vendor-Managed Inventory — supplier decides replenishment based on shared data.");
g("VoC","Voice of the Customer — systematic capture of customer preferences and expectations.");
g("WMS","Warehouse Management System.");
g("Yield management","Dynamic pricing/availability to maximize revenue (airlines, hotels).");
g("YMS","Yard Management System — manages trailers and containers in the yard.");
g("Takt time","Available production time ÷ customer demand rate — the pace at which units must be produced to match demand.");
g("3PL / 4PL","Third-party / fourth-party logistics providers.");
g("WEEE","EU Waste Electrical and Electronic Equipment directive requiring take-back/recycling.");
g("RoHS","EU Restriction of Hazardous Substances in electronics.");
g("C-TPAT / AEO","Trusted-trader programs (US / EU) accelerating customs clearance.");
g("Dodd-Frank §1502","US law requiring disclosure of conflict minerals (3TG) sourcing.");
g("UN SDGs","17 Sustainable Development Goals (2015–2030) spanning social, economic, environmental targets.");
g("GHG Protocol","Standard for corporate greenhouse-gas accounting (Scopes 1, 2, 3).");
g("Scope 1/2/3 emissions","Direct / indirect from purchased energy / value chain (including suppliers and product use) emissions.");
g("Omni-channel","Integrated customer experience across physical, digital, and mobile channels with unified inventory.");
g("FMEA","Failure Mode and Effects Analysis — risk/quality tool rating Severity × Occurrence × Detection.");
g("Pareto principle","80-20 rule — most effects come from a few causes.");
g("Ishikawa / fishbone","Cause-and-effect diagram for root-cause analysis.");
g("Statistical Process Control (SPC)","Control-chart-based monitoring of process variation.");
g("Cp / Cpk","Process capability indexes — process spread vs. spec limits; Cpk accounts for centering.");
g("Hoshin Kanri","Policy deployment aligning strategy to daily work.");
g("Heuristic","Rule-of-thumb solution used when exact optimization is impractical.");

/* ===== Additional glossary terms ===== */
g("Keiretsu","Japanese cooperative network of legally independent firms (often around a bank/trading company) supporting long-term lean supplier relationships.");
g("Chaebol","Korean equivalent — large family-controlled industrial conglomerate spanning many sectors.");
g("Order winner","Competitive characteristic that causes customers to choose your product over competitors (price, quality, delivery, design).");
g("Order qualifier","Minimum competitive characteristic required to be considered. Failing it loses orders; exceeding it does not win them.");
g("Order loser","Characteristic that drives customers AWAY (e.g., poor quality, late delivery).");
g("MTS / ATO / MTO / ETO / PTO","Manufacturing environments by customer order decoupling point — finished goods stocked / modules stocked / nothing stocked but raw / engineer after order / packaging after order.");
g("CODP","Customer Order Decoupling Point — where the chain switches from forecast (push) to order (pull).");
g("Level production","Stable production rate; vary inventory to absorb demand swings.");
g("Chase production","Vary production each period to match demand (overtime, hiring, outsourcing).");
g("Hybrid production","Combine level + chase to minimize total cost.");
g("Echelon","Level of supply chain nodes (factory, DC, retail). Each adds operating expense, holds inventory, expects profit.");
g("Stakeholder","Individual or group whose interest is affected by the firm's activities.");
g("Service industry","All organizations except farming, mining, and manufacturing.");
g("Mean Squared Error (MSE)","Σ(Actual−Forecast)²/n; penalizes large errors more than MAD.");
g("R-squared (R²)","Goodness of regression fit; 0 to 1. High R² ≠ causation.");
g("Life-cycle / analog forecasting","Apply demand patterns from a similar prior product to forecast a new one.");
g("Product family","Group of items with similar processes/equipment used for aggregate planning in S&OP.");
g("Backlog","Customer orders received but not yet shipped.");
g("Resource planning","Long-range capacity planning at the business plan level.");
g("Master planning","Bundles demand management, production/resource planning, and master scheduling.");
g("Reconciliation (S&OP)","Step where supply and demand plans are compared and imbalances resolved.");
g("Sunk cost","Past cost already paid; irrelevant to future decisions.");
g("ATP / CTP / PTP","Available-to-Promise / Capable-to-Promise (also considers capacity) / Profitable-to-Promise (prioritizes by margin).");
g("DuPont / Strategic Profit Model","ROA = Net Profit Margin × Asset Turnover.");
g("Net Profit Margin","Net Profit / Net Sales.");
g("Asset Turnover","Net Sales / Total Assets.");
g("Working Capital","Current Assets − Current Liabilities.");
g("Altman Z-Score","Bankruptcy-prediction formula. >2.99 safe, 1.81–2.99 grey, <1.81 distress.");
g("Capex / Opex","Capex = long-term assets; Opex = ongoing operations. SaaS/cloud shifts Capex → Opex.");
g("Letter of Credit (L/C)","Bank guarantee of payment to seller upon proof of compliance with shipment conditions.");
g("Liquidity ratios","Current ratio = CA/CL; Quick ratio = (CA−Inv)/CL.");
g("Activity ratios","Inventory turnover, asset turnover, AR turnover, days of supply.");
g("Leverage ratios","Debt-to-equity, debt-to-assets — measure use of debt.");
g("Suboptimization","Optimizing one part of a system at the expense of overall results.");
g("AIDC","Automatic Identification and Data Capture — barcodes, RFID, EPC, smart cards, voice, pick-to-light.");
g("EPC","Electronic Product Code — globally unique RFID identifier.");
g("Active vs. passive RFID","Active = self-powered (long range); Passive = powered by reader (short range, cheap); Semipassive = battery-assisted.");
g("LAN / WAN / Intranet / Extranet / VAN","Network topologies — Local / Wide / Internal / Partner / Value-Added (EDI).");
g("Middleware","Software enabling communication between systems not designed to interact.");
g("Legacy system","Old, hard-to-replace business application with poor interfaces.");
g("DSS","Decision Support System.");
g("Microservices","Architecture using small, independent services for flexibility and scale.");
g("Aggregation","Pooling demand reduces relative variance — basis for risk pooling and centralized inventory.");
g("Master data lifecycle","Create → Update → Cleanse → Retire.");
g("Order fulfillment dwell time","Lead time caused by customer requirements; not deducted from order-fulfillment cycle time.");
g("Backorder","Unfilled or past-due demand against insufficient inventory.");
g("Inventory shrinkage","Inventory losses from scrap, theft, deterioration, evaporation.");
g("Single sourcing","ONE supplier used by CHOICE — alternatives exist (lean strategy).");
g("Sole sourcing","Only ONE supplier is AVAILABLE — patents/tooling. Forced, not preferred.");
g("Multi-sourcing","Use of multiple suppliers for the same item to ensure continuity / foster competition.");
g("Insourcing","Use of internal resources; opposite of outsourcing.");
g("Subcontracting","Sending production work outside to another manufacturer.");
g("Forward auction","One seller, many buyers bid up. Used for unique/scarce goods.");
g("Reverse auction","One buyer, many sellers bid down. Used for commodities; price-driven.");
g("Dutch auction","Price starts high and lowers; first bid = contract.");
g("Three-way match","Payment authorized only when PO + Receiving Report + Invoice agree.");
g("Net cost","Gross cost − discounts − rebates − allowances.");
g("Ongoing costs","Costs continuing throughout the supplier relationship — quality mgmt, monitoring, audits, admin.");
g("Postponement","Deliberate delay of final differentiation until the latest possible time.");
g("Mass customization","High-variety production at mass-production efficiency through postponement and modular design.");
g("Modular design","Components/subassemblies that can be combined into multiple end products.");
g("Glocalization","Global product modified for local needs — a form of postponement.");
g("QFD","Quality Function Deployment — translates Voice of the Customer into design specs (House of Quality).");
g("DFX family","DFM, DFA, DFMA, DFQ, DFSS, DFE, Design for Service, Design for Supply Chain, Design for Logistics.");
g("Standardization","Establishing standard parts/processes; reduces variety.");
g("Simplification","Removing complexity from a product/service.");
g("Universality","Designing a product for one market that can also sell in others.");
g("Nearshoring","Moving operations to a nearby country.");
g("Reshoring","Bringing operations back home.");
g("Multidomestic strategy","Each country is self-contained with unique products and local production.");
g("CISG / Vienna Convention","UN treaty providing uniform rules for international goods sales.");
g("Consortia Trade Exchange (CTX)","Online marketplace owned by a consortium of companies in the same industry.");
g("Independent Trading Exchange","Third-party-owned marketplace open to any buyer/seller.");
g("Private Trading Exchange","Marketplace hosted by a single company for its trading partners.");
g("Horizontal / Vertical marketplace","Across industries / within a single industry.");
g("Blanket PO","Long-term commitment with short-term releases against it.");
g("Annualized contract","One-year agreement on pricing, supply continuity, estimated requirements.");
g("Incentive contract","Buyer and seller share cost savings beyond target; share extra costs up to a cap.");
g("Cost-Plus-Fixed-Fee (CPFF)","Allowable costs + stipulated fixed fee.");
g("Cost-Plus-Incentive-Fee (CPIF)","Allowable costs + bonus if targets met.");
g("Fixed-Price Incentive (FPIF)","Set price + bonus for hitting stipulations.");
g("Dependent demand","Demand calculated from BOM (components).");
g("Independent demand","Demand unrelated to other items; must be forecasted (finished goods, service parts).");
g("Pegging","Tracing gross requirements upstream to find the parent that caused them.");
g("Firm Planned Order (FPO)","MRP order frozen in quantity and time; not auto-changed by MRP.");
g("Demand Time Fence (DTF)","Boundary inside which forecast is replaced by actual customer orders.");
g("Planning Time Fence (PTF)","Boundary inside which the planner controls changes.");
g("MRP nervousness","Excessive replanning from small changes; remedies: FPOs, time fences, larger lot sizes.");
g("Closed-loop MRP","MRP with execution feedback + capacity, shop floor, purchasing.");
g("MRP II","Manufacturing Resource Planning — closed-loop MRP + business/financial planning + simulation.");
g("DDMRP","Demand-Driven MRP — strategic decoupling buffers; closer to actual demand.");
g("Lot-for-Lot (L4L)","Order exactly the net requirement each period.");
g("FOQ / POQ / TPOP","Fixed Order Quantity / Period Order Quantity / Time-Phased Order Point.");
g("Single-Level / Multilevel BOM","Immediate components only / all components down to raw materials.");
g("Planning BOM","Artificial BOM with option percentages for product family forecasting.");
g("Phantom BOM","Non-stocked subassembly; MRP passes through it.");
g("Modular BOM","Organized by major options for ATO environments.");
g("Jidoka","Automation with a human touch — machine stops on defect. Pillar of TPS.");
g("Kaizen event / blitz","Focused 1-week cross-functional improvement of a process area.");
g("TPM","Total Productive Maintenance — operator-led preventive + improvement.");
g("TQM","Total Quality Management — customer-driven, all-employee, continuous improvement.");
g("SPC","Statistical Process Control — control charts vs. limits.");
g("Seven basic quality tools","Cause-effect, check sheet, control chart, histogram, Pareto, scatter, stratification (or flow chart).");
g("Five approaches to quality","Transcendent, Product-based, User-based, Manufacturing-based, Value-based.");
g("Quality of design vs. conformance","Customer satisfaction with features vs. absence of defects.");
g("Drum-Buffer-Rope","TOC scheduling — constraint paces; time buffer protects it; rope ties release to its consumption.");
g("Cycle counting","Continuous inventory counting on a cyclic schedule (A items most often).");
g("Inventory accuracy","% items within tolerance vs. system records; target 95–99%.");
g("Allocation","Quantities reserved for orders or production but not yet shipped/released.");
g("Line-item / unit fill rate","% of order LINES filled completely / % of UNITS shipped from stock.");
g("SKU","Stock Keeping Unit — unique tracking code at a particular location.");
g("Public / Private / Contract warehouse","Pay-per-use shared / company-owned / long-term tailored.");
g("Distribution intensity","Intensive (everywhere), Selective (limited), Exclusive (very few).");
g("Inverted duties","Tariffs on finished goods are LOWER than on components; FTZs help mitigate.");
g("De minimis","Value threshold below which goods clear customs simply.");
g("Free Trade Zone benefits","Duty deferral, re-export exemption, inspection before paying, manufacture without inverted duties.");
g("HTS","US Harmonized Tariff Schedule.");
g("Trade bloc","Country agreement to reduce trade barriers (EU, USMCA).");
g("Total-cost concept","Minimize SUM of logistics costs at equal service levels — not any single category.");
g("Spot-stocking","Temporarily placing inventory near a market for promotion or seasonal peak.");
g("Accumulation / Assortment assembly","Combining inbound shipments / building mixed-product orders.");
g("Density / Stowability / Hazmat","Weight per cube / ease of packing / hazardous materials handling.");
g("GHS","Globally Harmonized System for chemical hazard classification & labelling.");
g("Waste hierarchy","Reduce > Reuse > Recycle > Recovery > Disposal.");
g("Common carrier","Public, regulated transport available to anyone (certificate of public convenience).");
g("Drop-ship","Direct supplier-to-customer shipment, bypassing seller warehouse.");
g("ATR Certificate","EU-Turkey free-circulation customs document.");
g("CRM technology maturity","Disconnected → Interfacing → Internally Integrated → Multi-Enterprise Integrated.");
g("Cross-selling / Up-selling","Sell related products / sell premium versions or add-ons.");
g("Lifetime customer value (LCV)","Total profit a customer generates over the entire relationship.");
g("Campaign types","Prospecting · Loyalty · Win-back · Vulnerable.");
g("Churn","Customers leaving for better/cheaper alternatives.");
g("Joint venture","Separate entity created by two+ orgs sharing ownership, risk, returns.");
g("Virtual organization","Short-term alliance of independent orgs to design/produce/distribute.");
g("Tactical buying","Transactional, nonstrategic purchasing of standard items.");
g("Supplier certification","Verifying supplier's ability to meet cost/quality/delivery standards (often ISO).");
g("Strategic alliance 10 steps","Align internally → select partner → win-win → ground rules → alliance manager → encourage collaboration → corporate mindset → manage multi-faceted → pulse checks → plan for change.");
g("Risk appetite vs. tolerance","Willingness to PURSUE vs. readiness to ACCEPT negative outcomes.");
g("Risk threshold","Specific quantitative limit at which a risk is escalated or treated.");
g("Three-point estimate","(O + M + P) / 3 — average of optimistic, most likely, pessimistic.");
g("PERT estimate","(O + 4M + P) / 6 — weights most-likely 4×.");
g("Value at Risk (VaR)","Sum of EMVs across all identified risks; total expected loss.");
g("BCMS","Business Continuity Management System (per ISO 22301).");
g("Contingent BI insurance","Business Interruption insurance covering losses caused at a SUPPLIER or CUSTOMER.");
g("Cargo / Trade Disruption / Cyber insurance","Goods in transit / non-physical political risk / cyber attacks & breaches.");
g("ISO 22301","Business Continuity Management System standard.");
g("Four generic strategies","Least cost, Differentiation, Focus/Niche, Best cost.");
g("Functional vs. innovative product","Predictable, low margin → efficient. Unpredictable, high margin → responsive.");
g("Upside / Downside SC adaptability","Max % increase in deliverable quantities / % reduction sustainable 30 days out.");
g("Upside SC flexibility","Days needed to achieve unplanned 20% increase.");
g("Target costing","Target manufacturing cost = market price − desired profit − marketing/distribution.");
g("UN Global Compact","Largest corporate sustainability initiative — 10 principles in human rights, labor, env, anti-corruption.");
g("SA8000 areas","Child labor · Forced labor · H&S · Freedom of association · Discrimination · Disciplinary · Working hours · Remuneration.");
g("ANSI Z.10","Voluntary occupational H&S management standard.");
g("Accreditation vs. certification","Certifying the certifier vs. third-party verification of compliance.");
g("Registration (ISO)","Process of having an accredited third-party auditor verify ISO conformance.");
g("Feasibility study","Project viability check (technical, economic, operational) before committing.");
g("ESI","Early Supplier Involvement — supplier joins design process early to reduce time and cost.");
g("Quantum computing","Emerging quantum-mechanics-based technology for combinatorial / optimization problems.");
g("Spend management","Total outflow management across procurement, outsourcing, and SCM.");
g("EVA","Economic Value Added = profit above the cost of capital.");
g("Gap analysis","Difference between actual performance and customer expectations.");
g("Learning curve","Task time decreases with repetition.");
g("Heuristic","Rule-of-thumb solution; common in scheduling/lot sizing/forecasting.");
g("WBS","Work Breakdown Structure — hierarchical project decomposition.");
g("Stage 5 SC maturity","Orchestrated supply chain — full digital transformation creating relative competitive advantage.");
g("Product traceability","Ability to trace a product's history, application, or location.");
g("Chain of custody","Documented unbroken trail of possession from origin to destination.");
g("Bullwhip causes","Demand-signal processing, order batching, price fluctuations, rationing/shortage gaming, long lead times.");
g("Bullwhip remedies","Share POS, smaller batches, EDLP pricing, allocate by past sales, shorter lead times, VMI/CPFR.");
g("DDMRP","Demand-Driven MRP — strategic decoupling buffers reduce nervousness.");
g("SCOR DS","Newer SCOR with 7 process areas: Orchestrate, Plan, Source, Order, Transform, Fulfill, Return.");
g("Business plan","Long-range strategy with revenue, cost, profit objectives + budgets, balance sheet, cash flow.");
