<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>Data Science Mastery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden;background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
input[type="range"]{-webkit-appearance:none;height:6px;border-radius:3px;background:#2d3348;outline:none;width:100%;max-width:180px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#6366f1;cursor:pointer;border:2px solid #fff}
input[type="number"]{-webkit-appearance:none;-moz-appearance:textfield}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
button{-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px)}
.header{background:linear-gradient(135deg,#1a1d27,rgba(79,70,229,0.15));border-bottom:1px solid #2d3348;padding:max(env(safe-area-inset-top,12px),12px) 16px 12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.header-inner{max-width:800px;margin:0 auto}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-icon{background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center}
.logo-title{font-size:19px;font-weight:800;color:#e2e8f0}
.logo-sub{font-size:11px;color:#94a3b8}
.search-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:140px}
.search-box input{width:100%;padding:10px 10px 10px 34px;background:#0f1117;border:1px solid #2d3348;border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
.search-box input:focus{border-color:#6366f1}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.btn{border:1px solid #2d3348;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;background:#242836;color:#94a3b8}
.btn.active{background:rgba(245,158,11,0.2);border-color:#f59e0b;color:#f59e0b}
.content{max-width:800px;margin:0 auto;padding:16px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:24px}
.cat-card{background:#1a1d27;border:1px solid #2d3348;border-radius:14px;padding:16px;cursor:pointer;transition:transform 0.15s}
.cat-card:active{transform:scale(0.97)}
.cat-name{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.cat-count{font-size:11px;color:#94a3b8}
.cat-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.cat-tag{font-size:9px;padding:2px 6px;border-radius:12px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-title{font-size:17px;font-weight:700}
.section-badge{font-size:11px;color:#64748b;background:#242836;padding:2px 8px;border-radius:12px}
.topic-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.topic-card{background:#1a1d27;border:1px solid #2d3348;border-radius:14px;overflow:hidden;transition:border-color 0.2s}
.topic-card.expanded{border-color:rgba(99,102,241,0.4)}
.topic-head{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.topic-head:active{background:#242836}
.topic-chevron{margin-top:3px;flex-shrink:0}
.topic-body{flex:1;min-width:0}
.topic-title-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.topic-name{font-size:15px;font-weight:700;color:#e2e8f0}
.topic-fav{background:none;border:none;cursor:pointer;padding:3px;flex-shrink:0}
.badge-interactive{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(16,185,129,0.15);color:#10b981}
.topic-quick{font-size:13px;color:#94a3b8;line-height:1.5}
.topic-formula-mini{display:inline-block;margin-top:8px;background:#0f1117;padding:3px 8px;border-radius:6px;font-size:11px;border:1px solid #2d3348;font-family:monospace;word-break:break-all}
.topic-detail{padding:0 16px 16px 42px;border-top:1px solid #2d3348}
.formula-box{margin:14px 0;border-radius:10px;padding:10px 14px}
.formula-label{font-size:9px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.formula-code{font-size:13px;color:#e2e8f0;font-weight:600;font-family:monospace;word-break:break-all}
.detail-text{font-size:13px;color:#94a3b8;line-height:1.75;margin-top:14px}
.detail-text .arrow{padding-left:10px;margin-bottom:3px}
.detail-text .numbered{font-weight:600;color:#e2e8f0;margin-top:8px}
.detail-text .spacer{height:6px}
.viz-box{margin-top:18px;background:#0f1117;border:1px solid #2d3348;border-radius:12px;padding:14px;overflow-x:auto}
.viz-label{font-size:10px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;color:#10b981}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tag{background:#242836;color:#64748b;font-size:10px;padding:3px 8px;border-radius:12px;cursor:pointer;border:1px solid #2d3348}
.tag:active{border-color:#6366f1;color:#6366f1}
.empty{text-align:center;padding:48px 16px;color:#64748b}
.footer{text-align:center;padding:32px 0 8px;border-top:1px solid #2d3348;margin-top:32px;font-size:11px;color:#64748b}
.slider-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.slider-label{color:#94a3b8;font-size:13px}
.slider-val{font-weight:700}
.viz-btn{border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.viz-btn.primary{background:#6366f1;color:#fff}
.viz-btn.secondary{background:#242836;color:#94a3b8;border:1px solid #2d3348}
.metrics-row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.cm-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;margin-bottom:14px;max-width:300px}
.cm-header{padding:6px;text-align:center;font-size:11px;color:#94a3b8;font-weight:600}
.cm-cell{border-radius:8px;padding:10px;text-align:center;margin:2px}
.cm-cell-label{font-size:11px;font-weight:700;margin-bottom:4px}
.cm-input{width:50px;background:#0f1117;border:1px solid #2d3348;border-radius:4px;color:#e2e8f0;text-align:center;padding:4px;font-size:16px;font-weight:700}
svg text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
.cv-row{display:flex;gap:3px;cursor:pointer;align-items:center;margin-bottom:5px}
.cv-label{font-size:11px;color:#94a3b8;width:48px;flex-shrink:0}
.cv-blocks{display:flex;gap:2px;flex:1}
.cv-block{flex:1;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.tree-nodes{display:flex;flex-direction:column;align-items:center;gap:8px}
.tree-node{border-radius:10px;padding:8px 14px;font-size:12px;text-align:center;min-width:70}
.tree-branches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tree-result{border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700}
.act-btns{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.act-btn{border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12px;border:1px solid #2d3348}
</style>
</head>
<body>
<div id="app" class="app">
<div id="header"></div>
<div id="content"></div>
</div>
<script>
// ─── SVG Chart Helpers ──────────────────────────────
function svgChart(w,h,content){
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" xmlns="http://www.w3.org/2000/svg" style="display:block">'+content+'</svg>';
}
function polyline(pts,color,sw,dash){
  if(!pts.length)return '';
  return '<polyline points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+(sw||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}
function areaPath(pts,baseY,color,opacity){
  if(!pts.length)return '';
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=1;i<pts.length;i++) d+='L'+pts[i][0]+','+pts[i][1];
  d+='L'+pts[pts.length-1][0]+','+baseY+'L'+pts[0][0]+','+baseY+'Z';
  return '<path d="'+d+'" fill="'+color+'" opacity="'+(opacity||0.3)+'"/>';
}
function circle(cx,cy,r,fill,stroke,sw){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fff')+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(sw||2)+'"':'')+'/>';
}
function gridLines(x0,y0,x1,y1,nx,ny){
  var s='';
  for(var i=0;i<=nx;i++){var x=x0+(x1-x0)*i/nx;s+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+y1+'" stroke="#2d3348" stroke-width="0.5"/>';}
  for(var j=0;j<=ny;j++){var y=y0+(y1-y0)*j/ny;s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#2d3348" stroke-width="0.5"/>';}
  return s;
}
function axisLabels(x0,y0,x1,y1,xLabels,yLabels){
  var s='';
  if(xLabels)for(var i=0;i<xLabels.length;i++){var x=x0+(x1-x0)*i/(xLabels.length-1);s+='<text x="'+x+'" y="'+(y1+14)+'" fill="#64748b" font-size="10" text-anchor="middle">'+xLabels[i]+'</text>';}
  if(yLabels)for(var j=0;j<yLabels.length;j++){var y=y0+(y1-y0)*j/(yLabels.length-1);s+='<text x="'+(x0-6)+'" y="'+(y+3)+'" fill="#64748b" font-size="10" text-anchor="end">'+yLabels[j]+'</text>';}
  return s;
}
function mapRange(val,min,max,outMin,outMax){return outMin+(val-min)/(max-min)*(outMax-outMin);}
function legendItem(x,y,color,label){return '<rect x="'+x+'" y="'+y+'" width="12" height="3" rx="1" fill="'+color+'"/><text x="'+(x+16)+'" y="'+(y+4)+'" fill="#94a3b8" font-size="10">'+label+'</text>';}

// ─── Colors ─────────────────────────────────────────
var C={bg:"#0f1117",surface:"#1a1d27",surfaceLight:"#242836",border:"#2d3348",text:"#e2e8f0",textMuted:"#94a3b8",textDim:"#64748b",accent:"#6366f1",accentLight:"#818cf8",green:"#10b981",blue:"#3b82f6",orange:"#f59e0b",pink:"#ec4899",red:"#ef4444",cyan:"#06b6d4",purple:"#a855f7"};

// ─── State ──────────────────────────────────────────
var state={
  selectedCat:null, search:'', expandedTopics:{}, favorites:{}, showFavOnly:false,
  normMean:0, normStd:1,
  bvComplexity:5,
  rocThreshold:0.5,
  gdStep:0, gdLr:0.1,
  cmTp:85, cmFp:10, cmFn:15, cmTn:90,
  kmK:3, kmIter:0,
  dtAge:30, dtIncome:55,
  actFn:'relu',
  regLambda:0.5,
  cvK:5, cvActive:0,
};

function setState(updates){
  for(var k in updates) state[k]=updates[k];
  renderContent();
}
function setSearch(val){
  state.search=val;
  renderContent();
}

// ─── Category Data ──────────────────────────────────
var CATEGORIES=[
  {id:"stats",name:"Statistics & Probability",icon:'\u{1F4CA}',color:C.cyan,
    topics:[
      {id:"normal-dist",name:"Normal Distribution",
        quick:"Bell-shaped curve where ~68% of data falls within 1\u03C3 of the mean. Defined by \u03BC (mean) and \u03C3 (standard deviation).",
        detail:"Think of measuring heights of 10,000 people. Most cluster around the average. That's a Normal Distribution!\n\nThe magic numbers:\n\u2192 68% within \u00B11\u03C3\n\u2192 95% within \u00B12\u03C3\n\u2192 99.7% within \u00B13\u03C3 (empirical rule)\n\nWhy it matters: The Central Limit Theorem says sample means become normally distributed regardless of population shape.\n\nDon't memorize the formula \u2014 understand the shape. Play with \u03BC and \u03C3 below!",
        formula:"f(x) = (1/\u03C3\u221A2\u03C0) \u00B7 e^(-\u00BD((x-\u03BC)/\u03C3)\u00B2)", viz:"normalDist",
        tags:["distribution","gaussian","bell curve","CLT"]},
      {id:"bayes",name:"Bayes' Theorem",
        quick:"Updates probability given new evidence: P(A|B) = P(B|A)\u00B7P(A) / P(B)",
        detail:"A disease test is 99% accurate. Only 1 in 10,000 have the disease. Positive test \u2192 only ~1% chance you have it!\n\nKey ingredients:\n\u2192 Prior: P(A) \u2014 belief before evidence\n\u2192 Likelihood: P(B|A) \u2014 evidence if hypothesis true\n\u2192 Posterior: P(A|B) \u2014 updated belief\n\nThe Base Rate Fallacy = ignoring the prior. Underpins Naive Bayes classifiers.",
        formula:"P(A|B) = P(B|A) \u00B7 P(A) / P(B)",
        tags:["probability","conditional","prior","posterior"]},
      {id:"hypothesis",name:"Hypothesis Testing",
        quick:"Framework to decide if evidence is strong enough to reject a claim. Uses p-values and significance levels.",
        detail:"Assume the drug doesn't work (H\u2080). Look for evidence against that.\n\n1. State H\u2080 and H\u2081\n2. Choose \u03B1 (usually 0.05)\n3. Compute test statistic\n4. Get p-value\n5. If p-value < \u03B1 \u2192 reject H\u2080\n\nCommon mistakes:\n\u2192 p-value \u2260 probability H\u2080 is true\n\u2192 \"Not significant\" \u2260 \"no effect\"\n\u2192 Multiple comparisons inflate false positives\n\nTypes: z-test, t-test, chi-square, ANOVA",
        formula:"If p-value < \u03B1 \u2192 Reject H\u2080",
        tags:["p-value","significance","null hypothesis","t-test"]},
      {id:"distributions",name:"Key Distributions",
        quick:"Binomial (n trials), Poisson (rare events/time), Exponential (time between events), Uniform (equal probability).",
        detail:"Your distribution toolkit:\n\nBinomial: \"How many heads in 20 flips?\"\n\u2192 Parameters: n (trials), p (probability)\n\nPoisson: \"Customers per hour?\"\n\u2192 Parameter: \u03BB (average rate)\n\nExponential: \"Time until next customer?\"\n\u2192 Memoryless property!\n\nStudent's t: Normal with heavier tails\n\u2192 Small sample, unknown \u03C3\n\u2192 As n \u2192 \u221E, becomes Normal",
        tags:["binomial","poisson","exponential","t-distribution"]},
      {id:"clt",name:"Central Limit Theorem",
        quick:"Sample means \u2192 normal distribution as n increases, regardless of original shape. Rule of thumb: n \u2265 30.",
        detail:"The MOST IMPORTANT theorem in statistics.\n\nTake ANY distribution. Sample many times. Plot the means. Result: Normal!\n\n\u2192 Mean of sample means = \u03BC\n\u2192 Std of sample means = \u03C3/\u221An (standard error)\n\nThis lets us use Normal tools even when data isn't normal. Foundation of inferential statistics.",
        formula:"X\u0304 ~ N(\u03BC, \u03C3\u00B2/n) as n \u2192 \u221E",
        tags:["sampling","standard error"]},
      {id:"confidence",name:"Confidence Intervals",
        quick:"A range likely to contain the true parameter. 95% CI \u2260 '95% chance truth is here'.",
        detail:"95% CI means: repeat 100 times \u2192 ~95 intervals contain the truth.\n\nFormula: X\u0304 \u00B1 z* \u00D7 (\u03C3/\u221An)\n\n\u2192 90%: z* = 1.645\n\u2192 95%: z* = 1.96\n\u2192 99%: z* = 2.576\n\nKey insights:\n\u2192 Wider = more confident, less precise\n\u2192 Larger sample = narrower interval\n\u2192 CI width \u221D 1/\u221An",
        formula:"CI = X\u0304 \u00B1 z* \u00D7 (\u03C3/\u221An)",
        tags:["margin of error","standard error"]},
      {id:"correlation",name:"Correlation & Covariance",
        quick:"Pearson: linear relationship [-1,1]. Spearman: monotonic rank correlation. Correlation \u2260 causation!",
        detail:"Covariance tells direction, correlation tells direction AND strength.\n\nPearson r: Linear relationship only\n\u2192 r = 1: perfect positive line\n\u2192 r = 0: no LINEAR relationship (could still be curved!)\n\u2192 r = -1: perfect negative line\n\nSpearman: Rank-based, catches non-linear monotonic relationships\n\nTrap: Anscombe's quartet \u2014 4 datasets with same r but wildly different shapes! Always plot your data.\n\nGolden rule: Correlation does NOT mean causation. Ice cream sales correlate with drownings (both caused by summer).",
        formula:"r = \u03A3(x\u1D62-x\u0304)(y\u1D62-y\u0304) / \u221A[\u03A3(x\u1D62-x\u0304)\u00B2\u03A3(y\u1D62-y\u0304)\u00B2]",
        tags:["pearson","spearman","covariance","causation"]},
      {id:"ab-testing",name:"A/B Testing",
        quick:"Compare two versions using hypothesis testing. Need enough sample size for statistical power.",
        detail:"Want to know if a new button color gets more clicks? A/B test it!\n\n1. Pick your metric (click rate, revenue, etc.)\n2. Calculate sample size needed (power analysis)\n3. Randomly split users into A (control) and B (treatment)\n4. Run until you hit sample size \u2014 NO peeking!\n5. Run hypothesis test\n\nKey concepts:\n\u2192 Statistical power: probability of detecting a real effect (aim for 80%+)\n\u2192 Effect size: how big a difference you care about\n\u2192 Multiple testing: testing 10 metrics? Some will be \"significant\" by chance! Use Bonferroni correction.\n\nPeeking = inflated false positive rate. Decide sample size BEFORE you start.",
        formula:"n = (Z_\u03B1 + Z_\u03B2)\u00B2 \u00B7 2\u03C3\u00B2 / \u03B4\u00B2",
        tags:["experiment","power","sample size","significance"]},
      {id:"mle",name:"Maximum Likelihood Estimation",
        quick:"Find parameter values that make the observed data most probable. Foundation of many ML algorithms.",
        detail:"You flip a coin 10 times, get 7 heads. What's the most likely p?\n\nMLE says: find the p that maximizes P(data | p).\n\n1. Write the likelihood function: L(\u03B8) = P(data | \u03B8)\n2. Take the log (easier math): log L(\u03B8)\n3. Take derivative, set = 0\n4. Solve for \u03B8\n\nFor the coin: MLE gives p = 7/10 = 0.7. Makes sense!\n\nWhy it matters:\n\u2192 Logistic regression uses MLE\n\u2192 Neural network training is basically MLE\n\u2192 Many distributions have closed-form MLE solutions\n\nMLE can overfit with small samples \u2192 use MAP (adds a prior) or regularization.",
        formula:"\u03B8\u0302 = argmax L(\u03B8) = argmax \u03A0 P(x\u1D62 | \u03B8)",
        tags:["likelihood","estimation","MAP","parameters"]},
      {id:"law-large-numbers",name:"Law of Large Numbers",
        quick:"As sample size grows, the sample mean converges to the true population mean. The foundation of why statistics works.",
        detail:"Flip a coin 10 times \u2014 you might get 70% heads. Flip 10,000 times \u2014 you'll get very close to 50%.\n\nThat's the Law of Large Numbers (LLN).\n\nTwo versions:\n\u2192 Weak LLN: Sample mean CONVERGES IN PROBABILITY to \u03BC\n\u2192 Strong LLN: Sample mean converges ALMOST SURELY to \u03BC\n\nIn plain English: more data = more accurate average. Always.\n\nHow it differs from CLT:\n\u2192 LLN: Sample mean \u2192 population mean (convergence)\n\u2192 CLT: Sample mean is normally distributed (shape)\n\nReal-world:\n\u2192 Casinos always win long-term (LLN guarantees it)\n\u2192 Insurance companies can price policies accurately\n\u2192 A/B tests need large samples to be reliable\n\nCommon mistake: Gambler's Fallacy! After 5 heads in a row, tails is NOT \"due\". Each flip is independent. LLN is about the AVERAGE, not individual events.",
        tags:["convergence","sample size","gambler fallacy"]},
      {id:"type-errors",name:"Type I & Type II Errors",
        quick:"Type I: false alarm (reject true H\u2080). Type II: missed detection (fail to reject false H\u2080). You can't minimize both!",
        detail:"Think of a fire alarm:\n\u2192 Type I Error (\u03B1): Alarm rings but there's NO fire. False Positive.\n\u2192 Type II Error (\u03B2): There IS a fire but alarm doesn't ring. False Negative.\n\n\u03B1 = P(reject H\u2080 | H\u2080 true) = significance level (usually 0.05)\n\u03B2 = P(fail to reject H\u2080 | H\u2080 false)\nPower = 1 - \u03B2 = P(correctly reject false H\u2080)\n\nThe tradeoff:\n\u2192 Lower \u03B1 (fewer false alarms) \u2192 higher \u03B2 (more misses)\n\u2192 Only way to reduce BOTH: increase sample size!\n\nWhich matters more?\n\u2192 Medical test: Type II is worse (missing a disease)\n\u2192 Criminal trial: Type I is worse (convicting innocent)\n\u2192 Spam filter: Type I is worse (losing real email)\n\nInterview tip: Always state which error is worse for the given business context.",
        formula:"\u03B1 = P(Type I) | \u03B2 = P(Type II) | Power = 1 - \u03B2",
        tags:["false positive","false negative","power","significance"]},
    ]
  },
  {id:"ml",name:"Machine Learning Models",icon:'\u{1F9E0}',color:C.accent,
    topics:[
      {id:"linreg",name:"Linear Regression",
        quick:"Fits y = wx + b minimizing squared errors. Assumes linearity, independence, homoscedasticity, normal residuals.",
        detail:"The Hello World of ML.\n\nModel: y\u0302 = w\u2081x\u2081 + w\u2082x\u2082 + ... + b\nMinimizes: \u03A3(y\u1D62 - y\u0302\u1D62)\u00B2\n\nAssumptions (LINE):\n\u2192 Linearity\n\u2192 Independence\n\u2192 Normality of residuals\n\u2192 Equal variance\n\nCheck: R\u00B2 (variance explained), residual plots.\nFails with: non-linear data, multicollinearity, outliers.",
        formula:"y\u0302 = Xw + b, min ||y - y\u0302||\u00B2",
        tags:["regression","OLS","R-squared"]},
      {id:"logreg",name:"Logistic Regression",
        quick:"Classification via sigmoid: P(y=1) = 1/(1+e^(-z)). It's classification, not regression!",
        detail:"It's a classification algorithm!\n\n1. Compute z = w\u1D40x + b\n2. \u03C3(z) = 1/(1+e\u207B\u1DBB) \u2192 probability [0,1]\n3. P \u2265 0.5 \u2192 class 1\n\nLoss: Binary Cross-Entropy\nL = -[y\u00B7log(y\u0302) + (1-y)\u00B7log(1-y\u0302)]\n\nWhy not linear regression? Outputs must be [0,1]!\n\u2192 Interpretable coefficients (log-odds)\n\u2192 Multiclass: Softmax",
        formula:"P(y=1) = 1/(1+e^(-(w\u1D40x+b)))",
        tags:["classification","sigmoid","cross-entropy"]},
      {id:"dtree",name:"Decision Trees",
        quick:"If-then splits minimizing Gini or Entropy. Interpretable but overfits easily.",
        detail:"20 Questions with data. Best-separating question at each node.\n\nSplit criteria:\n\u2192 Gini: 1 - \u03A3p\u1D62\u00B2\n\u2192 Entropy: -\u03A3p\u1D62\u00B7log\u2082(p\u1D62)\n\u2192 Info Gain = parent - weighted children entropy\n\nPros: Interpretable, no scaling needed\nCons: Overfits, unstable\nFix: Prune or use ensembles.\n\nTry the interactive tree!",
        viz:"decisionTree",
        tags:["gini","entropy","CART","pruning"]},
      {id:"rf",name:"Random Forest",
        quick:"Ensemble of trees on random subsets. Bagging + feature randomization \u2192 less overfitting.",
        detail:"Train hundreds of trees, let them vote.\n\nTwo tricks:\n\u2192 Bagging: Random samples WITH replacement\n\u2192 Feature randomization: \u221Ap features per split\n\nKey params: n_estimators, max_depth, max_features\n\nBonus: OOB score = free validation!\nFeature importance from impurity reduction.",
        formula:"y\u0302 = mode(tree\u2081, tree\u2082, ..., tree\u2099)",
        tags:["ensemble","bagging","OOB"]},
      {id:"xgb",name:"Gradient Boosting / XGBoost",
        quick:"Sequential learners correcting previous errors. XGBoost adds regularization.",
        detail:"Trees built sequentially \u2014 each fixes previous mistakes.\n\n1. Start with mean\n2. Compute residuals\n3. Train tree on residuals\n4. Add (scaled by lr)\n5. Repeat!\n\nXGBoost adds:\n\u2192 L1 + L2 regularization\n\u2192 Handles missing values\n\u2192 Parallel feature processing\n\nKey: learning_rate (0.01-0.1), max_depth (3-8), early stopping!",
        formula:"y\u0302 = \u03A3 \u03B7 \u00B7 h\u2098(x) + \u03A9(h\u2098)",
        viz:"gradientDescent",
        tags:["boosting","xgboost","lightgbm"]},
      {id:"svm",name:"Support Vector Machines",
        quick:"Maximizes margin between classes. Kernel trick for non-linear boundaries.",
        detail:"Find the widest street between classes. Closest points = support vectors.\n\nNon-linear? Kernel trick:\n\u2192 Linear: x\u1D40y\n\u2192 RBF: exp(-\u03B3||x-y||\u00B2) \u2014 most common\n\u2192 Polynomial: (x\u1D40y + c)^d\n\nParams: C (regularization), \u03B3 (kernel width)\nPros: High dimensions, memory-efficient\nCons: Slow on large data",
        formula:"min \u00BD||w||\u00B2 s.t. y\u1D62(w\u1D40x\u1D62+b) \u2265 1",
        tags:["kernel","margin","RBF"]},
      {id:"knn",name:"k-Nearest Neighbors",
        quick:"Majority vote of k closest points. Lazy learning \u2014 no training phase!",
        detail:"\"You are your neighbors.\"\n\n1. Store all data\n2. Find k closest\n3. Vote (classification) or average (regression)\n\nDistances: Euclidean \u221A\u03A3(x\u1D62-y\u1D62)\u00B2, Manhattan \u03A3|x\u1D62-y\u1D62|\n\nk small \u2192 flexible/noisy. k large \u2192 smooth/underfit.\n\nCRITICAL: Scale features!\nSpeed: KD-trees, FAISS",
        tags:["distance","lazy learning","euclidean"]},
      {id:"naive-bayes",name:"Naive Bayes",
        quick:"Assumes feature independence. P(class) \u00D7 \u220FP(feature|class). Fast, great for text.",
        detail:"Naive = features independent given class. Rarely true but works!\n\nVariants:\n\u2192 Gaussian: Continuous features\n\u2192 Multinomial: Word counts\n\u2192 Bernoulli: Binary features\n\nWorks because ranking matters more than exact probabilities.\n\nUse: Spam, sentiment, document classification.",
        formula:"P(C|X) = P(C)\u220FP(x\u1D62|C) / P(X)",
        tags:["probabilistic","spam","text"]},
      {id:"loss-functions",name:"Loss Functions",
        quick:"MSE for regression, Cross-Entropy for classification. The function your model is actually minimizing.",
        detail:"A loss function measures how WRONG your model is. Training = minimizing loss.\n\nRegression losses:\n\u2192 MSE: (y-y\u0302)\u00B2 \u2014 penalizes big errors heavily\n\u2192 MAE: |y-y\u0302| \u2014 robust to outliers\n\u2192 Huber: MSE when small, MAE when large \u2014 best of both\n\nClassification losses:\n\u2192 Binary Cross-Entropy: -[y\u00B7log(p) + (1-y)\u00B7log(1-p)]\n\u2192 Categorical Cross-Entropy: -\u03A3 y\u1D62\u00B7log(p\u1D62)\n\u2192 Hinge Loss: max(0, 1 - y\u00B7f(x)) \u2014 used by SVMs\n\nPicking the right loss matters more than picking the right model! MSE + outliers = disaster. Use Huber instead.",
        formula:"MSE = (1/n)\u03A3(y\u1D62-y\u0302\u1D62)\u00B2 | CE = -\u03A3y\u1D62log(p\u1D62)",
        tags:["MSE","MAE","cross-entropy","hinge","huber"]},
    ]
  },
  {id:"dl",name:"Deep Learning",icon:'\u26A1',color:C.pink,
    topics:[
      {id:"nn",name:"Neural Networks",
        quick:"Layers of neurons with activations. Universal function approximators.",
        detail:"Matrix multiplications + non-linear functions!\n\nNeuron: output = activation(\u03A3w\u1D62x\u1D62 + b)\n\nTraining:\n1. Forward pass \u2192 prediction\n2. Compute loss\n3. Backprop gradients (chain rule)\n4. Update: w = w - lr \u00D7 \u2202L/\u2202w\n\nKey concepts:\n\u2192 Vanishing gradients \u2192 use ReLU, ResNets\n\u2192 Batch Norm \u2192 stable training\n\u2192 Dropout \u2192 prevents overfitting\n\nExplore activations below!",
        viz:"activation",
        tags:["backpropagation","activation","dropout"]},
      {id:"cnn",name:"CNNs",
        quick:"Convolutional filters detect spatial patterns: edges \u2192 textures \u2192 shapes \u2192 objects.",
        detail:"Slide small filters to detect local patterns.\n\nBlocks:\n\u2192 Conv: Filter slides across input\n\u2192 Pooling: Downsample (Max pool)\n\u2192 Flatten + Dense: Classify\n\nHierarchy:\nLayer 1: Edges \u2192 Layer 2: Textures \u2192 Layer 3: Parts \u2192 Layer 4+: Objects\n\nConcepts: Stride, Padding, Receptive field\n\nArchitectures: LeNet \u2192 AlexNet \u2192 VGG \u2192 ResNet \u2192 EfficientNet",
        tags:["convolution","pooling","ResNet"]},
      {id:"rnn",name:"RNNs & LSTMs",
        quick:"Sequential data with memory. LSTMs use gates to solve vanishing gradients.",
        detail:"RNNs pass info between timesteps.\nh\u209C = tanh(W\u2095h\u209C\u208B\u2081 + W\u2093x\u209C)\nProblem: Vanishing gradients!\n\nLSTM fixes with 3 gates:\n\u2192 Forget: Discard old info\n\u2192 Input: Store new info\n\u2192 Output: What to emit\n\nCell state = conveyor belt through time.\n\nGRU: Simpler, 2 gates, often works as well.\n\nNote: Transformers now dominate NLP.",
        tags:["sequence","time series","gates"]},
      {id:"transformer",name:"Transformers & Attention",
        quick:"Self-attention lets each token attend to all others. Foundation of GPT, BERT.",
        detail:"\"Attention Is All You Need\"\n\n1. Create Q, K, V for each token\n2. Scores = Q \u00B7 K\u1D40 / \u221Ad\u2096\n3. Softmax \u2192 attention weights\n4. Output = weighted sum of Values\n\nMulti-Head: Multiple parallel attention with different projections.\n\n\u2192 Encoder: BERT (bidirectional)\n\u2192 Decoder: GPT (autoregressive)\n\u2192 Both: T5\n\nPositional encoding via sine/cosine.",
        formula:"Attention(Q,K,V) = softmax(QK\u1D40/\u221Ad\u2096)V",
        tags:["attention","BERT","GPT","NLP"]},
      {id:"autoencoders",name:"Autoencoders & VAEs",
        quick:"Compress input to latent space, then reconstruct. VAEs add probabilistic sampling for generation.",
        detail:"An autoencoder learns to copy its input \u2014 but through a bottleneck!\n\nEncoder: Input \u2192 small latent vector (z)\nDecoder: z \u2192 reconstructed input\n\nThe bottleneck forces the network to learn the most important features.\n\nUses:\n\u2192 Dimensionality reduction (non-linear PCA!)\n\u2192 Denoising (train on noisy, reconstruct clean)\n\u2192 Anomaly detection (high reconstruction error = anomaly)\n\nVAE (Variational):\nInstead of a fixed z, encode to a mean and variance. Sample from that distribution. This lets you GENERATE new data by sampling from the latent space.\n\nVAE loss = Reconstruction loss + KL divergence (keeps latent space organized).",
        formula:"Loss = ||x - x\u0302||\u00B2 + KL(q(z|x) || p(z))",
        tags:["latent space","generative","VAE","denoising"]},
    ]
  },
  {id:"eval",name:"Model Evaluation",icon:'\u{1F3AF}',color:C.green,
    topics:[
      {id:"bias-var",name:"Bias-Variance Tradeoff",
        quick:"Error = Bias\u00B2 + Variance + Noise. Bias = underfitting, Variance = overfitting.",
        detail:"Bias: Model too simple \u2192 poor everywhere\nVariance: Model memorizes noise \u2192 great on train, bad on test\n\nMore complex \u2192 bias\u2193 variance\u2191\nLess complex \u2192 bias\u2191 variance\u2193\n\nDiagnose:\n\u2192 High bias: Bad train AND test\n\u2192 High variance: Great train, bad test\n\nFix bias: More features, complex model\nFix variance: More data, regularization, dropout\n\nPlay with the chart!",
        viz:"biasVariance",
        tags:["underfitting","overfitting","generalization"]},
      {id:"crossval",name:"Cross-Validation",
        quick:"k folds: train on k-1, test on 1, rotate. More reliable than single split.",
        detail:"One split = one exam. CV gives k exams!\n\n1. Split into k folds\n2. Each fold takes a turn as test set\n3. Average scores\n\nVariants:\n\u2192 Stratified: Preserves class proportions\n\u2192 LOO: k = n\n\u2192 Time Series: Only past \u2192 future\n\nNEVER tune on test data! Use nested CV.",
        viz:"crossVal",
        tags:["k-fold","stratified","LOOCV"]},
      {id:"confusion",name:"Confusion Matrix",
        quick:"TP, FP, FN, TN \u2192 Precision, Recall, F1. Don't use accuracy on imbalanced data!",
        detail:"The scorecard:\n\u2192 Precision = TP/(TP+FP) \u2014 \"of predicted +, how many right?\"\n\u2192 Recall = TP/(TP+FN) \u2014 \"of actual +, how many found?\"\n\u2192 F1 = 2\u00B7P\u00B7R/(P+R)\n\nPrioritize:\n\u2192 Spam filter \u2192 Precision\n\u2192 Cancer screening \u2192 Recall\n\u2192 Balanced \u2192 F1\n\nTry adjusting values!",
        viz:"confusionMatrix",
        tags:["precision","recall","F1","accuracy"]},
      {id:"roc-auc",name:"ROC Curve & AUC",
        quick:"TPR vs FPR at all thresholds. AUC 0.5=random, 1.0=perfect.",
        detail:"Performance across ALL thresholds.\n\n\u2192 X: False Positive Rate\n\u2192 Y: True Positive Rate (= Recall)\n\u2192 Diagonal = random\n\u2192 Top-left = perfect\n\nAUC = probability model ranks positive higher than negative.\n\nROC vs PR curve:\n\u2192 ROC: Balanced classes\n\u2192 PR: Imbalanced data\n\nPlay with threshold!",
        viz:"roc",
        tags:["threshold","AUC","TPR","FPR"]},
      {id:"r-squared",name:"R\u00B2 & Adjusted R\u00B2",
        quick:"R\u00B2 = % of variance explained. Adjusted R\u00B2 penalizes adding useless features. Always use Adjusted for multiple regression.",
        detail:"R\u00B2 answers: \"How much of the output's wiggle does my model explain?\"\n\nR\u00B2 = 1 - (SS_res / SS_tot)\n\u2192 SS_res = \u03A3(y - y\u0302)\u00B2 (leftover error)\n\u2192 SS_tot = \u03A3(y - y\u0304)\u00B2 (total variance)\n\u2192 R\u00B2 = 0: model explains nothing (just predicts mean)\n\u2192 R\u00B2 = 1: perfect predictions\n\u2192 R\u00B2 = 0.75: model explains 75% of variance\n\nTHE PROBLEM: R\u00B2 NEVER decreases when you add features. Even random garbage features increase R\u00B2.\n\nAdjusted R\u00B2 fixes this:\n\u2192 Penalizes each additional feature\n\u2192 Only increases if the new feature actually helps\n\u2192 Formula includes n (samples) and p (features)\n\nWhen to use what:\n\u2192 Simple regression (1 feature): R\u00B2 is fine\n\u2192 Multiple regression: ALWAYS use Adjusted R\u00B2\n\u2192 Comparing models with different # of features: Adjusted R\u00B2\n\nR\u00B2 can be negative! If your model is worse than just predicting the mean.",
        formula:"R\u00B2 = 1 - SS_res/SS_tot | Adj R\u00B2 = 1 - (1-R\u00B2)(n-1)/(n-p-1)",
        tags:["R-squared","variance explained","model fit","regression"]},
      {id:"multicollinearity",name:"Multicollinearity",
        quick:"When features are highly correlated with each other. Inflates coefficient variance, makes interpretation unreliable.",
        detail:"If \"height in cm\" and \"height in inches\" are both features \u2014 they're 100% correlated. That's multicollinearity.\n\nWhy it's bad:\n\u2192 Coefficients become unstable (huge standard errors)\n\u2192 Small data change \u2192 wildly different coefficients\n\u2192 Can't tell which feature matters\n\u2192 Predictions might still be fine! But interpretation is garbage.\n\nHow to detect:\n\u2192 Correlation matrix: |r| > 0.8 is suspicious\n\u2192 VIF (Variance Inflation Factor): VIF > 5 is concerning, > 10 is serious\n\u2192 VIF = 1/(1-R\u00B2\u1D62) where R\u00B2\u1D62 is from regressing feature i on all others\n\nHow to fix:\n\u2192 Drop one of the correlated features\n\u2192 PCA to combine correlated features\n\u2192 Ridge regression (L2) handles it automatically\n\u2192 Domain knowledge: pick the more meaningful feature\n\nNote: Tree-based models (RF, XGBoost) are NOT affected by multicollinearity!",
        formula:"VIF\u1D62 = 1 / (1 - R\u00B2\u1D62)",
        tags:["VIF","correlation","coefficients","variance inflation"]},
    ]
  },
  {id:"unsupervised",name:"Unsupervised Learning",icon:'\u{1F500}',color:C.orange,
    topics:[
      {id:"kmeans",name:"K-Means Clustering",
        quick:"Assign points to nearest of k centroids, update centroids, repeat until convergence.",
        detail:"1. Place k centroids randomly\n2. Assign each point \u2192 nearest centroid\n3. Move centroids to cluster means\n4. Repeat!\n\nChoose k: Elbow method, Silhouette score\n\nLimitations: Spherical clusters, specify k, sensitive to init (use K-Means++)\n\nAlternatives: DBSCAN, Hierarchical, GMM\n\nTry it!",
        formula:"min \u03A3 ||x - \u03BC\u1D62||\u00B2",
        viz:"kmeans",
        tags:["clustering","centroid","elbow","silhouette"]},
      {id:"pca",name:"PCA",
        quick:"Find directions of maximum variance. Project onto top-k principal components.",
        detail:"100 features \u2192 find the few that matter.\n\n1. Center data\n2. Covariance matrix\n3. Eigenvectors + eigenvalues\n4. Sort by eigenvalue\n5. Project onto top-k\n\nKeep ~95% explained variance.\n\nLinear only!\nAlternatives: t-SNE (viz), UMAP (faster), Autoencoders (non-linear)",
        formula:"X_reduced = X \u00B7 W_k",
        tags:["dimensionality reduction","eigenvalue","t-SNE","UMAP"]},
      {id:"hierarchical",name:"Hierarchical Clustering",
        quick:"Build a tree of clusters. No need to pre-specify k. Cut the dendrogram where you want.",
        detail:"Two approaches:\n\nAgglomerative (bottom-up) \u2014 most common:\n1. Start: every point is its own cluster\n2. Merge the two closest clusters\n3. Repeat until one cluster remains\n4. Cut the dendrogram at desired height\n\nLinkage methods (how to measure cluster distance):\n\u2192 Single: min distance (chains!)\n\u2192 Complete: max distance (compact)\n\u2192 Average: mean distance (balanced)\n\u2192 Ward: minimizes variance (usually best)\n\nDivisive (top-down): Start with one cluster, split. Rare in practice.\n\nPros over K-Means: No need to choose k upfront, dendrogram shows structure.\nCons: O(n\u00B2) memory, O(n\u00B3) time \u2014 doesn't scale to big data.",
        tags:["dendrogram","linkage","agglomerative","ward"]},
      {id:"anomaly",name:"Anomaly Detection",
        quick:"Find the weird ones. Z-score for simple data, Isolation Forest for complex, autoencoders for deep.",
        detail:"Normal data is similar. Anomalies are different. Find the different ones.\n\nSimple methods:\n\u2192 Z-score: |z| > 3 \u2192 anomaly (assumes normal distribution)\n\u2192 IQR: below Q1-1.5*IQR or above Q3+1.5*IQR\n\nML methods:\n\u2192 Isolation Forest: Randomly split features. Anomalies are isolated in fewer splits (short path = anomaly).\n\u2192 LOF (Local Outlier Factor): Compares point's density to neighbors. Low relative density = anomaly.\n\u2192 One-Class SVM: Learns boundary around normal data.\n\nDeep Learning:\n\u2192 Autoencoder: Train on normal data. High reconstruction error = anomaly.\n\nUse cases: Fraud detection, equipment failure, network intrusion.",
        tags:["outlier","isolation forest","LOF","fraud"]},
    ]
  },
  {id:"prep",name:"Data Prep & Features",icon:'\u{1F5C4}\uFE0F',color:C.purple,
    topics:[
      {id:"missing",name:"Missing Data",
        quick:"MCAR/MAR/MNAR. Methods: deletion, imputation (mean/KNN/MICE), indicator variables.",
        detail:"Types:\n\u2192 MCAR: Random \u2014 safe to drop\n\u2192 MAR: Depends on observed \u2014 impute\n\u2192 MNAR: Depends on missing value \u2014 hardest\n\nStrategies:\n\u2192 Delete rows/columns\n\u2192 Mean/median/mode fill\n\u2192 KNN or MICE imputation\n\u2192 Binary \"was_missing\" column\n\nRules: Investigate WHY first. Never impute target. Impute AFTER split!",
        tags:["imputation","MCAR","MICE"]},
      {id:"scaling",name:"Feature Scaling",
        quick:"Z-score: (x-\u03BC)/\u03C3. MinMax: [0,1]. Essential for distance-based models.",
        detail:"Feature 0-1 vs 0-1000 \u2192 second dominates!\n\nZ-score: z = (x-\u03BC)/\u03C3 \u2192 mean=0, std=1\nMinMax: (x-min)/(max-min) \u2192 [0,1]\n\nNeed scaling: KNN, SVM, NNs, PCA, K-Means\nDon't need: Trees, RF, GBM\n\nCRITICAL: Fit on TRAIN only, transform both!",
        formula:"Z: (x-\u03BC)/\u03C3 | MinMax: (x-min)/(max-min)",
        tags:["normalization","standardization"]},
      {id:"encoding",name:"Encoding Categoricals",
        quick:"Label (ordinal), One-hot (nominal), Target encoding (high cardinality).",
        detail:"Label: red=0, blue=1 \u2014 ordinal only!\nOne-hot: red\u2192[1,0,0] \u2014 nominal, drop 1 column\nTarget: Replace with target mean \u2014 high cardinality\n\nWhen:\n\u2192 2-5 categories: One-hot\n\u2192 Ordinal: Label\n\u2192 High cardinality: Target encoding (with CV!)",
        tags:["one-hot","label encoding","target encoding"]},
      {id:"regularization",name:"Regularization",
        quick:"L1 (Lasso): sparse. L2 (Ridge): small weights. Elastic Net: both.",
        detail:"Penalty on loss to prevent overfitting.\n\nL1 (Lasso): + \u03BB\u03A3|w\u1D62|\n\u2192 Drives weights to zero \u2192 feature selection!\n\nL2 (Ridge): + \u03BB\u03A3w\u1D62\u00B2\n\u2192 Shrinks toward zero, handles multicollinearity\n\nElastic Net: Both!\n\nIn NNs: L2 = weight decay, Dropout, Early stopping\n\nSee the effect!",
        formula:"L1: \u03BB\u03A3|w\u1D62| | L2: \u03BB\u03A3w\u1D62\u00B2",
        viz:"regularization",
        tags:["Lasso","Ridge","Elastic Net"]},
      {id:"imbalanced",name:"Imbalanced Data",
        quick:"99:1 classes \u2192 accuracy useless. Use SMOTE, class weights, F1/AUC.",
        detail:"\"Not fraud\" = 99.9% accuracy. Useless!\n\n\u2192 SMOTE: Synthetic minority samples\n\u2192 class_weight='balanced' \u2014 free!\n\u2192 Anomaly detection\n\nEvaluation: F1, AUC-PR, MCC\nNEVER use accuracy!\n\nStart with class_weight='balanced'.",
        tags:["SMOTE","class weights"]},
      {id:"data-leakage",name:"Data Leakage",
        quick:"Training info unavailable at prediction time. Always split BEFORE preprocessing!",
        detail:"#1 reason models fail in production.\n\n\u2192 Target leakage: Feature caused by target\n\u2192 Train-test contamination: Test leaks into train\n\u2192 Temporal leakage: Future info used\n\nPrevention:\n1. Split FIRST\n2. Features from train only\n3. Use sklearn Pipeline\n4. Ask: \"Would I know this in production?\"",
        tags:["contamination","pipeline"]},
      {id:"curse-dimensionality",name:"Curse of Dimensionality",
        quick:"As features increase, data becomes sparse. Distances lose meaning. Models need exponentially more data.",
        detail:"In 1D, 10 points cover a line nicely. In 100D? Those 10 points are lost in a vast empty space.\n\nWhat happens:\n\u2192 All distances become similar (everything is \"far\" from everything)\n\u2192 KNN breaks (nearest neighbor isn't meaningful)\n\u2192 Density estimation fails\n\u2192 Need exponentially more data to fill the space\n\nRule of thumb: Need ~10\u00D7 samples per feature for reliable results.\n\n100 features? Need ~1,000 samples minimum.\n\nSolutions:\n\u2192 Feature selection: Keep only relevant features\n\u2192 PCA / UMAP: Reduce dimensions\n\u2192 Regularization: L1 drives weights to zero\n\u2192 Domain knowledge: Manually pick meaningful features\n\nModels most affected: KNN, SVM (RBF), density-based clustering.\nModels less affected: Trees (split one feature at a time), Lasso.",
        tags:["high dimensional","sparsity","feature selection"]},
      {id:"feature-selection",name:"Feature Selection",
        quick:"Pick the best features. Filter (stats), Wrapper (try subsets), Embedded (model does it). Fewer features = simpler, faster, better.",
        detail:"More features \u2260 better model. Irrelevant features add noise.\n\nThree approaches:\n\nFilter Methods (fastest):\n\u2192 Correlation with target\n\u2192 Chi-squared test\n\u2192 Mutual information\n\u2192 Variance threshold (drop near-zero variance)\n\nWrapper Methods (thorough but slow):\n\u2192 Forward selection: Start empty, add best feature one at a time\n\u2192 Backward elimination: Start with all, remove worst one at a time\n\u2192 Recursive Feature Elimination (RFE)\n\nEmbedded Methods (built into model):\n\u2192 Lasso (L1): Drives weights to zero automatically\n\u2192 Tree feature importance: Based on impurity reduction\n\u2192 ElasticNet: Combines L1 and L2\n\nPractical order:\n1. Remove zero/near-zero variance\n2. Remove highly correlated pairs (keep one)\n3. Use Lasso or tree importance\n4. Validate: Does removing features hurt CV score?",
        tags:["filter","wrapper","embedded","RFE","Lasso"]},
      {id:"sampling",name:"Sampling Methods",
        quick:"How you pick your data subset matters. Random, stratified, systematic, or bootstrap \u2014 each has trade-offs.",
        detail:"Can't survey everyone? Sample! But HOW you sample determines if results are valid.\n\nSimple Random: Every item equally likely to be picked.\n\u2192 Fair but might miss rare subgroups.\n\nStratified: Split by groups first, then sample from each group proportionally.\n\u2192 Guarantees representation. Use for imbalanced classes!\n\nSystematic: Every k-th item (e.g., every 10th customer).\n\u2192 Easy but can have hidden patterns.\n\nCluster: Randomly pick groups (clusters), survey everyone in chosen groups.\n\u2192 Practical when population is naturally grouped (cities, schools).\n\nBootstrap: Sample WITH replacement. Same size as original.\n\u2192 Can create many datasets from one! Foundation of bagging.\n\u2192 Used to estimate confidence intervals when math is hard.\n\nKey interview concepts:\n\u2192 Selection bias: Your sample isn't representative\n\u2192 Survivorship bias: Only see the survivors\n\u2192 Response bias: Who answers vs who doesn't",
        tags:["stratified","bootstrap","random","bias","representativeness"]},
    ]
  },
  {id:"accel",name:"Advanced Concepts",icon:'\u2B50',color:C.cyan,
    topics:[
      {id:"gradient-descent",name:"Gradient Descent Variants",
        quick:"SGD, Mini-batch, Adam. Adam = adaptive lr + momentum. Default for deep learning.",
        detail:"Batch: All data \u2192 stable, slow\nSGD: 1 sample \u2192 fast, noisy\nMini-batch: 32-256 \u2192 best of both\n\nMomentum: Ball rolling downhill\nAdam: Momentum + adaptive lr\n\u2192 lr=0.001, \u03B2\u2081=0.9, \u03B2\u2082=0.999\n\nLR scheduling: Step decay, Cosine, One-cycle",
        viz:"gradientDescent",
        tags:["SGD","Adam","momentum","learning rate"]},

        detail:"Combine models!\n\nBagging: Parallel, vote/average \u2192 \u2193variance\n\u2192 Random Forest\n\nBoosting: Sequential, fix errors \u2192 \u2193bias\n\u2192 XGBoost, LightGBM\n\nStacking: Diverse models + meta-learner\n\u2192 Wins competitions!\n\nWhy: Different models make uncorrelated errors that cancel out.",
        tags:["bagging","boosting","stacking"]},
      {id:"dim-reduction",name:"t-SNE & UMAP",
        quick:"Non-linear dimensionality reduction. t-SNE = local, UMAP = local + global, both stochastic.",
        detail:"PCA is linear. These handle non-linear.\n\nt-SNE: Perplexity 5-50\n\u2192 Sizes/distances NOT meaningful\n\u2192 Slow, viz only\n\nUMAP: Faster, better global structure\n\u2192 Can use for general dim reduction\n\nQuick viz: UMAP\nPublication: t-SNE\nPreprocessing: UMAP or PCA",
        tags:["visualization","manifold","perplexity"]},
      {id:"bayesian-vs-freq",name:"Bayesian vs Frequentist",
        quick:"Frequentist: probability = long-run frequency. Bayesian: probability = degree of belief. Both valid, different philosophies.",
        detail:"The great debate in statistics!\n\nFrequentist:\n\u2192 Probability = how often something happens in repeated experiments\n\u2192 Parameters are FIXED, data is random\n\u2192 Uses: p-values, confidence intervals, MLE\n\u2192 \"If I repeated this experiment 100 times, 95 CIs would contain the truth\"\n\nBayesian:\n\u2192 Probability = degree of belief/certainty\n\u2192 Parameters are RANDOM, we update beliefs with data\n\u2192 Uses: Prior + Likelihood \u2192 Posterior (via Bayes' theorem)\n\u2192 \"Given what I've seen, there's a 95% probability the parameter is in this range\"\n\nWhen to use which:\n\u2192 Frequentist: Large data, regulatory settings (FDA), simple problems\n\u2192 Bayesian: Small data (use informative priors!), sequential updating, complex hierarchical models\n\nInterview answer: \"I use both. Frequentist for standard testing with large samples, Bayesian when I have useful prior knowledge or small data.\"",
        tags:["bayesian","frequentist","prior","posterior","philosophy"]},
      {id:"recommender",name:"Recommender Systems",
        quick:"Collaborative filtering: similar users like similar items. Content-based: match item features to user preferences.",
        detail:"Netflix, Spotify, Amazon \u2014 all recommender systems.\n\nCollaborative Filtering:\n\u2192 User-based: \"Users like you also liked...\"\n\u2192 Item-based: \"People who liked this also liked...\"\n\u2192 Matrix Factorization: Decompose user-item matrix into low-rank matrices. Each user and item gets a latent vector.\n\nContent-Based:\n\u2192 Use item features (genre, director, keywords)\n\u2192 Build user profile from liked items\n\u2192 Recommend items matching profile\n\nCold Start Problem:\n\u2192 New user? No history \u2192 can't do collaborative\n\u2192 New item? No ratings \u2192 use content features\n\nHybrid: Combine both approaches. Netflix uses this.",
        tags:["collaborative filtering","matrix factorization","cold start"]},
      {id:"reinforcement",name:"Reinforcement Learning",
        quick:"Agent learns by trial and error. Maximize cumulative reward through actions in an environment.",
        detail:"A robot learning to walk. No one tells it the right answer \u2014 it just tries things and gets rewards.\n\nKey pieces:\n\u2192 Agent: The learner (your algorithm)\n\u2192 Environment: The world it acts in\n\u2192 State: Current situation\n\u2192 Action: What agent does\n\u2192 Reward: Feedback signal\n\nCore algorithms:\n\u2192 Q-Learning: Learn a table of state-action values. Pick action with highest Q.\n\u2192 Deep Q-Network (DQN): Use a neural net for Q when state space is huge (Atari games).\n\u2192 Policy Gradient: Directly learn the best action probabilities.\n\u2192 Actor-Critic: Combine value estimation + policy learning.\n\nExploration vs Exploitation:\n\u2192 Explore: Try new things (might find better rewards)\n\u2192 Exploit: Use what you know (safe bet)\n\u2192 Epsilon-greedy: Random action \u03B5% of the time",
        formula:"Q(s,a) \u2190 Q(s,a) + \u03B1[r + \u03B3\u00B7max Q(s',a') - Q(s,a)]",
        tags:["Q-learning","policy gradient","reward","exploration"]},
      {id:"shap",name:"SHAP & Explainability",
        quick:"Shapley values explain each feature's contribution to a prediction. LIME explains locally with simple models.",
        detail:"Your model says \"deny loan\". The customer asks WHY. You need explainability.\n\nSHAP (SHapley Additive exPlanations):\n\u2192 Based on game theory (Shapley values)\n\u2192 For each prediction, tells you how much each feature pushed it up or down\n\u2192 Example: Income pushed prediction +0.3, Age pushed -0.1\n\u2192 All SHAP values sum to the difference from average prediction\n\nLIME (Local Interpretable Model-agnostic Explanations):\n\u2192 Create fake data near the point\n\u2192 Get predictions from your complex model\n\u2192 Fit a simple model (linear) locally\n\u2192 The simple model explains the complex one at that point\n\nFeature Importance (tree-based):\n\u2192 How much each feature reduces impurity across all splits\n\u2192 Fast but less rigorous than SHAP\n\nPartial Dependence Plots:\n\u2192 Show effect of one feature, averaged over all others",
        tags:["shapley","LIME","feature importance","interpretability"]},
    ]
  },
  {id:"nlp",name:"NLP & Text",icon:'\u{1F4DD}',color:C.blue,
    topics:[
      {id:"bow-tfidf",name:"Bag of Words & TF-IDF",
        quick:"BoW: count words. TF-IDF: weight by how unique a word is across documents. Simple but powerful baseline.",
        detail:"How do you turn text into numbers a model can use?\n\nBag of Words:\n1. Build vocabulary from all documents\n2. Each document = vector of word counts\n3. \"I love cats\" + \"I love dogs\" \u2192 {I:1, love:1, cats:1, dogs:0} and {I:1, love:1, cats:0, dogs:1}\n\nProblem: \"the\" appears everywhere but means nothing!\n\nTF-IDF fixes this:\n\u2192 TF (Term Frequency): How often word appears in THIS doc\n\u2192 IDF (Inverse Doc Frequency): log(total docs / docs containing word)\n\u2192 TF-IDF = TF \u00D7 IDF\n\nRare words get HIGH scores. Common words get LOW scores.\n\nStill used in search engines and as ML baselines. Loses word order though.",
        formula:"TF-IDF = tf(t,d) \u00D7 log(N / df(t))",
        tags:["text representation","vectorization","search"]},
      {id:"word-embeddings",name:"Word Embeddings",
        quick:"Words as dense vectors where similar words are nearby. Word2Vec, GloVe, then contextual (BERT).",
        detail:"\"King\" - \"Man\" + \"Woman\" = \"Queen\". That's the magic of embeddings!\n\nWord2Vec (2013):\n\u2192 Skip-gram: predict context from word\n\u2192 CBOW: predict word from context\n\u2192 Trains on co-occurrence patterns\n\u2192 Result: 100-300 dimensional dense vectors\n\nGloVe: Uses global word co-occurrence statistics. Often similar quality.\n\nProblem: One vector per word. \"Bank\" (river) = \"Bank\" (money)!\n\nContextual Embeddings (BERT, GPT):\n\u2192 Different vector depending on sentence context\n\u2192 \"Bank of the river\" vs \"Bank of America\" \u2192 different vectors\n\u2192 Pre-trained on massive text, fine-tune for your task\n\nThis was the revolution that made modern NLP possible.",
        tags:["Word2Vec","GloVe","BERT","embeddings","representation"]},
      {id:"seq2seq",name:"Sequence Models",
        quick:"Encoder reads input sequence, decoder generates output. Add attention to focus on relevant parts.",
        detail:"Translate English to French? Summarize a document? You need seq2seq.\n\nOriginal Architecture:\n1. Encoder reads input word by word \u2192 context vector\n2. Decoder generates output word by word from context vector\n\nProblem: Squeezing entire input into ONE vector loses information!\n\nAttention Mechanism:\n\u2192 Decoder can LOOK BACK at all encoder states\n\u2192 Learns which input words matter for each output word\n\u2192 \"Translating 'chat' \u2192 look at 'cat' in English\"\n\nBeam Search: Keep top-k candidates at each step instead of just the best one. Better output quality.\n\nTeacher Forcing: During training, feed correct previous word (not model's guess). Faster training but exposure bias.",
        tags:["encoder-decoder","attention","beam search","translation"]},
      {id:"text-preprocess",name:"Text Preprocessing",
        quick:"Tokenize, lowercase, remove stop words, stem/lemmatize. Clean text before feeding to models.",
        detail:"Raw text is messy. Models need clean, consistent input.\n\nPipeline:\n1. Tokenization: Split into words/subwords\n\u2192 \"I can't\" \u2192 [\"I\", \"ca\", \"n't\"] or [\"I\", \"can't\"]\n\n2. Lowercasing: \"Apple\" \u2192 \"apple\"\n\u2192 Usually yes, unless case matters (NER)\n\n3. Stop Words: Remove \"the\", \"is\", \"at\"\n\u2192 Careful: \"not good\" loses meaning without \"not\"!\n\n4. Stemming vs Lemmatization:\n\u2192 Stemming: Chop suffix. \"running\" \u2192 \"run\", \"better\" \u2192 \"better\"\n\u2192 Lemmatization: Use dictionary. \"better\" \u2192 \"good\". Slower but smarter.\n\n5. N-grams: Pairs/triples of words. \"New York\" = bigram.\n\nModern approach: Subword tokenization (BPE, WordPiece) handles rare words by breaking them into pieces.",
        tags:["tokenization","stemming","lemmatization","n-grams","stop words"]},
    ]
  },
  {id:"timeseries",name:"Time Series",icon:'\u{1F4C8}',color:C.orange,
    topics:[
      {id:"arima",name:"ARIMA & Forecasting",
        quick:"AR (past values) + I (differencing) + MA (past errors). The workhorse of time series forecasting.",
        detail:"Predict tomorrow's stock price from past prices? Time series!\n\nARIMA(p, d, q):\n\u2192 AR(p): Use last p values as predictors. \"Today looks like recent days.\"\n\u2192 I(d): Difference d times to make stationary. If data has a trend, subtract previous value.\n\u2192 MA(q): Use last q forecast errors. \"Correct for recent mistakes.\"\n\nStep by step:\n1. Plot it! Look for trend, seasonality\n2. Test stationarity (ADF test). If non-stationary, difference.\n3. Look at ACF/PACF plots:\n\u2192 ACF cuts off at q \u2192 MA order\n\u2192 PACF cuts off at p \u2192 AR order\n4. Fit model, check residuals are white noise\n\nSeasonal ARIMA: SARIMA(p,d,q)(P,D,Q,s) for seasonal patterns.\n\nModern alternatives: Prophet (Facebook), LSTM, Temporal Fusion Transformers.",
        formula:"y\u209C = c + \u03C6\u2081y\u209C\u208B\u2081 + ... + \u03C6\u209Ay\u209C\u208B\u209A + \u03B5\u209C + \u03B8\u2081\u03B5\u209C\u208B\u2081 + ... + \u03B8\u2091\u03B5\u209C\u208B\u2091",
        tags:["forecasting","stationarity","ACF","PACF","seasonal"]},
      {id:"ts-decomposition",name:"Time Series Decomposition",
        quick:"Break a series into Trend + Seasonality + Residual. Additive or multiplicative.",
        detail:"Every time series is a combination of patterns:\n\n\u2192 Trend: Long-term direction (sales growing over years)\n\u2192 Seasonality: Repeating patterns (ice cream sales peak in summer)\n\u2192 Residual: Random noise left over\n\nTwo types:\n\u2192 Additive: y = Trend + Seasonal + Residual\n  Use when seasonal variation is CONSTANT (same amplitude)\n\u2192 Multiplicative: y = Trend \u00D7 Seasonal \u00D7 Residual\n  Use when seasonal variation GROWS with trend\n\nHow to decompose:\n1. Estimate trend (moving average)\n2. Remove trend \u2192 detrended series\n3. Average detrended by season \u2192 seasonal component\n4. Residual = original - trend - seasonal\n\nWhy bother? Each component can be modeled separately. Easier to forecast when you understand the pieces.",
        tags:["trend","seasonality","additive","multiplicative","moving average"]},
    ]
  },
];

function renderNormalDist(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var mean=state.normMean, std=state.normStd;
  var pts=[], maxY=0;
  for(var x=-5;x<=5;x+=0.15){
    var y=1/(std*Math.sqrt(2*Math.PI))*Math.exp(-0.5*Math.pow((x-mean)/std,2));
    if(y>maxY)maxY=y;
    pts.push([x,y]);
  }
  maxY=Math.ceil(maxY*10)/10+0.05;
  var svgPts=pts.map(function(p){return [mapRange(p[0],-5,5,pad.l,W-pad.r), mapRange(p[1],0,maxY,H-pad.b,pad.t)];});
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var labels=axisLabels(pad.l,pad.t,W-pad.r,H-pad.b,['-5','','-1','','3','5'],null);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">\u03BC: <span class="slider-val" style="color:'+C.cyan+'">'+mean+'</span><br><input type="range" min="-3" max="3" step="0.5" value="'+mean+'" onchange="setState({normMean:+this.value})"></label>';
  html+='<label class="slider-label">\u03C3: <span class="slider-val" style="color:'+C.orange+'">'+std+'</span><br><input type="range" min="0.3" max="3" step="0.1" value="'+std+'" onchange="setState({normStd:+this.value})"></label>';
  html+='</div>';
  html+=svgChart(W,H,grid+labels+areaPath(svgPts,H-pad.b,C.cyan,0.25)+polyline(svgPts,C.cyan,2.5));
  return html;
}

function renderBiasVariance(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var data=[];
  for(var c=1;c<=10;c++){var b=10/c,v=0.1*Math.pow(c,1.8);data.push({c:c,b:b,v:v,t:b+v});}
  var maxY=Math.ceil(Math.max.apply(null,data.map(function(d){return d.t;}))*1.1);
  function px(d,key){return [mapRange(d.c,1,10,pad.l,W-pad.r),mapRange(d[key],0,maxY,H-pad.b,pad.t)];}
  var bPts=data.map(function(d){return px(d,'b');});
  var vPts=data.map(function(d){return px(d,'v');});
  var tPts=data.map(function(d){return px(d,'t');});
  var sel=data[state.bvComplexity-1];
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">Complexity: <span class="slider-val" style="color:'+C.accent+'">'+state.bvComplexity+'</span><br><input type="range" min="1" max="10" value="'+state.bvComplexity+'" onchange="setState({bvComplexity:+this.value})"></label>';
  html+='</div>';
  html+='<div class="metrics-row" style="margin-bottom:10px"><span style="color:'+C.blue+'">Bias\u00B2: '+sel.b.toFixed(1)+'</span><span style="color:'+C.orange+'">Var: '+sel.v.toFixed(1)+'</span><span style="color:'+C.red+'">Total: '+sel.t.toFixed(1)+'</span></div>';
  var cx=mapRange(sel.c,1,10,pad.l,W-pad.r);
  var marker='<line x1="'+cx+'" y1="'+pad.t+'" x2="'+cx+'" y2="'+(H-pad.b)+'" stroke="'+C.accent+'" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>';
  var leg=legendItem(pad.l+10,pad.t+4,C.blue,'Bias\u00B2')+legendItem(pad.l+70,pad.t+4,C.orange,'Variance')+legendItem(pad.l+150,pad.t+4,C.red,'Total');
  html+=svgChart(W,H,grid+marker+polyline(bPts,C.blue,2)+polyline(vPts,C.orange,2)+polyline(tPts,C.red,2.5,'5 5')+leg);

}

function renderROC(){
  var W=300,H=200,pad={l:35,r:10,t:10,b:24};
  var curve=[],diag=[];
  for(var t=0;t<=1;t+=0.03){
    curve.push([Math.pow(t,0.6),Math.pow(t,0.35)]);
    diag.push([t,t]);
  }
  var th=state.rocThreshold;
  var idx=Math.round(th*(curve.length-1));
  var pt=curve[idx]||[0,0];
  function px(p){return [mapRange(p[0],0,1,pad.l,W-pad.r),mapRange(p[1],0,1,H-pad.b,pad.t)];}
  var cPts=curve.map(px), dPts=diag.map(px), pPt=px(pt);
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,5);
  var labs=axisLabels(pad.l,pad.t,W-pad.r,H-pad.b,['0','','0.5','','1'],['1','','0.5','','0']);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">Threshold: <span class="slider-val" style="color:'+C.green+'">'+th.toFixed(2)+'</span><br><input type="range" min="0" max="1" step="0.05" value="'+th+'" onchange="setState({rocThreshold:+this.value})"></label>';
  html+='</div>';
  html+='<div style="font-size:12px;color:#94a3b8;margin-bottom:8px">FPR: <span style="color:'+C.red+'">'+pt[0].toFixed(2)+'</span> | TPR: <span style="color:'+C.green+'">'+pt[1].toFixed(2)+'</span></div>';
  html+=svgChart(W,H,grid+labs+areaPath(cPts,H-pad.b,C.green,0.12)+polyline(dPts,C.textDim,1,'5 5')+polyline(cPts,C.green,2.5)+circle(pPt[0],pPt[1],6,C.accent,C.accent,0));
  return html;
}

function renderGradientDescent(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var landscape=[];
  for(var x=-3;x<=3;x+=0.12){landscape.push([x,x*x+0.5*Math.sin(3*x)]);}
  var maxY=Math.max.apply(null,landscape.map(function(p){return p[1];}))+0.5;
  var lr=state.gdLr, step=state.gdStep;
  var cx=2.5;
  var path=[{x:cx,y:cx*cx+0.5*Math.sin(3*cx)}];
  for(var i=0;i<30;i++){
    var grad=2*cx+1.5*Math.cos(3*cx);
    cx=Math.max(-3,Math.min(3,cx-lr*grad));
    path.push({x:cx,y:cx*cx+0.5*Math.sin(3*cx)});
  }
  var cur=path[Math.min(step,30)];
  function px(p){return [mapRange(p[0]||p.x,-3,3,pad.l,W-pad.r),mapRange(p[1]||p.y,0,maxY,H-pad.b,pad.t)];}
  var lPts=landscape.map(px);
  var curPx=px(cur);
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">LR: <span class="slider-val" style="color:'+C.orange+'">'+lr+'</span><br><input type="range" min="0.01" max="0.5" step="0.01" value="'+lr+'" onchange="setState({gdLr:+this.value,gdStep:0})"></label>';
  html+='<button class="viz-btn primary" onclick="setState({gdStep:Math.min(state.gdStep+1,30)})">&#9654; Step</button> ';
  html+='<button class="viz-btn secondary" onclick="setState({gdStep:0})">&#8634; Reset</button> ';
  html+='<span style="font-size:12px;color:#94a3b8">'+step+'/30</span>';
  html+='</div>';
  html+=svgChart(W,H,grid+polyline(lPts,C.blue,2)+circle(curPx[0],curPx[1],7,C.red,'#fff',2));
  return html;
}

function renderConfusionMatrix(){

  html+='<div class="cm-header"></div><div class="cm-header">Pred +</div><div class="cm-header">Pred \u2212</div>';

  html+='<div class="cm-cell" style="background:'+C.blue+'22;border:1px solid '+C.blue+'44"><div class="cm-cell-label" style="color:'+C.blue+'">TN</div><input class="cm-input" type="number" value="'+tn+'" onchange="setState({cmTn:Math.max(0,+this.value)})"></div>';
