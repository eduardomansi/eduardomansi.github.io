<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>Data Science Mastery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden;background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
input[type="range"]{-webkit-appearance:none;height:6px;border-radius:3px;background:#2d3348;outline:none;width:100%;max-width:180px}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#6366f1;cursor:pointer;border:2px solid #fff}
input[type="number"]{-webkit-appearance:none;-moz-appearance:textfield}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
button{-webkit-tap-highlight-color:transparent}
.app{min-height:100vh;padding-bottom:env(safe-area-inset-bottom,20px)}
.header{background:linear-gradient(135deg,#1a1d27,rgba(79,70,229,0.15));border-bottom:1px solid #2d3348;padding:max(env(safe-area-inset-top,12px),12px) 16px 12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.header-inner{max-width:800px;margin:0 auto}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-icon{background:linear-gradient(135deg,#6366f1,#06b6d4);border-radius:10px;padding:8px;display:flex;align-items:center;justify-content:center}
.logo-title{font-size:19px;font-weight:800;color:#e2e8f0}
.logo-sub{font-size:11px;color:#94a3b8}
.search-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:140px}
.search-box input{width:100%;padding:10px 10px 10px 34px;background:#0f1117;border:1px solid #2d3348;border-radius:10px;color:#e2e8f0;font-size:14px;outline:none}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
.btn{border:1px solid #2d3348;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap;background:#242836;color:#94a3b8}
.btn.active{background:rgba(245,158,11,0.2);border-color:#f59e0b;color:#f59e0b}
.content{max-width:800px;margin:0 auto;padding:16px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;margin-bottom:24px}
.cat-card{background:#1a1d27;border:1px solid #2d3348;border-radius:14px;padding:16px;cursor:pointer;transition:transform 0.15s}
.cat-card:active{transform:scale(0.97)}
.cat-name{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:4px}
.cat-count{font-size:11px;color:#94a3b8}
.cat-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.cat-tag{font-size:9px;padding:2px 6px;border-radius:12px}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-title{font-size:17px;font-weight:700}
.section-badge{font-size:11px;color:#64748b;background:#242836;padding:2px 8px;border-radius:12px}
.topic-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.topic-card{background:#1a1d27;border:1px solid #2d3348;border-radius:14px;overflow:hidden;transition:border-color 0.2s}
.topic-card.expanded{border-color:rgba(99,102,241,0.4)}
.topic-head{padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
.topic-head:active{background:#242836}
.topic-chevron{margin-top:3px;flex-shrink:0}
.topic-body{flex:1;min-width:0}
.topic-title-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.topic-name{font-size:15px;font-weight:700;color:#e2e8f0}
.topic-fav{background:none;border:none;cursor:pointer;padding:3px;flex-shrink:0}
.badge-interactive{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(16,185,129,0.15);color:#10b981}
.topic-quick{font-size:13px;color:#94a3b8;line-height:1.5}
.topic-formula-mini{display:inline-block;margin-top:8px;background:#0f1117;padding:3px 8px;border-radius:6px;font-size:11px;border:1px solid #2d3348;font-family:monospace;word-break:break-all}
.topic-detail{padding:0 16px 16px 42px;border-top:1px solid #2d3348}
.formula-box{margin:14px 0;border-radius:10px;padding:10px 14px}
.formula-label{font-size:9px;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.formula-code{font-size:13px;color:#e2e8f0;font-weight:600;font-family:monospace;word-break:break-all}
.detail-text{font-size:13px;color:#94a3b8;line-height:1.75;margin-top:14px}
.detail-text .arrow{padding-left:10px;margin-bottom:3px}
.detail-text .numbered{font-weight:600;color:#e2e8f0;margin-top:8px}
.detail-text .spacer{height:6px}
.viz-box{margin-top:18px;background:#0f1117;border:1px solid #2d3348;border-radius:12px;padding:14px;overflow-x:auto}
.viz-label{font-size:10px;font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;color:#10b981}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tag{background:#242836;color:#64748b;font-size:10px;padding:3px 8px;border-radius:12px;cursor:pointer;border:1px solid #2d3348}
.tag:active{border-color:#6366f1;color:#6366f1}
.empty{text-align:center;padding:48px 16px;color:#64748b}
.footer{text-align:center;padding:32px 0 8px;border-top:1px solid #2d3348;margin-top:32px;font-size:11px;color:#64748b}
.slider-row{display:flex;gap:16px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.slider-label{color:#94a3b8;font-size:13px}
.slider-val{font-weight:700}
.viz-btn{border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.viz-btn.primary{background:#6366f1;color:#fff}
.viz-btn.secondary{background:#242836;color:#94a3b8;border:1px solid #2d3348}
.metrics-row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.cm-grid{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;margin-bottom:14px;max-width:300px}
.cm-header{padding:6px;text-align:center;font-size:11px;color:#94a3b8;font-weight:600}
.cm-cell{border-radius:8px;padding:10px;text-align:center;margin:2px}
.cm-cell-label{font-size:11px;font-weight:700;margin-bottom:4px}
.cm-input{width:50px;background:#0f1117;border:1px solid #2d3348;border-radius:4px;color:#e2e8f0;text-align:center;padding:4px;font-size:16px;font-weight:700}
svg text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
.cv-row{display:flex;gap:3px;cursor:pointer;align-items:center;margin-bottom:5px}
.cv-label{font-size:11px;color:#94a3b8;width:48px;flex-shrink:0}
.cv-blocks{display:flex;gap:2px;flex:1}
.cv-block{flex:1;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.tree-nodes{display:flex;flex-direction:column;align-items:center;gap:8px}
.tree-node{border-radius:10px;padding:8px 14px;font-size:12px;text-align:center;min-width:70}
.tree-branches{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tree-result{border-radius:10px;padding:10px 20px;font-size:14px;font-weight:700}
.act-btns{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.act-btn{border-radius:8px;padding:6px 14px;cursor:pointer;font-size:12px;border:1px solid #2d3348}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
// ─── Minimal SVG Chart Helpers ──────────────────────
function svgChart(w,h,content){
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" xmlns="http://www.w3.org/2000/svg" style="display:block">'+content+'</svg>';
}
function polyline(pts,color,sw,dash){
  if(!pts.length)return '';
  return '<polyline points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="'+(sw||2)+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
}
function areaPath(pts,baseY,color,opacity){
  if(!pts.length)return '';
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=1;i<pts.length;i++) d+='L'+pts[i][0]+','+pts[i][1];
  d+='L'+pts[pts.length-1][0]+','+baseY+'L'+pts[0][0]+','+baseY+'Z';
  return '<path d="'+d+'" fill="'+color+'" opacity="'+(opacity||0.3)+'"/>';
}
function circle(cx,cy,r,fill,stroke,sw){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+(fill||'#fff')+'"'+(stroke?' stroke="'+stroke+'" stroke-width="'+(sw||2)+'"':'')+'/>';
}
function gridLines(x0,y0,x1,y1,nx,ny){
  var s='';
  for(var i=0;i<=nx;i++){var x=x0+(x1-x0)*i/nx;s+='<line x1="'+x+'" y1="'+y0+'" x2="'+x+'" y2="'+y1+'" stroke="#2d3348" stroke-width="0.5"/>';}
  for(var j=0;j<=ny;j++){var y=y0+(y1-y0)*j/ny;s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#2d3348" stroke-width="0.5"/>';}
  return s;
}
function axisLabels(x0,y0,x1,y1,xLabels,yLabels){
  var s='';
  if(xLabels)for(var i=0;i<xLabels.length;i++){var x=x0+(x1-x0)*i/(xLabels.length-1);s+='<text x="'+x+'" y="'+(y1+14)+'" fill="#64748b" font-size="10" text-anchor="middle">'+xLabels[i]+'</text>';}
  if(yLabels)for(var j=0;j<yLabels.length;j++){var y=y0+(y1-y0)*j/(yLabels.length-1);s+='<text x="'+(x0-6)+'" y="'+(y+3)+'" fill="#64748b" font-size="10" text-anchor="end">'+yLabels[j]+'</text>';}
  return s;
}
function mapRange(val,min,max,outMin,outMax){return outMin+(val-min)/(max-min)*(outMax-outMin);}
function legendItem(x,y,color,label){return '<rect x="'+x+'" y="'+y+'" width="12" height="3" rx="1" fill="'+color+'"/><text x="'+(x+16)+'" y="'+(y+4)+'" fill="#94a3b8" font-size="10">'+label+'</text>';}

// ─── Colors ─────────────────────────────────────────
var C={bg:"#0f1117",surface:"#1a1d27",surfaceLight:"#242836",border:"#2d3348",text:"#e2e8f0",textMuted:"#94a3b8",textDim:"#64748b",accent:"#6366f1",accentLight:"#818cf8",green:"#10b981",blue:"#3b82f6",orange:"#f59e0b",pink:"#ec4899",red:"#ef4444",cyan:"#06b6d4",purple:"#a855f7"};

// ─── State ──────────────────────────────────────────
var state={
  selectedCat:null, search:'', expandedTopics:{}, favorites:{}, showFavOnly:false,
  // viz states
  normMean:0, normStd:1,
  bvComplexity:5,
  rocThreshold:0.5,
  gdStep:0, gdLr:0.1,
  cmTp:85, cmFp:10, cmFn:15, cmTn:90,
  kmK:3, kmIter:0,
  dtAge:30, dtIncome:55,
  actFn:'relu',
  regLambda:0.5,
  cvK:5, cvActive:0,
};

function setState(updates){
  for(var k in updates) state[k]=updates[k];
  render();
}

// ─── Category Data ──────────────────────────────────
var CATEGORIES=[
  {id:"stats",name:"Statistics & Probability",icon:'📊',color:C.cyan,
    topics:[
      {id:"normal-dist",name:"Normal Distribution",
        quick:"Bell-shaped curve where ~68% of data falls within 1σ of the mean. Defined by μ (mean) and σ (standard deviation).",
        detail:"Think of measuring heights of 10,000 people. Most cluster around the average. That's a Normal Distribution!\n\nThe magic numbers:\n→ 68% within ±1σ\n→ 95% within ±2σ\n→ 99.7% within ±3σ (empirical rule)\n\nWhy it matters: The Central Limit Theorem says sample means become normally distributed regardless of population shape.\n\nDon't memorize the formula — understand the shape. Play with μ and σ below!",
        formula:"f(x) = (1/σ√2π) · e^(-½((x-μ)/σ)²)", viz:"normalDist",
        tags:["distribution","gaussian","bell curve","CLT"]},
      {id:"bayes",name:"Bayes' Theorem",
        quick:"Updates probability given new evidence: P(A|B) = P(B|A)·P(A) / P(B)",
        detail:"A disease test is 99% accurate. Only 1 in 10,000 have the disease. Positive test → only ~1% chance you have it!\n\nKey ingredients:\n→ Prior: P(A) — belief before evidence\n→ Likelihood: P(B|A) — evidence if hypothesis true\n→ Posterior: P(A|B) — updated belief\n\nThe Base Rate Fallacy = ignoring the prior. Underpins Naive Bayes classifiers.",
        formula:"P(A|B) = P(B|A) · P(A) / P(B)",
        tags:["probability","conditional","prior","posterior"]},
      {id:"hypothesis",name:"Hypothesis Testing",
        quick:"Framework to decide if evidence is strong enough to reject a claim. Uses p-values and significance levels.",
        detail:"Assume the drug doesn't work (H₀). Look for evidence against that.\n\n1. State H₀ and H₁\n2. Choose α (usually 0.05)\n3. Compute test statistic\n4. Get p-value\n5. If p-value < α → reject H₀\n\nCommon mistakes:\n→ p-value ≠ probability H₀ is true\n→ \"Not significant\" ≠ \"no effect\"\n→ Multiple comparisons inflate false positives\n\nTypes: z-test, t-test, chi-square, ANOVA",
        formula:"If p-value < α → Reject H₀",
        tags:["p-value","significance","null hypothesis","t-test"]},
      {id:"distributions",name:"Key Distributions",
        quick:"Binomial (n trials), Poisson (rare events/time), Exponential (time between events), Uniform (equal probability).",
        detail:"Your distribution toolkit:\n\nBinomial: \"How many heads in 20 flips?\"\n→ Parameters: n (trials), p (probability)\n\nPoisson: \"Customers per hour?\"\n→ Parameter: λ (average rate)\n\nExponential: \"Time until next customer?\"\n→ Memoryless property!\n\nStudent's t: Normal with heavier tails\n→ Small sample, unknown σ\n→ As n → ∞, becomes Normal",
        tags:["binomial","poisson","exponential","t-distribution"]},
      {id:"clt",name:"Central Limit Theorem",
        quick:"Sample means → normal distribution as n increases, regardless of original shape. Rule of thumb: n ≥ 30.",
        detail:"The MOST IMPORTANT theorem in statistics.\n\nTake ANY distribution. Sample many times. Plot the means. Result: Normal!\n\n→ Mean of sample means = μ\n→ Std of sample means = σ/√n (standard error)\n\nThis lets us use Normal tools even when data isn't normal. Foundation of inferential statistics.",
        formula:"X̄ ~ N(μ, σ²/n) as n → ∞",
        tags:["sampling","standard error"]},
      {id:"confidence",name:"Confidence Intervals",
        quick:"A range likely to contain the true parameter. 95% CI ≠ '95% chance truth is here'.",
        detail:"95% CI means: repeat 100 times → ~95 intervals contain the truth.\n\nFormula: X̄ ± z* × (σ/√n)\n\n→ 90%: z* = 1.645\n→ 95%: z* = 1.96\n→ 99%: z* = 2.576\n\nKey insights:\n→ Wider = more confident, less precise\n→ Larger sample = narrower interval\n→ CI width ∝ 1/√n",
        formula:"CI = X̄ ± z* × (σ/√n)",
        tags:["margin of error","standard error"]},
    ]
  },
  {id:"ml",name:"Machine Learning Models",icon:'🧠',color:C.accent,
    topics:[
      {id:"linreg",name:"Linear Regression",
        quick:"Fits y = wx + b minimizing squared errors. Assumes linearity, independence, homoscedasticity, normal residuals.",
        detail:"The Hello World of ML.\n\nModel: ŷ = w₁x₁ + w₂x₂ + ... + b\nMinimizes: Σ(yᵢ - ŷᵢ)²\n\nAssumptions (LINE):\n→ Linearity\n→ Independence\n→ Normality of residuals\n→ Equal variance\n\nCheck: R² (variance explained), residual plots.\nFails with: non-linear data, multicollinearity, outliers.",
        formula:"ŷ = Xw + b, min ||y - ŷ||²",
        tags:["regression","OLS","R-squared"]},
      {id:"logreg",name:"Logistic Regression",
        quick:"Classification via sigmoid: P(y=1) = 1/(1+e^(-z)). It's classification, not regression!",
        detail:"It's a classification algorithm!\n\n1. Compute z = wᵀx + b\n2. σ(z) = 1/(1+e⁻ᶻ) → probability [0,1]\n3. P ≥ 0.5 → class 1\n\nLoss: Binary Cross-Entropy\nL = -[y·log(ŷ) + (1-y)·log(1-ŷ)]\n\nWhy not linear regression? Outputs must be [0,1]!\n→ Interpretable coefficients (log-odds)\n→ Multiclass: Softmax",
        formula:"P(y=1) = 1/(1+e^(-(wᵀx+b)))",
        tags:["classification","sigmoid","cross-entropy"]},
      {id:"dtree",name:"Decision Trees",
        quick:"If-then splits minimizing Gini or Entropy. Interpretable but overfits easily.",
        detail:"20 Questions with data. Best-separating question at each node.\n\nSplit criteria:\n→ Gini: 1 - Σpᵢ²\n→ Entropy: -Σpᵢ·log₂(pᵢ)\n→ Info Gain = parent - weighted children entropy\n\nPros: Interpretable, no scaling needed\nCons: Overfits, unstable\nFix: Prune or use ensembles.\n\nTry the interactive tree!",
        viz:"decisionTree",
        tags:["gini","entropy","CART","pruning"]},
      {id:"rf",name:"Random Forest",
        quick:"Ensemble of trees on random subsets. Bagging + feature randomization → less overfitting.",
        detail:"Train hundreds of trees, let them vote.\n\nTwo tricks:\n→ Bagging: Random samples WITH replacement\n→ Feature randomization: √p features per split\n\nKey params: n_estimators, max_depth, max_features\n\nBonus: OOB score = free validation!\nFeature importance from impurity reduction.",
        formula:"ŷ = mode(tree₁, tree₂, ..., treeₙ)",
        tags:["ensemble","bagging","OOB"]},
      {id:"xgb",name:"Gradient Boosting / XGBoost",
        quick:"Sequential learners correcting previous errors. XGBoost adds regularization.",
        detail:"Trees built sequentially — each fixes previous mistakes.\n\n1. Start with mean\n2. Compute residuals\n3. Train tree on residuals\n4. Add (scaled by lr)\n5. Repeat!\n\nXGBoost adds:\n→ L1 + L2 regularization\n→ Handles missing values\n→ Parallel feature processing\n\nKey: learning_rate (0.01-0.1), max_depth (3-8), early stopping!",
        formula:"ŷ = Σ η · hₘ(x) + Ω(hₘ)",
        viz:"gradientDescent",
        tags:["boosting","xgboost","lightgbm"]},
      {id:"svm",name:"Support Vector Machines",
        quick:"Maximizes margin between classes. Kernel trick for non-linear boundaries.",
        detail:"Find the widest street between classes. Closest points = support vectors.\n\nNon-linear? Kernel trick:\n→ Linear: xᵀy\n→ RBF: exp(-γ||x-y||²) — most common\n→ Polynomial: (xᵀy + c)^d\n\nParams: C (regularization), γ (kernel width)\nPros: High dimensions, memory-efficient\nCons: Slow on large data",
        formula:"min ½||w||² s.t. yᵢ(wᵀxᵢ+b) ≥ 1",
        tags:["kernel","margin","RBF"]},
      {id:"knn",name:"k-Nearest Neighbors",
        quick:"Majority vote of k closest points. Lazy learning — no training phase!",
        detail:"\"You are your neighbors.\"\n\n1. Store all data\n2. Find k closest\n3. Vote (classification) or average (regression)\n\nDistances: Euclidean √Σ(xᵢ-yᵢ)², Manhattan Σ|xᵢ-yᵢ|\n\nk small → flexible/noisy. k large → smooth/underfit.\n\nCRITICAL: Scale features!\nSpeed: KD-trees, FAISS",
        tags:["distance","lazy learning","euclidean"]},
      {id:"naive-bayes",name:"Naive Bayes",
        quick:"Assumes feature independence. P(class) × ∏P(feature|class). Fast, great for text.",
        detail:"Naive = features independent given class. Rarely true but works!\n\nVariants:\n→ Gaussian: Continuous features\n→ Multinomial: Word counts\n→ Bernoulli: Binary features\n\nWorks because ranking matters more than exact probabilities.\n\nUse: Spam, sentiment, document classification.",
        formula:"P(C|X) = P(C)∏P(xᵢ|C) / P(X)",
        tags:["probabilistic","spam","text"]},
    ]
  },
  {id:"dl",name:"Deep Learning",icon:'⚡',color:C.pink,
    topics:[
      {id:"nn",name:"Neural Networks",
        quick:"Layers of neurons with activations. Universal function approximators.",
        detail:"Matrix multiplications + non-linear functions!\n\nNeuron: output = activation(Σwᵢxᵢ + b)\n\nTraining:\n1. Forward pass → prediction\n2. Compute loss\n3. Backprop gradients (chain rule)\n4. Update: w = w - lr × ∂L/∂w\n\nKey concepts:\n→ Vanishing gradients → use ReLU, ResNets\n→ Batch Norm → stable training\n→ Dropout → prevents overfitting\n\nExplore activations below!",
        viz:"activation",
        tags:["backpropagation","activation","dropout"]},
      {id:"cnn",name:"CNNs",
        quick:"Convolutional filters detect spatial patterns: edges → textures → shapes → objects.",
        detail:"Slide small filters to detect local patterns.\n\nBlocks:\n→ Conv: Filter slides across input\n→ Pooling: Downsample (Max pool)\n→ Flatten + Dense: Classify\n\nHierarchy:\nLayer 1: Edges → Layer 2: Textures → Layer 3: Parts → Layer 4+: Objects\n\nConcepts: Stride, Padding, Receptive field\n\nArchitectures: LeNet → AlexNet → VGG → ResNet → EfficientNet",
        tags:["convolution","pooling","ResNet"]},
      {id:"rnn",name:"RNNs & LSTMs",
        quick:"Sequential data with memory. LSTMs use gates to solve vanishing gradients.",
        detail:"RNNs pass info between timesteps.\nhₜ = tanh(Wₕhₜ₋₁ + Wₓxₜ)\nProblem: Vanishing gradients!\n\nLSTM fixes with 3 gates:\n→ Forget: Discard old info\n→ Input: Store new info\n→ Output: What to emit\n\nCell state = conveyor belt through time.\n\nGRU: Simpler, 2 gates, often works as well.\n\nNote: Transformers now dominate NLP.",
        tags:["sequence","time series","gates"]},
      {id:"transformer",name:"Transformers & Attention",
        quick:"Self-attention lets each token attend to all others. Foundation of GPT, BERT.",
        detail:"\"Attention Is All You Need\"\n\n1. Create Q, K, V for each token\n2. Scores = Q · Kᵀ / √dₖ\n3. Softmax → attention weights\n4. Output = weighted sum of Values\n\nMulti-Head: Multiple parallel attention with different projections.\n\n→ Encoder: BERT (bidirectional)\n→ Decoder: GPT (autoregressive)\n→ Both: T5\n\nPositional encoding via sine/cosine.",
        formula:"Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V",
        tags:["attention","BERT","GPT","NLP"]},
    ]

function renderNormalDist(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  var mean=state.normMean, std=state.normStd;
  var pts=[], maxY=0;
  for(var x=-5;x<=5;x+=0.15){
    var y=1/(std*Math.sqrt(2*Math.PI))*Math.exp(-0.5*Math.pow((x-mean)/std,2));
    if(y>maxY)maxY=y;
    pts.push([x,y]);
  }
  maxY=Math.ceil(maxY*10)/10+0.05;
  var svgPts=pts.map(function(p){return [mapRange(p[0],-5,5,pad.l,W-pad.r), mapRange(p[1],0,maxY,H-pad.b,pad.t)];});
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var xL=['-5','','-1','','3','5'];
  var labels=axisLabels(pad.l,pad.t,W-pad.r,H-pad.b,['-5','','-1','','3','5'],null);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">μ: <span class="slider-val" style="color:'+C.cyan+'">'+mean+'</span><br><input type="range" min="-3" max="3" step="0.5" value="'+mean+'" onchange="setState({normMean:+this.value})"></label>';
  html+='<label class="slider-label">σ: <span class="slider-val" style="color:'+C.orange+'">'+std+'</span><br><input type="range" min="0.3" max="3" step="0.1" value="'+std+'" onchange="setState({normStd:+this.value})"></label>';
  html+='</div>';
  html+=svgChart(W,H,grid+labels+areaPath(svgPts,H-pad.b,C.cyan,0.25)+polyline(svgPts,C.cyan,2.5));
  return html;
}

function renderGradientDescent(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var landscape=[];
  for(var x=-3;x<=3;x+=0.12){landscape.push([x,x*x+0.5*Math.sin(3*x)]);}
  var maxY=Math.max.apply(null,landscape.map(function(p){return p[1];}))+0.5;
  var lr=state.gdLr, step=state.gdStep;
  var cx=2.5;
  var path=[{x:cx,y:cx*cx+0.5*Math.sin(3*cx)}];
  for(var i=0;i<30;i++){
    var grad=2*cx+1.5*Math.cos(3*cx);
    cx=Math.max(-3,Math.min(3,cx-lr*grad));
    path.push({x:cx,y:cx*cx+0.5*Math.sin(3*cx)});
  }
  var cur=path[Math.min(step,30)];
  function px(p){return [mapRange(p[0]||p.x,-3,3,pad.l,W-pad.r),mapRange(p[1]||p.y,0,maxY,H-pad.b,pad.t)];}
  var lPts=landscape.map(px);
  var curPx=px(cur);
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var html='<div class="slider-row">';
  html+='<label class="slider-label">LR: <span class="slider-val" style="color:'+C.orange+'">'+lr+'</span><br><input type="range" min="0.01" max="0.5" step="0.01" value="'+lr+'" onchange="setState({gdLr:+this.value,gdStep:0})"></label>';

  html+='<button class="viz-btn secondary" onclick="setState({gdStep:0})">↺ Reset</button> ';
  html+='<span style="font-size:12px;color:#94a3b8">'+step+'/30</span>';
  html+='</div>';
  html+=svgChart(W,H,grid+polyline(lPts,C.blue,2)+circle(curPx[0],curPx[1],7,C.red,'#fff',2));
  return html;
}

function renderKMeans(){
  var W=300,H=220,pad={l:30,r:10,t:10,b:20};
  var k=state.kmK, iter=state.kmIter;
  var colors=[C.cyan,C.orange,C.pink,C.green,C.purple];
  // Seeded random
  function seeded(s){return function(){s=(s*16807)%2147483647;return(s-1)/2147483646;};}
  var r1=seeded(42);
  var centers=[[2,2],[6,7],[9,3],[4,9],[8,8]];
  var basePts=[];
  for(var i=0;i<60;i++){var ci=centers[i%5];basePts.push({x:ci[0]+(r1()-0.5)*3,y:ci[1]+(r1()-0.5)*3});}
  var r2=seeded(123);
  var cents=[];for(var j=0;j<k;j++)cents.push({x:r2()*10,y:r2()*10});
  var assigned=basePts.map(function(p){return{x:p.x,y:p.y,c:0};});
  for(var it=0;it<=iter;it++){
    assigned=basePts.map(function(p){
      var minD=1e9,best=0;
      cents.forEach(function(c,ci){var d=(p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y);if(d<minD){minD=d;best=ci;}});
      return{x:p.x,y:p.y,c:best};
    });
    var nc=cents.map(function(_,ci){
      var cl=assigned.filter(function(p){return p.c===ci;});
      if(!cl.length)return cents[ci];
      return{x:cl.reduce(function(s,p){return s+p.x;},0)/cl.length, y:cl.reduce(function(s,p){return s+p.y;},0)/cl.length};
    });
    cents=nc;
  }
  function px(p){return [mapRange(p.x,0,11,pad.l,W-pad.r),mapRange(p.y,0,11,H-pad.b,pad.t)];}
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,5);
  var dots='';
  assigned.forEach(function(p){var pt=px(p);dots+=circle(pt[0],pt[1],4,colors[p.c]+'cc','none',0);});
  cents.forEach(function(c,i){var pt=px(c);dots+='<rect x="'+(pt[0]-5)+'" y="'+(pt[1]-5)+'" width="10" height="10" transform="rotate(45 '+pt[0]+' '+pt[1]+')" fill="#fff" stroke="'+colors[i]+'" stroke-width="2.5"/>';});

  var html='<div class="slider-row">';
  html+='<label class="slider-label">k = <span class="slider-val" style="color:'+C.accent+'">'+k+'</span><br><input type="range" min="2" max="5" value="'+k+'" onchange="setState({kmK:+this.value,kmIter:0})"></label>';
  html+='<button class="viz-btn primary" onclick="setState({kmIter:Math.min(state.kmIter+1,15)})">▶ Iterate</button> ';
  html+='<button class="viz-btn secondary" onclick="setState({kmIter:0})">↺ Reset</button> ';
  html+='<span style="font-size:12px;color:#94a3b8">Iter: '+iter+'</span>';
  html+='</div>';
  html+=svgChart(W,H,grid+dots);
  return html;
}

  html+='<div class="tree-result" style="background:'+rc+'33;border:2px solid '+rc+';color:'+rc+'">'+(result==='Yes'?'✓ Approve':'✗ Deny')+'</div>';
  html+='</div>';
  html+='<div style="margin-top:12px;font-size:12px;color:#94a3b8;background:#0f1117;padding:8px;border-radius:6px">Path: '+path+'</div>';
  return html;
}

function renderActivation(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var fn=state.actFn;
  var fns={relu:{name:'ReLU',f:function(x){return Math.max(0,x);},color:C.cyan},sigmoid:{name:'Sigmoid',f:function(x){return 1/(1+Math.exp(-x));},color:C.green},tanh:{name:'Tanh',f:function(x){return Math.tanh(x);},color:C.orange},leaky:{name:'Leaky ReLU',f:function(x){return x>0?x:0.1*x;},color:C.pink}};
  var cur=fns[fn];
  var pts=[];var minY=fn==='sigmoid'?0:-1.5;var maxY=fn==='sigmoid'?1:fn==='tanh'?1.2:5;
  for(var x=-5;x<=5;x+=0.15){var y=cur.f(x);pts.push([x,y]);}
  if(fn==='relu'||fn==='leaky')maxY=5.5;
  function px(p){return [mapRange(p[0],-5,5,pad.l,W-pad.r),mapRange(p[1],minY,maxY,H-pad.b,pad.t)];}
  var svgPts=pts.map(px);
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var html='<div class="act-btns">';
  Object.keys(fns).forEach(function(k){
    var v=fns[k];
    var active=fn===k;
    html+='<button class="act-btn" style="background:'+(active?v.color+'33':C.surfaceLight)+';border-color:'+(active?v.color:C.border)+';color:'+(active?v.color:C.textMuted)+';font-weight:'+(active?600:400)+'" onclick="setState({actFn:\''+k+'\'})">'+v.name+'</button>';
  });
  html+='</div>';
  html+=svgChart(W,H,grid+polyline(svgPts,cur.color,2.5));
  return html;
}

function renderRegularization(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var lam=state.regLambda;
  var pts1=[],pts2=[];
  for(var x=-3;x<=3;x+=0.12){
    var nr=0.5*x*x*x-2*x+0.3*Math.sin(5*x);
    var wr=0.5*x*x*x/(1+lam*2)-2*x/(1+lam)+0.3*Math.sin(5*x)/(1+lam*5);
    pts1.push([x,nr]);pts2.push([x,wr]);
  }
  var allY=pts1.concat(pts2).map(function(p){return p[1];});
  var minY=Math.min.apply(null,allY)-0.5, maxY=Math.max.apply(null,allY)+0.5;
  function px(p){return [mapRange(p[0],-3,3,pad.l,W-pad.r),mapRange(p[1],minY,maxY,H-pad.b,pad.t)];}
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var leg=legendItem(pad.l+10,pad.t+4,C.red,'No Reg')+legendItem(pad.l+80,pad.t+4,C.purple,'With Reg');
  var html='<div class="slider-row">';
  html+='<label class="slider-label">λ: <span class="slider-val" style="color:'+C.purple+'">'+lam.toFixed(2)+'</span><br><input type="range" min="0" max="3" step="0.1" value="'+lam+'" onchange="setState({regLambda:+this.value})"></label>';
  html+='</div>';
  html+=svgChart(W,H,grid+leg+polyline(pts1.map(px),C.red,1.5,'5 5')+polyline(pts2.map(px),C.purple,2.5));
  return html;
}

function renderCrossVal(){
  var k=state.cvK, active=state.cvActive;
  if(active>=k) active=0;
  var html='<div class="slider-row">';
  html+='<label class="slider-label">k = <span class="slider-val" style="color:'+C.accent+'">'+k+'</span><br><input type="range" min="3" max="10" value="'+k+'" onchange="setState({cvK:+this.value,cvActive:0})"></label>';
  html+='</div>';
  for(var fold=0;fold<k;fold++){
    var opacity=fold===active?1:0.35;
    html+='<div class="cv-row" onclick="setState({cvActive:'+fold+'})" style="opacity:'+opacity+'">';
    html+='<span class="cv-label">Fold '+(fold+1)+'</span>';
    html+='<div class="cv-blocks">';
    for(var j=0;j<k;j++){
      var isTest=j===fold;
      html+='<div class="cv-block" style="background:'+(isTest?C.orange+'88':C.accent+'44')+';border:1px solid '+(isTest?C.orange:C.accent)+'33;color:'+(isTest?C.orange:C.accentLight)+'">'+(isTest?'TEST':'TRAIN')+'</div>';
    }
    html+='</div></div>';
  }
  html+='<div style="margin-top:8px;font-size:12px;color:#94a3b8">Tap a fold to highlight.</div>';
  return html;
}

var VIZ_MAP={
  normalDist:renderNormalDist,
  biasVariance:renderBiasVariance,
  roc:renderROC,
  gradientDescent:renderGradientDescent,
  confusionMatrix:renderConfusionMatrix,
  kmeans:renderKMeans,
  decisionTree:renderDecisionTree,
  activation:renderActivation,
  regularization:renderRegularization,
  crossVal:renderCrossVal,
};

// ─── Render ─────────────────────────────────────────
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(){
  var q=state.search.toLowerCase().trim();
  var filteredCats=CATEGORIES.map(function(cat){
    var topics=cat.topics.filter(function(t){
      if(state.showFavOnly&&!state.favorites[t.id])return false;
      if(!q)return true;
      return t.name.toLowerCase().indexOf(q)!==-1||t.quick.toLowerCase().indexOf(q)!==-1||(t.tags||[]).some(function(tag){return tag.toLowerCase().indexOf(q)!==-1;})||t.detail.toLowerCase().indexOf(q)!==-1;
    });
    return{id:cat.id,name:cat.name,icon:cat.icon,color:cat.color,topics:topics};
  }).filter(function(cat){return cat.topics.length>0;});

  var totalTopics=CATEGORIES.reduce(function(s,c){return s+c.topics.length;},0);
  var totalFiltered=filteredCats.reduce(function(s,c){return s+c.topics.length;},0);

  var html='';
  // Header
  html+='<div class="header"><div class="header-inner">';
  html+='<div class="logo-row"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="20" x2="16" y2="20"/></svg></div><div><div class="logo-title">Data Science Mastery</div><div class="logo-sub">'+totalTopics+' concepts · Interactive</div></div></div>';
  // Search
  html+='<div class="search-row">';
  html+='<div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" placeholder="Search concepts..." value="'+escHtml(state.search)+'" oninput="setState({search:this.value})"></div>';
  html+='<button class="btn'+(state.showFavOnly?' active':'')+'" onclick="setState({showFavOnly:!state.showFavOnly})">★ Favs</button>';
  if(state.selectedCat) html+='<button class="btn" onclick="setState({selectedCat:null})">⌂ All</button>';
  if(q) html+='<span style="font-size:11px;color:#64748b">'+totalFiltered+' found</span>';
  html+='</div></div></div>';

  html+='<div class="content">';

  // Category grid
  if(!state.selectedCat&&!q&&!state.showFavOnly){
    html+='<div class="cat-grid">';
    CATEGORIES.forEach(function(cat){
      html+='<div class="cat-card" style="border-left:3px solid '+cat.color+'" onclick="setState({selectedCat:\''+cat.id+'\'})">';
      html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">'+cat.icon+'</span><div class="cat-name">'+cat.name+'</div></div>';
      html+='<div class="cat-count">'+cat.topics.length+' topics</div>';
      html+='<div class="cat-tags">';
      cat.topics.slice(0,2).forEach(function(t){
        html+='<span class="cat-tag" style="background:'+cat.color+'18;color:'+cat.color+'">'+t.name+'</span>';
      });
      if(cat.topics.length>2) html+='<span style="font-size:9px;color:#64748b;padding:2px 4px">+'+(cat.topics.length-2)+'</span>';
      html+='</div></div>';
    });
    html+='</div>';
  }

  // Topics
  var catsToShow=state.selectedCat||q||state.showFavOnly?filteredCats:[];
  catsToShow.forEach(function(cat){
    if(state.selectedCat&&cat.id!==state.selectedCat)return;
    html+='<div class="section-head"><span style="font-size:18px">'+cat.icon+'</span><span class="section-title" style="color:'+cat.color+'">'+cat.name+'</span><span class="section-badge">'+cat.topics.length+'</span></div>';
    html+='<div class="topic-list">';
    cat.topics.forEach(function(topic){
      var expanded=state.expandedTopics[topic.id];
      var isFav=state.favorites[topic.id];
      html+='<div class="topic-card'+(expanded?' expanded':'')+'"'+(expanded?' style="border-color:'+cat.color+'66"':'')+'>';
      // Head
      html+='<div class="topic-head" onclick="setState({expandedTopics:Object.assign({},state.expandedTopics,{\''+topic.id+'\':!state.expandedTopics[\''+topic.id+'\']})})">';
      html+='<div class="topic-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+cat.color+'" stroke-width="2"><polyline points="'+(expanded?'6 9 12 15 18 9':'9 18 15 12 9 6')+'"/></svg></div>';
      html+='<div class="topic-body">';
      html+='<div class="topic-title-row"><span class="topic-name">'+topic.name+'</span>';
      html+='<button class="topic-fav" onclick="event.stopPropagation();setState({favorites:Object.assign({},state.favorites,{\''+topic.id+'\':!state.favorites[\''+topic.id+'\']})})" style="color:'+(isFav?C.orange:C.textDim)+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="'+(isFav?C.orange:'none')+'" stroke="'+(isFav?C.orange:C.textDim)+'" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>';
      if(topic.viz) html+='<span class="badge-interactive">INTERACTIVE</span>';
      html+='</div>';
      html+='<p class="topic-quick">'+escHtml(topic.quick)+'</p>';
      if(topic.formula&&!expanded) html+='<code class="topic-formula-mini" style="color:'+cat.color+'">'+escHtml(topic.formula)+'</code>';
      html+='</div></div>';
      // Expanded
      if(expanded){
        html+='<div class="topic-detail">';
        if(topic.formula){
          html+='<div class="formula-box" style="background:'+cat.color+'11;border:1px solid '+cat.color+'33">';
          html+='<div class="formula-label" style="color:'+cat.color+'">KEY FORMULA</div>';
          html+='<code class="formula-code">'+escHtml(topic.formula)+'</code>';
          html+='</div>';
        }
        html+='<div class="detail-text">';
        topic.detail.split('\n').forEach(function(line){
          if(line.indexOf('→')===0) html+='<div class="arrow"><span style="color:'+cat.color+'">→</span>'+escHtml(line.slice(1))+'</div>';
          else if(line.match(/^\d+\./)) html+='<div class="numbered">'+escHtml(line)+'</div>';
          else if(line.trim()==='') html+='<div class="spacer"></div>';
          else html+='<div>'+escHtml(line)+'</div>';
        });
        html+='</div>';
        if(topic.viz&&VIZ_MAP[topic.viz]){
          html+='<div class="viz-box"><div class="viz-label">▶ INTERACTIVE</div>'+VIZ_MAP[topic.viz]()+'</div>';
        }
        if(topic.tags){
          html+='<div class="tag-list">';
          topic.tags.forEach(function(tag){
            html+='<span class="tag" onclick="setState({search:\''+tag+'\'})\">#'+tag+'</span>';
          });
          html+='</div>';
        }
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  });

  // Empty
  if(q&&totalFiltered===0){
    html+='<div class="empty"><div style="font-size:40px;margin-bottom:12px">🔍</div><p style="font-size:15px">No results for "'+escHtml(q)+'"</p><p style="font-size:12px;margin-top:6px">Try a different keyword</p></div>';
  }

  html+='<div class="footer">Data Science Mastery · '+totalTopics+' concepts</div>';
  html+='</div>'; // content

  document.getElementById('app').innerHTML=html;
}

render();
</script>
</body>
</html>
