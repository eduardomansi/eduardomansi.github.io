function renderKMeans(){
  var W=300,H=220,pad={l:30,r:10,t:10,b:20};
  var k=state.kmK, iter=state.kmIter;
  var colors=[C.cyan,C.orange,C.pink,C.green,C.purple];
  function seeded(s){return function(){s=(s*16807)%2147483647;return(s-1)/2147483646;};}
  var r1=seeded(42);
  var centers=[[2,2],[6,7],[9,3],[4,9],[8,8]];
  var basePts=[];
  for(var i=0;i<60;i++){var ci=centers[i%5];basePts.push({x:ci[0]+(r1()-0.5)*3,y:ci[1]+(r1()-0.5)*3});}
  var r2=seeded(123);
  var cents=[];for(var j=0;j<k;j++)cents.push({x:r2()*10,y:r2()*10});
  var assigned=basePts.map(function(p){return{x:p.x,y:p.y,c:0};});
  for(var it=0;it<=iter;it++){
    assigned=basePts.map(function(p){
      var minD=1e9,best=0;
      cents.forEach(function(c,ci){var d=(p.x-c.x)*(p.x-c.x)+(p.y-c.y)*(p.y-c.y);if(d<minD){minD=d;best=ci;}});
      return{x:p.x,y:p.y,c:best};
    });
    var nc=cents.map(function(_,ci){
      var cl=assigned.filter(function(p){return p.c===ci;});
      if(!cl.length)return cents[ci];
      return{x:cl.reduce(function(s,p){return s+p.x;},0)/cl.length, y:cl.reduce(function(s,p){return s+p.y;},0)/cl.length};
    });
    cents=nc;
  }
  function px(p){return [mapRange(p.x,0,11,pad.l,W-pad.r),mapRange(p.y,0,11,H-pad.b,pad.t)];}
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,5);
  var dots='';
  assigned.forEach(function(p){var pt=px(p);dots+=circle(pt[0],pt[1],4,colors[p.c]+'cc','none',0);});
  cents.forEach(function(c,i){var pt=px(c);dots+='<rect x="'+(pt[0]-5)+'" y="'+(pt[1]-5)+'" width="10" height="10" transform="rotate(45 '+pt[0]+' '+pt[1]+')" fill="#fff" stroke="'+colors[i]+'" stroke-width="2.5"/>';});
  var html='<div class="slider-row">';
  html+='<label class="slider-label">k = <span class="slider-val" style="color:'+C.accent+'">'+k+'</span><br><input type="range" min="2" max="5" value="'+k+'" onchange="setState({kmK:+this.value,kmIter:0})"></label>';
  html+='<button class="viz-btn primary" onclick="setState({kmIter:Math.min(state.kmIter+1,15)})">&#9654; Iterate</button> ';
  html+='<button class="viz-btn secondary" onclick="setState({kmIter:0})">&#8634; Reset</button> ';
  html+='<span style="font-size:12px;color:#94a3b8">Iter: '+iter+'</span>';
  html+='</div>';
  html+=svgChart(W,H,grid+dots);
  return html;
}

function renderDecisionTree(){
  var age=state.dtAge, inc=state.dtIncome;
  var result,path;
  if(age<25){result=inc>40?'Yes':'No';path=age<25&&inc>40?'Age<25 \u2192 Income>40k \u2192 Approve':'Age<25 \u2192 Income\u226440k \u2192 Deny';}
  else if(age<50){result=inc>30?'Yes':'No';path=inc>30?'25\u2264Age<50 \u2192 Income>30k \u2192 Approve':'25\u2264Age<50 \u2192 Income\u226430k \u2192 Deny';}
  else{result=inc>50?'Yes':'No';path=inc>50?'Age\u226550 \u2192 Income>50k \u2192 Approve':'Age\u226550 \u2192 Income\u226450k \u2192 Deny';}
  var activeNode=age<25?0:age<50?1:2;
  function ns(active){return 'tree-node" style="background:'+(active?C.accent+'33':C.surfaceLight)+';border:2px solid '+(active?C.accent:C.border)+';color:'+(active?C.accentLight:C.textMuted)+';font-weight:'+(active?700:400);}
  var html='<div class="slider-row">';
  html+='<label class="slider-label">Age: <span class="slider-val" style="color:'+C.cyan+'">'+age+'</span><br><input type="range" min="18" max="70" value="'+age+'" onchange="setState({dtAge:+this.value})"></label>';
  html+='<label class="slider-label">Income $k: <span class="slider-val" style="color:'+C.green+'">'+inc+'</span><br><input type="range" min="15" max="100" value="'+inc+'" onchange="setState({dtIncome:+this.value})"></label>';
  html+='</div>';
  html+='<div class="tree-nodes">';
  html+='<div class="'+ns(true)+'">Age?</div>';
  html+='<div style="color:#64748b;font-size:11px">\u2193</div>';
  html+='<div class="tree-branches">';
  html+='<div class="'+ns(activeNode===0)+'">< 25</div>';
  html+='<div class="'+ns(activeNode===1)+'">25-49</div>';
  html+='<div class="'+ns(activeNode===2)+'">\u2265 50</div>';
  html+='</div>';
  html+='<div style="color:#64748b;font-size:11px">\u2193 Income</div>';
  var rc=result==='Yes'?C.green:C.red;
  html+='<div class="tree-result" style="background:'+rc+'33;border:2px solid '+rc+';color:'+rc+'">'+(result==='Yes'?'\u2713 Approve':'\u2717 Deny')+'</div>';
  html+='</div>';
  html+='<div style="margin-top:12px;font-size:12px;color:#94a3b8;background:#0f1117;padding:8px;border-radius:6px">Path: '+path+'</div>';
  return html;
}

function renderActivation(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var fn=state.actFn;
  var fns={relu:{name:'ReLU',f:function(x){return Math.max(0,x);},color:C.cyan},sigmoid:{name:'Sigmoid',f:function(x){return 1/(1+Math.exp(-x));},color:C.green},tanh:{name:'Tanh',f:function(x){return Math.tanh(x);},color:C.orange},leaky:{name:'Leaky ReLU',f:function(x){return x>0?x:0.1*x;},color:C.pink}};
  var cur=fns[fn];
  var pts=[];var minY=fn==='sigmoid'?0:-1.5;var maxY=fn==='sigmoid'?1:fn==='tanh'?1.2:5;
  for(var x=-5;x<=5;x+=0.15){var y=cur.f(x);pts.push([x,y]);}
  if(fn==='relu'||fn==='leaky')maxY=5.5;
  function px(p){return [mapRange(p[0],-5,5,pad.l,W-pad.r),mapRange(p[1],minY,maxY,H-pad.b,pad.t)];}
  var svgPts=pts.map(px);
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var html='<div class="act-btns">';
  Object.keys(fns).forEach(function(k){
    var v=fns[k];
    var active=fn===k;
    html+='<button class="act-btn" style="background:'+(active?v.color+'33':C.surfaceLight)+';border-color:'+(active?v.color:C.border)+';color:'+(active?v.color:C.textMuted)+';font-weight:'+(active?600:400)+'" onclick="setState({actFn:\''+k+'\'})">'+v.name+'</button>';
  });
  html+='</div>';
  html+=svgChart(W,H,grid+polyline(svgPts,cur.color,2.5));
  return html;
}

function renderRegularization(){
  var W=320,H=180,pad={l:35,r:10,t:10,b:24};
  var lam=state.regLambda;
  var pts1=[],pts2=[];
  for(var x=-3;x<=3;x+=0.12){
    var nr=0.5*x*x*x-2*x+0.3*Math.sin(5*x);
    var wr=0.5*x*x*x/(1+lam*2)-2*x/(1+lam)+0.3*Math.sin(5*x)/(1+lam*5);
    pts1.push([x,nr]);pts2.push([x,wr]);
  }
  var allY=pts1.concat(pts2).map(function(p){return p[1];});
  var minY=Math.min.apply(null,allY)-0.5, maxY=Math.max.apply(null,allY)+0.5;
  function px(p){return [mapRange(p[0],-3,3,pad.l,W-pad.r),mapRange(p[1],minY,maxY,H-pad.b,pad.t)];}
  var grid=gridLines(pad.l,pad.t,W-pad.r,H-pad.b,5,4);
  var leg=legendItem(pad.l+10,pad.t+4,C.red,'No Reg')+legendItem(pad.l+80,pad.t+4,C.purple,'With Reg');
  var html='<div class="slider-row">';
  html+='<label class="slider-label">\u03BB: <span class="slider-val" style="color:'+C.purple+'">'+lam.toFixed(2)+'</span><br><input type="range" min="0" max="3" step="0.1" value="'+lam+'" onchange="setState({regLambda:+this.value})"></label>';
  html+='</div>';
  html+=svgChart(W,H,grid+leg+polyline(pts1.map(px),C.red,1.5,'5 5')+polyline(pts2.map(px),C.purple,2.5));
  return html;
}

function renderCrossVal(){
  var k=state.cvK, active=state.cvActive;
  if(active>=k) active=0;
  var html='<div class="slider-row">';
  html+='<label class="slider-label">k = <span class="slider-val" style="color:'+C.accent+'">'+k+'</span><br><input type="range" min="3" max="10" value="'+k+'" onchange="setState({cvK:+this.value,cvActive:0})"></label>';
  html+='</div>';
  for(var fold=0;fold<k;fold++){
    var opacity=fold===active?1:0.35;
    html+='<div class="cv-row" onclick="setState({cvActive:'+fold+'})" style="opacity:'+opacity+'">';
    html+='<span class="cv-label">Fold '+(fold+1)+'</span>';
    html+='<div class="cv-blocks">';
    for(var j=0;j<k;j++){
      var isTest=j===fold;
      html+='<div class="cv-block" style="background:'+(isTest?C.orange+'88':C.accent+'44')+';border:1px solid '+(isTest?C.orange:C.accent)+'33;color:'+(isTest?C.orange:C.accentLight)+'">'+(isTest?'TEST':'TRAIN')+'</div>';
    }
    html+='</div></div>';
  }
  html+='<div style="margin-top:8px;font-size:12px;color:#94a3b8">Tap a fold to highlight.</div>';
  return html;
}

var VIZ_MAP={
  normalDist:renderNormalDist,
  biasVariance:renderBiasVariance,
  roc:renderROC,
  gradientDescent:renderGradientDescent,
  confusionMatrix:renderConfusionMatrix,
  kmeans:renderKMeans,
  decisionTree:renderDecisionTree,
  activation:renderActivation,
  regularization:renderRegularization,
  crossVal:renderCrossVal,
};

// ─── Render ─────────────────────────────────────────
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function initHeader(){
  var totalTopics=CATEGORIES.reduce(function(s,c){return s+c.topics.length;},0);
  var hdr=document.getElementById('header');
  hdr.className='header';
  var html='<div class="header-inner">';
  html+='<div class="logo-row"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><line x1="12" y1="17" x2="12" y2="22"/><line x1="8" y1="20" x2="16" y2="20"/></svg></div><div><div class="logo-title">Data Science Mastery</div><div class="logo-sub">'+totalTopics+' concepts \u00B7 Interactive</div></div></div>';
  html+='<div class="search-row">';
  html+='<div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="searchInput" type="text" placeholder="Search concepts..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>';
  html+='<button id="favBtn" class="btn">&#9733; Favs</button>';
  html+='<span id="headerExtra"></span>';
  html+='</div></div>';
  hdr.innerHTML=html;

  // Attach event listeners (persistent, not re-created)
  document.getElementById('searchInput').addEventListener('input',function(e){
    state.search=e.target.value;
    renderContent();
  });
  document.getElementById('favBtn').addEventListener('click',function(){
    state.showFavOnly=!state.showFavOnly;
    updateHeaderState();
    renderContent();
  });
}

function updateHeaderState(){
  var favBtn=document.getElementById('favBtn');
  if(favBtn){
    if(state.showFavOnly){favBtn.className='btn active';}
    else{favBtn.className='btn';}
  }
  var extra=document.getElementById('headerExtra');
  if(extra){
    var h='';
    if(state.selectedCat) h+='<button class="btn" onclick="setState({selectedCat:null})">\u2302 All</button> ';
    var q=state.search.toLowerCase().trim();
    if(q){
      var totalFiltered=CATEGORIES.reduce(function(s,c){return s+c.topics.filter(function(t){
        if(state.showFavOnly&&!state.favorites[t.id])return false;
        return t.name.toLowerCase().indexOf(q)!==-1||t.quick.toLowerCase().indexOf(q)!==-1||(t.tags||[]).some(function(tag){return tag.toLowerCase().indexOf(q)!==-1;})||t.detail.toLowerCase().indexOf(q)!==-1;
      }).length;},0);
      h+='<span style="font-size:11px;color:#64748b">'+totalFiltered+' found</span>';
    }
    extra.innerHTML=h;
  }
}

function renderContent(){
  var q=state.search.toLowerCase().trim();
  var filteredCats=CATEGORIES.map(function(cat){
    var topics=cat.topics.filter(function(t){
      if(state.showFavOnly&&!state.favorites[t.id])return false;
      if(!q)return true;
      return t.name.toLowerCase().indexOf(q)!==-1||t.quick.toLowerCase().indexOf(q)!==-1||(t.tags||[]).some(function(tag){return tag.toLowerCase().indexOf(q)!==-1;})||t.detail.toLowerCase().indexOf(q)!==-1;
    });
    return{id:cat.id,name:cat.name,icon:cat.icon,color:cat.color,topics:topics};
  }).filter(function(cat){return cat.topics.length>0;});

  var totalTopics=CATEGORIES.reduce(function(s,c){return s+c.topics.length;},0);
  var totalFiltered=filteredCats.reduce(function(s,c){return s+c.topics.length;},0);

  updateHeaderState();

  var html='<div class="content">';

  // Category grid
  if(!state.selectedCat&&!q&&!state.showFavOnly){
    html+='<div class="cat-grid">';
    CATEGORIES.forEach(function(cat){
      html+='<div class="cat-card" style="border-left:3px solid '+cat.color+'" onclick="setState({selectedCat:\''+cat.id+'\'})">';
      html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:18px">'+cat.icon+'</span><div class="cat-name">'+cat.name+'</div></div>';
      html+='<div class="cat-count">'+cat.topics.length+' topics</div>';
      html+='<div class="cat-tags">';
      cat.topics.slice(0,2).forEach(function(t){
        html+='<span class="cat-tag" style="background:'+cat.color+'18;color:'+cat.color+'">'+t.name+'</span>';
      });
      if(cat.topics.length>2) html+='<span style="font-size:9px;color:#64748b;padding:2px 4px">+'+(cat.topics.length-2)+'</span>';
      html+='</div></div>';
    });
    html+='</div>';
  }

  // Topics
  var catsToShow=state.selectedCat||q||state.showFavOnly?filteredCats:[];
  catsToShow.forEach(function(cat){
    if(state.selectedCat&&cat.id!==state.selectedCat)return;
    html+='<div class="section-head"><span style="font-size:18px">'+cat.icon+'</span><span class="section-title" style="color:'+cat.color+'">'+cat.name+'</span><span class="section-badge">'+cat.topics.length+'</span></div>';
    html+='<div class="topic-list">';
    cat.topics.forEach(function(topic){
      var expanded=state.expandedTopics[topic.id];
      var isFav=state.favorites[topic.id];
      html+='<div class="topic-card'+(expanded?' expanded':'')+'"'+(expanded?' style="border-color:'+cat.color+'66"':'')+'>';
      html+='<div class="topic-head" onclick="setState({expandedTopics:Object.assign({},state.expandedTopics,{\''+topic.id+'\':!state.expandedTopics[\''+topic.id+'\']})})">';
      html+='<div class="topic-chevron"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="'+cat.color+'" stroke-width="2"><polyline points="'+(expanded?'6 9 12 15 18 9':'9 18 15 12 9 6')+'"/></svg></div>';
      html+='<div class="topic-body">';
      html+='<div class="topic-title-row"><span class="topic-name">'+topic.name+'</span>';
      html+='<button class="topic-fav" onclick="event.stopPropagation();setState({favorites:Object.assign({},state.favorites,{\''+topic.id+'\':!state.favorites[\''+topic.id+'\']})})" style="color:'+(isFav?C.orange:C.textDim)+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="'+(isFav?C.orange:'none')+'" stroke="'+(isFav?C.orange:C.textDim)+'" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg></button>';
      if(topic.viz) html+='<span class="badge-interactive">INTERACTIVE</span>';
      html+='</div>';
      html+='<p class="topic-quick">'+escHtml(topic.quick)+'</p>';
      if(topic.formula&&!expanded) html+='<code class="topic-formula-mini" style="color:'+cat.color+'">'+escHtml(topic.formula)+'</code>';
      html+='</div></div>';
      if(expanded){
        html+='<div class="topic-detail">';
        if(topic.formula){
          html+='<div class="formula-box" style="background:'+cat.color+'11;border:1px solid '+cat.color+'33">';
          html+='<div class="formula-label" style="color:'+cat.color+'">KEY FORMULA</div>';
          html+='<code class="formula-code">'+escHtml(topic.formula)+'</code>';
          html+='</div>';
        }
        html+='<div class="detail-text">';
        topic.detail.split('\n').forEach(function(line){
          if(line.indexOf('\u2192')===0) html+='<div class="arrow"><span style="color:'+cat.color+'">\u2192</span>'+escHtml(line.slice(1))+'</div>';
          else if(line.match(/^\d+\./)) html+='<div class="numbered">'+escHtml(line)+'</div>';
          else if(line.trim()==='') html+='<div class="spacer"></div>';
          else html+='<div>'+escHtml(line)+'</div>';
        });
        html+='</div>';
        if(topic.viz&&VIZ_MAP[topic.viz]){
          html+='<div class="viz-box"><div class="viz-label">&#9654; INTERACTIVE</div>'+VIZ_MAP[topic.viz]()+'</div>';
        }
        if(topic.tags){
          html+='<div class="tag-list">';
          topic.tags.forEach(function(tag){
            html+='<span class="tag" onclick="document.getElementById(\'searchInput\').value=\''+tag+'\';setSearch(\''+tag+'\')">#'+tag+'</span>';
          });
          html+='</div>';
        }
        html+='</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  });

  if(q&&totalFiltered===0){
    html+='<div class="empty"><div style="font-size:40px;margin-bottom:12px">\u{1F50D}</div><p style="font-size:15px">No results for "'+escHtml(q)+'"</p><p style="font-size:12px;margin-top:6px">Try a different keyword</p></div>';
  }

  html+='<div class="footer">Data Science Mastery \u00B7 '+totalTopics+' concepts</div>';
  html+='</div>';

  document.getElementById('content').innerHTML=html;
}

function render(){renderContent();}

// ─── Init ───────────────────────────────────────────
initHeader();
renderContent();
</script>
</body>
</html>
