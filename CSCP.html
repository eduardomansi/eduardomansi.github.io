/* ================= GLOSSARY ================= */
const g = (term,def)=>GLOSSARY.push({term,def});
g("ABC analysis","Ranking of items by annual dollar volume into A (highest value, tightest control), B (mid), and C (lowest value, loosest control) classes.");
g("Agile supply chain","A chain designed for rapid response to customer demands and market changes, often combining responsive + risk-hedging approaches.");
g("APS","Advanced Planning & Scheduling — constraint-based planning of demand, supply, and capacity using optimization.");
g("ATP","Available-to-Promise — quantity of supply uncommitted to customer orders; used to promise new orders.");
g("Autonomation (Jidoka)","Ability of a process to detect defects and stop automatically so problems are not passed on.");
g("Backward integration","Acquiring or controlling an upstream supplier.");
g("Balanced Scorecard","Kaplan & Norton framework measuring Financial, Customer, Internal Process, and Learning & Growth performance.");
g("BATNA","Best Alternative To a Negotiated Agreement — the walkaway option that anchors negotiation power.");
g("Benchmarking","Comparing KPIs and practices against internal, competitive, functional, or generic best-in-class references.");
g("BIA","Business Impact Analysis — identifies critical processes and quantifies disruption impact over time.");
g("Bill of Lading (BOL)","Contract of carriage issued by a carrier, serving also as a receipt and (if negotiable) a document of title.");
g("Blockchain","Distributed, immutable ledger technology used for provenance, smart contracts, and reducing counterfeits.");
g("Bottleneck","The resource whose capacity limits the throughput of the system; target of TOC.");
g("BOPIS","Buy Online, Pick up In-Store — omni-channel fulfillment using store inventory.");
g("Bullwhip effect","Amplification of demand variability as it moves upstream in the supply chain.");
g("Business continuity plan (BCP)","Documented process to keep critical operations running through and recovering from disruption.");
g("Cash-to-cash cycle","DIO + DSO − DPO — measures working capital tied up in operations.");
g("Carrying cost","Inventory holding cost: capital cost + storage + insurance + obsolescence, typically 20–30% of item value per year.");
g("Cat. strategy (category)","Coordinated approach for managing a group of related purchased items using portfolio analysis (e.g., Kraljic).");
g("CIF","Cost, Insurance and Freight — sea-only Incoterm where seller pays freight + insurance to destination port; risk transfers at origin port.");
g("CIP","Carriage and Insurance Paid — any-mode Incoterm; seller carriage + insurance to named destination; risk transfers at first carrier.");
g("CLM","Contract Lifecycle Management — authoring, negotiation, execution, and monitoring of contracts.");
g("Closed-loop supply chain","Network designed to support both forward and reverse flows as an integrated system.");
g("Collaborative transportation mgmt (CTM)","Shipper-carrier collaboration to share plans and optimize loads, routes, and assets.");
g("Concurrent engineering","Cross-functional design involving suppliers early to reduce time, cost, and quality problems.");
g("Contingency reserve","Budget or time reserved for known risks with quantified impact and probability.");
g("Control tower","Centralized end-to-end visibility, exception management, and decision-support platform for the supply chain.");
g("COSO ERM","Enterprise Risk Management framework from the Committee of Sponsoring Organizations.");
g("CPFR","Collaborative Planning, Forecasting and Replenishment — shared forecasts and replenishment with partners.");
g("CRM","Customer Relationship Management — integrated people, process, and technology to manage customer interactions.");
g("Cross-docking","Transfer of inbound freight directly to outbound with little or no storage.");
g("CTPAT","US Customs-Trade Partnership Against Terrorism — trusted-trader security program.");
g("Cycle counting","Ongoing counting of a portion of inventory each period rather than one annual count.");
g("DAP","Delivered At Place — Incoterm; seller delivers ready for unloading at named destination.");
g("DBR","Drum-Buffer-Rope — TOC scheduling: constraint is the drum, buffers protect it, rope synchronizes release.");
g("DDP","Delivered Duty Paid — Incoterm; seller's maximum obligation.");
g("Decoupling point","The point in the supply chain where forecast-driven push meets order-driven pull.");
g("Delphi method","Structured, iterative, anonymous expert forecasting to reach consensus.");
g("Demand management","Process of planning, communicating, influencing, and prioritizing demand.");
g("DFM / DFA / DFX","Design for Manufacturing / Assembly / (any X) — designing to ease production, service, or other objectives.");
g("DIO / DSO / DPO","Days Inventory Outstanding / Days Sales Outstanding / Days Payable Outstanding.");
g("Digital twin","Virtual replica of physical asset or process used for simulation and optimization.");
g("DMAIC","Six Sigma improvement cycle: Define, Measure, Analyze, Improve, Control.");
g("DPMO","Defects Per Million Opportunities — Six Sigma measure (≤3.4 at six-sigma level).");
g("DRP","Distribution Requirements Planning — extends MRP logic to the distribution network.");
g("EDI","Electronic Data Interchange — structured, computer-to-computer business message exchange.");
g("EMV","Expected Monetary Value — Σ probability × impact.");
g("EOQ","Economic Order Quantity = √(2DS/H); balances ordering vs. holding cost.");
g("EPR","Extended Producer Responsibility — producer is accountable for product end-of-life.");
g("ERP","Enterprise Resource Planning — integrated transactional system of record.");
g("ETO","Engineer-to-Order — design after receipt of customer order.");
g("EXW","Ex Works — Incoterm; seller's minimum obligation.");
g("FCPA","US Foreign Corrupt Practices Act — prohibits bribery of foreign officials.");
g("FEFO / FIFO / LIFO","First-Expired-First-Out / First-In-First-Out / Last-In-First-Out inventory rotation.");
g("Fill rate","Units (or orders) shipped from stock ÷ units ordered.");
g("FOB","Free On Board — sea/waterway Incoterm; risk transfers when goods on board at origin port.");
g("FTZ","Free Trade Zone — secure area where duties are deferred until goods leave the zone to home market.");
g("Gainsharing","Incentive agreement where parties share benefits from cost reductions / improvements.");
g("GDPR","EU General Data Protection Regulation — personal data protection and rights.");
g("GRI","Global Reporting Initiative — sustainability reporting standards.");
g("Hedging","Financial/operational techniques to mitigate exposure to risk (e.g., FX forward, dual sourcing).");
g("Heijunka","Level loading / mix — smoothing production to enable JIT.");
g("HS code","Harmonized System — international product classification code for customs duties.");
g("Incoterms","ICC international trade terms defining buyer/seller responsibilities.");
g("Intermodal","Container movement across two or more modes without re-handling product.");
g("IoT","Internet of Things — connected sensors and devices.");
g("ISO 9001 / 14001 / 31000 / 27001 / 28000","Quality / Environmental / Risk / Information Security / Supply Chain Security management standards.");
g("JIT","Just-In-Time — produce/deliver only what is needed when needed.");
g("Kaizen / Kaikaku","Small continuous improvement / radical transformation.");
g("Kanban","Visual pull signal authorizing production or replenishment.");
g("Kraljic matrix","Sourcing portfolio framework with profit impact × supply risk quadrants.");
g("Landed cost","All costs to deliver goods at destination: price + freight + duties + insurance + handling.");
g("LCA","Life Cycle Assessment — cradle-to-grave environmental impact analysis.");
g("Lead time","Elapsed time between initiation and completion (purchase LT, manufacturing LT, customer LT).");
g("Lean","Philosophy focused on eliminating waste and maximizing customer value through flow and pull.");
g("LTL","Less-than-Truckload — freight consolidated from multiple shippers.");
g("Make-to-order (MTO)","Produce only after receiving customer order; minimal finished-goods inventory.");
g("Make-to-stock (MTS)","Produce to forecast, hold finished goods for immediate fulfillment.");
g("MAD / MSE / MAPE","Forecast error metrics — Mean Absolute Deviation / Mean Squared Error / Mean Absolute Percentage Error.");
g("Master data","Core reference data: items, BOMs, customers, suppliers, locations.");
g("MPS","Master Production Schedule — end-item schedule driving MRP.");
g("MRP","Material Requirements Planning — explodes MPS through BOM to plan component orders.");
g("NPS","Net Promoter Score = % promoters − % detractors.");
g("OEE","Overall Equipment Effectiveness = Availability × Performance × Quality.");
g("OTIF","On-Time In-Full — delivery performance metric.");
g("Perfect order","OTIF + damage-free + correctly documented.");
g("Periodic review (P-model)","Inventory system with fixed review interval and order-up-to level.");
g("Planning fence","Time window within which MPS changes require authorization but may still be allowed.");
g("Poka-yoke","Mistake-proofing device or method preventing/detecting errors.");
g("Postponement","Delaying final product configuration until customer order is known to reduce inventory risk.");
g("PDCA","Plan-Do-Check-Act continuous improvement cycle.");
g("Push / Pull","Forecast-driven upstream (push) vs. customer-order-driven downstream (pull).");
g("Quick Response","Rapid replenishment method using POS data sharing (esp. fashion/retail).");
g("Rationing/shortage game","Supply chain behavior during shortages where orders are allocated by past sales; causes inflated ordering.");
g("RCCP","Rough-Cut Capacity Planning — validates MPS against critical resources.");
g("Resilience","Capacity to recover from disruption via redundancy, flexibility, visibility, partnerships.");
g("Return merchandise authorization (RMA)","Number/document authorizing a product return.");
g("RFID","Radio-frequency identification — tagged items automatically detected at readers.");
g("RFx","Sourcing solicitations: RFI, RFP, RFQ.");
g("Risk appetite","Level of risk an organization is willing to accept in pursuit of its objectives.");
g("Risk register","Catalog of identified risks with P, I, owner, response, triggers, status.");
g("ROP","Reorder Point = demand during lead time + safety stock.");
g("RPO / RTO","Recovery Point / Recovery Time Objective for business continuity.");
g("S&OP","Sales & Operations Planning — monthly, family-level demand/supply balancing process.");
g("Safety stock","Buffer against demand and lead-time variability = z · σ_LT.");
g("SCM control tower","Platform for end-to-end visibility, exception management, decision support.");
g("SCOR","Supply Chain Operations Reference model — Plan, Source, Make, Deliver, Return, Enable.");
g("Seasonal index","Avg demand in period ÷ overall average demand.");
g("Service-level factor (z)","Standard-normal multiplier chosen for desired service level (95% ≈ 1.65).");
g("Should-cost","Bottom-up cost model benchmarking what an item should cost.");
g("Six Sigma","Data-driven improvement methodology targeting ≤3.4 DPMO using DMAIC.");
g("SMED","Single-Minute Exchange of Dies — setup-time reduction methodology.");
g("SOX","Sarbanes-Oxley Act — US financial reporting controls.");
g("Spend analysis","Categorized summary and ranking of spending (often Pareto).");
g("SRM","Supplier Relationship Management.");
g("Sustainable development","Development meeting present needs without compromising future generations.");
g("SWOT","Strengths, Weaknesses, Opportunities, Threats.");
g("TCO","Total Cost of Ownership — acquisition + ownership + disposal over asset life.");
g("TMS","Transportation Management System.");
g("TOC","Theory of Constraints — manage throughput by focusing on the bottleneck.");
g("Triple Bottom Line","People, Planet, Profit measurement of sustainability.");
g("Utilization","Actual output ÷ design capacity.");
g("Value stream map (VSM)","Lean tool mapping material and information flow to expose waste.");
g("VMI","Vendor-Managed Inventory — supplier decides replenishment based on shared data.");
g("VoC","Voice of the Customer — systematic capture of customer preferences and expectations.");
g("WMS","Warehouse Management System.");
g("Yield management","Dynamic pricing/availability to maximize revenue (airlines, hotels).");
g("YMS","Yard Management System — manages trailers and containers in the yard.");
g("Takt time","Available production time ÷ customer demand rate — the pace at which units must be produced to match demand.");
g("3PL / 4PL","Third-party / fourth-party logistics providers.");
g("WEEE","EU Waste Electrical and Electronic Equipment directive requiring take-back/recycling.");
g("RoHS","EU Restriction of Hazardous Substances in electronics.");
g("C-TPAT / AEO","Trusted-trader programs (US / EU) accelerating customs clearance.");
g("Dodd-Frank §1502","US law requiring disclosure of conflict minerals (3TG) sourcing.");
g("UN SDGs","17 Sustainable Development Goals (2015–2030) spanning social, economic, environmental targets.");
g("GHG Protocol","Standard for corporate greenhouse-gas accounting (Scopes 1, 2, 3).");
g("Scope 1/2/3 emissions","Direct / indirect from purchased energy / value chain (including suppliers and product use) emissions.");
g("Omni-channel","Integrated customer experience across physical, digital, and mobile channels with unified inventory.");
g("FMEA","Failure Mode and Effects Analysis — risk/quality tool rating Severity × Occurrence × Detection.");
g("Pareto principle","80-20 rule — most effects come from a few causes.");
g("Ishikawa / fishbone","Cause-and-effect diagram for root-cause analysis.");
g("Statistical Process Control (SPC)","Control-chart-based monitoring of process variation.");
g("Cp / Cpk","Process capability indexes — process spread vs. spec limits; Cpk accounts for centering.");
g("Hoshin Kanri","Policy deployment aligning strategy to daily work.");
g("Heuristic","Rule-of-thumb solution used when exact optimization is impractical.");

</script>
<script id="app-script">
/* =============== APP LOGIC =============== */
const LS_KEY = "cscp_app_v1";
const state = Object.assign({
  moduleRead: {},          // moduleId -> bool
  quizScores: {},          // moduleId -> {best, last, attempts}
  mockBest: null,
  flashSeen: {},
  flashKnown: {},
  activeModule: "m1",
  activeQuizModule: "m1",
  activeFlashFilter: "all",
}, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));

const save = () => localStorage.setItem(LS_KEY, JSON.stringify(state));

/* ---------- Tab Navigation ---------- */
document.querySelectorAll("#mainTabs button").forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll("#mainTabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    const v = document.getElementById("view-"+b.dataset.view);
    v.classList.add("active");
    renderView(b.dataset.view);
    window.scrollTo({top:0,behavior:"smooth"});
  };
});

function renderView(v){
  if(v==="dashboard") renderDashboard();
  if(v==="modules") renderModules();
  if(v==="flashcards") renderFlashcards();
  if(v==="quiz") renderQuiz();
  if(v==="mock") renderMock();
  if(v==="diagrams") renderDiagrams();
  if(v==="glossary") renderGlossary();
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const totalFlash = FLASHCARDS.length;
  const known = Object.values(state.flashKnown).filter(Boolean).length;
  const totalQ = Object.values(QUIZZES).reduce((a,b)=>a+b.length,0);
  const modulesDone = Object.values(state.moduleRead).filter(Boolean).length;
  const bestScores = MODULES.map(m=>state.quizScores[m.id]?.best ?? null);
  const avgBest = bestScores.filter(x=>x!=null).reduce((a,b)=>a+b,0) / Math.max(1,bestScores.filter(x=>x!=null).length);
  const html = `
    <h2 class="section-title">Welcome back — let's get you CSCP-certified.</h2>
    <p class="lead">Track your progress across all 8 ECM modules, ${totalFlash} flashcards, ${totalQ} practice questions, and a 120-question mock exam.</p>
    <div class="grid cards-4" style="margin-bottom:22px">
      <div class="card stat-box"><b>${modulesDone}/8</b><span>Modules reviewed</span></div>
      <div class="card stat-box"><b>${known}/${totalFlash}</b><span>Flashcards learned</span></div>
      <div class="card stat-box"><b>${bestScores.filter(x=>x!=null).length>0 ? Math.round(avgBest)+"%" : "—"}</b><span>Avg. best quiz score</span></div>
      <div class="card stat-box"><b>${state.mockBest!=null ? state.mockBest+"%" : "—"}</b><span>Mock exam best</span></div>
    </div>
    <h3 style="margin:24px 0 10px">Modules</h3>
    <div class="grid cards-3">
      ${MODULES.map((m,i)=>{
        const done = !!state.moduleRead[m.id];
        const score = state.quizScores[m.id]?.best;
        const pct = done?100:(score?score:0);
        return `<div class="card" style="cursor:pointer" onclick="goModule('${m.id}')">
          <span class="pill mod${i+1}">Module ${i+1}</span>
          <h3 style="margin-top:8px">${m.title}</h3>
          <p style="margin-top:6px">${m.blurb}</p>
          <div class="progress"><div style="width:${pct}%"></div></div>
          <div class="row" style="margin-top:8px;font-size:.85rem;color:var(--mute)">
            <span>${done?"Reviewed ✓":"Not yet reviewed"}</span>
            ${score!=null?`· <span>Best quiz: ${score}%</span>`:""}
          </div>
        </div>`;
      }).join("")}
    </div>
    <h3 style="margin:24px 0 10px">Study plan — suggested path</h3>
    <div class="card">
      <ol>
        <li><b>Read each module</b> (use the <a href="#" onclick="switchTab('modules');return false;">Modules</a> tab) — open each collapsible section, focus on keyterms and formulas highlighted in color.</li>
        <li><b>Drill flashcards daily</b> (20–30/day). Use the module filter to focus on the chapter you just read.</li>
        <li><b>Take the module quiz</b> right after finishing the module. Aim for 80%+ before moving on.</li>
        <li><b>Study the diagrams</b> — SCOR, Kraljic, Porter 5F, Push/Pull, Bullwhip. Be able to sketch them from memory.</li>
        <li><b>Take the 120-question Mock Exam</b> once, cold, two weeks before your test. Review every miss.</li>
        <li><b>Re-run any quiz where you scored &lt; 80%</b> until you own the material.</li>
      </ol>
    </div>
    <h3 style="margin:24px 0 10px">Exam quick facts</h3>
    <div class="card">
      <table><tr><th>Format</th><td>150 multiple-choice questions (130 scored + 20 pretest); 3.5 hours</td></tr>
      <tr><th>Pass mark</th><td>Scaled score of 300 out of a 200–350 range (≈70% raw)</td></tr>
      <tr><th>Domains</th><td>Supply Chains, Demand & Forecasting · Global Networks · Sourcing · Internal Operations · Logistics · Relationships · Risk · Optimization/Sustainability/Tech</td></tr>
      <tr><th>Retake</th><td>Allowed; waiting periods apply between attempts</td></tr>
      <tr><th>Certification</th><td>Issued by ASCM (formerly APICS)</td></tr></table>
    </div>
  `;
  document.getElementById("view-dashboard").innerHTML = html;
}
function goModule(id){ state.activeModule = id; save(); switchTab("modules"); }
function switchTab(name){ document.querySelector(`#mainTabs button[data-view="${name}"]`).click(); }

/* ---------- Modules ---------- */
function renderModules(){
  const mod = MODULES.find(m=>m.id===state.activeModule) || MODULES[0];
  const tabs = MODULES.map(m=>`<button class="${m.id===mod.id?'active':''}" onclick="setModule('${m.id}')">${m.shortTitle}</button>`).join("");
  const sectionHtml = mod.sections.map(sec=>`
    <details ${sec.open?"open":""}>
      <summary>${sec.title}</summary>
      <div style="padding:8px 2px">${sec.body}</div>
    </details>`).join("");
  const done = !!state.moduleRead[mod.id];
  document.getElementById("view-modules").innerHTML = `
    <h2 class="section-title">${mod.title}</h2>
    <p class="lead">${mod.blurb}</p>
    <div class="module-tabs">${tabs}</div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn ${done?'good':''}" onclick="toggleRead('${mod.id}')">${done?"✓ Marked as reviewed":"Mark module as reviewed"}</button>
      <button class="btn ghost" onclick="state.activeQuizModule='${mod.id}';save();switchTab('quiz')">Take this module's quiz →</button>
      <button class="btn ghost" onclick="state.activeFlashFilter='${mod.id}';save();switchTab('flashcards')">Flashcards for this module →</button>
    </div>
    ${sectionHtml}
    <div class="row" style="margin-top:18px;justify-content:space-between">
      ${MODULES.indexOf(mod)>0?`<button class="btn ghost" onclick="setModule('${MODULES[MODULES.indexOf(mod)-1].id}')">← ${MODULES[MODULES.indexOf(mod)-1].shortTitle}</button>`:'<span></span>'}
      ${MODULES.indexOf(mod)<MODULES.length-1?`<button class="btn" onclick="setModule('${MODULES[MODULES.indexOf(mod)+1].id}')">${MODULES[MODULES.indexOf(mod)+1].shortTitle} →</button>`:''}
    </div>`;
}
function setModule(id){ state.activeModule=id; save(); renderModules(); window.scrollTo({top:0,behavior:"smooth"}); }
function toggleRead(id){ state.moduleRead[id]=!state.moduleRead[id]; save(); renderModules(); }

/* ---------- Flashcards ---------- */
let flashIdx = 0;
let flashDeck = [];
function renderFlashcards(){
  const filter = state.activeFlashFilter;
  flashDeck = (filter==="all")?[...FLASHCARDS]:FLASHCARDS.filter(c=>c.m===filter);
  if(!flashDeck.length){ flashDeck=[...FLASHCARDS]; state.activeFlashFilter="all"; }
  if(flashIdx>=flashDeck.length) flashIdx=0;
  const c = flashDeck[flashIdx];
  const filterOpts = ['<option value="all">All modules</option>'].concat(
    MODULES.map(m=>`<option value="${m.id}" ${filter===m.id?'selected':''}>${m.shortTitle}</option>`)
  ).join("");
  const known = Object.values(state.flashKnown).filter(Boolean).length;
  document.getElementById("view-flashcards").innerHTML = `
    <h2 class="section-title">Flashcards</h2>
    <p class="lead">${FLASHCARDS.length} cards across all modules · ${known} marked known. Click a card to flip; use the buttons to progress.</p>
    <div class="flash-toolbar">
      <select id="flashFilter" onchange="state.activeFlashFilter=this.value;flashIdx=0;save();renderFlashcards()">${filterOpts}</select>
      <button class="btn ghost" onclick="shuffleFlash()">Shuffle</button>
      <button class="btn ghost" onclick="prevFlash()">← Prev</button>
      <button class="btn" onclick="nextFlash()">Next →</button>
      <button class="btn good" onclick="markKnown(true)">✓ I know this</button>
      <button class="btn warn" onclick="markKnown(false)">Review again</button>
      <span style="color:var(--mute)">Card ${flashIdx+1} / ${flashDeck.length}</span>
    </div>
    <div class="flashcard ${state.flipped?'flipped':''}" id="flashcardEl" onclick="flipFlash()">
      <div class="face">
        <div class="front">
          <div>${c.q}</div>
          <small style="color:var(--mute);margin-top:8px;font-weight:400">${moduleLabel(c.m)} · click to flip</small>
        </div>
        <div class="back">
          <div>${c.a}</div>
          <small style="color:#a5f3fc;margin-top:8px">Press "I know this" to mark learned</small>
        </div>
      </div>
    </div>`;
}
function moduleLabel(id){ const m=MODULES.find(x=>x.id===id); return m?m.shortTitle:id; }
function flipFlash(){ document.getElementById("flashcardEl").classList.toggle("flipped"); }
function nextFlash(){ flashIdx=(flashIdx+1)%flashDeck.length; renderFlashcards(); }
function prevFlash(){ flashIdx=(flashIdx-1+flashDeck.length)%flashDeck.length; renderFlashcards(); }
function shuffleFlash(){ flashDeck.sort(()=>Math.random()-.5); flashIdx=0; renderFlashcards(); }
function markKnown(v){ const c=flashDeck[flashIdx]; state.flashKnown[c.id]=v; save(); nextFlash(); }

/* ---------- Quiz ---------- */
let quizState = { mod:"m1", idx:0, answers:{}, submitted:false };
function renderQuiz(){
  quizState.mod = state.activeQuizModule || "m1";
  const tabs = MODULES.map(m=>`<button class="${m.id===quizState.mod?'active':''}" onclick="setQuizMod('${m.id}')">${m.shortTitle} (${(QUIZZES[m.id]||[]).length})</button>`).join("");
  const qs = QUIZZES[quizState.mod] || [];
  const lastScore = state.quizScores[quizState.mod];
  let body;
  if(!qs.length){
    body = `<div class="card">No questions loaded for this module.</div>`;
  } else if(!quizState.submitted){
    body = qs.map((q,i)=>{
      const chosen = quizState.answers[i];
      const opts = q.options.map((o,oi)=>{
        const id = `q${i}o${oi}`;
        return `<label class="q-opt"><input type="radio" name="q${i}" value="${oi}" ${chosen===oi?'checked':''} onchange="quizState.answers[${i}]=${oi}"> <span>${String.fromCharCode(65+oi)}. ${o}</span></label>`;
      }).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div></div>`;
    }).join("") + `<div class="row" style="margin-top:10px"><button class="btn" onclick="submitQuiz()">Submit quiz</button><button class="btn ghost" onclick="resetQuiz()">Reset</button></div>`;
  } else {
    let correct=0;
    const rendered = qs.map((q,i)=>{
      const chosen=quizState.answers[i];
      const opts = q.options.map((o,oi)=>{
        let cls="q-opt";
        if(oi===q.answer) cls+=" correct";
        else if(chosen===oi) cls+=" wrong";
        return `<div class="${cls}"><span>${String.fromCharCode(65+oi)}. ${o}</span></div>`;
      }).join("");
      if(chosen===q.answer) correct++;
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div><div class="rationale"><b>Rationale:</b> ${q.rationale||""}</div></div>`;
    }).join("");
    const pct = Math.round(100*correct/qs.length);
    const prev = state.quizScores[quizState.mod] || {best:0,attempts:0};
    prev.last = pct; prev.best = Math.max(prev.best||0, pct); prev.attempts=(prev.attempts||0)+1;
    if(!quizState.saved){ state.quizScores[quizState.mod]=prev; save(); quizState.saved=true; }
    body = `<div class="score-banner"><h3>${correct} / ${qs.length} correct (${pct}%)</h3><p>${pct>=80?"Great work — you've mastered this module.":pct>=65?"Solid. Review the misses and retake.":"Go back to the module notes, then try again."}</p></div>${rendered}<div class="row" style="margin-top:10px"><button class="btn" onclick="resetQuiz()">Retake quiz</button></div>`;
  }
  document.getElementById("view-quiz").innerHTML = `
    <h2 class="section-title">Module quizzes</h2>
    <p class="lead">Multiple-choice, 4 options, with rationales. Each module quiz targets the high-yield concepts you'll see on the exam.</p>
    <div class="module-tabs">${tabs}</div>
    ${lastScore?`<p style="color:var(--mute)">Best: <b>${lastScore.best}%</b> · Last: ${lastScore.last}% · Attempts: ${lastScore.attempts}</p>`:""}
    ${body}`;
}
function setQuizMod(id){ state.activeQuizModule=id; save(); quizState={mod:id,idx:0,answers:{},submitted:false}; renderQuiz(); }
function submitQuiz(){ quizState.submitted=true; quizState.saved=false; renderQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
function resetQuiz(){ quizState={mod:quizState.mod,idx:0,answers:{},submitted:false}; renderQuiz(); }

/* ---------- Mock Exam ---------- */
let mockState = { started:false, submitted:false, answers:{}, order:[] };
function renderMock(){
  if(!mockState.started){
    const best = state.mockBest;
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">120-Question Mock Exam</h2>
      <p class="lead">Simulates the CSCP test proportionally across all 8 modules. Budget ~2.5 hours; the real exam gives 3.5 hours for 150 questions. Aim for 80%+ before test day.</p>
      ${best!=null?`<div class="card" style="margin-bottom:12px">Your best score: <b>${best}%</b></div>`:""}
      <div class="card">
        <h3>How it works</h3>
        <ul>
          <li>120 questions drawn from the full pool (${MOCK_EXAM.length} available), shuffled.</li>
          <li>No time pressure — the app doesn't stop you.</li>
          <li>Answer all, then submit. You'll see rationales and which modules need more review.</li>
        </ul>
        <button class="btn" onclick="startMock()">Start mock exam</button>
      </div>`;
    return;
  }
  const qs = mockState.order.map(i=>MOCK_EXAM[i]);
  if(!mockState.submitted){
    const list = qs.map((q,i)=>{
      const chosen = mockState.answers[i];
      const opts = q.options.map((o,oi)=>`<label class="q-opt"><input type="radio" name="mq${i}" value="${oi}" ${chosen===oi?'checked':''} onchange="mockState.answers[${i}]=${oi}"> <span>${String.fromCharCode(65+oi)}. ${o}</span></label>`).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q}</div><div class="q-opts">${opts}</div></div>`;
    }).join("");
    const answered = Object.keys(mockState.answers).length;
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">Mock Exam — in progress</h2>
      <p class="lead">${answered}/${qs.length} answered. Scroll through all and submit when done.</p>
      ${list}
      <div class="row" style="margin-top:12px"><button class="btn" onclick="submitMock()">Submit exam</button><button class="btn ghost" onclick="mockState={started:false,submitted:false,answers:{},order:[]};renderMock()">Cancel</button></div>`;
  } else {
    let correct=0;
    const byMod = {};
    const rendered = qs.map((q,i)=>{
      const chosen = mockState.answers[i];
      const right = chosen===q.answer;
      if(right) correct++;
      byMod[q.m] = byMod[q.m]||{c:0,t:0}; byMod[q.m].t++; if(right)byMod[q.m].c++;
      const opts = q.options.map((o,oi)=>{
        let cls="q-opt";
        if(oi===q.answer)cls+=" correct";
        else if(chosen===oi)cls+=" wrong";
        return `<div class="${cls}"><span>${String.fromCharCode(65+oi)}. ${o}</span></div>`;
      }).join("");
      return `<div class="q-box"><div class="q-text">${i+1}. ${q.q} <span class="pill mod${q.m.slice(1)}">${moduleLabel(q.m)}</span></div><div class="q-opts">${opts}</div><div class="rationale"><b>Rationale:</b> ${q.rationale||""}</div></div>`;
    }).join("");
    const pct = Math.round(100*correct/qs.length);
    if(!mockState.saved){ state.mockBest = Math.max(state.mockBest||0, pct); save(); mockState.saved=true; }
    const modBreak = Object.keys(byMod).sort().map(k=>`<tr><td>${moduleLabel(k)}</td><td>${byMod[k].c}/${byMod[k].t} (${Math.round(100*byMod[k].c/byMod[k].t)}%)</td></tr>`).join("");
    document.getElementById("view-mock").innerHTML = `
      <h2 class="section-title">Mock Exam — result</h2>
      <div class="score-banner"><h3>${correct} / ${qs.length} · ${pct}%</h3><p>${pct>=80?"Excellent. You are exam-ready.":pct>=70?"Solid pass territory — tighten up the weak modules.":pct>=60?"Close, not quite. Focus on your lowest-scoring modules below.":"Go back to module notes and flashcards before retaking."}</p></div>
      <div class="card"><h3>By module</h3><table><tr><th>Module</th><th>Correct</th></tr>${modBreak}</table></div>
      ${rendered}
      <div class="row" style="margin-top:10px"><button class="btn" onclick="mockState={started:false,submitted:false,answers:{},order:[]};renderMock()">Take another mock</button></div>`;
  }
}
function startMock(){
  const pool = MOCK_EXAM.map((_,i)=>i).sort(()=>Math.random()-.5);
  mockState = { started:true, submitted:false, answers:{}, order: pool.slice(0, Math.min(120, MOCK_EXAM.length)) };
  renderMock();
}
function submitMock(){ mockState.submitted=true; mockState.saved=false; renderMock(); window.scrollTo({top:0,behavior:"smooth"}); }

/* ---------- Diagrams ---------- */
let diagIdx = 0;
function renderDiagrams(){
  const d = DIAGRAMS[diagIdx];
  const tabs = DIAGRAMS.map((x,i)=>`<button class="${i===diagIdx?'active':''}" onclick="diagIdx=${i};renderDiagrams()">${x.title}</button>`).join("");
  document.getElementById("view-diagrams").innerHTML = `
    <h2 class="section-title">Interactive diagrams</h2>
    <p class="lead">Click any highlighted element in the diagrams to see its explanation. These are the frameworks you must know cold.</p>
    <div class="module-tabs">${tabs}</div>
    <div class="diagram-wrap"><h3 style="margin:0 0 6px">${d.title}</h3><p style="margin:0 0 10px;color:var(--mute)">${d.desc}</p>${d.svg}</div>
    <div class="card" id="diagInfo"><b>Click a highlighted element above</b> to see its explanation here.</div>`;
  document.querySelectorAll(".clickable[data-key]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.key;
      const info = d.keys[key];
      document.getElementById("diagInfo").innerHTML = info ? `<h3 style="margin:0 0 6px">${key}</h3><p style="margin:0">${info}</p>` : key;
    });
  });
}

/* ---------- Glossary ---------- */
function renderGlossary(){
  const letters = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const byLet = {};
  GLOSSARY.forEach(g=>{
    const l = g.term[0].toUpperCase();
    byLet[l] = byLet[l] || [];
    byLet[l].push(g);
  });
  const html = letters.filter(l=>byLet[l]).map(l=>{
    return `<h3 id="g-${l}" style="margin:18px 0 6px;color:var(--accent)">${l}</h3>` +
      byLet[l].sort((a,b)=>a.term.localeCompare(b.term)).map(g=>`<div class="keyterm"><b>${g.term}</b> — ${g.def}</div>`).join("");
  }).join("");
  const nav = letters.filter(l=>byLet[l]).map(l=>`<a href="#g-${l}">${l}</a>`).join(" · ");
  document.getElementById("view-glossary").innerHTML = `
    <h2 class="section-title">Glossary</h2>
    <p class="lead">${GLOSSARY.length} key terms from the ECM. Use Ctrl/Cmd+F to search.</p>
    <div class="card" style="margin-bottom:12px">${nav}</div>${html}`;
}

/* ---------- Init ---------- */
renderDashboard();
</script>
