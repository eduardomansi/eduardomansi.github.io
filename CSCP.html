    {title:"E. MRP Mechanics, BOMs, TOC & Quality — Reference",body:`
      <h4>MRP mechanics — exploding, netting, offsetting</h4>
      <ol>
        <li><b>Explosion</b> — use the BOM to translate parent demand to gross requirements for components (100 cars × 4 wheels = 400 wheels).</li>
        <li><b>Netting</b> — Gross req. − On-hand − Scheduled receipts + Safety stock = Net req.</li>
        <li><b>Lot-sizing</b> — apply the lot rule (L4L, FOQ, EOQ, POQ).</li>
        <li><b>Offsetting</b> — back the planned-order release date by the lead time so material arrives when needed.</li>
        <li><b>Pegging</b> — trace gross requirements upstream to the parent that caused them ('active where-used').</li>
      </ol>
      <h4>Dependent vs. independent demand</h4>
      <div class="keyterm"><b>Dependent</b> demand is calculated from BOM (components). <b>Independent</b> demand must be forecasted (finished goods, service parts).</div>
      <h4>Time fence zones</h4>
      <table>
        <tr><th>Zone</th><th>Boundary</th><th>Rule</th></tr>
        <tr><td><b>Frozen</b></td><td>Inside Demand Time Fence (DTF)</td><td>Only emergency changes; senior approval. Customer orders drive schedule.</td></tr>
        <tr><td><b>Slushy</b></td><td>Between DTF &amp; Planning Time Fence (PTF)</td><td>Planner-controlled changes; trade-off analysis.</td></tr>
        <tr><td><b>Liquid</b></td><td>Beyond PTF</td><td>System auto-generates and adjusts planned orders.</td></tr>
      </table>
      <h4>MRP system nervousness</h4>
      <p><b>Nervousness</b> = excessive replanning from small MPS changes rippling through the BOM. Remedies: <b>Firm Planned Orders (FPO)</b> freeze specific orders; <b>time fences</b> restrict near-term changes; <b>larger lot sizes</b> dampen rescheduling.</p>
      <h4>Closed-loop MRP &amp; MRP II</h4>
      <ul>
        <li><b>Closed-loop MRP</b> — adds capacity planning, shop-floor control, purchasing, and feedback to basic MRP.</li>
        <li><b>MRP II</b> — Manufacturing Resource Planning. Adds business &amp; financial planning + simulation. Direct predecessor to ERP.</li>
        <li><b>DDMRP</b> — Demand-Driven MRP. Uses strategic decoupling buffers to plan closer to actual demand and reduce nervousness.</li>
      </ul>
      <h4>BOM types</h4>
      <ul>
        <li><b>Single-level BOM</b> — only immediate components.</li>
        <li><b>Multilevel (indented)</b> — all components down to raw materials.</li>
        <li><b>Planning BOM</b> — artificial; uses option percentages for product family forecasting (not buildable).</li>
        <li><b>Phantom BOM</b> — non-stocked subassembly; MRP passes through it.</li>
        <li><b>Modular BOM</b> — organized by major options for ATO environments.</li>
      </ul>
      <h4>Capacity strategies (recap with addition)</h4>
      <ul>
        <li><b>Lead</b> — add capacity ahead of demand.</li>
        <li><b>Lag</b> — add only after demand.</li>
        <li><b>Straddle / overlap (match)</b> — small frequent additions tracking demand.</li>
        <li><b>Load leveling (capacity smoothing)</b> — spread orders so work is even and feasible.</li>
      </ul>
      <h4>Inventory types</h4>
      <ul>
        <li><b>Cycle stock</b> — to fulfill demand during an order cycle (lot-sizing).</li>
        <li><b>Safety stock</b> — buffer against <em>variability</em>.</li>
        <li><b>Anticipation</b> — covers <em>known</em> events (promo, shutdown, season).</li>
        <li><b>In-transit / pipeline</b> — moving between locations.</li>
        <li><b>Buffer</b> (TOC) — protects throughput before the constraint.</li>
        <li><b>Decoupling</b> — independence between operations.</li>
        <li><b>Hedge</b> — protect against price/FX moves.</li>
        <li><b>MRO</b> — supports operations; not in product.</li>
      </ul>
      <h4>Lot sizing rules</h4>
      <ul>
        <li><b>Lot-for-Lot (L4L)</b> — order exactly net requirement; min inventory, max ordering cost.</li>
        <li><b>Fixed Order Quantity (FOQ)</b> — always a fixed multiple.</li>
        <li><b>EOQ</b> — minimizes total ordering + holding cost (assumes constant, known demand).</li>
        <li><b>POQ</b> — period order quantity covers fixed number of periods.</li>
        <li><b>TPOP</b> (Time-Phased Order Point) — time-phased for independent demand items with lumpy patterns.</li>
        <li><b>Safety lead time</b> — extra LT buffer added (vs. extra <em>quantity</em> via safety stock).</li>
      </ul>
      <h4>EOQ assumptions (limit its accuracy)</h4>
      <ul>
        <li>Constant, known demand &amp; lead time</li>
        <li>Items arrive all at once</li>
        <li>No quantity discounts</li>
        <li>Only variable costs are ordering &amp; carrying</li>
        <li>No stockouts</li>
      </ul>
      <p>EOQ is <b>robust</b> — total cost varies little across a range of order quantities near the optimum.</p>
      <h4>Lean & quality detail</h4>
      <ul>
        <li><b>Jidoka</b> — automation with a human touch; machine stops on defect; pillar of TPS along with JIT.</li>
        <li><b>Heijunka</b> — level production by mix and volume.</li>
        <li><b>Kaizen event / Kaizen blitz</b> — focused 1-week cross-functional improvement of a process area.</li>
        <li><b>Value stream map</b> — visual flow showing value-added and non-value-added time.</li>
        <li><b>Eight wastes (DOWNTIME):</b> Defects · Overproduction · Waiting · Non-utilized talent · Transportation · Inventory · Motion · Extra-processing.</li>
        <li><b>TPM</b> (Total Productive Maintenance) — preventive + continuous improvement of equipment by operators.</li>
        <li><b>TQM</b> (Total Quality Management) — customer-driven, all-employee, continuous-improvement culture.</li>
        <li><b>SPC</b> (Statistical Process Control) — control charts detect assignable causes vs. random variation.</li>
        <li><b>Seven basic quality tools</b>: cause-effect (Ishikawa) · check sheet · control chart · histogram · Pareto chart · scatter diagram · stratification (or flow chart).</li>
        <li><b>Five approaches to quality</b>: Transcendent · Product-based · User-based · Manufacturing-based · Value-based.</li>
        <li><b>Quality of design</b> (does it satisfy customer needs?) vs. <b>quality of conformance</b> (does it meet specs?).</li>
      </ul>
      <h4>Drum-Buffer-Rope (TOC scheduling)</h4>
      <ul>
        <li><b>Drum</b> — the constraint; sets the pace.</li>
        <li><b>Buffer</b> — TIME buffer placed BEFORE the constraint to prevent starvation.</li>
        <li><b>Rope</b> — release rate of material tied to the constraint's consumption rate; prevents over-WIP.</li>
      </ul>
      <h4>Performance & inventory accuracy</h4>
      <ul>
        <li><b>Cycle counting</b> &gt; periodic counts; A items most often.</li>
        <li><b>Inventory accuracy target</b>: 95–99%.</li>
        <li><b>Configuration management</b> — control product data through lifecycle.</li>
        <li><b>End-of-life management</b> — phase-out planning, lifetime buys.</li>
        <li><b>Allocation</b> — quantities reserved for orders but not yet shipped.</li>
        <li><b>Line-item fill rate</b> — % of order LINES filled completely. <b>Unit fill rate</b> — % of UNITS filled.</li>
        <li><b>SKU</b> — unique stock-keeping unit code for tracking.</li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m5", shortTitle:"Mod 5 · Logistics",
  title:"Module 5 — Forward & Reverse Logistics",
  blurb:"Warehousing, materials handling, transportation modes & pricing, 3PL/4PL, reverse logistics, Incoterms.",
  sections:[
    {open:true,title:"A. Distribution Network",body:`
      <p><b>Logistics</b> manages the physical, informational and financial flows between supply chain entities — time, place, and form utility.</p>
      <div class="keyterm"><b>Seven Rs:</b> right product, right quantity, right condition, right place, right time, right customer, right cost.</div>
      <h4>Logistics service providers</h4>
      <table><tr><th>Type</th><th>Scope</th></tr>
        <tr><td><b>1PL</b></td><td>Firm owns and does its own logistics.</td></tr>
        <tr><td><b>2PL</b></td><td>Asset-based carrier (trucking, shipping line).</td></tr>
        <tr><td><b>3PL</b></td><td>Outsourced provider performing transport, warehousing, value-add services.</td></tr>
        <tr><td><b>4PL</b></td><td>Lead logistics integrator — manages multiple 3PLs + tech for the client.</td></tr>
        <tr><td><b>5PL</b></td><td>Network orchestrator leveraging digital/e-business for end-to-end optimization.</td></tr></table>
      <h4>3PL/4PL considerations</h4>
      <p>Advantages: scale, expertise, flexibility, lower capital. Risks: loss of control, IP exposure, dependency. Contract terms: SLAs, gainshare, volume guarantees, exit clauses.</p>
      <h4>Logistics tactics</h4>
      <ul>
        <li>Coordinate cross-functional execution</li>
        <li>Integrate chain to reduce inventory via information</li>
        <li>Regulate number of partners</li>
        <li><b>Risk pooling</b> — centralizing inventory reduces total safety stock (variance adds in quadrature)</li>
      </ul>
    `},
    {title:"B. Distribution Services & Transportation",body:`
      <h4>Distribution services flow</h4>
      <p><b>Receive → Put-away → Store → Pick → Pack → Ship</b>. <b>Cross-docking</b> bypasses storage by transferring inbound directly to outbound.</p>
      <ul>
        <li><b>Receiving</b> — physical receipt, inspection, identification, receiving reports.</li>
        <li><b>Put-away</b> — transport to storage, place, record location.</li>
        <li><b>Order picking</b> — discrete, batch, zone, wave.</li>
        <li><b>Shipping</b> — packaging, marking, weighing, loading.</li>
        <li><b>Break-bulk</b> — divide truckloads into smaller quantities.</li>
      </ul>
      <h4>Materials handling</h4>
      <p>Manual · mechanized (forklifts, conveyors, tow lines, cranes, carousels) · automated (AGV, AS/RS, sortation, robotics, live racks). <b>Pick-to-light</b>, voice-pick, and goods-to-person improve pick rates.</p>
      <h4>Stock location methods</h4>
      <ul>
        <li><b>Fixed</b> — each SKU has a home (familiar, more space).</li>
        <li><b>Random/dynamic</b> — any empty slot (better utilization, needs WMS).</li>
        <li><b>Zone / ABC velocity</b> — fast movers near ship area.</li>
      </ul>
      <h4>Transportation modes</h4>
      <table><tr><th>Mode</th><th>Best for</th><th>Cost / Speed</th></tr>
        <tr><td><b>Rail</b></td><td>Heavy, bulk, long land moves</td><td>Low cost / slow</td></tr>
        <tr><td><b>Road / truck</b></td><td>Door-to-door, mid-distance — most flexible</td><td>Medium cost / medium</td></tr>
        <tr><td><b>Water</b></td><td>International bulk, low value/weight</td><td>Lowest / slowest</td></tr>
        <tr><td><b>Air</b></td><td>High value, perishable, urgent</td><td>Highest / fastest</td></tr>
        <tr><td><b>Pipeline</b></td><td>Liquids, gases (continuous flow)</td><td>Very low / slow</td></tr>
        <tr><td><b>Intermodal</b></td><td>Containers; two+ modes w/o rehandling</td><td>Balanced</td></tr></table>
      <h4>Truckload options</h4>
      <ul>
        <li><b>FTL</b> — Full truckload (one shipper).</li>
        <li><b>LTL</b> — Less-than-truckload; freight from multiple shippers, priced by class + distance.</li>
        <li><b>Parcel</b> — small packages by express carriers.</li>
      </ul>
      <h4>Freight rates & charges</h4>
      <ul>
        <li><b>Line-haul</b> — distance-based.</li>
        <li><b>Accessorial</b> — detention, fuel, lift-gate, inside delivery.</li>
        <li><b>Demurrage / detention</b> — equipment tie-up charges beyond free time.</li>
        <li><b>FAK</b> (Freight-All-Kinds) — flat rate for mixed loads.</li>
        <li><b>Tariff</b> — published rate schedule.</li>
      </ul>
      <h4>Total-cost concept</h4>
      <p>At equal service levels, minimize the SUM of logistics costs (transport + inventory + warehousing + handling) — not any single line item.</p>
      <h4>Distribution intensity</h4>
      <p><b>Intensive</b> (everywhere — convenience), <b>Selective</b> (limited — specialty), <b>Exclusive</b> (very few — luxury).</p>
    `},
    {title:"C. Trade Considerations",body:`
      <h4>Incoterms 2020</h4>
      <p>ICC rules defining buyer/seller obligations for delivery, risk transfer, and cost in international shipments.</p>
      <table><tr><th>Any mode</th><th>Sea / inland waterway only</th></tr>
        <tr><td>EXW, FCA, CPT, CIP, DAP, DPU, DDP</td><td>FAS, FOB, CFR, CIF</td></tr></table>
      <div class="keyterm"><b>EXW</b> = seller minimum (buyer collects at seller's premises).<br><b>DDP</b> = seller maximum (delivered, duty paid at buyer's named place).</div>
      <h4>Trade classification & duties</h4>
      <ul>
        <li><b>HS code</b> — international Harmonized System product classification.</li>
        <li><b>HTS</b> — US Harmonized Tariff Schedule.</li>
        <li><b>Tariff</b> — official tax schedule on imports/exports.</li>
        <li><b>Country of origin</b> — drives duty rate &amp; FTA eligibility.</li>
        <li><b>Inverted duties</b> — when finished-good tariff is LOWER than component tariffs (discourages local manufacturing). FTZs help mitigate.</li>
        <li><b>De minimis</b> — value threshold below which goods clear with simplified procedures.</li>
      </ul>
      <h4>Free Trade Zones (FTZ) & blocs</h4>
      <ul>
        <li><b>FTZ</b> — duty deferral, exemption on re-exports, inspection before paying, manufacture without inverted duties.</li>
        <li><b>Trade bloc</b> — agreement reducing barriers (EU, USMCA, Mercosur).</li>
        <li><b>CISG (Vienna Convention)</b> — uniform default rules for international goods sales.</li>
      </ul>
      <h4>Trade & customs roles</h4>
      <ul>
        <li><b>Shipper (consignor)</b>, <b>consignee</b>, <b>carrier</b>.</li>
        <li><b>Freight forwarder</b> — arranges shipment between shipper and carrier; consolidates freight.</li>
        <li><b>Customs broker</b> — clears goods through customs.</li>
        <li><b>NVOCC</b> — non-vessel-operating common carrier; consolidates LCL freight without owning vessels.</li>
      </ul>
      <h4>Trusted-trader & security programs</h4>
      <ul>
        <li><b>C-TPAT</b> (US) · <b>AEO</b> (EU) — accelerated customs for security-certified firms.</li>
        <li><b>ISO 28000</b> — supply chain security management.</li>
      </ul>
      <h4>Currency & financial risk</h4>
      <p>Mitigations: <b>natural hedge</b> (match currency of revenues &amp; costs), forward contracts, currency clauses in supply agreements.</p>
      <h4>Global trade management</h4>
      <p>Optimizing international shipments for efficiency &amp; cash flow while ensuring regulatory compliance.</p>
    `},
    {title:"D. Reverse Flow",body:`
      <p><b>Reverse logistics</b> = flow of products/materials from the customer back toward origin for return, repair, remanufacture, recycle, or disposal.</p>
      <div class="keyterm"><b>5 Rs of reverse logistics:</b> Returns, Reselling, Repairs, Repackaging, Recycling.</div>
      <h4>Product recovery hierarchy (preferred → least)</h4>
      <ol>
        <li>Repair</li>
        <li>Refurbish</li>
        <li>Remanufacture</li>
        <li>Recycle (materials)</li>
        <li>Dispose (landfill/incineration)</li>
      </ol>
      <h4>Closed-loop supply chain</h4>
      <p>Designed to handle both forward &amp; reverse flows as one system. Drivers: regulation (EU WEEE, RoHS), extended producer responsibility (EPR), circular economy, brand protection.</p>
      <h4>Green / sustainable logistics</h4>
      <p>Route optimization, load consolidation, modal shift to rail/water, alt fuels, returnable packaging, carbon reporting (GHG Protocol).</p>
    `},
    {title:"E. Warehousing Details & Trade Documentation",body:`
      <h4>Warehouse types</h4>
      <table><tr><th>Type</th><th>Pros</th><th>Cons</th></tr>
        <tr><td><b>Private</b> (owned)</td><td>Customization, no markup, proximity</td><td>Capital tied up, fixed cost in downturns</td></tr>
        <tr><td><b>Public</b> (shared)</td><td>No capital; pay-as-you-go; flexibility for new markets</td><td>Less control; service variability</td></tr>
        <tr><td><b>Contract</b></td><td>Tailored services via long-term contract; cheaper than public</td><td>Less flexible than public; ties you to a partner</td></tr>
        <tr><td><b>Distribution Center</b></td><td>Demand-driven rapid distribution; cross-dock or fulfillment</td><td>—</td></tr>
      </table>
      <h4>Standard distribution flow</h4>
      <p><b>Receive → Put-away → Store → Pick → Pack → Ship</b>.</p>
      <h4>Picking strategies</h4>
      <ul>
        <li><b>Discrete</b> — one order at a time.</li>
        <li><b>Batch</b> — pick multiple orders together; reduce travel.</li>
        <li><b>Zone</b> — pickers stay in zones; orders pass through.</li>
        <li><b>Wave</b> — release groups of orders to align with shipping cutoffs.</li>
      </ul>
      <h4>Value-added warehouse services</h4>
      <p>Installation · repacking · postponement · stocking (price/labels) · final assembly · kitting · labeling · returns processing.</p>
      <h4>Distribution intensity</h4>
      <ul>
        <li><b>Intensive</b> — sell everywhere (convenience goods).</li>
        <li><b>Selective</b> — limited outlets (specialty).</li>
        <li><b>Exclusive</b> — very few outlets (luxury / B2B premium).</li>
      </ul>
      <h4>Logistics tradeoffs (total-cost concept)</h4>
      <ul>
        <li>Inventory ↔ transportation</li>
        <li>Lot size ↔ inventory</li>
        <li>Lead time ↔ transportation cost</li>
        <li>Variety ↔ inventory</li>
        <li>Service level ↔ cost</li>
      </ul>
      <p><b>Total-cost concept</b>: at equal service levels, minimize the SUM of logistics costs — not any single line item.</p>
      <h4>Trade & customs detail</h4>
      <ul>
        <li><b>HS code</b> classifies goods globally; <b>HTS</b> = US version for tariffs.</li>
        <li><b>Tariff</b> — official import/export tax schedule.</li>
        <li><b>Trade bloc</b> — agreement reducing barriers (EU, USMCA).</li>
        <li><b>Inverted duties</b> — tariffs on finished goods are LOWER than on components → manufacturing in country becomes uneconomic. <b>FTZs help</b>.</li>
        <li><b>De minimis</b> — value threshold below which goods clear with simplified procedures.</li>
        <li><b>Free Trade Zone benefits</b>: defer duties, exempt re-exports, inspection before paying, manufacture without inverted duties, simplified customs, indefinite storage.</li>
        <li><b>Freight forwarder</b> — arranges shipment between shipper and carrier; consolidates freight.</li>
        <li><b>Customs broker</b> — clears goods through customs.</li>
        <li><b>NVOCC</b> — non-vessel-operating common carrier.</li>
        <li><b>Common carrier</b> — public, regulated; must obtain certificate of public convenience.</li>
      </ul>
      <h4>Trade documents</h4>
      <ul>
        <li><b>Bill of Lading (B/L)</b> — receipt + contract of carriage + (negotiable) document of title.</li>
        <li><b>Commercial invoice</b> — seller's bill describing goods, quantity, price.</li>
        <li><b>Certificate of Origin</b> — country of manufacture; needed for tariff treatment.</li>
        <li><b>ATR Certificate</b> — EU-Turkey free-circulation certificate.</li>
        <li><b>Packing list</b> — items, weights, dimensions.</li>
        <li><b>Customs declaration</b> — value &amp; nature of goods declared to customs.</li>
        <li><b>Letter of Credit</b> — bank guarantee of payment if conditions met.</li>
      </ul>
      <h4>Reverse-logistics extras</h4>
      <ul>
        <li><b>Waste hierarchy</b>: Reduce &gt; Reuse &gt; Recycle &gt; Recovery &gt; Disposal.</li>
        <li><b>GHS</b> — Globally Harmonized System for chemical hazard classification &amp; labelling.</li>
        <li><b>Hazardous waste</b>, <b>clean technology</b>, <b>responsible landfill</b>, <b>total waste management</b>, <b>waste exchange</b>.</li>
      </ul>
      <h4>Other logistics terms</h4>
      <ul>
        <li><b>Sortation</b>, <b>staging area</b>, <b>stowability</b>, <b>density</b> (price by weight or cube), <b>perishability</b>, <b>hazmat</b>.</li>
        <li><b>Spot-stocking</b> — temporary inventory near a market for promo/seasonal demand.</li>
        <li><b>Accumulation</b> — combining small inbound shipments into one outbound.</li>
        <li><b>Assortment assembly</b> — building mixed-product orders from single-product lots.</li>
        <li><b>Aisle space</b> — typically 40–60% of warehouse floor.</li>
        <li><b>Drop-ship</b> — direct from supplier to customer (bypassing seller's DC).</li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m6", shortTitle:"Mod 6 · Relationships",
  title:"Module 6 — Supply Chain Relationships",
  blurb:"CRM & SRM, segmentation, customer service metrics, relationship types, collaboration, performance management.",
  sections:[
    {open:true,title:"A. Customer Relationships",body:`
      <h4>Customer segmentation</h4>
      <p>Group customers so you can differentiate service. Common bases:</p>
      <ul>
        <li><b>Value</b> — lifetime value, margin, share of wallet</li>
        <li><b>Needs</b> — service level required, responsiveness expectations</li>
        <li><b>Channel</b> preference — retail, online, B2B, direct</li>
        <li><b>Behavior</b> — loyalty, frequency, recency, monetary (RFM)</li>
      </ul>
      <div class="keyterm"><b>VoC (Voice of the Customer):</b> systematic capture of customer expectations/preferences — surveys, NPS, interviews, analytics — feeds product &amp; service design.</div>
      <h4>Scope of CRM</h4>
      <p>Sales, marketing, service, analytics, customer data warehousing, personalization, loyalty programs.</p>
      <h4>Strategies by relationship type</h4>
      <table><tr><th>Type</th><th>Tactic</th></tr>
        <tr><td>Transactional</td><td>Efficient self-service, low-cost channels</td></tr>
        <tr><td>Preferred</td><td>Account management, service recovery</td></tr>
        <tr><td>Partner</td><td>Dedicated teams, joint planning, tailored SLAs</td></tr>
        <tr><td>Alliance</td><td>Co-investment, co-innovation, shared KPIs</td></tr></table>
      <h4>Customer service metrics</h4>
      <ul>
        <li><b>Fill rate</b> = units (or orders) shipped from stock / units ordered</li>
        <li><b>OTIF</b> — on-time in-full</li>
        <li><b>Perfect order</b> — OTIF + damage-free + correctly documented</li>
        <li><b>Order cycle time</b></li>
        <li><b>NPS</b>, CSAT, CES (effort)</li>
      </ul>
    `},
    {title:"B. Supplier Relationships",body:`
      <p><b>SRM</b> = integrated approach to managing supplier interactions: selection, development, performance management, innovation, risk.</p>
      <h4>Relationship spectrum</h4>
      <p>Arm's-length → preferred → strategic → alliance → joint venture / integrated.</p>
      <h4>Supplier development</h4>
      <ul>
        <li>Training &amp; technical support</li>
        <li>Joint Kaizen events / on-site assessment</li>
        <li>Financial support for capacity / quality</li>
        <li>Process / quality certification support (ISO 9001, IATF 16949)</li>
      </ul>
      <h4>Performance measurement</h4>
      <p>Balanced scorecards with <b>QCDFR</b> dimensions: Quality, Cost, Delivery, Flexibility, Responsiveness. Review cadence varies by criticality.</p>
      <h4>SRM technology</h4>
      <p>Supplier portals, e-sourcing/e-auctions, contract lifecycle management (CLM), spend analytics, supplier info management (SIM).</p>
    `},
    {title:"C. Relationship Management in Practice — Collaboration & Performance",body:`
      <h4>Collaboration continuum</h4>
      <ol>
        <li>Information sharing</li>
        <li>Coordinated operations</li>
        <li>Joint planning (S&amp;OP w/ key partners)</li>
        <li>Shared risks &amp; rewards</li>
        <li>Co-development / innovation</li>
      </ol>
      <h4>CPFR (Collaborative Planning, Forecasting & Replenishment)</h4>
      <p>Four activities: strategy &amp; planning · demand &amp; supply management · execution · analysis. Partners share forecasts and replenishment plans, collaboratively resolve exceptions.</p>
      <h4>Trust & governance</h4>
      <p>Formal contracts + relational norms (trust, commitment, communication). Use joint steering committees, balanced scorecards, open-book costing.</p>
    `},
    {title:"D. Performance Management & SCOR Metrics",body:`
      <h4>SCOR-based metrics</h4>
      <p>The <b>SCOR</b> (Supply Chain Operations Reference) model defines 5 process areas (<b>Plan, Source, Make, Deliver, Return</b>) and three performance groups:</p>
      <ul>
        <li><b>Customer-facing</b>: Reliability (perfect order), Responsiveness (order fulfillment cycle time), Agility (adapt to changes).</li>
        <li><b>Internal-facing</b>: Cost (COGS %, cash-to-cash), Assets (inventory days, return on assets).</li>
      </ul>
      <div class="formula">Cash-to-cash cycle time = DIO + DSO − DPO</div>
      <div class="keyterm"><b>Balanced Scorecard (Kaplan &amp; Norton):</b> Financial · Customer · Internal process · Learning &amp; growth.</div>
      <h4>Benchmarking</h4>
      <p>Compare KPIs vs. internal, competitive, functional, or generic best-in-class. Follow PDCA to close gaps.</p>
    `},
    {title:"E. CRM Maturity, Stakeholders & Strategic Alliance Steps",body:`
      <h4>CRM technology maturity</h4>
      <ol>
        <li><b>Disconnected</b> — multiple non-interfacing databases.</li>
        <li><b>Interfacing</b> — systems feed into each other; some integration.</li>
        <li><b>Internally integrated</b> — one main system across departments.</li>
        <li><b>Multi-enterprise integrated</b> — partners share data; full SC collaboration.</li>
      </ol>
      <h4>Customer revenue strategies</h4>
      <ul>
        <li><b>Cross-selling</b> — sell related products (phone case after phone).</li>
        <li><b>Up-selling</b> — sell premium versions / add-ons.</li>
        <li><b>Lifetime customer value (LCV)</b> — total profit a customer generates over the relationship; key metric for segmentation &amp; retention investment.</li>
      </ul>
      <h4>Campaign management types</h4>
      <ul>
        <li><b>Prospecting</b> — acquire new customers.</li>
        <li><b>Loyalty</b> — retain, cross-/up-sell.</li>
        <li><b>Win-back</b> — recover lost customers.</li>
        <li><b>Vulnerable</b> — prevent at-risk defection.</li>
      </ul>
      <h4>Customer service vocabulary</h4>
      <ul>
        <li><b>Customer service ratio</b> — MTS: % shipped on schedule. MTO: % jobs on time.</li>
        <li><b>Churn</b> — customers leaving for better/cheaper alternatives.</li>
        <li><b>VoC</b> — actual customer descriptions of desired functions/features.</li>
        <li><b>Business intelligence</b> — gather, store, analyze data for better decisions.</li>
        <li><b>Customer-driven</b> — culture in which all personnel work to meet/exceed customer expectations.</li>
        <li><b>Portal</b> — secured web entry that aggregates data for partners or customers.</li>
      </ul>
      <h4>SRM relationship & supplier types</h4>
      <ul>
        <li><b>Strategic alliance</b> — share proprietary info, joint investments, linked processes.</li>
        <li><b>Joint venture</b> — separate entity, shared ownership/risk.</li>
        <li><b>Virtual organization</b> — short-term alliance to design/produce/distribute.</li>
        <li><b>Tactical buying</b> — transactional, nonstrategic, standard items.</li>
        <li><b>Supplier certification</b> — verifies supplier's ability to meet cost/quality/delivery/safety standards (often ISO).</li>
        <li><b>Supplier development</b> — collaborate, share data, real-time design collaboration, remediation plan when underperforming.</li>
      </ul>
      <h4>Strategic alliance — 10-step process</h4>
      <ol>
        <li>Align internally</li><li>Select proper partner</li><li>Negotiate win-win</li>
        <li>Establish ground rules / governance</li><li>Appoint dedicated alliance manager</li>
        <li>Encourage collaboration</li><li>Build collaborative mindset</li><li>Manage multi-faceted relationships</li>
        <li>Conduct pulse checks</li><li>Plan for change</li>
      </ol>
      <h4>Stakeholder & communication management</h4>
      <p><b>Stakeholder Relationship Management</b> proactively addresses competing internal/external priorities to lower cost and increase buy-in. <b>Communication management plan</b> documents communication needs (format, dates, owners).</p>
      <div class="tip"><b>Exam emphasis:</b> The expected benefit of collaborative SCM is <b>synchronizing supply and demand across the entire chain</b> — not maximizing any single firm's performance.</div>
    `},
  ]
});

MODULES.push({
  id:"m7", shortTitle:"Mod 7 · Risk",
  title:"Module 7 — Supply Chain Risk",
  blurb:"Risk identification, analysis (qualitative & quantitative), response strategies, business continuity, security & compliance.",
  sections:[
    {open:true,title:"A. Risk Management Framework & Risk Identification",body:`
      <p>Risk = effect of uncertainty on objectives (ISO 31000). Can be positive (opportunity) or negative (threat).</p>
      <h4>Risk management process</h4>
      <ol>
        <li><b>Identify</b> — risk register.</li>
        <li><b>Analyze</b> — qualitative (P×I matrix) and/or quantitative (EMV, Monte Carlo).</li>
        <li><b>Evaluate &amp; prioritize</b>.</li>
        <li><b>Treat / respond</b>.</li>
        <li><b>Monitor &amp; communicate</b>.</li>
      </ol>
      <h4>Frameworks</h4>
      <ul>
        <li><b>ISO 31000</b> — principles &amp; guidelines.</li>
        <li><b>ISO 31010</b> — risk assessment techniques (Delphi, HAZOP, FMEA, bow-tie, Monte Carlo).</li>
        <li><b>COSO ERM</b> — governance, strategy, performance, review, communication.</li>
        <li><b>GRC</b> — Governance, Risk, Compliance.</li>
      </ul>
      <h4>Attitudes toward risk</h4>
      <p>Risk-averse, risk-neutral, risk-seeking. The <b>risk appetite</b> sets the level of risk the organization is willing to accept.</p>
    `},
    {title:"B. Supply Chain Risks & Categories",body:`
      <h4>Risk register</h4>
      <p>Catalog of: risk ID, description, category, cause, probability, impact, owner, response plan, triggers, status.</p>
      <h4>Categories of supply chain risk</h4>
      <ul>
        <li><b>Operational</b> — supplier failure, quality, capacity, labor.</li>
        <li><b>Demand</b> — forecast error, volatility, cannibalization.</li>
        <li><b>Supply</b> — single-source, geopolitical, commodity price.</li>
        <li><b>Logistics</b> — disruption, port closures, weather.</li>
        <li><b>Financial</b> — FX, credit, liquidity.</li>
        <li><b>Strategic</b> — competitive, reputation, M&amp;A.</li>
        <li><b>Environmental</b> — natural disasters, climate, pandemic.</li>
        <li><b>Cyber / data</b> — breach, ransomware, IP theft.</li>
        <li><b>Compliance / legal</b> — regulation, trade, sanctions.</li>
      </ul>
      <h4>Loss of tangible vs. intangible assets</h4>
      <p>Tangible: inventory, facilities, equipment. Intangible: brand, customer trust, IP.</p>
    `},
    {title:"C. Risk Analysis and Response",body:`
      <h4>Qualitative analysis — P×I matrix</h4>
      <p>Score probability (Low/Med/High or 1–5) and impact (same scale). Multiply for risk score; plot on heat map. Use <b>urgency</b> and <b>data quality</b> modifiers.</p>
      <h4>Quantitative analysis</h4>
      <div class="formula">EMV (Expected Monetary Value) = Σ (Probability × Impact)</div>
      <ul>
        <li><b>Sensitivity analysis</b> — how output changes with each input.</li>
        <li><b>Monte Carlo simulation</b> — distribution of outcomes via repeated random sampling.</li>
        <li><b>Decision tree</b> — chain of probabilistic decisions with EMV.</li>
      </ul>
      <h4>Response strategies — threats</h4>
      <ul>
        <li><b>Avoid</b> — eliminate cause (not source the region).</li>
        <li><b>Transfer</b> — insurance, contract, hedge.</li>
        <li><b>Mitigate</b> — reduce P or I (safety stock, multi-source).</li>
        <li><b>Accept</b> — conscious choice; reserve if passive.</li>
      </ul>
      <h4>Response strategies — opportunities</h4>
      <p>Exploit · Enhance · Share · Accept.</p>
      <h4>Action plans & triggers</h4>
      <p>Document triggers (early warning signals) and pre-defined responses. Use <b>contingency reserves</b> (budget/time) for known risks and <b>management reserves</b> for unknowns.</p>
    `},
    {title:"D. Business Continuity, Security & Insurance",body:`
      <h4>Business continuity planning (BCP)</h4>
      <p>Ensure critical processes continue through disruption.</p>
      <ul>
        <li><b>BIA</b> (Business Impact Analysis) identifies critical processes and impacts over time.</li>
        <li><b>RTO</b> — Recovery Time Objective</li>
        <li><b>RPO</b> — Recovery Point Objective (max acceptable data loss window)</li>
        <li><b>MTPD</b> — Maximum Tolerable Period of Disruption</li>
      </ul>
      <p>Plan includes: crisis management, disaster recovery (IT), alternate sites, communications.</p>
      <h4>Supply chain security</h4>
      <ul>
        <li><b>C-TPAT</b> (US Customs-Trade Partnership Against Terrorism)</li>
        <li><b>AEO</b> (EU Authorized Economic Operator)</li>
        <li><b>ISO 28000</b> — supply chain security management</li>
        <li><b>TAPA</b> — Transported Asset Protection Association</li>
      </ul>
      <h4>Compliance & ethics</h4>
      <ul>
        <li><b>FCPA</b> / UK Bribery Act</li>
        <li><b>Sarbanes-Oxley (SOX)</b> — financial controls</li>
        <li><b>Dodd-Frank §1502</b> — conflict minerals</li>
        <li><b>UN Global Compact</b>, labor, human rights, OECD guidelines</li>
        <li><b>Modern Slavery Act</b></li>
      </ul>
    `},
    {title:"E. Quantitative Risk Methods & ISO Standards",body:`
      <h4>Risk appetite vs. risk tolerance (commonly confused)</h4>
      <table>
        <tr><th>Term</th><th>Definition</th></tr>
        <tr><td><b>Risk appetite</b></td><td>Amount/type of risk the organization is willing to <em>pursue</em> or retain in pursuit of objectives.</td></tr>
        <tr><td><b>Risk tolerance</b></td><td>Readiness to <em>accept</em> a threat or potential negative outcome to achieve objectives.</td></tr>
        <tr><td><b>Risk threshold</b></td><td>Specific quantitative limit at which a risk is escalated or treated.</td></tr>
      </table>
      <h4>Risk identification tools</h4>
      <ul>
        <li><b>Risk diagramming</b> — Ishikawa (cause-effect / fishbone), influence diagrams, fault trees, risk breakdown structures.</li>
        <li><b>Due diligence</b> — investigation of partners' financial, legal, operational, reputational status before commitment.</li>
        <li><b>FMEA</b> — Failure Mode &amp; Effects Analysis. Risk Priority Number = Severity × Occurrence × Detection.</li>
        <li><b>Bow-tie analysis</b> — threats → event → consequences with preventive &amp; mitigating controls.</li>
      </ul>
      <h4>Insurance for supply chain risk</h4>
      <table><tr><th>Policy</th><th>Covers</th></tr>
        <tr><td><b>Property</b></td><td>Buildings, equipment, inventory at your or partners' sites.</td></tr>

      <h4>Quantitative risk methods (more)</h4>

/* Module 1 additions */
fc("m1","Keiretsu","Japanese form of cooperative relationship among legally independent companies that work closely together, often centered on a bank/trading company. Underpins long-term lean supplier relationships.");
fc("m1","Order qualifier","Competitive characteristic that must be met just to be considered. Failing it loses orders; being better at it doesn't win them.");
fc("m1","Order winner","Competitive characteristic that causes customers to choose your product over competitors (e.g., delivery speed, quality, design).");
fc("m1","Order loser","Characteristic that drives customers AWAY (poor quality, late delivery, high price when price is a qualifier).");
fc("m1","Make-to-Stock (MTS)","Finished goods built before order; shortest customer lead time; lowest variety. Decoupling point at finished goods.");
fc("m1","Assemble-to-Order (ATO)","Modules/subassemblies stocked; final assembly on order. Balances variety and lead time.");
fc("m1","Make-to-Order (MTO)","Production begins after customer order; raw materials only stocked; long lead time.");
fc("m1","Engineer-to-Order (ETO)","Custom design after order; longest lead time; highest variety.");
fc("m1","Package-to-Order (PTO)","Common physical product; packaging delayed until order — supports postponement and many regional/customer SKUs.");
fc("m1","Customer Order Decoupling Point (CODP)","Point in chain where production switches from forecast-driven (push) to order-driven (pull). MTS = all push; ETO = all pull.");

fc("m1","Chase production strategy","Vary production each period to match demand using overtime, hiring, outsourcing.");
fc("m1","Hybrid production strategy","Combine level + chase to minimize total cost.");
fc("m1","Echelon","Level of supply chain nodes (factory, DC, retail). Each adds cost, inventory, cycle time, and expects profit.");
fc("m1","Service industry definition","All organizations except farming, mining, and manufacturing.");
fc("m1","MSE","Mean Squared Error — Σ(Actual−Forecast)²/n. Penalizes large errors more than MAD.");
fc("m1","R-squared","Goodness-of-fit of regression; 1 = perfect fit, 0 = no relationship. High R² ≠ causation.");
fc("m1","Life-cycle analysis (analog forecasting)","Apply demand patterns from a similar prior product to forecast a new launch.");
fc("m1","1 MAD ≈ ?% service","≈80% service. 2 MAD ≈ 95%, 3 MAD ≈ 99%.");
fc("m1","σ vs MAD","1σ ≈ 84% service · σ ≈ 1.25 × MAD.");
fc("m1","Product family","Group of items with similar processes/equipment used for aggregate planning in S&OP.");
fc("m1","Backlog","Customer orders received but not yet shipped.");
fc("m1","Customer service ratio","MTS: % items/$ shipped on schedule. MTO: % jobs shipped on time.");
fc("m1","S&OP reconciliation","Step where supply and demand plans are compared and imbalances resolved before executive approval.");

fc("m4","SPC","Statistical Process Control — control charts detect assignable causes vs. random variation.");

/* ================= QUIZZES ================= */
QUIZZES.m1 = [
  {q:"Which of the following is NOT one of the three primary flows in a supply chain?",options:["Information","Product/Service","Funds","Authority"],answer:3,rationale:"The three flows are information, product/service, and funds. Authority is an organizational concept, not a supply chain flow."},
  {q:"A firm that buys its key supplier is engaging in which type of integration?",options:["Forward vertical","Backward vertical","Horizontal","Lateral alliance"],answer:1,rationale:"Backward vertical integration = acquiring upstream suppliers. Forward = downstream."},
  {q:"A supply chain described as 'functions each optimize themselves without cross-functional integration' is at which maturity stage?",options:["Stage 1 Multiple dysfunction","Stage 2 Semifunctional enterprise","Stage 3 Integrated enterprise","Stage 4 Extended enterprise"],answer:1,rationale:"Stage 2 exhibits functional silos optimizing individually. Stage 1 is deeper dysfunction with no coordination at all."},
  {q:"Real GDP is computed by applying a weighted average price to control for what?",options:["Seasonality","Exchange rate","Inflation","Population"],answer:2,rationale:"Real GDP uses fixed-basket prices to strip out inflation so growth reflects true output change."},
  {q:"A product with |price elasticity of demand| = 0.4 is best described as:",options:["Highly elastic","Inelastic","Unit elastic","Perfectly elastic"],answer:1,rationale:"|E|<1 is inelastic — quantity changes less than proportionally to price."},
  {q:"Which forecasting principle states you should forecast based on demand rather than orders?",options:["Principle 1","Principle 2","Principle 3","Principle 4"],answer:0,rationale:"Principle 1 — orders are constrained by supply; true demand must drive the forecast."},
  {q:"Exponential smoothing with α = 0.8 will:",options:["Respond slowly to changes in demand","Respond quickly to recent changes","Give equal weight to all periods","Produce identical results to a 3-period moving average"],answer:1,rationale:"Higher α puts more weight on the most recent demand, causing the forecast to respond faster (also noisier)."},
  {q:"Which method is most appropriate for long-range forecasting of a new product with no demand history?",options:["Simple moving average","Exponential smoothing","Delphi technique","Naïve method"],answer:2,rationale:"Delphi — iterative anonymous expert consensus — is the preferred qualitative method for NPI and long-horizon forecasts."},
  {q:"A tracking signal consistently reads +5.5 over several periods. This suggests:",options:["Forecasts are accurate","Forecasts are biased low","Forecasts are biased high","Random noise only"],answer:1,rationale:"A positive tracking signal means actual > forecast on balance, i.e., the forecast is systematically too low. ±4 to ±6 indicates bias."},
  {q:"Which of the following best captures the 'Act' phase of the PDCA cycle?",options:["Set targets and metrics","Execute the plan","Compare actual vs. target","Standardize successes or correct deviations"],answer:3,rationale:"The Act phase institutionalizes what worked or corrects what didn't, setting up the next PDCA cycle."},
  {q:"Deseasonalizing demand requires dividing actual demand by:",options:["Trend value","Seasonal index","Weighted moving average","Regression coefficient"],answer:1,rationale:"Actual ÷ seasonal index removes seasonal effect before applying trend/time-series methods; then reseasonalize at the end."},
  {q:"MAPE is defined as:",options:["Σ Error / n","Σ |Error| / n","(Σ |Error / Actual|) / n × 100%","Σ Error² / n"],answer:2,rationale:"MAPE = Mean Absolute Percentage Error; scale-free so you can compare across items."},
  {q:"Which demand pattern component represents repeating within-year variation?",options:["Trend","Cycle","Seasonality","Random"],answer:2,rationale:"Seasonality = predictable repeating pattern within a year (quarterly, monthly, weekly)."},
  {q:"The 4 Ps of marketing include all EXCEPT:",options:["Price","Placement","Planning","Promotion"],answer:2,rationale:"The Ps are Product, Price, Placement (channel), Promotion. Planning is not one of the 4 Ps."},
  {q:"Forecasts are generally MORE accurate when:",options:["For individual items vs. groups","For long horizons vs. short","For groups vs. individual items","When they include no error estimate"],answer:2,rationale:"Principle 4 — aggregation reduces randomness, so group (category/family) forecasts are more accurate than individual SKUs."},
];

QUIZZES.m2 = [
  {q:"Which supply chain design is best for functional products with stable demand?",options:["Responsive","Efficient","Agile","Risk-hedging"],answer:1,rationale:"Fisher's framework: functional products → efficient, low-cost chain. Innovative products → responsive."},
  {q:"The PRIMARY benefit of ERP is:",options:["Best-of-breed functionality per module","Single integrated database and transactional backbone","No customization ever required","Elimination of all master data issues"],answer:1,rationale:"ERP's core value is one source of truth across functions; best-of-breed trades integration for best functionality."},
  {q:"Configuration is preferred over customization because it:",options:["Allows unlimited code changes","Preserves upgrade path","Is always cheaper at year 1","Eliminates the need for training"],answer:1,rationale:"Configuration uses delivered functionality and survives upgrades; customization breaks upgrades and raises TCO."},
  {q:"Which integration method involves the supplier owning the replenishment decision for the customer?",options:["CPFR","VMI","Quick Response","Cross-docking"],answer:1,rationale:"VMI = Vendor-Managed Inventory; supplier decides when and how much to replenish based on shared data."},
  {q:"CPFR stands for:",options:["Continuous Planning, Forecasting & Replenishment","Collaborative Planning, Forecasting & Replenishment","Consolidated Procurement, Forecasting & Reporting","Customer Planning for Rapid Response"],answer:1,rationale:"Collaborative Planning, Forecasting & Replenishment — shared forecasts and replenishment plans with partners."},
  {q:"Under Incoterms, EXW:",options:["Places maximum responsibility on the seller","Places maximum responsibility on the buyer","Is used only for sea shipments","Requires seller to clear goods for export"],answer:1,rationale:"Ex Works = seller's minimum obligation; buyer takes over at the seller's premises."},
  {q:"DDP (Delivered Duty Paid) means:",options:["Seller delivers to the first carrier only","Buyer is responsible for import duties","Seller bears risk until goods reach buyer's named place, duties paid","Terms only for inland water transport"],answer:2,rationale:"DDP = maximum seller obligation — duties paid, delivered to buyer's named place."},
  {q:"Risk pooling reduces safety stock because:",options:["Centralized variance is the sum of variances","Central inventory sees less demand","Aggregated demand has lower relative variability","Suppliers always deliver faster"],answer:2,rationale:"Aggregated demand has lower CV (variance adds in quadrature); safety stock ∝ σ, so pooling lowers total SS by √n."},
  {q:"Which of the following is a middleware/API purpose?",options:["Store master data","Provide transactional financial ledgers","Connect disparate systems for real-time data exchange","Replace the ERP"],answer:2,rationale:"Middleware and APIs enable real-time data exchange between front-end, ERP, and external systems."},
  {q:"The HS (Harmonized System) code is used for:",options:["Carrier rate tariffs","Customs classification and duties","ERP master data","Cybersecurity audits"],answer:1,rationale:"HS codes classify goods internationally for customs duty and trade statistics."},
  {q:"A Free Trade Zone (FTZ) primarily allows firms to:",options:["Pay duties immediately on arrival","Defer or avoid duties until goods enter commerce","Avoid all regulations","Bypass customs entirely"],answer:1,rationale:"In an FTZ, duties are deferred or avoided until goods leave the zone into the home market."},
  {q:"Which technology MOST directly provides real-time alerts when supply chain events deviate from plan?",options:["ERP transactional modules","APS","SCEM","WMS"],answer:2,rationale:"Supply Chain Event Management monitors events in real time against thresholds and triggers alerts."},
  {q:"In a cash-to-cash cycle, a LOWER number is achieved by:",options:["Increasing DIO and DSO","Decreasing DPO","Decreasing DIO and DSO while increasing DPO","Ignoring inventory turns"],answer:2,rationale:"Cash-to-cash = DIO + DSO − DPO. Less inventory and faster collections while paying suppliers later reduce it."},
  {q:"The nucleus firm in a supply chain is:",options:["The largest tier-2 supplier","A 3PL logistics provider","The focal firm that orchestrates network decisions","The end customer"],answer:2,rationale:"The nucleus (focal) firm is the orchestrator that leads design and cross-partner decisions."},
  {q:"GDPR primarily governs:",options:["Supply chain carbon emissions","Cross-border tariffs","Processing of personal data of EU residents","Anti-bribery compliance"],answer:2,rationale:"GDPR = EU General Data Protection Regulation; consent-based processing of personal data."},
];

QUIZZES.m3 = [
  {q:"Sourcing vs. procurement: sourcing is best described as:",options:["The transactional act of issuing a PO","The strategic process of supplier selection and relationship management","The same thing as procurement","Always outsourced to a 3PL"],answer:1,rationale:"Sourcing is strategic; procurement is tactical (PO, receive, pay)."},
  {q:"Which is NOT a typical make-vs-buy consideration?",options:["Core competency","Lost skills/knowledge risk","TCO / landed cost","Competitor's brand color"],answer:3,rationale:"Core competency, skill retention, and TCO are core considerations. Competitor aesthetics are not."},
  {q:"TCO typically includes all EXCEPT:",options:["Acquisition price","Inventory carrying cost","Disposal cost","Competitor's marketing budget"],answer:3,rationale:"TCO covers all costs across the ownership lifecycle of the buying firm — not competitors' costs."},
  {q:"On the Kraljic matrix, items with HIGH profit impact and HIGH supply risk are:",options:["Non-critical","Leverage","Bottleneck","Strategic"],answer:3,rationale:"Strategic items — treat with long-term partnership, joint development, risk share."},
  {q:"Leverage items (Kraljic) are characterized by:",options:["Low profit impact, low risk","High profit impact, low risk","Low profit impact, high risk","High profit impact, high risk"],answer:1,rationale:"Leverage: high spend, many suppliers — exploit buying power through bidding and consolidation."},
  {q:"A 'should-cost' analysis is used to:",options:["Determine the landed cost","Model what an item should cost from first principles (materials + labor + overhead + margin)","Audit supplier books","Calculate EOQ"],answer:1,rationale:"Should-cost benchmarks supplier quotes against a bottom-up cost model."},
  {q:"Concurrent engineering provides which benefit over traditional sequential design?",options:["Slower time to market","Late supplier involvement","Reduced development time and cost","Single-function decisions"],answer:2,rationale:"Concurrent engineering integrates cross-functional teams — including suppliers — early, reducing time and cost."},
  {q:"DFM stands for:",options:["Design for Manufacturing","Design for Marketing","Demand for Materials","Data flow Mapping"],answer:0,rationale:"DFM = Design for Manufacturing — one of the DFX family (DFA, DFS, DFE, etc.)."},
  {q:"A performance specification:",options:["Dictates exact dimensions and materials","Describes the functional outcome the item must achieve","Is used only for commodities","Cannot be used with outsourced suppliers"],answer:1,rationale:"Performance specs give supplier freedom in HOW while constraining WHAT the product must achieve."},
  {q:"Value engineering focuses on:",options:["Maximizing aesthetic value","Cutting cost while preserving function","Adding features irrespective of cost","Marketing communications"],answer:1,rationale:"VE/VA eliminates unnecessary cost without sacrificing function or quality."},
  {q:"Which contract type transfers cost risk to the supplier?",options:["Fixed-price","Cost-plus-fixed-fee","Time & materials","Cost-reimbursable"],answer:0,rationale:"Under fixed-price, the supplier bears overrun risk; buyer pays agreed price regardless of supplier cost."},
  {q:"BATNA is:",options:["A type of contract","Your best alternative to a negotiated agreement","A freight term","A sourcing event"],answer:1,rationale:"BATNA anchors your walkaway value — you should never accept terms worse than your BATNA."},
  {q:"Supplier right-sizing balances:",options:["Quality vs. speed","Risk reduction (more suppliers) vs. leverage (fewer suppliers)","Make vs. buy","Domestic vs. offshore"],answer:1,rationale:"More suppliers → less single-source risk; fewer suppliers → more volume leverage. Right-size balances these."},
  {q:"Spend analysis typically reveals:",options:["Perfect parity across all suppliers","A Pareto (80-20) distribution","That all spend is strategic","Equal spending by category"],answer:1,rationale:"Spend almost always follows 80-20: a few suppliers/categories account for most spend."},
  {q:"A preferred supplier relationship usually implies:",options:["Lowest price only","Multi-year performance-based relationship","No measurable KPIs","One-time transaction"],answer:1,rationale:"Preferred suppliers have performance scorecards and multi-year engagement; not pure spot buying."},
];

QUIZZES.m4 = [
  {q:"S&OP is conducted at which level of detail?",options:["SKU-level, daily","Product-family, monthly","Work center, hourly","Component, weekly"],answer:1,rationale:"S&OP works at product-family level with monthly cadence over 12–18 months."},
  {q:"ATP (Available-to-Promise) is calculated as:",options:["Forecast minus customer orders","MPS in this period + prior PAB − customer orders before the next MPS receipt","Beginning inventory + receipts","EOQ × lead time"],answer:1,rationale:"ATP = supply available to promise to new orders between MPS receipts — discrete ATP formula."},
  {q:"A demand fence (time fence) is a period in which:",options:["Forecasts are freely changed","MPS is frozen; no changes allowed","MRP doesn't run","Capacity is unconstrained"],answer:1,rationale:"Demand / inside time fence = frozen window; changes require significant authorization."},
  {q:"MRP inputs include all EXCEPT:",options:["MPS","Bills of material","Inventory records","Daily shipping manifests"],answer:3,rationale:"MRP inputs: MPS, BOM, inventory records, lead times. Shipping manifests are outbound execution documents."},
  {q:"MRP logic sequence is:",options:["Exploding → offsetting → netting","Netting → lot-sizing → offsetting → exploding","Lot-sizing → netting → exploding","Offsetting → exploding → netting"],answer:1,rationale:"Standard MRP flow: net gross requirements, apply lot-sizing, offset for lead time, explode to next BOM level."},
  {q:"RCCP (Rough-Cut Capacity Planning) validates:",options:["The MRP plan in detail","The MPS against critical resources","Daily dispatch lists","Shipping capacity"],answer:1,rationale:"RCCP is an MPS-level capacity check on critical work centers before MRP runs."},
  {q:"Utilization = ?",options:["Actual output / Design capacity","Actual output / Standard output","Standard output / Design capacity","Hours × Efficiency"],answer:0,rationale:"Utilization = actual output (or hours) ÷ design capacity (or scheduled hours). Efficiency compares to standard."},
  {q:"The Theory of Constraints' FIRST focusing step is:",options:["Elevate","Exploit","Identify the constraint","Subordinate"],answer:2,rationale:"The 5 steps: Identify → Exploit → Subordinate → Elevate → Repeat."},
  {q:"In lean, which is NOT one of the seven wastes?",options:["Overproduction","Defects","Transportation","Documentation"],answer:3,rationale:"TIMWOOD: Transport, Inventory, Motion, Waiting, Over-processing, Overproduction, Defects. Some add 'non-utilized talent' as an 8th."},
  {q:"SMED's goal is to:",options:["Reduce setup/changeover time","Improve product quality","Increase batch size","Eliminate inventory"],answer:0,rationale:"Single-Minute Exchange of Dies — reduce setup time to single-digit minutes to enable small batches."},
  {q:"DMAIC is associated with:",options:["Lean only","Six Sigma","TOC","ISO 9001"],answer:1,rationale:"DMAIC = Define, Measure, Analyze, Improve, Control — Six Sigma project framework."},
  {q:"ABC analysis classifies items by:",options:["Alphabet","Annual dollar usage / importance","Weight","Color"],answer:1,rationale:"ABC ranks items by annual dollar usage; A items highest control, C lowest."},
  {q:"EOQ formula is:",options:["√(2DS/H)","D × S × H","2DH / S","(D+S)/H"],answer:0,rationale:"EOQ = √(2·D·S/H) — balances ordering/setup and holding cost."},
  {q:"Safety stock for 95% service level uses a z-factor of approximately:",options:["1.00","1.28","1.65","2.33"],answer:2,rationale:"z≈1.65 for 95% one-tailed service level. 1.28 ≈ 90%; 2.33 ≈ 99%."},
  {q:"Inventory turns = ?",options:["COGS / Average inventory","Sales / Safety stock","EOQ × cycle time","Average inventory / Daily demand"],answer:0,rationale:"Turns = COGS ÷ average inventory — how many times stock cycles per year."},
];

QUIZZES.m5 = [
  {q:"Which of the following is NOT one of the Seven Rs of logistics?",options:["Right product","Right quantity","Right receipt","Right time"],answer:2,rationale:"Seven Rs: right product, quantity, condition, place, time, customer, cost. 'Right receipt' is not one."},
  {q:"A 4PL is BEST described as:",options:["A shipper that owns its own trucks","An asset-heavy carrier","A lead logistics integrator managing multiple 3PLs and tech","A customs broker"],answer:2,rationale:"4PL = lead orchestrator; asset-light, manages multiple 3PLs and the technology stack."},
  {q:"Cross-docking primarily aims to:",options:["Store goods for longer","Bypass storage, transferring inbound directly to outbound","Increase order cycle time","Simplify customs clearance"],answer:1,rationale:"Cross-docking moves products directly from receiving to shipping with minimal or no storage."},
  {q:"Which mode of transport is BEST for low-value, bulk, international shipments?",options:["Air","Truck","Water","Parcel"],answer:2,rationale:"Water/ocean freight is the lowest cost per unit-mile but the slowest — ideal for bulk, low-value international."},
  {q:"A bill of lading functions as:",options:["Only a receipt for goods","A contract of carriage and receipt of goods","A customs declaration only","A marketing brochure"],answer:1,rationale:"A BOL is simultaneously a contract of carriage, receipt of goods, and (if negotiable) document of title."},
  {q:"Demurrage is a charge for:",options:["Fuel","Excessive use of a carrier's equipment (detention beyond free time)","Insurance","Customs clearance"],answer:1,rationale:"Demurrage (and detention) charges equipment held beyond allotted free time at port/DC/shipper."},
  {q:"Increasing the number of distribution centers typically:",options:["Increases transportation cost and reduces inventory","Increases inventory and reduces outbound transportation cost","Has no inventory effect","Is always cheaper overall"],answer:1,rationale:"More DCs → more safety stock (√n law) AND shorter last-mile → lower outbound transport. Optimum balances these."},
  {q:"Reverse logistics product recovery is MOST preferred in which hierarchy order?",options:["Dispose > Recycle > Remanufacture > Refurbish > Repair","Repair > Refurbish > Remanufacture > Recycle > Dispose","Recycle > Repair > Dispose > Refurbish","Refurbish > Dispose > Recycle > Repair"],answer:1,rationale:"Best-to-worst: Repair, Refurbish, Remanufacture, Recycle, Dispose."},
  {q:"WEEE applies to:",options:["Food products","Electrical/electronic waste in the EU","Currency exchange","Transport emissions"],answer:1,rationale:"WEEE = EU Waste Electrical and Electronic Equipment Directive, drives take-back/recycling."},
  {q:"Random stock location (vs. fixed) generally provides:",options:["Slower picking, better accuracy","Better space utilization, more complex without WMS","Lower overall cost with zero system","Reduces need for training"],answer:1,rationale:"Random/dynamic slotting maximizes space utilization but requires a WMS to track locations."},
  {q:"LTL freight is:",options:["Dedicated trailer for one shipper","Shared trailer, multiple shippers, classed freight","Always air","Over dimensional-only"],answer:1,rationale:"LTL (Less-than-Truckload) consolidates freight from multiple shippers; priced on class and distance."},
  {q:"Risk pooling via centralization cuts aggregate safety stock approximately by factor:",options:["N","log N","√N","N²"],answer:2,rationale:"Square-root law: total safety stock ratio ≈ 1/√N compared to N independent locations."},
  {q:"Which is part of extended producer responsibility (EPR)?",options:["Consumer pays all disposal costs","Producer responsible for product end-of-life","Only retailers handle returns","Governments absorb all waste"],answer:1,rationale:"EPR makes the producer financially/physically responsible for end-of-life management."},
  {q:"Collaborative Transportation Management (CTM) primarily seeks to:",options:["Reduce collaboration","Optimize transport by sharing information across shippers and carriers","Eliminate carriers","Increase empty miles"],answer:1,rationale:"CTM aligns shipper/carrier plans — reduces empty miles, balances loads, improves service."},
  {q:"Green logistics tactics include all EXCEPT:",options:["Modal shift to rail/water","Returnable packaging","Route optimization","Increasing empty backhauls"],answer:3,rationale:"Reducing — not increasing — empty backhauls lowers emissions."},
];

QUIZZES.m7 = [
  {q:"ISO 31000 defines risk as:",options:["Only negative outcomes","The effect of uncertainty on objectives","Only financial loss","Insurance premium × probability"],answer:1,rationale:"ISO 31000 defines risk as an 'effect of uncertainty on objectives' — positive or negative."},
  {q:"A risk register typically includes all EXCEPT:",options:["Probability and impact","Risk owner","Response plan","Employee satisfaction score"],answer:3,rationale:"Risk register captures risk, category, cause, P/I, owner, response, triggers, status — not HR metrics."},
  {q:"COSO ERM is focused on:",options:["Supply chain security only","Enterprise Risk Management framework","Inventory policy","Transportation classification"],answer:1,rationale:"COSO ERM is the widely used enterprise risk management framework."},
  {q:"Expected Monetary Value (EMV) equals:",options:["Probability / Impact","Σ (Probability × Impact)","Max of Probability, Impact","Average of impacts"],answer:1,rationale:"EMV sums probability-weighted impacts for each risk/outcome."},

  {q:"Which response strategy for threats seeks to reduce probability or impact without eliminating the risk?",options:["Avoid","Transfer","Mitigate","Accept"],answer:2,rationale:"Mitigate reduces P or I (e.g., multi-source, safety stock). Avoid eliminates the cause. Transfer shifts it (insurance). Accept = take it."},

  {q:"RPO is:",options:["Return Processing Office","Recovery Point Objective — maximum tolerable data loss","Replenishment Order","Rate of Production Output"],answer:1,rationale:"RPO defines how much data (time) a firm can lose — sets backup/replication frequency."},
  {q:"A BIA (Business Impact Analysis) establishes:",options:["Which processes are critical and what impact their disruption causes over time","Six Sigma control chart limits","Supplier scorecards","Capacity requirements"],answer:0,rationale:"A BIA is the foundation of a BCP — identifies critical processes and time-based impact."},
  {q:"C-TPAT is a program designed to:",options:["Reduce customs/clearance time for trusted traders","Set Incoterms","Govern GDPR","Manage 3PL contracts"],answer:0,rationale:"C-TPAT is a US Customs-Trade Partnership to expedite clearance for security-certified firms."},
