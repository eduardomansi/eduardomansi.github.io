<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSCP Master Study App</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#111827; --panel:#1e293b; --panel2:#253449;
    --ink:#e5e7eb; --mute:#94a3b8; --accent:#38bdf8; --accent2:#22d3ee;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --border:#334155;
    --chip:#1e40af; --chip2:#0e7490;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b1222 0%,#0f172a 100%);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.5px}
  .brand h1{font-size:1.05rem;margin:0;letter-spacing:.3px}
  .brand small{color:var(--mute);display:block;font-weight:400}
  nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
  nav.tabs button{background:transparent;color:var(--mute);border:1px solid transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem}
  nav.tabs button:hover{color:var(--ink);background:#1a2540}
  nav.tabs button.active{color:#fff;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:#0ea5e9}
  main{max-width:1200px;margin:0 auto;padding:24px 22px 80px}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2.section-title{font-size:1.55rem;margin:8px 0 6px;letter-spacing:.2px}
  .lead{color:var(--mute);margin:0 0 20px}
  .grid{display:grid;gap:16px}
  .cards-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .cards-4{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .card h3{margin:0 0 6px;font-size:1.05rem}
  .card p{margin:0;color:var(--mute)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;background:#0e7490;color:#cffafe;font-size:.78rem;font-weight:600;margin-right:6px}
  .pill.mod1{background:#0e7490;color:#cffafe}
  .pill.mod2{background:#6d28d9;color:#ede9fe}
  .pill.mod3{background:#b45309;color:#fef3c7}
  .pill.mod4{background:#047857;color:#d1fae5}
  .pill.mod5{background:#be185d;color:#fce7f3}
  .pill.mod6{background:#4338ca;color:#e0e7ff}
  .pill.mod7{background:#b91c1c;color:#fee2e2}
  .pill.mod8{background:#0369a1;color:#e0f2fe}
  .progress{height:8px;background:#0b1222;border-radius:999px;overflow:hidden;margin-top:10px}
  .progress>div{height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1);transition:width .3s}
  .btn{background:#0ea5e9;color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
  .btn.ghost:hover{background:#1a2540}
  .btn.good{background:var(--good)}
  .btn.bad{background:var(--bad)}
  .btn.warn{background:var(--warn)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .kv{display:flex;gap:8px;align-items:baseline}
  .kv b{color:var(--ink)}
  .kv span{color:var(--mute)}
  details{background:#16213a;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0}
  details[open]{background:#17243f}
  summary{cursor:pointer;font-weight:700;padding:4px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--accent);font-weight:700;margin-right:4px}
  details[open] summary::before{content:"▾ "}
  .keyterm{background:#0b1830;border-left:4px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:6px}
  .keyterm b{color:#7dd3fc}
  .formula{background:#0a2213;border-left:4px solid var(--good);padding:8px 12px;margin:8px 0;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#bbf7d0}
  .tip{background:#1e1a06;border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;border-radius:6px;color:#fde68a}
  .danger{background:#2b0a0a;border-left:4px solid var(--bad);padding:8px 12px;margin:8px 0;border-radius:6px;color:#fecaca}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#0b1830;color:#cbd5e1}
  .module-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .module-tabs button{background:#162138;color:var(--ink);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem}
  .module-tabs button.active{background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:#0ea5e9;color:#fff}
  /* Flashcards */
  .flashcard{perspective:1200px;height:220px;cursor:pointer}
  .flashcard .face{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .flashcard.flipped .face{transform:rotateY(180deg)}
  .flashcard .front,.flashcard .back{position:absolute;inset:0;border-radius:14px;padding:18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border)}
  .flashcard .front{background:linear-gradient(135deg,#1e293b,#0f172a);font-weight:700;font-size:1.15rem}
  .flashcard .back{background:linear-gradient(135deg,#0b3b4a,#0e7490);color:#e0f7fa;transform:rotateY(180deg);font-size:.95rem;overflow-y:auto}
  .flash-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  select,input[type=text]{background:#0b1222;color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  /* Quiz */
  .q-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin:14px 0}
  .q-text{font-weight:600;margin-bottom:12px}
  .q-opts{display:grid;gap:8px}
  .q-opt{background:#0b1830;border:1px solid var(--border);padding:10px 14px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .q-opt:hover{background:#12223e}
  .q-opt input{margin-top:3px}
  .q-opt.correct{background:#062e1a;border-color:#22c55e}
  .q-opt.wrong{background:#2e0606;border-color:#ef4444}
  .rationale{margin-top:12px;padding:10px 12px;background:#0b1830;border-left:4px solid var(--accent);border-radius:6px;color:#cbd5e1}
  .score-banner{background:linear-gradient(135deg,#6366f1,#0ea5e9);border-radius:14px;padding:22px;text-align:center;margin:16px 0}
  .score-banner h3{margin:0 0 6px;font-size:1.6rem}
  .score-banner p{margin:0;color:#e0e7ff}
  /* Diagrams */
  .diagram-wrap{background:#0b1222;border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
  .diagram-wrap svg{width:100%;height:auto;max-height:520px}
  .legend{font-size:.85rem;color:var(--mute);margin-top:8px}
  .clickable{cursor:pointer;transition:opacity .2s, transform .2s}
  .clickable:hover{opacity:.8;transform:scale(1.02)}
  footer{text-align:center;color:var(--mute);margin-top:40px;font-size:.85rem}
  .stat-box{display:flex;flex-direction:column;gap:4px}
  .stat-box b{font-size:1.8rem;color:#7dd3fc}
  .stat-box span{color:var(--mute);font-size:.85rem}
  @media (max-width:700px){
    .brand h1{font-size:.95rem}
    nav.tabs button{padding:6px 10px;font-size:.82rem}
    h2.section-title{font-size:1.25rem}
  }
</style>
</head>

MODULES.push({
  id:"m1", shortTitle:"Mod 1 · Demand/Forecast",
  title:"Module 1 — Supply Chains, Demand Management & Forecasting",
  blurb:"Foundations of supply chain, demand analysis, demand planning, and all major forecasting techniques.",
  sections:[
    {open:true,title:"A. Introduction to Supply Chains",body:`
      <p>A <b>supply chain</b> is the global network used to deliver products and services from raw materials to end customers through an engineered flow of <b>information, physical distribution, and cash</b>. A basic chain includes <b>supplier → producer → distributor → retailer → customer</b>.</p>
      <div class="keyterm"><b>Three flows:</b> Information (orders, forecasts, status) · Product/Service (from raw material to consumer) · Funds (generally upstream, opposite of product flow).</div>
      <div class="keyterm"><b>Value and balance:</b> Each link must add <b>value</b> greater than its cost. Goals: balance supply and demand while creating a service-profit chain.</div>
      <h4>Vertical vs. lateral (horizontal) integration</h4>
      <table><tr><th>Vertical</th><th>Lateral / horizontal</th></tr>
      <tr><td>Single firm owns multiple stages (upstream = backward integration; downstream = forward). Gains control, reduces transaction costs, but needs heavy capital and adds rigidity.</td>
      <td>Partnerships across the chain via contracts, alliances, or joint ventures. Retains focus on core competencies; gains agility but requires trust and governance.</td></tr></table>
      <h4>Stages of supply chain evolution</h4>
      <ol>
        <li><b>Multiple dysfunction</b> — silos, no shared data, reactive firefighting.</li>
        <li><b>Semifunctional enterprise</b> — functions optimize themselves; limited cross-functional integration.</li>
        <li><b>Integrated enterprise</b> — internal cross-functional alignment; S&amp;OP in place.</li>
        <li><b>Extended enterprise</b> — tier-1 suppliers and key customers linked; shared forecasts (e.g., CPFR).</li>
        <li><b>Orchestrated supply chain</b> — multi-tier collaboration, real-time visibility, network-wide optimization.</li>
      </ol>
      <div class="tip"><b>Exam cue:</b> The CSCP expects you to identify maturity stage from description and map appropriate strategy (e.g., stage 1 needs basic integration, not advanced analytics).</div>
      <h4>Manufacturing vs. service supply chains</h4>
      <p>Service chains often lack inventory buffer (production = consumption) — they emphasize capacity and scheduling flexibility. Specialized chains include reverse (returns), fast-fashion, and perishable / cold-chain.</p>
    `},
    {title:"B. Demand Analysis & Patterns",body:`
      <h4>Demand analysis road map</h4>
      <p>Combine <b>SWOT</b>, <b>market research</b>, <b>product assessment</b>, and macro/microeconomic data to understand demand drivers before you forecast.</p>
      <div class="keyterm"><b>SWOT:</b> Strengths/Weaknesses are internal; Opportunities/Threats are external. Used to align capabilities with market conditions.</div>
      <h4>Market research types</h4>
      <ul>
        <li><b>Primary</b> — surveys, focus groups, interviews; costly but current.</li>
        <li><b>Secondary</b> — published data, trade reports, internal records.</li>
        <li><b>Qualitative</b> — attitudes, preferences; <b>quantitative</b> — numeric share, volume, price elasticity.</li>
      </ul>
      <h4>Product life cycle (PLC)</h4>
      <p><b>Introduction → Growth → Maturity → Decline</b>. Each phase changes demand pattern and forecasting technique.</p>
      <table><tr><th>Stage</th><th>Volume</th><th>Forecast method</th><th>Priority</th></tr>
        <tr><td>Introduction</td><td>Low, uncertain</td><td>Judgmental, Delphi</td><td>Trial / awareness</td></tr>
        <tr><td>Growth</td><td>Rising quickly</td><td>Associative / trend</td><td>Expand capacity</td></tr>
        <tr><td>Maturity</td><td>Stable, seasonal</td><td>Time-series, seasonal indexes</td><td>Efficiency, cost</td></tr>
        <tr><td>Decline</td><td>Falling</td><td>Naïve / trend</td><td>Reduce inventory / exit</td></tr></table>
      <h4>Macroeconomic drivers</h4>
      <div class="keyterm"><b>GDP (real):</b> inflation-adjusted output. Rising real GDP ≈ expanding demand. Uses a <b>weighted average price</b> (fixed basket) to strip inflation.</div>
      <div class="keyterm"><b>Inflation</b>: general rise in prices; <b>Deflation</b>: general fall. Both distort demand signals — always analyze in real terms.</div>
      <p>Business cycles have four phases: expansion, peak, recession, trough. A <b>recession</b> = 2 consecutive quarters of negative real GDP growth; a <b>depression</b> is a severe, prolonged downturn.</p>
      <h4>Microeconomic concepts</h4>
      <div class="formula">Price elasticity of demand = % Δ quantity demanded / % Δ price</div>
      <ul>
        <li>|E| &gt; 1 → elastic (luxury, many substitutes)</li>
        <li>|E| &lt; 1 → inelastic (necessities, few substitutes)</li>
        <li>|E| = 1 → unit-elastic</li>
      </ul>
      <p><b>Marginal analysis</b> — compare marginal cost to marginal revenue; expand output while MR &gt; MC.</p>
      <h4>Short-/medium-term demand patterns</h4>
      <ul>
        <li><b>Trend</b> — sustained direction (up/down).</li>
        <li><b>Cycle</b> — multi-year business cycle.</li>
        <li><b>Seasonality</b> — repeating within a year.</li>
        <li><b>Promotions / internal</b> — self-induced.</li>
        <li><b>Random / irregular</b> — noise you can't forecast.</li>
      </ul>
    `},
    {title:"C. Demand Management",body:`
      <h4>Demand plan</h4>
      <p>The <b>demand plan</b> translates forecasts + market/promo intel into a consensus view of future demand that drives S&amp;OP, MPS, and procurement.</p>
      <div class="keyterm"><b>Inputs:</b> statistical forecast, sales input, marketing/promotion calendar, customer commitments, new product intros, econometric data.</div>
      <div class="keyterm"><b>Planning horizon &amp; revision period:</b> horizon must match decision cycle (e.g., 18 months for capacity); revise monthly in rolling fashion.</div>
      <h4>Communication discipline</h4>
      <p>Communicate soon, structured, and focused — send the right info to the right stakeholders so they can act.</p>
      <h4>PDCA cycle (Deming / Shewhart)</h4>
      <p><b>Plan → Do → Check → Act</b>. Used for continuous improvement of demand management: plan the forecast/process, execute, compare to actuals, adjust the process.</p>
      <h4>The Four Ps and demand shaping</h4>
      <ul>
        <li><b>Product</b> — features, variants, SKUs</li>
        <li><b>Price</b> — everyday, promotional, bundle</li>
        <li><b>Placement</b> — channels, regions, availability</li>
        <li><b>Promotion</b> — advertising, incentives, PR</li>
      </ul>
      <p><b>Demand shaping</b> = deliberately using the 4 Ps (and pricing tactics like dynamic pricing, discounts) to steer demand toward available supply.</p>
      <h4>Product life cycle management</h4>
      <p>Managing NPI (New Product Introduction) schedules, phase-in/phase-out, and retirement plans. Higher NPI frequency → higher demand uncertainty, more safety stock, shorter forecast horizons.</p>
    `},
    {title:"D. Forecasting",body:`
      <h4>Five principles of forecasting</h4>
      <ol>
        <li>Base forecasts on <b>demand</b>, not orders (orders are constrained by supply).</li>
        <li>Forecasts are <b>(almost) always wrong</b> — plan for error.</li>
        <li>Always include an <b>estimate of error</b>.</li>
        <li>Forecasts are <b>more accurate for groups</b> than for individual items.</li>
        <li>Forecasts are <b>more accurate short-term</b> than long-term.</li>
      </ol>
      <h4>Forecasting process</h4>
      <ol><li>Determine purpose &amp; horizon</li><li>Select items/groups</li><li>Gather data</li><li>Select technique</li><li>Forecast</li><li>Measure error</li><li>Adjust &amp; improve</li></ol>
      <h4>Qualitative methods</h4>
      <ul>
        <li><b>Judgmental / expert opinion</b> — sales force composite, executive opinion.</li>
        <li><b>Delphi</b> — iterative anonymous expert rounds until convergence; best for long-range, NPI, tech forecasts.</li>
        <li><b>Combination</b> — blend qualitative with quantitative for new products.</li>
      </ul>
      <h4>Quantitative: time-series</h4>
      <div class="formula">Simple moving average (n=3): F<sub>t+1</sub> = (D<sub>t</sub>+D<sub>t-1</sub>+D<sub>t-2</sub>)/3</div>
      <div class="formula">Weighted MA: F<sub>t+1</sub> = Σ(w<sub>i</sub>·D<sub>i</sub>) &nbsp; where Σw<sub>i</sub>=1</div>
      <div class="formula">Exponential smoothing: F<sub>t+1</sub> = α·D<sub>t</sub> + (1-α)·F<sub>t</sub> &nbsp; (0&lt;α&lt;1)</div>
      <p>Higher α = more weight to recent demand (faster response, noisier). Use <b>deseasonalize → forecast → reseasonalize</b> when seasonality is present.</p>
      <h4>Seasonal index</h4>
      <div class="formula">Seasonal index = Avg period demand / Avg all periods</div>
      <p>Deseasonalized demand = Actual / Seasonal index. Re-apply index after forecasting the deseasonalized series.</p>
      <h4>Associative forecasting (causal)</h4>
      <ul>
        <li><b>Simple regression</b>: Y = a + bX (one predictor).</li>
        <li><b>Multiple regression</b>: multiple independent variables (price, advertising, GDP).</li>
        <li><b>Leading indicator</b> — changes <em>before</em> demand (housing starts → appliance demand).</li>
        <li><b>Correlation ≠ causation</b>; validate causality before using.</li>
      </ul>
      <h4>Forecast error metrics</h4>
      <div class="formula">Error<sub>t</sub> = Actual<sub>t</sub> − Forecast<sub>t</sub></div>
      <div class="formula">MAD = Σ|Error|/n &nbsp;(Mean Absolute Deviation)</div>
      <div class="formula">MSE = Σ(Error²)/n &nbsp;(penalizes large errors)</div>
      <div class="formula">MAPE = (Σ|Error/Actual|)/n × 100% &nbsp;(comparable across series)</div>
      <div class="formula">Bias / Running Sum of Forecast Errors (RSFE) = Σ(Error)</div>
      <div class="formula">Tracking signal = RSFE / MAD &nbsp;(within ±4 typical; ±6 alert)</div>
      <div class="tip">If tracking signal trends outside ±4 → forecast is biased; investigate and re-parameterize.</div>
    `},
  ]
});

MODULES.push({
  id:"m2", shortTitle:"Mod 2 · Global Networks",
  title:"Module 2 — Global Supply Chain Networks",
  blurb:"Network design, IT systems (ERP/APS/WMS/TMS), visibility, e-business, master data, global considerations.",
  sections:[
    {open:true,title:"A. Supply Chain Design & Optimization",body:`
      <p><b>Supply chain design</b> translates business strategy into a physical and information network that balances <b>efficiency, responsiveness, and resilience</b>.</p>
      <div class="keyterm"><b>Efficient vs. responsive design (Fisher):</b> Functional products (stable demand) → efficient, low-cost chains. Innovative products (uncertain demand) → responsive, flexible chains.</div>
      <div class="keyterm"><b>Resilience:</b> ability to recover from disruption. Built through redundancy, flexibility, visibility, and strong supplier relationships.</div>
      <h4>Network configuration decisions</h4>
      <ul>
        <li>Number, location, capacity of facilities</li>
        <li>Centralized vs. decentralized distribution</li>
        <li>Transportation modes &amp; routes</li>
        <li>Make-or-buy at each node</li>
        <li>Inventory placement and postponement</li>
      </ul>
      <h4>Benefit-cost analysis (BCA) for IT</h4>
      <div class="formula">ROI = (Benefits − Costs) / Costs × 100%</div>
      <p><b>Tangible benefits</b> = inventory reduction, cycle-time cut, labor savings. <b>Intangible benefits</b> = better decisions, customer satisfaction, morale. Costs include licenses, hardware, integration, training, change management.</p>
      <h4>Nucleus firm & cross-functional teams</h4>
      <p>The <b>nucleus firm</b> (focal firm) orchestrates partners and makes network-level decisions. Success requires cross-functional teams with shared KPIs.</p>
    `},
    {title:"B. End-to-End Connectivity & Visibility — ERP, APS, WMS, TMS",body:`
      <h4>ERP (Enterprise Resource Planning)</h4>
      <p>Single, integrated database of master data + transactions across finance, HR, sales, manufacturing, procurement. Benefits: real-time integration, single source of truth, process discipline. Risks: cost, long implementation, change resistance.</p>
      <div class="keyterm"><b>Configuration vs. customization:</b> configure = adjust parameters within delivered functionality (preferred, easy to upgrade); customize = modify code (risky, breaks upgrades).</div>
      <div class="keyterm"><b>Best-of-breed:</b> pick the best specialized system per function and integrate. More capability per module but integration is complex.</div>
      <h4>APS (Advanced Planning & Scheduling)</h4>
      <p>Uses constraint-based optimization and memory-resident models to plan demand, supply, and capacity simultaneously across a network. Benefits: better promise dates (CTP/ATP), feasible plans, what-if analysis.</p>
      <h4>SCEM (Supply Chain Event Management)</h4>
      <p>Monitors events in real time against thresholds; generates alerts and drives corrective action. Core to <b>active visibility</b> and exception management.</p>
      <h4>WMS (Warehouse Management)</h4>
      <p>Receives, putaway, slotting, picking, packing, shipping, cycle counting, yard management. Integrates with ERP, TMS, voice-pick, RF/RFID.</p>
      <h4>TMS (Transportation Management)</h4>
      <p>Mode selection, routing, rate shopping, load consolidation, tracking, freight audit. Supports <b>collaborative transportation management (CTM)</b> across carriers and shippers.</p>
      <h4>Supply chain integration methods</h4>
      <table><tr><th>Method</th><th>What it is</th></tr>
        <tr><td>Quick-response (QR)</td><td>Retailer shares POS with suppliers to replenish faster (esp. fashion).</td></tr>
        <tr><td>Continuous replenishment (CRP)</td><td>Supplier auto-replenishes based on actual consumption.</td></tr>
        <tr><td>Vendor-Managed Inventory (VMI)</td><td>Supplier owns the replenishment decision; customer shares stock &amp; demand data.</td></tr>
        <tr><td>CPFR</td><td>Collaborative Planning, Forecasting &amp; Replenishment — shared forecasts &amp; plans.</td></tr>
        <tr><td>Distributor integration</td><td>Common systems &amp; service levels across a distributor network.</td></tr></table>
      <h4>E-business & e-commerce</h4>
      <ul>
        <li><b>B2B</b> — supplier portals, EDI, buy-side/sell-side e-commerce, exchanges.</li>
        <li><b>B2C</b> — online retail, direct-to-consumer.</li>
        <li><b>Layers</b>: content, community, commerce, collaboration.</li>
      </ul>
    `},
    {title:"C. Data, Privacy & Middleware",body:`
      <h4>Master data</h4>
      <p>Non-transactional, high-value reference data: <b>customers, suppliers, items/SKUs, BOMs, routings, locations, prices</b>. Critical to maintain <b>data quality</b> — accuracy, completeness, consistency, timeliness.</p>
      <h4>Data capture methods</h4>
      <ul>
        <li>Barcodes (UPC, EAN)</li><li>RFID (passive/active tags)</li>
        <li>GPS</li><li>IoT sensors</li><li>EDI &amp; APIs</li>
      </ul>
      <h4>Middleware & APIs</h4>
      <p><b>Middleware</b> connects front-end (customer-facing) to back-end (ERP) systems. <b>APIs</b> (REST, SOAP) enable real-time data exchange; EDI (X12, EDIFACT) enables batch structured messaging.</p>
      <h4>Legal, privacy, cybersecurity</h4>
      <ul>
        <li><b>GDPR</b> (EU) — consent-based personal data processing; data-subject rights.</li>
        <li><b>HIPAA</b> (US) — health data.</li>
        <li><b>Cybersecurity:</b> encryption, access control, intrusion detection, multi-factor auth, SOC monitoring.</li>
      </ul>
    `},
    {title:"D. International Considerations",body:`
      <h4>Currency &amp; financial risk</h4>
      <p>Exchange-rate volatility affects landed cost and margins. Mitigations: <b>natural hedge</b> (match revenues/costs in currency), forward contracts, currency clauses in supply agreements.</p>
      <h4>Incoterms 2020</h4>
      <p>Rules from ICC defining buyer/seller obligations for delivery, risk transfer, and cost of international shipments. Any mode vs. sea/inland waterway only:</p>
      <table><tr><th>Any mode</th><th>Sea/inland waterway only</th></tr>
        <tr><td>EXW, FCA, CPT, CIP, DAP, DPU, DDP</td><td>FAS, FOB, CFR, CIF</td></tr></table>
      <div class="keyterm"><b>EXW</b> (Ex Works) = seller minimum; buyer takes risk at seller's door.<br><b>DDP</b> (Delivered Duty Paid) = seller maximum; seller delivers, cleared, to buyer's location.</div>
      <h4>Trade regulations</h4>
      <ul>
        <li><b>Harmonized System (HS) codes</b> classify goods for customs &amp; tariffs.</li>
        <li><b>FTZ / free trade zone</b> — defer/avoid duties until release to home market.</li>
        <li><b>Country of origin</b> rules impact duty rates and FTAs.</li>
        <li><b>C-TPAT / AEO</b> — trusted-trader programs accelerating customs.</li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m3", shortTitle:"Mod 3 · Sourcing",
  title:"Module 3 — Sourcing Products & Services",
  blurb:"Make-vs-buy, TCO, category strategy, Kraljic, supplier relationships, contracts, product design influence.",
  sections:[
    {open:true,title:"A. Aligning Sourcing to Demand",body:`
      <h4>Sourcing vs. procurement</h4>
      <div class="keyterm"><b>Sourcing</b> = strategic process: identify need, select supplier, negotiate contract, manage relationship.<br><b>Procurement</b> = tactical transaction: release PO, receive, pay.</div>
      <h4>Make-versus-buy</h4>
      <p>Key questions:</p>
      <ol>
        <li>Is the activity a <b>core competency</b>?</li>
        <li>Consequences of <b>lost skills/knowledge</b>?</li>
        <li>Total <b>landed cost / TCO</b>?</li>
        <li>Capacity, quality, IP, strategic risk?</li>
      </ol>
      <p><b>Make</b> when: core competency, protects IP, strategic control needed, lower total cost with utilization. <b>Buy</b> when: commodity, supplier has scale, frees capital, access to specialized skill.</p>
      <h4>Contracting & outsourcing</h4>
      <ul>
        <li><b>Outsourcing</b> = contracting an external party to perform an activity previously done internally.</li>
        <li><b>Offshoring</b> = moving work to another country (can be outsourced or captive).</li>
        <li><b>Reshoring / nearshoring</b> = bringing work back closer to home due to cost/risk shifts.</li>
      </ul>
      <h4>Total Cost of Ownership (TCO)</h4>
      <p>All costs over the life of the purchase: acquisition, ownership, disposal.</p>
      <div class="formula">TCO = Purchase price + Transportation + Duties/taxes + Quality/inspection + Inventory carrying + Installation + Maintenance + Support + Disposal − Salvage</div>
      <div class="tip"><b>Landed cost</b> specifically covers the cost to land goods at destination (price + freight + duties + insurance + handling). TCO is broader.</div>
      <p><b>Should-cost analysis</b> — buyer models what the product <em>should</em> cost (material + labor + overhead + margin) to benchmark supplier quotes.</p>
    `},
    {title:"B. Category Strategy — Kraljic Matrix",body:`
      <p>The <b>Kraljic portfolio matrix</b> segments spend by two axes:</p>
      <ul>
        <li><b>Profit impact</b> / strategic importance (low → high)</li>
        <li><b>Supply risk</b> / market complexity (low → high)</li>
      </ul>
      <table><tr><th></th><th>Low risk</th><th>High risk</th></tr>
        <tr><th>Low profit impact</th><td><b>Non-critical</b> — routine items. Strategy: simplify, e-procure, blanket orders, automate.</td><td><b>Bottleneck</b> — low spend, scarce supply. Strategy: ensure supply, safety stock, qualify alternates.</td></tr>
        <tr><th>High profit impact</th><td><b>Leverage</b> — high spend, many suppliers. Strategy: competitive bidding, consolidate spend, exploit buying power.</td><td><b>Strategic</b> — high spend, scarce supply. Strategy: long-term partnership, joint development, risk share.</td></tr></table>
      <h4>Supplier segments & relationships</h4>
      <p>Type of relationship depends on mutual need &amp; strategic fit:</p>
      <ul>
        <li><b>Transactional / arm's length</b> — price focus, short term.</li>
        <li><b>Preferred supplier</b> — multi-year, performance rating.</li>
        <li><b>Strategic alliance</b> — co-investment, shared risk/reward.</li>
        <li><b>Partnership / joint venture</b> — deep integration, shared IP.</li>
      </ul>
      <h4>Supply base analysis & right-sizing</h4>
      <p><b>Spend analysis</b> categorizes and ranks spend (Pareto / 80-20). <b>Right-sizing</b> balances risk reduction (multiple suppliers) vs. leverage (fewer suppliers). Approaches: single, dual, multiple sourcing; supplier rationalization.</p>
    `},
    {title:"C. Product Design Influence & Specifications",body:`
      <h4>Traditional vs. concurrent design</h4>
      <p><b>Traditional</b> = sequential (design → procure → produce), slow, late supplier input. <b>Concurrent engineering</b> = cross-functional team including suppliers from the start; reduces cost, time, and quality problems.</p>
      <div class="keyterm"><b>Design for X (DFX):</b> design for manufacturing, assembly, serviceability, environment, cost, logistics, supply chain.</div>
      <h4>Specifications</h4>
      <ul>
        <li><b>Performance</b> spec — describes what the item must do; supplier has freedom.</li>
        <li><b>Design / technical</b> spec — exact dimensions, materials, process.</li>
        <li><b>Commercial / market</b> — brand, model, grade.</li>
      </ul>
      <p><b>Standardization</b> reduces variety; <b>modularity</b> supports mass customization &amp; postponement.</p>
      <h4>Value engineering / value analysis</h4>
      <p>Cross-functional review of a product's function vs. cost to eliminate unnecessary cost without losing function or quality.</p>
    `},
    {title:"D. Procurement & Negotiation",body:`
      <h4>Procurement cycle</h4>
      <p>Requisition → RFx (RFI / RFP / RFQ) → bid evaluation → negotiation → contract → PO → receipt → invoice match (3-way) → payment (P2P).</p>
      <h4>Contract types</h4>
      <ul>
        <li><b>Fixed-price (FFP)</b> — supplier bears cost risk; use for stable, well-defined scope.</li>
        <li><b>Cost-reimbursable</b> — buyer bears cost risk; includes CPFF, CPIF, CPAF.</li>
        <li><b>T&amp;M</b> — time &amp; materials; used when scope uncertain.</li>
        <li><b>Indefinite delivery (IDIQ, blanket)</b> — umbrella contract; releases by PO.</li>
      </ul>
      <h4>Negotiation styles</h4>
      <p><b>Distributive</b> (win-lose, fixed pie) vs. <b>integrative</b> (win-win, expand the pie). Know your <b>BATNA</b> (best alternative to a negotiated agreement) and ZOPA (zone of possible agreement).</p>
      <h4>Supplier evaluation & metrics</h4>
      <p>Common KPIs: <b>on-time delivery, quality PPM, price variance, fill rate, lead time, responsiveness</b>. Use weighted scorecards to compare.</p>
    `},
  ]
});

MODULES.push({
  id:"m4", shortTitle:"Mod 4 · Internal Ops",
  title:"Module 4 — Internal Operations & Inventory",
  blurb:"S&OP, MPS, MRP, DRP, capacity planning, lean, TOC, inventory models (EOQ, ROP, ABC), Six Sigma.",
  sections:[
    {open:true,title:"A. Planning Operations — S&OP, MPS, MRP, DRP",body:`
      <h4>Manufacturing planning & control hierarchy</h4>
      <p>Strategic → Tactical → Operational:</p>
      <ol>
        <li><b>Business plan</b> — financial, multi-year.</li>
        <li><b>S&amp;OP</b> (Sales &amp; Operations Planning) — balances demand and supply at family level; monthly; 12–18 month horizon.</li>
        <li><b>Master production schedule (MPS)</b> — end-item level; weekly buckets; 3–12 months.</li>
        <li><b>MRP</b> — component/material level; explodes BOMs.</li>
        <li><b>PAC</b> (production activity control) — shop floor dispatching.</li>
      </ol>
      <h4>Master scheduling calculations</h4>
      <div class="formula">PAB (Projected Available Balance) = Prior PAB + MPS − max(Forecast, Customer Orders)</div>
      <div class="formula">ATP (Available-to-Promise) = MPS in this period + Prior PAB − Σ Customer orders before next MPS receipt</div>
      <div class="keyterm"><b>Time fences:</b> Demand fence (frozen — no changes, MPS firm) · Planning fence (trading — changes with authorization) · Beyond planning fence (liquid).</div>
      <h4>MRP</h4>
      <p>Inputs: <b>MPS, BOM, inventory records, lead times</b>. Outputs: <b>planned orders</b> (purchase/work orders), reschedule messages, exception reports.</p>
      <p>Logic: <b>netting → lot-sizing → offsetting → exploding</b>.</p>
      <div class="formula">Net requirement = Gross requirement − On-hand − Scheduled receipts + Safety stock</div>
      <p>Lot-sizing: lot-for-lot, fixed order quantity, POQ, EOQ, Least-total-cost.</p>
      <h4>DRP (Distribution Requirements Planning)</h4>
      <p>Extends MRP logic into the distribution network. Pulls net requirements from DCs back to the plant. <b>Push</b> = central pushes stock to DCs; <b>pull</b> = DC requests based on local demand (preferred for responsiveness).</p>
    `},
    {title:"B. Capacity & Production Activity Control",body:`
      <h4>Capacity planning hierarchy</h4>
      <ol>
        <li><b>Resource planning</b> (long-term, aligned with S&amp;OP)</li>
        <li><b>Rough-cut capacity planning (RCCP)</b> — validates MPS against critical resources</li>
        <li><b>Capacity requirements planning (CRP)</b> — detailed, against MRP</li>
        <li><b>Input/Output control</b> — PAC-level, tracks planned vs. actual</li>
      </ol>
      <h4>Capacity strategies</h4>
      <ul>
        <li><b>Lead</b> — add capacity in anticipation of demand; hedge.</li>
        <li><b>Lag</b> — add only after demand proves; cost-driven.</li>
        <li><b>Match / tracking</b> — small incremental adds.</li>
      </ul>
      <h4>Measuring capacity</h4>
      <div class="formula">Utilization = Actual output / Design capacity</div>
      <div class="formula">Efficiency = Actual output / Standard (effective) output</div>
      <div class="formula">Rated capacity = Available time × Utilization × Efficiency</div>
      <p><b>Demonstrated capacity</b> = recent average of actual output.</p>
      <h4>Theory of Constraints (TOC)</h4>
      <p>Goldratt: throughput = sales − variable cost; constraint (bottleneck) determines throughput. <b>Five focusing steps:</b> Identify → Exploit → Subordinate → Elevate → Repeat.</p>
      <p><b>Drum-Buffer-Rope (DBR)</b>: constraint paces the plant (drum); buffers protect it; rope syncs release.</p>
    `},
    {title:"C. Lean, JIT & Six Sigma",body:`
      <h4>Lean principles</h4>
      <p>Specify value (customer view) → map the value stream → create flow → pull at customer rate (takt) → pursue perfection.</p>
      <div class="keyterm"><b>Seven wastes (TIMWOOD / DOWNTIME):</b> Defects, Overproduction, Waiting, Non-utilized talent, Transportation, Inventory, Motion, Extra processing.</div>
      <h4>Lean tools</h4>
      <ul>
        <li><b>5S</b> — Sort, Set-in-order, Shine, Standardize, Sustain</li>
        <li><b>Kanban</b> — visual pull signals</li>
        <li><b>SMED</b> — single-minute exchange of dies (setup reduction)</li>
        <li><b>Poka-yoke</b> — mistake-proofing</li>
        <li><b>Jidoka</b> — autonomation; stop the line on defect</li>
        <li><b>Heijunka</b> — level loading/mix</li>
        <li><b>Value stream map (VSM)</b></li>
        <li><b>Gemba walk</b> — go see</li>
      </ul>
      <h4>Just-in-Time (JIT)</h4>
      <p>Produce and deliver only what is needed, when needed, in the quantity needed. Requires level demand, short setups, reliable suppliers, high quality.</p>
      <h4>Six Sigma / DMAIC</h4>
      <p>Data-driven defect reduction to ≤3.4 DPMO. <b>Define → Measure → Analyze → Improve → Control.</b> Tools: Ishikawa, Pareto, SPC/control charts, Cp/Cpk, DOE, hypothesis testing.</p>
      <p><b>Lean Six Sigma</b> combines waste (lean) and variation (Six Sigma) reduction.</p>
    `},
    {title:"D. Inventory Management",body:`
      <h4>Functions & types</h4>
      <p>Buffers <b>demand/supply uncertainty</b>, <b>lead time</b>, <b>cycle</b> (batching), <b>pipeline</b> (in-transit), <b>hedge</b>, <b>anticipation</b> (seasonal, promo).</p>
      <div class="keyterm"><b>MRO</b> — maintenance, repair, operating supplies (not in finished product).</div>
      <h4>ABC analysis (Pareto)</h4>
      <p>Classify SKUs by annual dollar volume: <b>A</b> ≈ 70–80% of value in 10–20% of items; <b>B</b> middle; <b>C</b> ≈ 5% of value in 50%+ of items. Tight control on A (cycle count monthly), loose on C.</p>
      <h4>EOQ — Economic Order Quantity</h4>
      <div class="formula">EOQ = √( 2·D·S / H )</div>
      <p>where D = annual demand, S = setup/order cost, H = holding cost per unit per year.</p>
      <div class="formula">Total cost = (D/Q)·S + (Q/2)·H &nbsp; — minimized at Q = EOQ</div>
      <div class="formula">Number of orders = D / EOQ &nbsp;·&nbsp; Cycle time = EOQ / D</div>
      <h4>Reorder point & safety stock</h4>
      <div class="formula">ROP = d·LT + SS &nbsp; (d = daily demand, LT = lead time in days)</div>
      <div class="formula">Safety stock = z · σ<sub>LT</sub> &nbsp;where z is the service-level factor (95% → 1.65; 98% → 2.05; 99% → 2.33)</div>
      <h4>Periodic review (P-model)</h4>
      <p>Review at fixed interval T, order-up-to level M. <b>Order quantity = M − Inventory on hand at review</b>. More safety stock than Q-model because cover T+LT.</p>
      <h4>Key metrics</h4>
      <div class="formula">Inventory turns = COGS / Average inventory</div>
      <div class="formula">Days of supply = Avg inventory / Avg daily usage</div>
      <div class="formula">Fill rate = Units shipped on time / Units ordered</div>
      <div class="formula">Perfect order = % orders on time, complete, damage-free, correctly documented</div>
      <h4>Quality & cost of quality</h4>
      <p>Four categories: <b>Prevention · Appraisal · Internal failure · External failure</b>. Investment in prevention/appraisal typically reduces failure costs more than 1:1.</p>
    `},
  ]
});

MODULES.push({
  id:"m5", shortTitle:"Mod 5 · Logistics",
  title:"Module 5 — Forward & Reverse Logistics",
  blurb:"Warehousing, materials handling, transportation modes & pricing, 3PL/4PL, reverse logistics, Incoterms.",
  sections:[
    {open:true,title:"A. Logistics Value & 3PL / 4PL",body:`
      <p><b>Logistics</b> manages the physical, informational and financial flows between supply chain entities — time, place, and form utility.</p>
      <div class="keyterm"><b>Seven Rs:</b> right product, right quantity, right condition, right place, right time, right customer, right cost.</div>
      <h4>Logistics service providers</h4>
      <table><tr><th>Type</th><th>Scope</th></tr>
        <tr><td><b>1PL</b></td><td>Firm owns and does its own logistics.</td></tr>
        <tr><td><b>2PL</b></td><td>Asset-based carrier (trucking, shipping line).</td></tr>
        <tr><td><b>3PL</b></td><td>Outsourced provider performing transport, warehousing, value-add services.</td></tr>
        <tr><td><b>4PL</b></td><td>Lead logistics integrator — manages multiple 3PLs + tech for the client.</td></tr>
        <tr><td><b>5PL</b></td><td>Network orchestrator leveraging digital/e-business for end-to-end optimization.</td></tr></table>
      <h4>3PL/4PL considerations</h4>
      <p>Advantages: scale, expertise, flexibility, lower capital. Risks: loss of control, IP exposure, dependency. Contract terms: SLAs, gainshare, volume guarantees, exit clauses.</p>
      <h4>Logistics tactics</h4>
      <ul>
        <li>Coordinate cross-functional execution</li>
        <li>Integrate chain to reduce inventory via information</li>
        <li>Regulate number of partners</li>
        <li><b>Risk pooling</b> — centralizing inventory reduces total safety stock (variance adds in quadrature)</li>
      </ul>
    `},
    {title:"B. Warehousing & Materials Handling",body:`
      <h4>Warehouse strategy</h4>
      <ul>
        <li><b>Owned</b> (private) — fixed cost, control; <b>leased</b> (public/contract) — variable, flexible.</li>
        <li>Number of DCs: trade off transportation + inventory + facility costs. Adding DCs increases inventory (√n law) but decreases outbound transport.</li>
        <li>Location: minimize landed cost, proximity to customers, labor, tax incentives.</li>
      </ul>
      <h4>Warehouse functions</h4>
      <p>Receive → putaway → storage → picking → packing → shipping. <b>Cross-docking</b> = bypass storage, directly transfer inbound to outbound. <b>Pick-to-light</b>, voice-pick, and goods-to-person improve pick rates.</p>
      <h4>Stock location methods</h4>
      <ul>
        <li><b>Fixed</b> location — each SKU has a home.</li>
        <li><b>Random</b>/dynamic — any empty slot.</li>
        <li><b>Zone</b> / <b>ABC velocity</b> — fast movers near ship area.</li>
      </ul>
      <h4>Materials handling</h4>
      <p>Manual · mechanized (forklifts, conveyors, tow lines, cranes, carousels) · automated (AGV, AS/RS, sortation, robotics, live racks).</p>
    `},
    {title:"C. Transportation — Modes & Pricing",body:`
      <h4>Five modes</h4>
      <table><tr><th>Mode</th><th>Best for</th><th>Cost / Speed</th></tr>
        <tr><td><b>Rail</b></td><td>Heavy, bulk, long land moves</td><td>Low cost / slow</td></tr>
        <tr><td><b>Road / truck</b></td><td>Door-to-door, mid-distance</td><td>Medium cost / medium</td></tr>
        <tr><td><b>Water</b></td><td>International bulk, low value/weight</td><td>Lowest / slowest</td></tr>
        <tr><td><b>Air</b></td><td>High value, perishable, urgent</td><td>Highest / fastest</td></tr>
        <tr><td><b>Pipeline</b></td><td>Liquids, gases</td><td>Very low / slow</td></tr>
        <tr><td><b>Intermodal</b></td><td>Container; two+ modes w/o rehandling</td><td>Balanced</td></tr></table>
      <h4>Truckload options</h4>
      <ul>
        <li><b>FTL</b> (full truckload)</li>
        <li><b>LTL</b> (less-than-truckload) — freight from multiple shippers, based on class &amp; distance</li>
        <li><b>Parcel</b> — small packages, express carriers</li>
      </ul>
      <h4>Freight rate & charges</h4>
      <ul>
        <li><b>Line-haul</b> — distance-based</li>
        <li><b>Accessorial</b> — detention, fuel, lift-gate, inside delivery</li>
        <li><b>Demurrage/detention</b> — equipment tie-up charges</li>
        <li><b>FAK</b> (freight-all-kinds) — flat rate for mixed loads</li>
        <li><b>Tariff</b> — published rate schedule</li>
      </ul>
      <h4>Roles & documentation</h4>
      <ul>
        <li><b>Shipper (consignor)</b>, <b>consignee</b>, <b>carrier</b>, <b>freight forwarder</b>, <b>customs broker</b>, <b>NVOCC</b>.</li>
        <li><b>Bill of Lading (BOL)</b> — contract of carriage &amp; receipt of goods.</li>
        <li><b>Commercial invoice</b>, <b>packing list</b>, <b>certificate of origin</b>, <b>letter of credit</b>.</li>
      </ul>
    `},
    {title:"D. Reverse Logistics & Sustainability in Logistics",body:`
      <p><b>Reverse logistics</b> = flow of products/materials from the customer back toward origin for return, repair, remanufacture, recycle, or disposal.</p>
      <div class="keyterm"><b>5 Rs of reverse logistics:</b> Returns, Reselling, Repairs, Repackaging, Recycling.</div>
      <h4>Product recovery hierarchy (preferred → least)</h4>
      <ol>
        <li>Repair</li>
        <li>Refurbish</li>
        <li>Remanufacture</li>
        <li>Recycle (materials)</li>
        <li>Dispose (landfill/incineration)</li>
      </ol>
      <h4>Closed-loop supply chain</h4>
      <p>Designed to handle both forward &amp; reverse flows as one system. Drivers: regulation (EU WEEE, RoHS), extended producer responsibility (EPR), circular economy, brand protection.</p>
      <h4>Green / sustainable logistics</h4>
      <p>Route optimization, load consolidation, modal shift to rail/water, alt fuels, returnable packaging, carbon reporting (GHG Protocol).</p>
    `},
  ]
});

MODULES.push({
  id:"m6", shortTitle:"Mod 6 · Relationships",
  title:"Module 6 — Supply Chain Relationships",
  blurb:"CRM & SRM, segmentation, customer service metrics, relationship types, collaboration, performance management.",
  sections:[
    {open:true,title:"A. Customer Relationship Management (CRM)",body:`
      <h4>Customer segmentation</h4>
      <p>Group customers so you can differentiate service. Common bases:</p>
      <ul>
        <li><b>Value</b> — lifetime value, margin, share of wallet</li>
        <li><b>Needs</b> — service level required, responsiveness expectations</li>
        <li><b>Channel</b> preference — retail, online, B2B, direct</li>
        <li><b>Behavior</b> — loyalty, frequency, recency, monetary (RFM)</li>
      </ul>
      <div class="keyterm"><b>VoC (Voice of the Customer):</b> systematic capture of customer expectations/preferences — surveys, NPS, interviews, analytics — feeds product &amp; service design.</div>
      <h4>Scope of CRM</h4>
      <p>Sales, marketing, service, analytics, customer data warehousing, personalization, loyalty programs.</p>
      <h4>Strategies by relationship type</h4>
      <table><tr><th>Type</th><th>Tactic</th></tr>
        <tr><td>Transactional</td><td>Efficient self-service, low-cost channels</td></tr>
        <tr><td>Preferred</td><td>Account management, service recovery</td></tr>
        <tr><td>Partner</td><td>Dedicated teams, joint planning, tailored SLAs</td></tr>
        <tr><td>Alliance</td><td>Co-investment, co-innovation, shared KPIs</td></tr></table>
      <h4>Customer service metrics</h4>
      <ul>
        <li><b>Fill rate</b> = units (or orders) shipped from stock / units ordered</li>
        <li><b>OTIF</b> — on-time in-full</li>
        <li><b>Perfect order</b> — OTIF + damage-free + correctly documented</li>
        <li><b>Order cycle time</b></li>
        <li><b>NPS</b>, CSAT, CES (effort)</li>
      </ul>
    `},
    {title:"B. Supplier Relationship Management (SRM)",body:`
      <p><b>SRM</b> = integrated approach to managing supplier interactions: selection, development, performance management, innovation, risk.</p>
      <h4>Relationship spectrum</h4>
      <p>Arm's-length → preferred → strategic → alliance → joint venture / integrated.</p>
      <h4>Supplier development</h4>
      <ul>
        <li>Training &amp; technical support</li>
        <li>Joint Kaizen events / on-site assessment</li>
        <li>Financial support for capacity / quality</li>
        <li>Process / quality certification support (ISO 9001, IATF 16949)</li>
      </ul>
      <h4>Performance measurement</h4>
      <p>Balanced scorecards with <b>QCDFR</b> dimensions: Quality, Cost, Delivery, Flexibility, Responsiveness. Review cadence varies by criticality.</p>
      <h4>SRM technology</h4>
      <p>Supplier portals, e-sourcing/e-auctions, contract lifecycle management (CLM), spend analytics, supplier info management (SIM).</p>
    `},
    {title:"C. Collaboration & Integration",body:`
      <h4>Collaboration continuum</h4>
      <ol>
        <li>Information sharing</li>
        <li>Coordinated operations</li>
        <li>Joint planning (S&amp;OP w/ key partners)</li>
        <li>Shared risks &amp; rewards</li>
        <li>Co-development / innovation</li>
      </ol>
      <h4>CPFR (Collaborative Planning, Forecasting & Replenishment)</h4>
      <p>Four activities: strategy &amp; planning · demand &amp; supply management · execution · analysis. Partners share forecasts and replenishment plans, collaboratively resolve exceptions.</p>
      <h4>Trust & governance</h4>
      <p>Formal contracts + relational norms (trust, commitment, communication). Use joint steering committees, balanced scorecards, open-book costing.</p>
    `},
    {title:"D. Performance Management & Metrics",body:`
      <h4>SCOR-based metrics</h4>
      <p>The <b>SCOR</b> (Supply Chain Operations Reference) model defines 5 process areas (<b>Plan, Source, Make, Deliver, Return</b>) and three performance groups:</p>
      <ul>
        <li><b>Customer-facing</b>: Reliability (perfect order), Responsiveness (order fulfillment cycle time), Agility (adapt to changes).</li>
        <li><b>Internal-facing</b>: Cost (COGS %, cash-to-cash), Assets (inventory days, return on assets).</li>
      </ul>
      <div class="formula">Cash-to-cash cycle time = DIO + DSO − DPO</div>
      <div class="keyterm"><b>Balanced Scorecard (Kaplan &amp; Norton):</b> Financial · Customer · Internal process · Learning &amp; growth.</div>
      <h4>Benchmarking</h4>
      <p>Compare KPIs vs. internal, competitive, functional, or generic best-in-class. Follow PDCA to close gaps.</p>
    `},

  id:"m7", shortTitle:"Mod 7 · Risk",
  title:"Module 7 — Supply Chain Risk",
  blurb:"Risk identification, analysis (qualitative & quantitative), response strategies, business continuity, security & compliance.",
  sections:[
    {open:true,title:"A. Risk Management Framework",body:`
      <p>Risk = effect of uncertainty on objectives (ISO 31000). Can be positive (opportunity) or negative (threat).</p>
      <h4>Risk management process</h4>
      <ol>
        <li><b>Identify</b> — risk register.</li>
        <li><b>Analyze</b> — qualitative (P×I matrix) and/or quantitative (EMV, Monte Carlo).</li>
        <li><b>Evaluate &amp; prioritize</b>.</li>
        <li><b>Treat / respond</b>.</li>
        <li><b>Monitor &amp; communicate</b>.</li>
      </ol>
      <h4>Frameworks</h4>
      <ul>
        <li><b>ISO 31000</b> — principles &amp; guidelines.</li>
        <li><b>ISO 31010</b> — risk assessment techniques (Delphi, HAZOP, FMEA, bow-tie, Monte Carlo).</li>
        <li><b>COSO ERM</b> — governance, strategy, performance, review, communication.</li>
        <li><b>GRC</b> — Governance, Risk, Compliance.</li>
      </ul>
      <h4>Attitudes toward risk</h4>
      <p>Risk-averse, risk-neutral, risk-seeking. The <b>risk appetite</b> sets the level of risk the organization is willing to accept.</p>
    `},
    {title:"B. Risk Identification & Types",body:`
      <h4>Risk register</h4>
      <p>Catalog of: risk ID, description, category, cause, probability, impact, owner, response plan, triggers, status.</p>
      <h4>Categories of supply chain risk</h4>
      <ul>
        <li><b>Operational</b> — supplier failure, quality, capacity, labor.</li>
        <li><b>Demand</b> — forecast error, volatility, cannibalization.</li>
        <li><b>Supply</b> — single-source, geopolitical, commodity price.</li>
        <li><b>Logistics</b> — disruption, port closures, weather.</li>
        <li><b>Financial</b> — FX, credit, liquidity.</li>
        <li><b>Strategic</b> — competitive, reputation, M&amp;A.</li>
        <li><b>Environmental</b> — natural disasters, climate, pandemic.</li>
        <li><b>Cyber / data</b> — breach, ransomware, IP theft.</li>
        <li><b>Compliance / legal</b> — regulation, trade, sanctions.</li>
      </ul>
      <h4>Loss of tangible vs. intangible assets</h4>
      <p>Tangible: inventory, facilities, equipment. Intangible: brand, customer trust, IP.</p>
    `},
    {title:"C. Risk Analysis & Response",body:`
      <h4>Qualitative analysis — P×I matrix</h4>
      <p>Score probability (Low/Med/High or 1–5) and impact (same scale). Multiply for risk score; plot on heat map. Use <b>urgency</b> and <b>data quality</b> modifiers.</p>
      <h4>Quantitative analysis</h4>
      <div class="formula">EMV (Expected Monetary Value) = Σ (Probability × Impact)</div>
      <ul>
        <li><b>Sensitivity analysis</b> — how output changes with each input.</li>
        <li><b>Monte Carlo simulation</b> — distribution of outcomes via repeated random sampling.</li>
        <li><b>Decision tree</b> — chain of probabilistic decisions with EMV.</li>
      </ul>
      <h4>Response strategies — threats</h4>
      <ul>
        <li><b>Avoid</b> — eliminate cause (not source the region).</li>
        <li><b>Transfer</b> — insurance, contract, hedge.</li>
        <li><b>Mitigate</b> — reduce P or I (safety stock, multi-source).</li>
        <li><b>Accept</b> — conscious choice; reserve if passive.</li>
      </ul>
      <h4>Response strategies — opportunities</h4>
      <p>Exploit · Enhance · Share · Accept.</p>
      <h4>Action plans & triggers</h4>
      <p>Document triggers (early warning signals) and pre-defined responses. Use <b>contingency reserves</b> (budget/time) for known risks and <b>management reserves</b> for unknowns.</p>
    `},
    {title:"D. Business Continuity, Security & Compliance",body:`
      <h4>Business continuity planning (BCP)</h4>
      <p>Ensure critical processes continue through disruption.</p>
      <ul>
        <li><b>BIA</b> (Business Impact Analysis) identifies critical processes and impacts over time.</li>
        <li><b>RTO</b> — Recovery Time Objective</li>
        <li><b>RPO</b> — Recovery Point Objective (max acceptable data loss window)</li>
        <li><b>MTPD</b> — Maximum Tolerable Period of Disruption</li>
      </ul>
      <p>Plan includes: crisis management, disaster recovery (IT), alternate sites, communications.</p>
      <h4>Supply chain security</h4>
      <ul>
        <li><b>C-TPAT</b> (US Customs-Trade Partnership Against Terrorism)</li>
        <li><b>AEO</b> (EU Authorized Economic Operator)</li>
        <li><b>ISO 28000</b> — supply chain security management</li>
        <li><b>TAPA</b> — Transported Asset Protection Association</li>
      </ul>
      <h4>Compliance & ethics</h4>
      <ul>
        <li><b>FCPA</b> / UK Bribery Act</li>
        <li><b>Sarbanes-Oxley (SOX)</b> — financial controls</li>
        <li><b>Dodd-Frank §1502</b> — conflict minerals</li>
        <li><b>UN Global Compact</b>, labor, human rights, OECD guidelines</li>
        <li><b>Modern Slavery Act</b></li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m8", shortTitle:"Mod 8 · Strategy & Tech",

    {open:true,title:"A. Strategy & Supply Chain Alignment",body:`
      <h4>Strategy hierarchy</h4>
      <p>Organizational strategy → Business strategy → Functional (supply chain, marketing, HR, IT).</p>
      <div class="keyterm"><b>Porter's generic strategies:</b> Cost leadership · Differentiation · Focus (cost-focus or differentiation-focus).</div>
      <h4>Porter's Five Forces</h4>
      <ol>
        <li>Threat of new entrants</li>
        <li>Bargaining power of buyers</li>
        <li>Bargaining power of suppliers</li>
        <li>Threat of substitutes</li>
        <li>Competitive rivalry</li>
      </ol>
      <h4>Business model components</h4>
      <p>Value proposition · Target customer · Channels · Customer relationships · Revenue model · Key resources · Key activities · Key partners · Cost structure.</p>
      <h4>Supply chain strategy archetypes</h4>
      <ul>
        <li><b>Efficient</b> (Fisher) — functional products, low cost.</li>
        <li><b>Responsive</b> — innovative products, high variety.</li>
        <li><b>Risk-hedging</b> — shared resources to pool risk.</li>
        <li><b>Agile</b> — responsive + risk-hedging.</li>
      </ul>
    `},
    {title:"B. SCOR Model & Continuous Improvement",body:`
      <h4>SCOR processes</h4>
      <p><b>Plan · Source · Make · Deliver · Return · Enable.</b> Each has Level 1 (process type), Level 2 (category), Level 3 (element) detail.</p>
      <h4>SCOR performance attributes</h4>
      <table><tr><th>Attribute</th><th>Example Metric</th></tr>
        <tr><td>Reliability</td><td>Perfect order</td></tr>
        <tr><td>Responsiveness</td><td>Order fulfillment cycle time</td></tr>
        <tr><td>Agility</td><td>Upside supply chain flexibility</td></tr>
        <tr><td>Cost</td><td>Total supply chain cost, COGS</td></tr>
        <tr><td>Asset mgmt.</td><td>Cash-to-cash, inventory days</td></tr></table>
      <h4>Continuous improvement</h4>
      <ul>
        <li><b>Kaizen</b> — small incremental improvements, bottom-up.</li>
        <li><b>Kaikaku</b> — radical transformation.</li>
        <li><b>Benchmarking</b> — internal, competitive, functional, generic.</li>
        <li><b>PDCA</b> &amp; <b>DMAIC</b> loops.</li>
        <li><b>Lean Six Sigma</b> combines waste &amp; variation reduction.</li>
      </ul>
      <h4>Change management</h4>
      <p><b>Kotter's 8 steps</b> (urgency, coalition, vision, communicate, empower, wins, consolidate, anchor) · <b>ADKAR</b> (Awareness, Desire, Knowledge, Ability, Reinforcement).</p>
    `},
    {title:"C. Sustainability — Triple Bottom Line",body:`
      <div class="keyterm"><b>Triple Bottom Line (Elkington):</b> People · Planet · Profit — measure success across social, environmental, and economic dimensions.</div>
      <h4>Standards & frameworks</h4>
      <ul>
        <li><b>GRI</b> — Global Reporting Initiative</li>
        <li><b>ISO 14001</b> — environmental management systems</li>
        <li><b>ISO 26000</b> — social responsibility</li>
        <li><b>ISO 50001</b> — energy management</li>
        <li><b>SA8000</b> — social accountability / labor</li>
        <li><b>UN SDGs</b> — 17 sustainable development goals</li>
        <li><b>CDP</b> — carbon disclosure</li>
        <li><b>Science Based Targets (SBTi)</b> — decarbonization</li>
      </ul>
      <h4>Circular economy</h4>
      <p>Design out waste, keep products/materials in use, regenerate natural systems. Principles of <b>reduce, reuse, recycle, recover, redesign</b>. Moves beyond linear "take-make-dispose."</p>
      <h4>Green supply chain practices</h4>
      <ul>
        <li>Supplier code of conduct + audits</li>
        <li>Packaging reduction / returnable</li>
        <li>Network / mode optimization for CO₂</li>
        <li>Renewable energy in facilities</li>
        <li>Product stewardship &amp; EPR</li>
        <li>Life-cycle assessment (LCA, cradle-to-grave/gate)</li>
      </ul>
    `},
    {title:"D. Emerging Technology",body:`
      <h4>Core supply chain tech stack</h4>
      <ul>
        <li><b>ERP</b> — transactional system of record</li>
        <li><b>APS</b> — constraint-based planning</li>
        <li><b>SCM control tower</b> — end-to-end visibility, exception management</li>
        <li><b>WMS / TMS / YMS</b></li>
        <li><b>PLM</b> — product lifecycle management</li>
        <li><b>MES</b> — manufacturing execution</li>

      <h4>Advanced & emerging</h4>
      <ul>
        <li><b>IoT</b> — sensors, RFID, connected assets.</li>
        <li><b>Big data / cloud</b> — scalable compute &amp; storage.</li>
        <li><b>AI / ML</b> — demand sensing, anomaly detection, dynamic pricing, computer vision QC.</li>
        <li><b>Robotics &amp; automation</b> — AS/RS, AMR, cobots, automated sortation.</li>

/* ================= QUIZZES ================= */
QUIZZES.m1 = [
  {q:"Which of the following is NOT one of the three primary flows in a supply chain?",options:["Information","Product/Service","Funds","Authority"],answer:3,rationale:"The three flows are information, product/service, and funds. Authority is an organizational concept, not a supply chain flow."},
  {q:"A firm that buys its key supplier is engaging in which type of integration?",options:["Forward vertical","Backward vertical","Horizontal","Lateral alliance"],answer:1,rationale:"Backward vertical integration = acquiring upstream suppliers. Forward = downstream."},
  {q:"A supply chain described as 'functions each optimize themselves without cross-functional integration' is at which maturity stage?",options:["Stage 1 Multiple dysfunction","Stage 2 Semifunctional enterprise","Stage 3 Integrated enterprise","Stage 4 Extended enterprise"],answer:1,rationale:"Stage 2 exhibits functional silos optimizing individually. Stage 1 is deeper dysfunction with no coordination at all."},
  {q:"Real GDP is computed by applying a weighted average price to control for what?",options:["Seasonality","Exchange rate","Inflation","Population"],answer:2,rationale:"Real GDP uses fixed-basket prices to strip out inflation so growth reflects true output change."},
  {q:"A product with |price elasticity of demand| = 0.4 is best described as:",options:["Highly elastic","Inelastic","Unit elastic","Perfectly elastic"],answer:1,rationale:"|E|<1 is inelastic — quantity changes less than proportionally to price."},
  {q:"Which forecasting principle states you should forecast based on demand rather than orders?",options:["Principle 1","Principle 2","Principle 3","Principle 4"],answer:0,rationale:"Principle 1 — orders are constrained by supply; true demand must drive the forecast."},
  {q:"Exponential smoothing with α = 0.8 will:",options:["Respond slowly to changes in demand","Respond quickly to recent changes","Give equal weight to all periods","Produce identical results to a 3-period moving average"],answer:1,rationale:"Higher α puts more weight on the most recent demand, causing the forecast to respond faster (also noisier)."},
  {q:"Which method is most appropriate for long-range forecasting of a new product with no demand history?",options:["Simple moving average","Exponential smoothing","Delphi technique","Naïve method"],answer:2,rationale:"Delphi — iterative anonymous expert consensus — is the preferred qualitative method for NPI and long-horizon forecasts."},
  {q:"A tracking signal consistently reads +5.5 over several periods. This suggests:",options:["Forecasts are accurate","Forecasts are biased low","Forecasts are biased high","Random noise only"],answer:1,rationale:"A positive tracking signal means actual > forecast on balance, i.e., the forecast is systematically too low. ±4 to ±6 indicates bias."},
  {q:"Which of the following best captures the 'Act' phase of the PDCA cycle?",options:["Set targets and metrics","Execute the plan","Compare actual vs. target","Standardize successes or correct deviations"],answer:3,rationale:"The Act phase institutionalizes what worked or corrects what didn't, setting up the next PDCA cycle."},
  {q:"Deseasonalizing demand requires dividing actual demand by:",options:["Trend value","Seasonal index","Weighted moving average","Regression coefficient"],answer:1,rationale:"Actual ÷ seasonal index removes seasonal effect before applying trend/time-series methods; then reseasonalize at the end."},
  {q:"MAPE is defined as:",options:["Σ Error / n","Σ |Error| / n","(Σ |Error / Actual|) / n × 100%","Σ Error² / n"],answer:2,rationale:"MAPE = Mean Absolute Percentage Error; scale-free so you can compare across items."},
  {q:"Which demand pattern component represents repeating within-year variation?",options:["Trend","Cycle","Seasonality","Random"],answer:2,rationale:"Seasonality = predictable repeating pattern within a year (quarterly, monthly, weekly)."},
  {q:"The 4 Ps of marketing include all EXCEPT:",options:["Price","Placement","Planning","Promotion"],answer:2,rationale:"The Ps are Product, Price, Placement (channel), Promotion. Planning is not one of the 4 Ps."},
  {q:"Forecasts are generally MORE accurate when:",options:["For individual items vs. groups","For long horizons vs. short","For groups vs. individual items","When they include no error estimate"],answer:2,rationale:"Principle 4 — aggregation reduces randomness, so group (category/family) forecasts are more accurate than individual SKUs."},
];

QUIZZES.m2 = [
  {q:"Which supply chain design is best for functional products with stable demand?",options:["Responsive","Efficient","Agile","Risk-hedging"],answer:1,rationale:"Fisher's framework: functional products → efficient, low-cost chain. Innovative products → responsive."},
  {q:"The PRIMARY benefit of ERP is:",options:["Best-of-breed functionality per module","Single integrated database and transactional backbone","No customization ever required","Elimination of all master data issues"],answer:1,rationale:"ERP's core value is one source of truth across functions; best-of-breed trades integration for best functionality."},
  {q:"Configuration is preferred over customization because it:",options:["Allows unlimited code changes","Preserves upgrade path","Is always cheaper at year 1","Eliminates the need for training"],answer:1,rationale:"Configuration uses delivered functionality and survives upgrades; customization breaks upgrades and raises TCO."},
  {q:"Which integration method involves the supplier owning the replenishment decision for the customer?",options:["CPFR","VMI","Quick Response","Cross-docking"],answer:1,rationale:"VMI = Vendor-Managed Inventory; supplier decides when and how much to replenish based on shared data."},
  {q:"CPFR stands for:",options:["Continuous Planning, Forecasting & Replenishment","Collaborative Planning, Forecasting & Replenishment","Consolidated Procurement, Forecasting & Reporting","Customer Planning for Rapid Response"],answer:1,rationale:"Collaborative Planning, Forecasting & Replenishment — shared forecasts and replenishment plans with partners."},
  {q:"Under Incoterms, EXW:",options:["Places maximum responsibility on the seller","Places maximum responsibility on the buyer","Is used only for sea shipments","Requires seller to clear goods for export"],answer:1,rationale:"Ex Works = seller's minimum obligation; buyer takes over at the seller's premises."},
  {q:"DDP (Delivered Duty Paid) means:",options:["Seller delivers to the first carrier only","Buyer is responsible for import duties","Seller bears risk until goods reach buyer's named place, duties paid","Terms only for inland water transport"],answer:2,rationale:"DDP = maximum seller obligation — duties paid, delivered to buyer's named place."},
  {q:"Risk pooling reduces safety stock because:",options:["Centralized variance is the sum of variances","Central inventory sees less demand","Aggregated demand has lower relative variability","Suppliers always deliver faster"],answer:2,rationale:"Aggregated demand has lower CV (variance adds in quadrature); safety stock ∝ σ, so pooling lowers total SS by √n."},
  {q:"Which of the following is a middleware/API purpose?",options:["Store master data","Provide transactional financial ledgers","Connect disparate systems for real-time data exchange","Replace the ERP"],answer:2,rationale:"Middleware and APIs enable real-time data exchange between front-end, ERP, and external systems."},
  {q:"The HS (Harmonized System) code is used for:",options:["Carrier rate tariffs","Customs classification and duties","ERP master data","Cybersecurity audits"],answer:1,rationale:"HS codes classify goods internationally for customs duty and trade statistics."},
  {q:"A Free Trade Zone (FTZ) primarily allows firms to:",options:["Pay duties immediately on arrival","Defer or avoid duties until goods enter commerce","Avoid all regulations","Bypass customs entirely"],answer:1,rationale:"In an FTZ, duties are deferred or avoided until goods leave the zone into the home market."},
  {q:"Which technology MOST directly provides real-time alerts when supply chain events deviate from plan?",options:["ERP transactional modules","APS","SCEM","WMS"],answer:2,rationale:"Supply Chain Event Management monitors events in real time against thresholds and triggers alerts."},
  {q:"In a cash-to-cash cycle, a LOWER number is achieved by:",options:["Increasing DIO and DSO","Decreasing DPO","Decreasing DIO and DSO while increasing DPO","Ignoring inventory turns"],answer:2,rationale:"Cash-to-cash = DIO + DSO − DPO. Less inventory and faster collections while paying suppliers later reduce it."},
  {q:"The nucleus firm in a supply chain is:",options:["The largest tier-2 supplier","A 3PL logistics provider","The focal firm that orchestrates network decisions","The end customer"],answer:2,rationale:"The nucleus (focal) firm is the orchestrator that leads design and cross-partner decisions."},
  {q:"GDPR primarily governs:",options:["Supply chain carbon emissions","Cross-border tariffs","Processing of personal data of EU residents","Anti-bribery compliance"],answer:2,rationale:"GDPR = EU General Data Protection Regulation; consent-based processing of personal data."},
];

QUIZZES.m3 = [
  {q:"Sourcing vs. procurement: sourcing is best described as:",options:["The transactional act of issuing a PO","The strategic process of supplier selection and relationship management","The same thing as procurement","Always outsourced to a 3PL"],answer:1,rationale:"Sourcing is strategic; procurement is tactical (PO, receive, pay)."},
  {q:"Which is NOT a typical make-vs-buy consideration?",options:["Core competency","Lost skills/knowledge risk","TCO / landed cost","Competitor's brand color"],answer:3,rationale:"Core competency, skill retention, and TCO are core considerations. Competitor aesthetics are not."},
  {q:"TCO typically includes all EXCEPT:",options:["Acquisition price","Inventory carrying cost","Disposal cost","Competitor's marketing budget"],answer:3,rationale:"TCO covers all costs across the ownership lifecycle of the buying firm — not competitors' costs."},
  {q:"On the Kraljic matrix, items with HIGH profit impact and HIGH supply risk are:",options:["Non-critical","Leverage","Bottleneck","Strategic"],answer:3,rationale:"Strategic items — treat with long-term partnership, joint development, risk share."},
  {q:"Leverage items (Kraljic) are characterized by:",options:["Low profit impact, low risk","High profit impact, low risk","Low profit impact, high risk","High profit impact, high risk"],answer:1,rationale:"Leverage: high spend, many suppliers — exploit buying power through bidding and consolidation."},
  {q:"A 'should-cost' analysis is used to:",options:["Determine the landed cost","Model what an item should cost from first principles (materials + labor + overhead + margin)","Audit supplier books","Calculate EOQ"],answer:1,rationale:"Should-cost benchmarks supplier quotes against a bottom-up cost model."},
  {q:"Concurrent engineering provides which benefit over traditional sequential design?",options:["Slower time to market","Late supplier involvement","Reduced development time and cost","Single-function decisions"],answer:2,rationale:"Concurrent engineering integrates cross-functional teams — including suppliers — early, reducing time and cost."},
  {q:"DFM stands for:",options:["Design for Manufacturing","Design for Marketing","Demand for Materials","Data flow Mapping"],answer:0,rationale:"DFM = Design for Manufacturing — one of the DFX family (DFA, DFS, DFE, etc.)."},
  {q:"A performance specification:",options:["Dictates exact dimensions and materials","Describes the functional outcome the item must achieve","Is used only for commodities","Cannot be used with outsourced suppliers"],answer:1,rationale:"Performance specs give supplier freedom in HOW while constraining WHAT the product must achieve."},
  {q:"Value engineering focuses on:",options:["Maximizing aesthetic value","Cutting cost while preserving function","Adding features irrespective of cost","Marketing communications"],answer:1,rationale:"VE/VA eliminates unnecessary cost without sacrificing function or quality."},
  {q:"Which contract type transfers cost risk to the supplier?",options:["Fixed-price","Cost-plus-fixed-fee","Time & materials","Cost-reimbursable"],answer:0,rationale:"Under fixed-price, the supplier bears overrun risk; buyer pays agreed price regardless of supplier cost."},
  {q:"BATNA is:",options:["A type of contract","Your best alternative to a negotiated agreement","A freight term","A sourcing event"],answer:1,rationale:"BATNA anchors your walkaway value — you should never accept terms worse than your BATNA."},
  {q:"Supplier right-sizing balances:",options:["Quality vs. speed","Risk reduction (more suppliers) vs. leverage (fewer suppliers)","Make vs. buy","Domestic vs. offshore"],answer:1,rationale:"More suppliers → less single-source risk; fewer suppliers → more volume leverage. Right-size balances these."},
  {q:"Spend analysis typically reveals:",options:["Perfect parity across all suppliers","A Pareto (80-20) distribution","That all spend is strategic","Equal spending by category"],answer:1,rationale:"Spend almost always follows 80-20: a few suppliers/categories account for most spend."},
  {q:"A preferred supplier relationship usually implies:",options:["Lowest price only","Multi-year performance-based relationship","No measurable KPIs","One-time transaction"],answer:1,rationale:"Preferred suppliers have performance scorecards and multi-year engagement; not pure spot buying."},
];

  {q:"S&OP is conducted at which level of detail?",options:["SKU-level, daily","Product-family, monthly","Work center, hourly","Component, weekly"],answer:1,rationale:"S&OP works at product-family level with monthly cadence over 12–18 months."},
  {q:"ATP (Available-to-Promise) is calculated as:",options:["Forecast minus customer orders","MPS in this period + prior PAB − customer orders before the next MPS receipt","Beginning inventory + receipts","EOQ × lead time"],answer:1,rationale:"ATP = supply available to promise to new orders between MPS receipts — discrete ATP formula."},

  {q:"MRP inputs include all EXCEPT:",options:["MPS","Bills of material","Inventory records","Daily shipping manifests"],answer:3,rationale:"MRP inputs: MPS, BOM, inventory records, lead times. Shipping manifests are outbound execution documents."},

  {q:"DMAIC is associated with:",options:["Lean only","Six Sigma","TOC","ISO 9001"],answer:1,rationale:"DMAIC = Define, Measure, Analyze, Improve, Control — Six Sigma project framework."},

  {q:"Inventory turns = ?",options:["COGS / Average inventory","Sales / Safety stock","EOQ × cycle time","Average inventory / Daily demand"],answer:0,rationale:"Turns = COGS ÷ average inventory — how many times stock cycles per year."},
];

QUIZZES.m5 = [
  {q:"Which of the following is NOT one of the Seven Rs of logistics?",options:["Right product","Right quantity","Right receipt","Right time"],answer:2,rationale:"Seven Rs: right product, quantity, condition, place, time, customer, cost. 'Right receipt' is not one."},
  {q:"A 4PL is BEST described as:",options:["A shipper that owns its own trucks","An asset-heavy carrier","A lead logistics integrator managing multiple 3PLs and tech","A customs broker"],answer:2,rationale:"4PL = lead orchestrator; asset-light, manages multiple 3PLs and the technology stack."},
  {q:"Cross-docking primarily aims to:",options:["Store goods for longer","Bypass storage, transferring inbound directly to outbound","Increase order cycle time","Simplify customs clearance"],answer:1,rationale:"Cross-docking moves products directly from receiving to shipping with minimal or no storage."},
  {q:"Which mode of transport is BEST for low-value, bulk, international shipments?",options:["Air","Truck","Water","Parcel"],answer:2,rationale:"Water/ocean freight is the lowest cost per unit-mile but the slowest — ideal for bulk, low-value international."},
  {q:"A bill of lading functions as:",options:["Only a receipt for goods","A contract of carriage and receipt of goods","A customs declaration only","A marketing brochure"],answer:1,rationale:"A BOL is simultaneously a contract of carriage, receipt of goods, and (if negotiable) document of title."},
  {q:"Demurrage is a charge for:",options:["Fuel","Excessive use of a carrier's equipment (detention beyond free time)","Insurance","Customs clearance"],answer:1,rationale:"Demurrage (and detention) charges equipment held beyond allotted free time at port/DC/shipper."},
  {q:"Increasing the number of distribution centers typically:",options:["Increases transportation cost and reduces inventory","Increases inventory and reduces outbound transportation cost","Has no inventory effect","Is always cheaper overall"],answer:1,rationale:"More DCs → more safety stock (√n law) AND shorter last-mile → lower outbound transport. Optimum balances these."},

  {q:"Random stock location (vs. fixed) generally provides:",options:["Slower picking, better accuracy","Better space utilization, more complex without WMS","Lower overall cost with zero system","Reduces need for training"],answer:1,rationale:"Random/dynamic slotting maximizes space utilization but requires a WMS to track locations."},
  {q:"LTL freight is:",options:["Dedicated trailer for one shipper","Shared trailer, multiple shippers, classed freight","Always air","Over dimensional-only"],answer:1,rationale:"LTL (Less-than-Truckload) consolidates freight from multiple shippers; priced on class and distance."},
  {q:"Risk pooling via centralization cuts aggregate safety stock approximately by factor:",options:["N","log N","√N","N²"],answer:2,rationale:"Square-root law: total safety stock ratio ≈ 1/√N compared to N independent locations."},
  {q:"Which is part of extended producer responsibility (EPR)?",options:["Consumer pays all disposal costs","Producer responsible for product end-of-life","Only retailers handle returns","Governments absorb all waste"],answer:1,rationale:"EPR makes the producer financially/physically responsible for end-of-life management."},
  {q:"Collaborative Transportation Management (CTM) primarily seeks to:",options:["Reduce collaboration","Optimize transport by sharing information across shippers and carriers","Eliminate carriers","Increase empty miles"],answer:1,rationale:"CTM aligns shipper/carrier plans — reduces empty miles, balances loads, improves service."},
  {q:"Green logistics tactics include all EXCEPT:",options:["Modal shift to rail/water","Returnable packaging","Route optimization","Increasing empty backhauls"],answer:3,rationale:"Reducing — not increasing — empty backhauls lowers emissions."},
];
