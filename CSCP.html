<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSCP Master Study App</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#111827; --panel:#1e293b; --panel2:#253449;
    --ink:#e5e7eb; --mute:#94a3b8; --accent:#38bdf8; --accent2:#22d3ee;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --border:#334155;
    --chip:#1e40af; --chip2:#0e7490;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b1222 0%,#0f172a 100%);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0ea5e9,#6366f1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.5px}
  .brand h1{font-size:1.05rem;margin:0;letter-spacing:.3px}
  .brand small{color:var(--mute);display:block;font-weight:400}
  nav.tabs{display:flex;flex-wrap:wrap;gap:6px}
  nav.tabs button{background:transparent;color:var(--mute);border:1px solid transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem}
  nav.tabs button:hover{color:var(--ink);background:#1a2540}
  nav.tabs button.active{color:#fff;background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:#0ea5e9}
  main{max-width:1200px;margin:0 auto;padding:24px 22px 80px}
  .view{display:none}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h2.section-title{font-size:1.55rem;margin:8px 0 6px;letter-spacing:.2px}
  .lead{color:var(--mute);margin:0 0 20px}
  .grid{display:grid;gap:16px}
  .cards-3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .cards-4{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .card h3{margin:0 0 6px;font-size:1.05rem}
  .card p{margin:0;color:var(--mute)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;background:#0e7490;color:#cffafe;font-size:.78rem;font-weight:600;margin-right:6px}
  .pill.mod1{background:#0e7490;color:#cffafe}
  .pill.mod2{background:#6d28d9;color:#ede9fe}
  .pill.mod3{background:#b45309;color:#fef3c7}
  .pill.mod4{background:#047857;color:#d1fae5}
  .pill.mod5{background:#be185d;color:#fce7f3}
  .pill.mod6{background:#4338ca;color:#e0e7ff}
  .pill.mod7{background:#b91c1c;color:#fee2e2}
  .pill.mod8{background:#0369a1;color:#e0f2fe}
  .progress{height:8px;background:#0b1222;border-radius:999px;overflow:hidden;margin-top:10px}
  .progress>div{height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1);transition:width .3s}
  .btn{background:#0ea5e9;color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--ink)}
  .btn.ghost:hover{background:#1a2540}
  .btn.good{background:var(--good)}
  .btn.bad{background:var(--bad)}
  .btn.warn{background:var(--warn)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .kv{display:flex;gap:8px;align-items:baseline}
  .kv b{color:var(--ink)}
  .kv span{color:var(--mute)}
  details{background:#16213a;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:8px 0}
  details[open]{background:#17243f}
  summary{cursor:pointer;font-weight:700;padding:4px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--accent);font-weight:700;margin-right:4px}
  details[open] summary::before{content:"▾ "}
  .keyterm{background:#0b1830;border-left:4px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:6px}
  .keyterm b{color:#7dd3fc}
  .formula{background:#0a2213;border-left:4px solid var(--good);padding:8px 12px;margin:8px 0;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#bbf7d0}
  .tip{background:#1e1a06;border-left:4px solid var(--warn);padding:8px 12px;margin:8px 0;border-radius:6px;color:#fde68a}
  .danger{background:#2b0a0a;border-left:4px solid var(--bad);padding:8px 12px;margin:8px 0;border-radius:6px;color:#fecaca}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:#0b1830;color:#cbd5e1}
  .module-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .module-tabs button{background:#162138;color:var(--ink);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.88rem}
  .module-tabs button.active{background:linear-gradient(135deg,#0ea5e9,#6366f1);border-color:#0ea5e9;color:#fff}
  /* Flashcards */
  .flashcard{perspective:1200px;height:220px;cursor:pointer}
  .flashcard .face{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
  .flashcard.flipped .face{transform:rotateY(180deg)}
  .flashcard .front,.flashcard .back{position:absolute;inset:0;border-radius:14px;padding:18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border)}
  .flashcard .front{background:linear-gradient(135deg,#1e293b,#0f172a);font-weight:700;font-size:1.15rem}
  .flashcard .back{background:linear-gradient(135deg,#0b3b4a,#0e7490);color:#e0f7fa;transform:rotateY(180deg);font-size:.95rem;overflow-y:auto}
  .flash-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  select,input[type=text]{background:#0b1222;color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  /* Quiz */
  .q-box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin:14px 0}
  .q-text{font-weight:600;margin-bottom:12px}
  .q-opts{display:grid;gap:8px}
  .q-opt{background:#0b1830;border:1px solid var(--border);padding:10px 14px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .q-opt:hover{background:#12223e}
  .q-opt input{margin-top:3px}
  .q-opt.correct{background:#062e1a;border-color:#22c55e}
  .q-opt.wrong{background:#2e0606;border-color:#ef4444}
  .rationale{margin-top:12px;padding:10px 12px;background:#0b1830;border-left:4px solid var(--accent);border-radius:6px;color:#cbd5e1}
  .score-banner{background:linear-gradient(135deg,#6366f1,#0ea5e9);border-radius:14px;padding:22px;text-align:center;margin:16px 0}
  .score-banner h3{margin:0 0 6px;font-size:1.6rem}
  .score-banner p{margin:0;color:#e0e7ff}
  /* Diagrams */
  .diagram-wrap{background:#0b1222;border:1px solid var(--border);border-radius:14px;padding:16px;margin:12px 0}
  .diagram-wrap svg{width:100%;height:auto;max-height:520px}
  .legend{font-size:.85rem;color:var(--mute);margin-top:8px}
  .clickable{cursor:pointer;transition:opacity .2s, transform .2s}
  .clickable:hover{opacity:.8;transform:scale(1.02)}
  footer{text-align:center;color:var(--mute);margin-top:40px;font-size:.85rem}
  .stat-box{display:flex;flex-direction:column;gap:4px}
  .stat-box b{font-size:1.8rem;color:#7dd3fc}
  .stat-box span{color:var(--mute);font-size:.85rem}
  @media (max-width:700px){
    .brand h1{font-size:.95rem}
    nav.tabs button{padding:6px 10px;font-size:.82rem}
    h2.section-title{font-size:1.25rem}
  }
</style>
</head>

<script id="data-script">
/* ================= MODULE DATA ================= */
MODULES.push({
  id:"m1", shortTitle:"Mod 1 · Demand/Forecast",
  title:"Module 1 — Supply Chains, Demand Management & Forecasting",
  blurb:"Foundations of supply chain, demand analysis, demand planning, and all major forecasting techniques.",
  sections:[
    {open:true,title:"A. Supply Chain Fundamentals",body:`
      <p>A <b>supply chain</b> is the global network used to deliver products and services from raw materials to end customers through an engineered flow of <b>information, physical distribution, and cash</b>. A basic chain includes <b>supplier → producer → distributor → retailer → customer</b>.</p>
      <div class="keyterm"><b>Three flows:</b> Information (orders, forecasts, status) · Product/Service (from raw material to consumer) · Funds (generally upstream, opposite of product flow). A fourth <b>reverse flow</b> handles returns / recycling / refurbishment.</div>
      <div class="keyterm"><b>Value and balance:</b> Each link must add <b>value</b> greater than its cost. Goals: balance supply and demand while creating a service-profit chain.</div>
      <h4>Foundational definitions</h4>
      <ul>
        <li><b>Echelon</b> — a level of supply chain nodes (factories, DCs, retail stores). Each adds operating expense, holds inventory, adds cycle time, and expects a profit.</li>
        <li><b>Stakeholder</b> — any individual or group whose interest is affected by the firm: customers, employees, suppliers, governments, communities, investors.</li>
        <li><b>Service industry</b> — broadly all organizations except farming, mining, and manufacturing.</li>
      </ul>
      <h4>Keiretsu (and chaebol)</h4>
      <div class="keyterm"><b>Keiretsu</b> — Japanese form of cooperative relationship among legally independent companies that work closely together, often centered around a bank and trading company. Used in lean manufacturing for close, long-term relationships with fewer suppliers (Toyota's network is the classic example). Korean equivalent = <b>chaebol</b>.</div>
      <h4>Vertical vs. lateral (horizontal) integration</h4>
      <table><tr><th>Vertical</th><th>Lateral / horizontal</th></tr>
      <tr><td>Single firm owns multiple stages (upstream = backward integration; downstream = forward). Gains control, reduces transaction costs, but needs heavy capital and adds rigidity.</td>
      <td>Partnerships across the chain via contracts, alliances, or joint ventures. Retains focus on core competencies; gains agility but requires trust and governance.</td></tr></table>
      <h4>Stages of supply chain evolution</h4>
      <ol>
        <li><b>Multiple dysfunction</b> — silos, no shared data, reactive firefighting.</li>
        <li><b>Semifunctional enterprise</b> — functions optimize themselves; limited cross-functional integration.</li>
        <li><b>Integrated enterprise</b> — internal cross-functional alignment; S&amp;OP in place.</li>
        <li><b>Extended enterprise</b> — tier-1 suppliers and key customers linked; shared forecasts (e.g., CPFR).</li>
        <li><b>Orchestrated supply chain</b> — multi-tier collaboration, real-time visibility, network-wide optimization.</li>
      </ol>
      <div class="tip"><b>Exam cue:</b> The CSCP expects you to identify maturity stage from description and map appropriate strategy (e.g., stage 1 needs basic integration, not advanced analytics).</div>
      <h4>Manufacturing vs. service supply chains</h4>
      <p>Service chains often lack inventory buffer (production = consumption) — they emphasize capacity and scheduling flexibility. Specialized chains include reverse (returns), fast-fashion, and perishable / cold-chain.</p>
    `},
    {title:"B. Demand Analysis and Patterns",body:`
      <h4>Demand analysis road map</h4>
      <p>Combine <b>SWOT</b>, <b>market research</b>, <b>product assessment</b>, and macro/microeconomic data to understand demand drivers before you forecast.</p>
      <div class="keyterm"><b>SWOT:</b> Strengths/Weaknesses are internal; Opportunities/Threats are external. Used to align capabilities with market conditions.</div>
      <h4>Market research types</h4>
      <ul>
        <li><b>Primary</b> — surveys, focus groups, interviews; costly but current.</li>
        <li><b>Secondary</b> — published data, trade reports, internal records.</li>
        <li><b>Qualitative</b> — attitudes, preferences; <b>quantitative</b> — numeric share, volume, price elasticity.</li>
      </ul>
      <h4>Product life cycle (PLC)</h4>
      <p><b>Introduction → Growth → Maturity → Decline</b>. Each phase changes demand pattern and forecasting technique.</p>
      <table><tr><th>Stage</th><th>Volume</th><th>Forecast method</th><th>Priority</th></tr>
        <tr><td>Introduction</td><td>Low, uncertain</td><td>Judgmental, Delphi</td><td>Trial / awareness</td></tr>
        <tr><td>Growth</td><td>Rising quickly</td><td>Associative / trend</td><td>Expand capacity</td></tr>
        <tr><td>Maturity</td><td>Stable, seasonal</td><td>Time-series, seasonal indexes</td><td>Efficiency, cost</td></tr>
        <tr><td>Decline</td><td>Falling</td><td>Naïve / trend</td><td>Reduce inventory / exit</td></tr></table>
      <h4>Macroeconomic drivers</h4>
      <div class="keyterm"><b>GDP (real):</b> inflation-adjusted output. Rising real GDP ≈ expanding demand. Uses a <b>weighted average price</b> (fixed basket) to strip inflation.</div>
      <div class="keyterm"><b>Inflation</b>: general rise in prices; <b>Deflation</b>: general fall. Both distort demand signals — always analyze in real terms.</div>
      <p>Business cycles have four phases: expansion, peak, recession, trough. A <b>recession</b> = 2 consecutive quarters of negative real GDP growth; a <b>depression</b> is a severe, prolonged downturn.</p>
      <h4>Microeconomic concepts</h4>
      <div class="formula">Price elasticity of demand = % Δ quantity demanded / % Δ price</div>
      <ul>
        <li>|E| &gt; 1 → elastic (luxury, many substitutes)</li>
        <li>|E| &lt; 1 → inelastic (necessities, few substitutes)</li>
        <li>|E| = 1 → unit-elastic</li>
      </ul>
      <p><b>Marginal analysis</b> — compare marginal cost to marginal revenue; expand output while MR &gt; MC.</p>
      <h4>Short-/medium-term demand patterns</h4>
      <ul>
        <li><b>Trend</b> — sustained direction (up/down).</li>
        <li><b>Cycle</b> — multi-year business cycle.</li>
        <li><b>Seasonality</b> — repeating within a year.</li>
        <li><b>Promotions / internal</b> — self-induced.</li>
        <li><b>Random / irregular</b> — noise you can't forecast.</li>
      </ul>
    `},
    {title:"C. Demand Management & Marketing",body:`
      <h4>Demand plan</h4>
      <p>The <b>demand plan</b> translates forecasts + market/promo intel into a consensus view of future demand that drives S&amp;OP, MPS, and procurement.</p>
      <div class="keyterm"><b>Inputs:</b> statistical forecast, sales input, marketing/promotion calendar, customer commitments, new product intros, econometric data.</div>
      <div class="keyterm"><b>Planning horizon &amp; revision period:</b> horizon must match decision cycle (e.g., 18 months for capacity); revise monthly in rolling fashion.</div>
      <h4>Communication discipline</h4>
      <p>Communicate soon, structured, and focused — send the right info to the right stakeholders so they can act.</p>
      <h4>PDCA cycle (Deming / Shewhart)</h4>
      <p><b>Plan → Do → Check → Act</b>. Used for continuous improvement of demand management: plan the forecast/process, execute, compare to actuals, adjust the process.</p>
      <h4>The Four Ps and demand shaping</h4>
      <ul>
        <li><b>Product</b> — features, variants, SKUs</li>
        <li><b>Price</b> — everyday, promotional, bundle</li>
        <li><b>Placement</b> — channels, regions, availability</li>
        <li><b>Promotion</b> — advertising, incentives, PR</li>
      </ul>
      <p><b>Demand shaping</b> = deliberately using the 4 Ps (and pricing tactics like dynamic pricing, discounts) to steer demand toward available supply.</p>
      <h4>Product life cycle management</h4>
      <p>Managing NPI (New Product Introduction) schedules, phase-in/phase-out, and retirement plans. Higher NPI frequency → higher demand uncertainty, more safety stock, shorter forecast horizons.</p>
      <h4>Order winners, qualifiers, and losers (frequently tested)</h4>
      <table>
        <tr><th>Concept</th><th>What it does</th></tr>
        <tr><td><b>Order qualifier</b></td><td>Competitive characteristic that must be met just to be <em>considered</em>. Failing it loses orders; being better at it doesn't win them.</td></tr>
        <tr><td><b>Order winner</b></td><td>Characteristic that <em>causes</em> customers to choose your product — typically price, quality, delivery speed/reliability, design, flexibility, or service.</td></tr>
        <tr><td><b>Order loser</b></td><td>Characteristic that drives customers <em>away</em> (poor quality, late delivery, high price when price is a qualifier).</td></tr>
      </table>
      <div class="tip">Price might be a <em>qualifier</em> in a luxury market and a <em>winner</em> in a discount market. The same characteristic can change role across segments and over time.</div>
      <h4>Branding</h4>
      <p>Use of a name, term, symbol, or design to identify a product. Strong brand can convert a qualifier into a winner.</p>
    `},
    {title:"D. Forecasting Methods",body:`
      <h4>Five principles of forecasting</h4>
      <ol>
        <li>Base forecasts on <b>demand</b>, not orders (orders are constrained by supply).</li>
        <li>Forecasts are <b>(almost) always wrong</b> — plan for error.</li>
        <li>Always include an <b>estimate of error</b>.</li>
        <li>Forecasts are <b>more accurate for groups</b> than for individual items.</li>
        <li>Forecasts are <b>more accurate short-term</b> than long-term.</li>
      </ol>
      <h4>Forecasting process</h4>
      <ol><li>Determine purpose &amp; horizon</li><li>Select items/groups</li><li>Gather data</li><li>Select technique</li><li>Forecast</li><li>Measure error</li><li>Adjust &amp; improve</li></ol>
      <h4>Qualitative methods</h4>
      <ul>
        <li><b>Judgmental / expert opinion</b> — sales force composite, executive opinion.</li>
        <li><b>Delphi</b> — iterative anonymous expert rounds until convergence; best for long-range, NPI, tech forecasts.</li>
        <li><b>Combination</b> — blend qualitative with quantitative for new products.</li>
      </ul>
      <h4>Quantitative: time-series</h4>
      <div class="formula">Simple moving average (n=3): F<sub>t+1</sub> = (D<sub>t</sub>+D<sub>t-1</sub>+D<sub>t-2</sub>)/3</div>
      <div class="formula">Weighted MA: F<sub>t+1</sub> = Σ(w<sub>i</sub>·D<sub>i</sub>) &nbsp; where Σw<sub>i</sub>=1</div>
      <div class="formula">Exponential smoothing: F<sub>t+1</sub> = α·D<sub>t</sub> + (1-α)·F<sub>t</sub> &nbsp; (0&lt;α&lt;1)</div>
      <p>Higher α = more weight to recent demand (faster response, noisier). Use <b>deseasonalize → forecast → reseasonalize</b> when seasonality is present.</p>
      <h4>Seasonal index</h4>
      <div class="formula">Seasonal index = Avg period demand / Avg all periods</div>
      <p>Deseasonalized demand = Actual / Seasonal index. Re-apply index after forecasting the deseasonalized series.</p>
      <h4>Associative forecasting (causal)</h4>
      <ul>
        <li><b>Simple regression</b>: Y = a + bX (one predictor).</li>
        <li><b>Multiple regression</b>: multiple independent variables (price, advertising, GDP).</li>
        <li><b>Leading indicator</b> — changes <em>before</em> demand (housing starts → appliance demand).</li>
        <li><b>Correlation ≠ causation</b>; validate causality before using.</li>
      </ul>
      <h4>Forecast error metrics</h4>
      <div class="formula">Error<sub>t</sub> = Actual<sub>t</sub> − Forecast<sub>t</sub></div>
      <div class="formula">MAD = Σ|Error|/n &nbsp;(Mean Absolute Deviation)</div>
      <div class="formula">MSE = Σ(Error²)/n &nbsp;(penalizes large errors)</div>
      <div class="formula">MAPE = (Σ|Error/Actual|)/n × 100% &nbsp;(comparable across series)</div>
      <div class="formula">Bias / Running Sum of Forecast Errors (RSFE) = Σ(Error)</div>
      <div class="formula">Tracking signal = RSFE / MAD &nbsp;(within ±4 typical; ±6 alert)</div>
      <div class="tip">If tracking signal trends outside ±4 → forecast is biased; investigate and re-parameterize.</div>
      <h4>Service-level conversions (commonly tested)</h4>
      <ul>
        <li><b>1 MAD ≈ 80% service level · 2 MAD ≈ 95% · 3 MAD ≈ 99%</b></li>
        <li><b>1σ ≈ 84% · 2σ ≈ 98%</b></li>
        <li><b>Standard deviation ≈ 1.25 × MAD</b></li>
      </ul>
      <div class="formula">Safety stock (using MAD) = Safety factor × MAD</div>
      <div class="formula">MSE = Σ(Actual − Forecast)² / n &nbsp; — penalizes large errors</div>
      <h4>Other forecast concepts</h4>
      <ul>
        <li><b>Life cycle analysis (analog forecasting)</b> — apply demand patterns from a similar prior product to forecast a new launch.</li>
        <li><b>R²</b> — fit of regression line; 1.0 = perfect, 0 = none. High R² ≠ causation.</li>
        <li><b>PLM (Product Lifecycle Management)</b> — discipline of managing product information end-to-end through forward & reverse logistics.</li>
        <li><b>Productivity</b> = output / input (units per labor hour, $ sales per employee).</li>
      </ul>
    `},
    {title:"E. Aligning Supply with Demand — S&OP",body:`
      <h4>Sales & Operations Planning (S&OP)</h4>
      <p><b>S&amp;OP</b> is a mid-to-long-term planning process that compares the demand plan with inventory and capacity, integrates business plans (sales, marketing, ops, finance, sourcing), and produces a high-level production plan at the <b>product family</b> level. Performed at least monthly; reviewed by senior management.</p>
      <p>Five S&amp;OP steps: (1) data gathering, (2) demand planning, (3) supply planning, (4) <b>reconciliation</b>, (5) executive S&amp;OP meeting.</p>
      <h4>Production strategies</h4>
      <ul>
        <li><b>Level production</b> — stable production rate; vary inventory to absorb demand swings (build during low demand, deplete during high).</li>
        <li><b>Chase</b> — vary production each period to match demand (overtime, hiring/firing, outsourcing).</li>
        <li><b>Hybrid</b> — combine level + chase to minimize total cost.</li>
      </ul>
      <h4>Manufacturing environments / Customer Order Decoupling Point (CODP)</h4>
      <table>
        <tr><th>Environment</th><th>What's stocked</th><th>Customer lead time</th><th>Variety</th></tr>
        <tr><td><b>Make-to-Stock (MTS)</b></td><td>Finished goods</td><td>Shortest</td><td>Lowest (consumer goods)</td></tr>
        <tr><td><b>Assemble-to-Order (ATO)</b></td><td>Modules / subassemblies</td><td>Short</td><td>Medium (laptops, autos)</td></tr>
        <tr><td><b>Make-to-Order (MTO)</b></td><td>Raw materials only</td><td>Long</td><td>High</td></tr>
        <tr><td><b>Engineer-to-Order (ETO)</b></td><td>Nothing — design after order</td><td>Longest</td><td>Highest (custom projects)</td></tr>
        <tr><td><b>Package-to-Order (PTO)</b></td><td>Finished item; packaging delayed</td><td>Short</td><td>Multi-customer / region</td></tr>
      </table>
      <p>The <b>CODP</b> is the point in the chain where production switches from forecast-driven (push) to order-driven (pull). MTS = all push; ETO = all pull.</p>
      <h4>Other S&amp;OP vocabulary</h4>
      <ul>
        <li><b>Product family</b> — group of items with similar processing &amp; equipment, used for aggregate planning.</li>
        <li><b>Resource planning</b> — long-range capacity at the business plan level (top-management approval needed).</li>
        <li><b>Master planning</b> — bundles demand management, production/resource planning, and master scheduling.</li>
        <li><b>Backlog</b> — orders received but not yet shipped.</li>
        <li><b>Customer service ratio</b> — MTS: % items/$ shipped on schedule. MTO: % jobs shipped on time.</li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m2", shortTitle:"Mod 2 · Global Networks",
  title:"Module 2 — Global Supply Chain Networks",
  blurb:"Network design, IT systems (ERP/APS/WMS/TMS), visibility, e-business, master data, global considerations.",
  sections:[
    {open:true,title:"A. Supply Chain Network Design",body:`
      <p><b>Supply chain design</b> translates business strategy into a physical and information network that balances <b>efficiency, responsiveness, and resilience</b>.</p>
      <div class="keyterm"><b>Efficient vs. responsive design (Fisher):</b> Functional products (stable demand) → efficient, low-cost chains. Innovative products (uncertain demand) → responsive, flexible chains.</div>
      <div class="keyterm"><b>Resilience:</b> ability to recover from disruption. Built through redundancy, flexibility, visibility, and strong supplier relationships.</div>
      <h4>Network configuration decisions</h4>
      <ul>
        <li>Number, location, capacity of facilities</li>
        <li>Centralized vs. decentralized distribution</li>
        <li>Transportation modes &amp; routes</li>
        <li>Make-or-buy at each node</li>
        <li>Inventory placement and postponement</li>
      </ul>
      <h4>Benefit-cost analysis (BCA) for IT</h4>
      <div class="formula">ROI = (Benefits − Costs) / Costs × 100%</div>
      <p><b>Tangible benefits</b> = inventory reduction, cycle-time cut, labor savings. <b>Intangible benefits</b> = better decisions, customer satisfaction, morale. Costs include licenses, hardware, integration, training, change management.</p>
      <h4>Nucleus firm & cross-functional teams</h4>
      <p>The <b>nucleus firm</b> (focal firm) orchestrates partners and makes network-level decisions. Success requires cross-functional teams with shared KPIs.</p>
    `},
    {title:"B. End-to-End Connectivity & Visibility Technologies",body:`
      <h4>ERP (Enterprise Resource Planning)</h4>
      <p>Single, integrated database of master data + transactions across finance, HR, sales, manufacturing, procurement. Benefits: real-time integration, single source of truth, process discipline. Risks: cost, long implementation, change resistance.</p>
      <div class="keyterm"><b>Configuration vs. customization:</b> configure = adjust parameters within delivered functionality (preferred, easy to upgrade); customize = modify code (risky, breaks upgrades).</div>
      <div class="keyterm"><b>Best-of-breed:</b> pick the best specialized system per function and integrate. More capability per module but integration is complex.</div>
      <h4>APS (Advanced Planning & Scheduling)</h4>
      <p>Uses constraint-based optimization and memory-resident models to plan demand, supply, and capacity simultaneously across a network. Benefits: better promise dates (CTP/ATP), feasible plans, what-if analysis.</p>
      <h4>SCEM (Supply Chain Event Management)</h4>
      <p>Monitors events in real time against thresholds; generates alerts and drives corrective action. Core to <b>active visibility</b> and exception management.</p>
      <h4>WMS (Warehouse Management)</h4>
      <p>Receives, putaway, slotting, picking, packing, shipping, cycle counting, yard management. Integrates with ERP, TMS, voice-pick, RF/RFID.</p>
      <h4>TMS (Transportation Management)</h4>
      <p>Mode selection, routing, rate shopping, load consolidation, tracking, freight audit. Supports <b>collaborative transportation management (CTM)</b> across carriers and shippers.</p>
      <h4>Supply chain integration methods</h4>
      <table><tr><th>Method</th><th>What it is</th></tr>
        <tr><td>Quick-response (QR)</td><td>Retailer shares POS with suppliers to replenish faster (esp. fashion).</td></tr>
        <tr><td>Continuous replenishment (CRP)</td><td>Supplier auto-replenishes based on actual consumption.</td></tr>
        <tr><td>Vendor-Managed Inventory (VMI)</td><td>Supplier owns the replenishment decision; customer shares stock &amp; demand data.</td></tr>
        <tr><td>CPFR</td><td>Collaborative Planning, Forecasting &amp; Replenishment — shared forecasts &amp; plans.</td></tr>
        <tr><td>Distributor integration</td><td>Common systems &amp; service levels across a distributor network.</td></tr></table>
      <h4>E-business & e-commerce</h4>
      <ul>
        <li><b>B2B</b> — supplier portals, EDI, buy-side/sell-side e-commerce, exchanges.</li>
        <li><b>B2C</b> — online retail, direct-to-consumer.</li>
        <li><b>Layers</b>: content, community, commerce, collaboration.</li>
      </ul>
    `},
    {title:"C. Supply Chain Metrics and Reports",body:`
      <h4>Financial statements & metrics</h4>
      <ul>
        <li><b>Balance Sheet</b> — Assets = Liabilities + Equity at a point in time.</li>
        <li><b>Income Statement</b> — Revenue − Expenses = Net Income over a period.</li>
        <li><b>Cash Flow</b> — operating, investing, and financing activities.</li>
        <li><b>COGS</b> — direct materials + direct labor + allocated overhead for goods sold.</li>
        <li><b>Gross Margin</b> = (Revenue − COGS)/Revenue.</li>
        <li><b>ROA</b> = Net Income / Total Assets · <b>ROI</b> = (Gain − Cost)/Cost.</li>
      </ul>
      <h4>Cash-to-Cash cycle time</h4>
      <div class="formula">Cash-to-Cash = Inventory Days + AR Days − AP Days</div>
      <p>Lower is better; <em>negative</em> means you collect from customers before paying suppliers (highly favorable working capital).</p>
      <h4>Inventory & operational metrics</h4>
      <div class="formula">Inventory Turnover = Annual COGS / Average Inventory</div>
      <div class="formula">Days of Supply = Inventory on hand / Avg daily COGS</div>
      <div class="formula">Fill Rate = Units shipped on time / Units ordered</div>
      <ul>
        <li><b>Perfect order</b> — all 7 Rs met (right product, qty, condition, place, time, customer, cost).</li>
        <li><b>OTIF</b> — On-Time In-Full delivery.</li>
        <li><b>Order fulfillment cycle time</b> — order receipt to customer acceptance.</li>
        <li><b>Inventory accuracy</b> — % within tolerance vs. records (target 95–99%).</li>
        <li><b>Inventory velocity</b> — speed of inventory through the firm (turnover).</li>
        <li><b>Dwell time</b> — lead time caused by customer requirements (not deducted from order-fulfillment cycle time).</li>
        <li><b>Backorder</b> — unfilled or past-due demand against insufficient inventory.</li>
        <li><b>Inventory shrinkage</b> — losses from scrap, theft, deterioration, evaporation.</li>
      </ul>
      <h4>SCOR Model & Balanced Scorecard</h4>
      <ul>
        <li><b>SCOR</b> processes (DS): Orchestrate · Plan · Source · Order · Transform · Fulfill · Return. Three metric levels for benchmarking.</li>
        <li><b>SCOR attributes</b> (customer-facing): Reliability · Responsiveness · Agility. (Internal): Cost · Asset Management.</li>
        <li><b>Balanced Scorecard</b> (Kaplan &amp; Norton): Financial · Customer · Internal Process · Learning &amp; Growth.</li>
        <li><b>Dashboard</b> — combines BI &amp; data integration to address objectives.</li>
        <li><b>Suboptimization</b> — optimizing a piece at the expense of the whole (common exam trap).</li>
      </ul>
      <h4>Promise types</h4>
      <ul>
        <li><b>ATP</b> (Available-to-Promise) — against inventory and MPS.</li>
        <li><b>CTP</b> (Capable-to-Promise) — also considers <b>capacity</b> via finite scheduling.</li>
        <li><b>PTP</b> (Profitable-to-Promise) — prioritizes orders that generate the most margin.</li>
      </ul>
      <h4>Strategic Profit Model / DuPont</h4>
      <div class="formula">ROA = Net Profit Margin × Asset Turnover</div>
      <div class="formula">Net Profit Margin = Net Profit / Net Sales · Asset Turnover = Net Sales / Total Assets</div>
      <div class="formula">Working Capital = Current Assets − Current Liabilities</div>
      <div class="keyterm"><b>SC impact on ROA:</b> supply chain affects COGS, inventory (current asset), AR (order-to-cash speed), and fixed-asset utilization — moving both numerator and denominator of ROA.</div>
      <h4>Financial ratio categories</h4>
      <table>
        <tr><th>Type</th><th>Examples</th></tr>
        <tr><td><b>Liquidity</b></td><td>Current ratio = CA/CL; Quick ratio = (CA − Inv)/CL</td></tr>
        <tr><td><b>Profitability</b></td><td>Gross margin, net profit margin, ROA, ROI, ROIC</td></tr>
        <tr><td><b>Activity / Efficiency</b></td><td>Inventory turnover, asset turnover, AR turnover, days of supply</td></tr>
        <tr><td><b>Leverage</b></td><td>Debt-to-equity, debt-to-assets</td></tr>
      </table>
      <h4>Other financial concepts</h4>
      <ul>
        <li><b>Altman Z-Score</b> — bankruptcy-prediction formula. >2.99 safe; 1.81–2.99 grey; &lt;1.81 distress. Used in supplier risk assessment.</li>
        <li><b>Capex vs. Opex</b> — Capex = long-term assets; Opex = ongoing operations. Cloud/SaaS shifts Capex → Opex.</li>
        <li><b>Letter of Credit (L/C)</b> — bank guarantee of payment in international trade.</li>
        <li><b>IFRS</b> — International Financial Reporting Standards.</li>
        <li><b>EVA</b> — Economic Value Added (profit above the cost of capital).</li>
        <li><b>Variance</b> — difference between budget/standard and actual; cost variance, usage variance.</li>
        <li><b>DSO</b> — Days Sales Outstanding (collection speed).</li>
        <li><b>Funds Flow Statement</b> — synonym for Statement of Cash Flows.</li>
      </ul>
    `},
    {title:"D. Master Data, Legal & Cyber Security",body:`
      <h4>Master data</h4>
      <p>Non-transactional, high-value reference data shared across the enterprise: <b>customers, suppliers, items/SKUs, BOMs, routings, locations, prices</b>. Foundation for all processes.</p>
      <h4>Master-data lifecycle (commonly tested)</h4>
      <ol>
        <li><b>Create</b> — establish new records with validation/approval.</li>
        <li><b>Update</b> — modify as conditions change (price, address, lead time).</li>
        <li><b>Cleanse</b> — find &amp; fix mistakes (misspellings, missing data, duplicates).</li>
        <li><b>Retire</b> — remove obsolete records while keeping history.</li>
      </ol>
      <h4>Data management vocabulary</h4>
      <ul>
        <li><b>Data governance</b> — overall management of data availability, usability, integrity, security.</li>
        <li><b>Data normalization</b> — minimize duplication when merging databases.</li>
        <li><b>Data dictionary</b> — catalog of requirements/specs for data.</li>
        <li><b>Data integrity</b> — accuracy, consistency, completeness, validity over time.</li>
        <li><b>Data warehouse</b> — repository for querying/analysis.</li>
        <li><b>Big data</b> — datasets too large for standard tools.</li>
        <li><b>Data mining</b> — searching for previously unknown relationships.</li>
        <li><b>DBMS</b> — Database Management System.</li>
      </ul>
      <h4>AIDC — data capture technologies</h4>
      <ul>
        <li><b>Barcodes / scanners</b> (1D linear, 2D QR) — line-of-sight.</li>
        <li><b>RFID</b> — Active (self-powered, long range), Passive (powered by reader, cheap), Semipassive (battery-assisted). NO line of sight needed.</li>
        <li><b>EPC</b> — Electronic Product Code, globally unique RFID identifier.</li>
        <li><b>POS</b>, <b>smart cards</b>, <b>magnetic stripes</b>, <b>voice recognition</b>, <b>pick-to-light</b>.</li>
        <li>Other capture: <b>GPS</b>, <b>IoT sensors</b>, <b>EDI</b>, <b>APIs</b>.</li>
      </ul>
      <h4>Legal & privacy</h4>
      <ul>
        <li><b>GDPR</b> (EU) — consent-based personal data; data-subject rights (access, erasure, portability).</li>
        <li><b>CCPA</b> (California) — consumer privacy.</li>
        <li><b>HIPAA</b> (US) — health data.</li>
        <li><b>Data residency</b> rules — which nation data must reside in (critical for cloud).</li>
        <li><b>IP protection</b> — clear partner agreements; trade-secret safeguards.</li>
      </ul>
      <h4>Cybersecurity</h4>
      <p>Encryption, access control, multi-factor auth, intrusion detection, SOC monitoring. Controls protect against unauthorized access, ransomware, and breaches. <b>Cyber insurance</b> covers attack/breach losses; <b>trade-disruption insurance</b> covers political/non-physical disruption.</p>
      <h4>Common standards adoption</h4>
      <p>Adopting common data standards across partners (EDI, GS1) reduces risk and improves interoperability.</p>
    `},
    {title:"E. International Trade & Additional Key Terms",body:`
      <h4>Sunk costs and decision making</h4>
      <div class="danger"><b>Sunk cost</b> — a past cost already incurred and unrecoverable. <b>Irrelevant</b> to future decisions; only future incremental costs and benefits matter. Common exam distractor.</div>
      <h4>Currency &amp; financial risk</h4>
      <p>Exchange-rate volatility affects landed cost and margins. Mitigations: <b>natural hedge</b> (match revenues/costs in the same currency), forward contracts, currency clauses in supply agreements.</p>
      <h4>Incoterms 2020</h4>
      <p>Rules from ICC defining buyer/seller obligations for delivery, risk transfer, and cost of international shipments.</p>
      <table><tr><th>Any mode</th><th>Sea / inland waterway only</th></tr>
        <tr><td>EXW, FCA, CPT, CIP, DAP, DPU, DDP</td><td>FAS, FOB, CFR, CIF</td></tr></table>
      <div class="keyterm"><b>EXW</b> = seller minimum; <b>DDP</b> = seller maximum (delivered, duty paid).</div>
      <h4>Trade regulations</h4>
      <ul>
        <li><b>Harmonized System (HS)</b> codes — international product classification for customs.</li>
        <li><b>HTS</b> — US Harmonized Tariff Schedule.</li>
        <li><b>Tariff</b> — official import/export tax schedule.</li>
        <li><b>Trade bloc</b> — agreement between countries to reduce barriers (EU, USMCA).</li>
        <li><b>FTZ / Free Trade Zone</b> — defer/avoid duties until release to home market.</li>
        <li><b>Country of origin</b> rules impact duty rates &amp; FTAs.</li>
        <li><b>C-TPAT / AEO</b> — trusted-trader programs accelerating customs.</li>
        <li><b>CISG (Vienna Convention)</b> — uniform rules for international goods sales.</li>
      </ul>
      <h4>Network architecture vocabulary</h4>
      <ul>
        <li><b>LAN</b> (Local Area Network), <b>WAN</b> (Wide Area Network).</li>
        <li><b>Intranet</b> (internal), <b>Extranet</b> (with partners), <b>VAN</b> (value-added network for EDI).</li>
        <li><b>Middleware</b> — software enabling communication between systems not designed to interact.</li>
        <li><b>Legacy system</b> — old, hard-to-replace business app with poor interfaces.</li>
        <li><b>DSS</b> (Decision Support System) — assists managers in evaluating alternatives.</li>
        <li><b>Microservices</b> — applications built as small independent services for flexibility and scale.</li>
        <li><b>Web services / APIs</b> — open frameworks for cross-app data movement (REST, SOAP).</li>
      </ul>
      <h4>Other Module-2 terms</h4>
      <ul>
        <li><b>Aggregation / risk pooling</b> — relative variance of total demand is less than that of individual items; basis for centralized inventory.</li>
        <li><b>Multicountry / multidomestic strategy</b> — each country market self-contained vs. a global standardized product.</li>
        <li><b>Batch processing</b> — accumulate transactions for periodic processing.</li>
        <li><b>BPM</b> — Business Process Management.</li>
        <li><b>Consignment</b> — supplier places goods at customer location; payment only when used/sold.</li>
        <li><b>Modular system</b> — related tasks grouped in independent packages.</li>
      </ul>
    `},
  ]
});

MODULES.push({
  id:"m3", shortTitle:"Mod 3 · Sourcing",
  title:"Module 3 — Sourcing Products & Services",
  blurb:"Make-vs-buy, TCO, category strategy, Kraljic, supplier relationships, contracts, product design influence.",
  sections:[
    {open:true,title:"A. Aligning Sourcing Activities to Demand",body:`
      <h4>Sourcing vs. procurement</h4>
      <div class="keyterm"><b>Sourcing</b> = strategic process: identify need, select supplier, negotiate contract, manage relationship.<br><b>Procurement</b> = tactical transaction: release PO, receive, pay.</div>
      <h4>Make-versus-buy</h4>
      <p>Key questions:</p>
      <ol>
        <li>Is the activity a <b>core competency</b>?</li>
        <li>Consequences of <b>lost skills/knowledge</b>?</li>
        <li>Total <b>landed cost / TCO</b>?</li>
        <li>Capacity, quality, IP, strategic risk?</li>
      </ol>
      <p><b>Make</b> when: core competency, protects IP, strategic control needed, lower total cost with utilization. <b>Buy</b> when: commodity, supplier has scale, frees capital, access to specialized skill.</p>
      <h4>Contracting & outsourcing</h4>
      <ul>
        <li><b>Outsourcing</b> = contracting an external party to perform an activity previously done internally.</li>
        <li><b>Offshoring</b> = moving work to another country (can be outsourced or captive).</li>
        <li><b>Reshoring / nearshoring</b> = bringing work back closer to home due to cost/risk shifts.</li>
      </ul>
      <h4>Total Cost of Ownership (TCO)</h4>
      <p>All costs over the life of the purchase: acquisition, ownership, disposal.</p>
      <div class="formula">TCO = Purchase price + Transportation + Duties/taxes + Quality/inspection + Inventory carrying + Installation + Maintenance + Support + Disposal − Salvage</div>
      <div class="tip"><b>Landed cost</b> specifically covers the cost to land goods at destination (price + freight + duties + insurance + handling). TCO is broader.</div>
      <p><b>Should-cost analysis</b> — buyer models what the product <em>should</em> cost (material + labor + overhead + margin) to benchmark supplier quotes.</p>
    `},
    {title:"B. Category Strategy for Sourcing",body:`
      <p>The <b>Kraljic portfolio matrix</b> segments spend by two axes:</p>
      <ul>
        <li><b>Profit impact</b> / strategic importance (low → high)</li>
        <li><b>Supply risk</b> / market complexity (low → high)</li>
      </ul>
      <table><tr><th></th><th>Low risk</th><th>High risk</th></tr>
        <tr><th>Low profit impact</th><td><b>Non-critical</b> — routine items. Strategy: simplify, e-procure, blanket orders, automate.</td><td><b>Bottleneck</b> — low spend, scarce supply. Strategy: ensure supply, safety stock, qualify alternates.</td></tr>
        <tr><th>High profit impact</th><td><b>Leverage</b> — high spend, many suppliers. Strategy: competitive bidding, consolidate spend, exploit buying power.</td><td><b>Strategic</b> — high spend, scarce supply. Strategy: long-term partnership, joint development, risk share.</td></tr></table>
      <h4>Supplier segments & relationships</h4>
      <p>Type of relationship depends on mutual need &amp; strategic fit:</p>
      <ul>
        <li><b>Transactional / arm's length</b> — price focus, short term.</li>
        <li><b>Preferred supplier</b> — multi-year, performance rating.</li>
        <li><b>Strategic alliance</b> — co-investment, shared risk/reward.</li>
        <li><b>Partnership / joint venture</b> — deep integration, shared IP.</li>
      </ul>
      <h4>Supply base analysis & right-sizing</h4>
      <p><b>Spend analysis</b> categorizes and ranks spend (Pareto / 80-20). <b>Right-sizing</b> balances risk reduction (multiple suppliers) vs. leverage (fewer suppliers). Approaches: single, dual, multiple sourcing; supplier rationalization.</p>
    `},
    {title:"C. Product Design Influence",body:`
      <h4>Traditional vs. concurrent design</h4>
      <p><b>Traditional</b> = sequential (design → procure → produce), slow, late supplier input. <b>Concurrent engineering</b> = cross-functional team including suppliers from the start; reduces cost, time, and quality problems.</p>
      <div class="keyterm"><b>Design for X (DFX):</b> design for manufacturing, assembly, serviceability, environment, cost, logistics, supply chain.</div>
      <h4>Specifications</h4>
      <ul>
        <li><b>Performance</b> spec — describes what the item must do; supplier has freedom.</li>
        <li><b>Design / technical</b> spec — exact dimensions, materials, process.</li>
        <li><b>Commercial / market</b> — brand, model, grade.</li>
      </ul>
      <p><b>Standardization</b> reduces variety; <b>modularity</b> supports mass customization &amp; postponement.</p>
      <h4>Value engineering / value analysis</h4>
      <p>Cross-functional review of a product's function vs. cost to eliminate unnecessary cost without losing function or quality.</p>
    `},
    {title:"D. Supplier Selection, Contracting & Purchase Orders",body:`
      <h4>Procurement cycle</h4>
      <p>Requisition → RFx (RFI / RFP / RFQ) → bid evaluation → negotiation → contract → PO → receipt → invoice match (3-way) → payment (P2P).</p>
      <h4>Contract types</h4>
      <ul>
        <li><b>Fixed-price (FFP)</b> — supplier bears cost risk; use for stable, well-defined scope.</li>
        <li><b>Cost-reimbursable</b> — buyer bears cost risk; includes CPFF, CPIF, CPAF.</li>
        <li><b>T&amp;M</b> — time &amp; materials; used when scope uncertain.</li>
        <li><b>Indefinite delivery (IDIQ, blanket)</b> — umbrella contract; releases by PO.</li>
      </ul>
      <h4>Negotiation styles</h4>
      <p><b>Distributive</b> (win-lose, fixed pie) vs. <b>integrative</b> (win-win, expand the pie). Know your <b>BATNA</b> (best alternative to a negotiated agreement) and ZOPA (zone of possible agreement).</p>
      <h4>Supplier evaluation & metrics</h4>
      <p>Common KPIs: <b>on-time delivery, quality PPM, price variance, fill rate, lead time, responsiveness</b>. Use weighted scorecards to compare.</p>
    `},
    {title:"E. Sourcing Methods, Auctions & Trade — Reference",body:`
      <h4>Sourcing methods (single vs. sole — must know!)</h4>
      <table>
        <tr><th>Type</th><th>Definition</th><th>Driver</th></tr>
        <tr><td><b>Insourcing</b></td><td>Use the firm's internal resources.</td><td>Reverse of outsourcing.</td></tr>
        <tr><td><b>Outsourcing</b></td><td>Have suppliers provide goods/services previously done internally.</td><td>Substitution of capacity.</td></tr>
        <tr><td><b>Subcontracting</b></td><td>Send production work outside to another manufacturer.</td><td>Capacity shortfall, specialty work.</td></tr>
        <tr><td><b>Single sourcing</b></td><td>Use ONE supplier <em>by choice</em> (alternatives exist).</td><td>Lean, deeper relationship.</td></tr>
        <tr><td><b>Sole sourcing</b></td><td>Only ONE supplier is <em>available</em> (patents, tooling).</td><td>Forced, not preferred.</td></tr>
        <tr><td><b>Multi-sourcing</b></td><td>Multiple suppliers for the same item.</td><td>Continuity, foster competition.</td></tr>
      </table>
      <div class="danger"><b>Single ≠ Sole.</b> Single = chosen; Sole = no alternatives. The exam tests this distinction frequently.</div>
      <h4>Auction types</h4>
      <table>
        <tr><th>Auction</th><th>Direction</th><th>Use</th></tr>
        <tr><td><b>Forward / classic</b></td><td>One seller, many buyers bid UP.</td><td>Unique / scarce goods.</td></tr>
        <tr><td><b>Reverse</b></td><td>One buyer, many sellers bid DOWN.</td><td>Commodities; price-driven sourcing.</td></tr>
        <tr><td><b>Dutch</b></td><td>Price starts HIGH and drops; bid = contract.</td><td>Treasury securities.</td></tr>
        <tr><td><b>Demand-management</b></td><td>Liquidate excess capacity (airlines, hotels).</td><td>Yield management.</td></tr>
        <tr><td><b>Stock-market style</b></td><td>Many buyers AND sellers; dynamic pricing.</td><td>Commodities, exchanges.</td></tr>
      </table>
      <h4>Procurement process & three-way match</h4>
      <p>Tactical purchase-to-pay cycle: <b>Requisition → PO → Receive → Inspect → 3-way match → Pay</b>.</p>
      <div class="keyterm"><b>Three-way match</b> — payment authorized only when PO + Receiving Report + Invoice all agree (what was ordered, received, billed). Anti-fraud control.</div>
      <h4>TCO components — <em>net</em> vs. <em>ongoing</em> costs</h4>
      <ul>
        <li><b>Net cost</b> = Gross cost − discounts − rebates − allowances.</li>
        <li><b>Ongoing costs</b> — quality management, relationship management, audits, performance monitoring, continuous improvement.</li>
      </ul>
      <h4>Product design influence — DFX & strategy</h4>
      <ul>
        <li><b>DFX</b> = Design for Excellence (umbrella).</li>
        <li><b>DFM / DFA / DFMA</b> — Manufacturability / Assembly / both. Simplify parts/processes.</li>
        <li><b>DFQ</b> — Design for Quality. <b>DFSS</b> — Design for Six Sigma.</li>
        <li><b>DFE</b> — Design for Environment.</li>
        <li><b>Design for Service</b> — simplify parts/processes for after-sale service.</li>
        <li><b>Design for Supply Chain / Logistics</b> — optimize for transportation, warehousing, handling.</li>
      </ul>
      <h4>Postponement, mass customization, glocalization</h4>
      <div class="keyterm"><b>Postponement</b> — deliberately delay final differentiation until the latest possible point. Reduces risk of forecast error and excess finished goods. Synonyms: delayed differentiation.</div>
      <ul>
        <li><b>Mass customization</b> — mass-production efficiency with broad variety, primarily through postponement &amp; modular design.</li>
        <li><b>Modular design</b> — common interfaces enable many configurations.</li>
        <li><b>Standardization</b> — fewer parts and procedures.</li>
        <li><b>Simplification</b> — remove complexity from product/service.</li>
        <li><b>Universality</b> — design for one market that can sell in others.</li>
        <li><b>Glocalization</b> — global product modified for local laws, customs, tastes (a form of postponement).</li>
      </ul>
      <h4>QFD (Quality Function Deployment)</h4>
      <p><b>QFD</b> translates the Voice of the Customer into design specs using the <b>House of Quality</b> matrix (customer requirements vs. engineering attributes; relationship/correlation grids; targets).</p>
      <h4>Contract types — extended</h4>
      <ul>
        <li><b>Fixed-price (FFP)</b> — supplier bears risk.</li>
        <li><b>Cost-plus-fixed-fee (CPFF)</b> — buyer pays costs + fixed fee.</li>
        <li><b>Cost-plus-incentive-fee (CPIF)</b> — costs + bonus if targets met.</li>
        <li><b>Cost-plus-award-fee (CPAF)</b> — costs + subjective award.</li>
        <li><b>Fixed-Price Incentive (FPIF)</b> — set price + bonus.</li>
        <li><b>Time &amp; Materials</b> — used when scope uncertain.</li>
        <li><b>Blanket PO</b> — long-term commitment with short-term releases.</li>
        <li><b>Annualized contract</b> — yearly agreement on pricing &amp; supply continuity.</li>
        <li><b>Incentive contract</b> — share cost savings beyond target / overage up to a cap.</li>
        <li><b>Cost-based</b> — price tied to input cost or economic factors.</li>
      </ul>
      <h4>Location strategies & trade</h4>
      <ul>
        <li><b>Offshoring</b> — distant country (lowest labor cost, longest lead times).</li>
        <li><b>Nearshoring</b> — nearby country (e.g., US→Mexico). Shorter lead times, similar time zone.</li>
        <li><b>Reshoring</b> — bringing work back home.</li>
        <li><b>CISG (Vienna Convention)</b> — UN Convention on Contracts for International Sale of Goods. Provides uniform default rules.</li>
        <li><b>Multicountry / multidomestic strategy</b> — each country tailored vs. global standardized.</li>
      </ul>
      <h4>E-marketplace types</h4>
      <ul>
        <li><b>Consortia Trade Exchange (CTX)</b> — owned by an industry group (e.g., automotive Covisint).</li>
        <li><b>Independent Trading Exchange</b> — third-party owned.</li>
        <li><b>Private Trading Exchange</b> — hosted by a single company for its partners.</li>
        <li><b>Vertical / Horizontal marketplace</b> — within one industry vs. across industries.</li>
      </ul>
    `},
  ]
});

MODULES.push({

      <div class="keyterm"><b>Time fences:</b> Demand fence (frozen — no changes, MPS firm) · Planning fence (trading — changes with authorization) · Beyond planning fence (liquid).</div>

    {title:"B. Capacity Management",body:`
      <h4>Capacity planning hierarchy</h4>
      <ol>
        <li><b>Resource planning</b> (long-term, aligned with S&amp;OP)</li>
        <li><b>Rough-cut capacity planning (RCCP)</b> — validates MPS against critical resources</li>

      <h4>Theory of Constraints (TOC)</h4>
      <p>Goldratt: throughput = sales − variable cost; constraint (bottleneck) determines throughput. <b>Five focusing steps:</b> Identify → Exploit → Subordinate → Elevate → Repeat.</p>

    {title:"C. Inventory Management",body:`
      <h4>Functions & types</h4>
      <p>Buffers <b>demand/supply uncertainty</b>, <b>lead time</b>, <b>cycle</b> (batching), <b>pipeline</b> (in-transit), <b>hedge</b>, <b>anticipation</b> (seasonal, promo).</p>
      <div class="keyterm"><b>MRO</b> — maintenance, repair, operating supplies (not in finished product).</div>
      <h4>ABC analysis (Pareto)</h4>
      <p>Classify SKUs by annual dollar volume: <b>A</b> ≈ 70–80% of value in 10–20% of items; <b>B</b> middle; <b>C</b> ≈ 5% of value in 50%+ of items. Tight control on A (cycle count monthly), loose on C.</p>
      <h4>EOQ — Economic Order Quantity</h4>
      <div class="formula">EOQ = √( 2·D·S / H )</div>
      <p>where D = annual demand, S = setup/order cost, H = holding cost per unit per year.</p>
      <div class="formula">Total cost = (D/Q)·S + (Q/2)·H &nbsp; — minimized at Q = EOQ</div>
      <div class="formula">Number of orders = D / EOQ &nbsp;·&nbsp; Cycle time = EOQ / D</div>
      <h4>Reorder point & safety stock</h4>
      <div class="formula">ROP = d·LT + SS &nbsp; (d = daily demand, LT = lead time in days)</div>
      <div class="formula">Safety stock = z · σ<sub>LT</sub> &nbsp;where z is the service-level factor (95% → 1.65; 98% → 2.05; 99% → 2.33)</div>
      <h4>Periodic review (P-model)</h4>
      <p>Review at fixed interval T, order-up-to level M. <b>Order quantity = M − Inventory on hand at review</b>. More safety stock than Q-model because cover T+LT.</p>
      <h4>Inventory key metrics</h4>
      <div class="formula">Inventory turns = COGS / Average inventory</div>

      <h4>Inventory accuracy & control</h4>

        <li><b>Cycle counting</b> — continuous counts on a cycle (A items most often).</li>

        <li><b>Inventory accuracy target</b>: 95–99% within tolerance.</li>
        <li><b>Inventory adjustment</b> — correcting record to match physical count.</li>
        <li><b>Configuration management</b> — control product data through lifecycle.</li>
        <li><b>End-of-life management</b> — phase-out, lifetime buys, customer notification.</li>

    {title:"D. Performance & Continuous Improvement",body:`
      <h4>Lean principles</h4>
      <p>Specify value (customer view) → map the value stream → create flow → pull at customer rate (takt) → pursue perfection.</p>
      <div class="keyterm"><b>Eight wastes (DOWNTIME):</b> Defects · Overproduction · Waiting · Non-utilized talent · Transportation · Inventory · Motion · Extra-processing.</div>
      <h4>Lean tools</h4>
      <ul>
        <li><b>5S</b> — Sort, Set-in-order, Shine, Standardize, Sustain</li>
        <li><b>Kanban</b> — visual pull signals</li>
        <li><b>SMED</b> — single-minute exchange of dies (setup reduction)</li>
        <li><b>Poka-yoke</b> — mistake-proofing</li>

        <li><b>Value stream map (VSM)</b></li>
        <li><b>Gemba walk</b> — go see</li>
        <li><b>Kaizen event / blitz</b> — focused 1-week cross-functional improvement.</li>

      <h4>Just-in-Time (JIT)</h4>
      <p>Produce and deliver only what is needed, when needed, in the quantity needed. Requires level demand, short setups, reliable suppliers, high quality.</p>
      <h4>Six Sigma / DMAIC</h4>

      <h4>TQM, TPM, SPC</h4>

      <h4>Quality & cost of quality</h4>

      <h4>Theory of Constraints</h4>
      <p>Five focusing steps: <b>Identify → Exploit → Subordinate → Elevate → Repeat</b>. <b>DBR</b> — Drum (constraint) sets pace; Buffer protects it; Rope ties release rate.</p>
